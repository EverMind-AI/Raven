# my-agent-flow: My-Agent's own tool and hook contributions.
#
# Config slice (plugins.config["my-agent-flow"]): enabled, greeting,
# stateRoot. config_schema stays empty on purpose: admission with an empty
# declaration is verbatim pass-through, and the slice is validated by the
# plugin's own code.

[plugin]
id = "my-agent-flow"
version = "0.1.0"
display_name = "My-Agent Flow"
enabled_by_default = true

[[plugin.contributes.hooks]]
name = "my_agent_flow"
factory = "my_agent_flow.plugin:make_hook"

[[plugin.contributes.tools]]
name = "my_agent_hello"
factory = "my_agent_flow.tools.hello:make_hello"

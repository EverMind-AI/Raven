# The four built-in capability bases the playbook generator derives roles
# from. Descriptions are what the generation LLM reads to cast roles — write
# charters and boundaries, not personas. Users may override fields or add
# bases via config (`playbooks.roles`); see role_pool.py for merge rules.
research:
  description: >-
    Deep retrieval and fact-checking: multi-source search, source-credibility
    judgment, adjudication when retrieved results conflict, research
    conclusions delivered with citations. No claims without a source.
  tags: [stateful, local-files]
code:
  description: >-
    Repository-level code work: understand the existing code structure,
    locate where a change lands, implement with unit tests, hands-on
    terminal work. Follow the repo's existing abstractions; never build a
    parallel system.
  tags: [stateful, local-files]
data:
  description: >-
    The whole data chain: data discovery, SQL workflows, statistics and
    causal judgment, quantified impact. Conclusions must be verifiable by
    an executable comparison or a programmatic assertion.
  tags: [stateful, local-files]
content:
  description: >-
    Text and presentation deliverables: writing, rewriting, removing the
    AI flavor, producing final copy under format and tone constraints,
    self-review. Conclusions first; hard constraints (word count,
    structure) outrank style.
  tags: [stateful, local-files]

[plugin]
id                 = "everos-memory"
version            = "1.0.0"
display_name       = "EverOS memory"
raven           = ">=0.1"
bundled            = true
enabled_by_default = true

[[plugin.contributes.memory_backends]]
name    = "everos"
factory = "raven.plugin.memory.everos.backend:make_backend"

# Multimodal understanding exposed as an agent tool: the LLM calls
# ``understand_media(paths=[...])`` to read attachments it can't consume
# natively (PDF / audio / Office / scanned images), reusing EverOS's
# memory-ingest multimodal parser. Requires the ``everos[multimodal]``
# extra + ``EVEROS_MULTIMODAL__*`` config at call time.
[[plugin.contributes.tools]]
name    = "understand_media"
factory = "raven.plugin.memory.everos.tools:make_understand_media_tool"

# Config schema sketch — the registry passes the user's
# ``plugins.config["everos-memory"]`` dict to ``make_backend(ctx)``
# verbatim; full schema validation will land alongside EM-2.
[plugin.config_schema]
mode          = { type = "string", enum = ["embedded", "http"], default = "embedded" }
# EverOS's own default bind (127.0.0.1:8000). Falls back to the
# EVEROS_BASE_URL environment variable when unset, so pointing a run at a
# remote service does not require editing a committed file.
base_url      = { type = "string", default = "http://127.0.0.1:8000" }
# Bearer token for a remote service. Prefer the EVEROS_API_KEY environment
# variable, which the factory reads when this is unset: a token written here
# is a secret in a file that gets shared and committed. Declared so the
# config-schema check does not report it as a typo.
api_key       = { type = "string" }
# Refused at construction: an api_key sent to a non-loopback host over plain
# http travels in cleartext, and the request still succeeds, so nothing
# downstream reveals that the token was exposed. Set this only to accept that
# exposure deliberately -- an https base_url is the fix.
allow_insecure_api_key = { type = "boolean", default = false }
# TLS peer verification: true, false, or a path to a CA bundle (the usual need
# behind a TLS-terminating corporate proxy). false is honoured but warns every
# boot -- it leaves the channel encrypted while authenticating nobody.
#
# Deliberately declares no ``type``: the value is boolean-or-string and the
# config-slice check has no union support, so declaring "boolean" reported the
# one configuration that actually needs this key (a CA bundle path) as a type
# error on every boot. The real validation is _resolve_tls_verify, which builds
# the SSLContext and names an unusable bundle.
tls_verify    = { default = true }
# Extra headers sent on every request, for an API gateway in front of EverOS
# (X-Api-Key, a tenant header, ...). Authorization is applied after these, so
# a header named here cannot shadow the resolved api_key.
headers       = { type = "object" }
# Bounded retry, covering only what the server provably did not act on:
# connection refused, handshake timeout, and 429 (the Cloud's over-quota
# refusal, whose Retry-After is honoured up to 30s). Read timeouts and every
# other status are never retried -- a 500 from /flush is the server-side
# cancel that already committed memcells and drained the buffer, so re-sending
# answers no_extraction and hides the loss. 0 keeps the single-attempt
# behaviour a local service has always had. Raising it adds turn latency only
# on the recall path, which is the one call that runs inside the turn.
retries       = { type = "integer", default = 0 }
# /add's synchronous-vs-queued choice. Unset omits the field, which is the only
# value correct on both deployments: Cloud defaults to async and answers 202
# "queued", so an eager profile's flush can overtake its own writes and promote
# a partial trajectory (set false there); self-hosted already writes in-request,
# and passing false costs ~33s per add on everos 1.2.3 (measured) against a 10s
# default per-turn budget. Not a boolean with a default for that reason.
async_mode    = { type = "boolean" }
# URL prefix for HTTP mode. "auto" probes /api/v2 and falls back to
# /api/v1 on 404 (everos >= 1.2.0 serves both; 1.1.x serves v1 only).
api_version   = { type = "string", enum = ["auto", "v1", "v2"], default = "auto" }
# Sent as SearchRequest.method when set; unset omits the field so the
# server's own default (hybrid) applies. Validated at construction — an
# unknown value is a 422 the fail-open recall path would swallow.
recall_method = { type = "string", enum = ["keyword", "vector", "hybrid", "agentic"] }
# Server-side LLM rerank pass. Applies to agent_case / agent_skill fusion
# only (the episode hybrid path has its own fact eviction and ignores it),
# and costs an LLM call inside the search request — i.e. inside the turn.
enable_llm_rerank = { type = "boolean", default = false }
# Pre-configured, stable agent identity: owner of the agent track (cases /
# skills accrue under it across sessions). Bare id, matched verbatim
# against the ``agent_id`` the host passes to recall. Must be path-safe
# (^[A-Za-z0-9_.-]+$) — it becomes an on-disk owner directory.
agent_id      = { type = "string", default = "default" }
# Owner of the user track (episodes / profiles). Same contract as
# agent_id: it must equal the ``memory.userId`` the host passes to
# recall, or writes land under one owner and reads look under another.
user_id       = { type = "string", default = "default" }
# Hard-isolation scope keys sent on every write (and search). Unset
# fields are omitted so the server scopes to default/default. Path-safe
# charset, validated at construction.
app_id        = { type = "string" }
project_id    = { type = "string" }
# Deferred capture: every /add carries defer_extraction=true (buffer
# write only — no boundary LLM inside the turn) and store() never
# flushes; promotion happens via backend.flush() or the post-batch
# flush script. Requires an everos build that knows the field —
# released <= 1.2.3 silently ignores it and extracts eagerly.
# mode="http" only: the embedded adapter exposes no flush, so the
# combination is rejected at construction.
defer_extraction  = { type = "boolean", default = false }
# Per-message content clip before /add (0 disables). The server has no
# content size limit; DR tool results are whole extracted pages.
capture_max_chars = { type = "integer", default = 50000 }
# Off: user-role messages are not captured (sub-agent profile — a
# forwarded user question would double-extract under the same owner).
emit_user_messages = { type = "boolean", default = true }
# Fold an assistant turn's out-of-band reasoning (``reasoning_content``)
# into the captured text, delimited by [reasoning] ... [/reasoning].
# Applies only to assistant rows carrying tool_calls: the user track's
# renderer skips those, so deliberation reaches agent-case extraction
# and never a profile or a fact. Off by default — it roughly doubles the
# assistant bytes a session writes, and its effect on extraction quality
# is unmeasured. Separate, tighter budget than capture_max_chars, which
# still applies to the combined text.
capture_reasoning           = { type = "boolean", default = false }
capture_reasoning_max_chars = { type = "integer", default = 12000 }
# Off: the host wires the backend into the after-turn store dispatch
# only; the context engine never sees it (no recall lane, no Everos
# skill source) — prompt bytes stay identical to memory.backend=null.
recall_enabled     = { type = "boolean", default = true }
# Per-lane refinement inside recall_enabled. The master switch above is the
# one that keeps prompt bytes identical to memory.backend=null; these pick
# which lane earns its cost once recall is on. A research agent typically
# wants skills without episodes — the distilled method transfers between
# questions, the episode summary of the previous question does not.
recall_memory_enabled = { type = "boolean", default = true }
recall_skills_enabled = { type = "boolean", default = true }
# Turn the start-time /health probe from a warning into a hard failure
# (MemoryServiceUnavailableError out of start()). Off by default so an
# interactive session never loses its answer because memory is down; on for
# a scripted run whose purpose is to write memory, where an hour spent
# writing into nothing is the worse outcome. Only the `raven agent -m` path
# surfaces it; TUI / gateway keep degrading.
require_service    = { type = "boolean", default = false }
# When set, everos session ids are generated locally per host session
# as <prefix>_<uuid4hex>. Writers sharing a session id merge buffers
# and cross-copy agent cases (server-side fan-out) — generate, don't
# accept caller-provided ids. The mapping is persisted per workspace in
# .everos_session_map.json, so the same host session key resolves to the
# same everos session in a later process (several ``-m`` calls sharing
# one ``-s`` accumulate into one buffer, as the host's own session log
# already does).
session_id_prefix  = { type = "string" }
# Flush cadence for the eager (non-deferred) path; 0 disables.
flush_every_turns  = { type = "integer", default = 1 }
# Separate budgets: add/search are per-turn (tight); flush runs the
# boundary + user-track extraction LLMs inside the request.
#
# flush_timeout_s must stay ABOVE the server's own in-request cap
# (memorize.session_lock_timeout_seconds, shipped default 360). Equal
# budgets are the bad case: the server's timer starts after routing, so it
# fires first and the caller gets a 500 instead of an answer. Below it, the
# client disconnects while the server is still working. See the constant in
# backend.py for why a cancelled flush is not recoverable by retrying.
timeout_s          = { type = "number", default = 10.0 }
flush_timeout_s    = { type = "number", default = 960.0 }

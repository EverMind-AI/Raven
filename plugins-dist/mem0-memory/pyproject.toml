[project]
name = "mem0-memory"
version = "0.1.0"
description = "Mem0 Platform (app.mem0.ai) as a Raven memory backend"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    {name = "EverMind"}
]
keywords = ["raven", "raven-plugin", "memory", "mem0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]

# No vendor SDK: the backend is a handful of REST calls over the httpx the
# host already carries, on the HttpMemoryBackend base the host provides.
dependencies = [
    "raven",
    "httpx>=0.28.0,<1.0.0",
]

[project.entry-points."raven.plugins"]
mem0-memory = "raven_mem0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raven_mem0"]

# Discovery loads raven-plugin.toml out of the installed package; a wheel
# without it installs a plugin nothing can find.
[tool.hatch.build]
include = [
    "raven_mem0/**/*.py",
    "raven_mem0/raven-plugin.toml",
]

[tool.hatch.build.targets.sdist]
include = [
    "raven_mem0/",
    "pyproject.toml",
]

[tool.uv.sources]
raven = { workspace = true }

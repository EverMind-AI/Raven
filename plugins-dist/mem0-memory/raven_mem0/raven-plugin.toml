[plugin]
id                 = "mem0-memory"
version            = "0.1.0"
display_name       = "Mem0 Platform memory"
raven              = ">=0.1"
bundled            = false

[[plugin.contributes.memory_backends]]
name    = "mem0"
factory = "raven_mem0.backend:make_backend"

[[plugin.contributes.onboard]]
name    = "mem0"
factory = "raven_mem0.onboard:make_onboard_step"

# The backend reads ``plugins.config["mem0"]`` (the onboarding screen writes it
# there); ``MEM0_API_KEY`` in the environment beats the slice. Identity is not
# declared here: ``user_id`` comes from the host through ``ServiceLocator``,
# never from a plugin's own slice.
[plugin.config_schema]
api_key  = { type = "string" }
base_url = { type = "string" }

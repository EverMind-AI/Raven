[plugin]
id                 = "memos-memory"
version            = "0.1.0"
display_name       = "MemOS Cloud memory"
raven              = ">=0.1"
bundled            = false

[[plugin.contributes.memory_backends]]
name    = "memos"
factory = "raven_memos.backend:make_backend"

[[plugin.contributes.onboard]]
name    = "memos"
factory = "raven_memos.onboard:make_onboard_step"

# The backend reads ``plugins.config["memos"]`` (the onboarding screen writes it
# there); ``MEMOS_API_KEY`` in the environment beats the slice. Identity is not
# declared here: ``user_id`` comes from the host through ``ServiceLocator``,
# never from a plugin's own slice.
[plugin.config_schema]
api_key  = { type = "string" }
base_url = { type = "string" }

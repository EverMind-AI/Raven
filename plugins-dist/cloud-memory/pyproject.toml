[project]
name = "cloud-memory"
version = "0.1.0"
description = "Hosted memory services (Mem0, Zep, MemOS) as Raven memory backends"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    {name = "EverMind"}
]
keywords = ["raven", "raven-plugin", "memory", "mem0", "zep", "memos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]

# No vendor SDK: each backend is a handful of REST calls over the httpx the
# host already carries, so the wheel adds nothing to an install.
dependencies = [
    "raven",
    "httpx>=0.28.0,<1.0.0",
]

[project.entry-points."raven.plugins"]
cloud-memory = "raven_cloud_memory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raven_cloud_memory"]

# Discovery loads raven-plugin.toml out of the installed package; a wheel
# without it installs a plugin nothing can find.
[tool.hatch.build]
include = [
    "raven_cloud_memory/**/*.py",
    "raven_cloud_memory/raven-plugin.toml",
]

[tool.hatch.build.targets.sdist]
include = [
    "raven_cloud_memory/",
    "pyproject.toml",
]

[tool.uv.sources]
raven = { workspace = true }

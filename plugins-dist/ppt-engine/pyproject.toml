[project]
name = "ppt-engine"
version = "0.2.0"
description = "Raven-PPT deck engine as a standalone raven plugin: eleven deck tools and the material/identity turn hook"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    {name = "EverMind"}
]
keywords = ["raven", "raven-plugin", "ppt", "deck"]

dependencies = [
    "raven",
    # The fork's raven[ppt] extra, carried by the wheel itself -- dependency
    # delivery is why the engine ships as its own distribution (ppt verdict,
    # section three, option ii). Pins are the fork's own where the fork pinned.
    "python-pptx>=0.6.21,<2",
    "lxml>=5.0,<7",
    # Reading the source material: a PDF's text with its layout, the figures and
    # tables embedded in its pages, and the type sizes a render resolved. pdfium
    # cannot reach the last three, and reading the sources is what this engine is
    # for, so this is a hard dependency rather than an optional one.
    #
    # The only AGPL-3.0 dependency in the distribution (Artifex also sells a
    # commercial licence). It is imported, not modified and not redistributed --
    # see NOTICES.md; the obligation stays on this wheel, and the host's
    # dependency face keeps zero fitz (D10).
    "pymupdf>=1.24,<2",
    # Brand marks ship as SVG and python-pptx places rasters only, so a fetched
    # logo is a document until something draws it. Optional at runtime -- `ppt_fetch`
    # keeps an SVG it cannot rasterise as the text it is -- but a deck without this
    # cannot show a company its own mark, which is most of what "find a logo" means.
    "cairosvg>=2.7,<3",
    # The fork's raven[render] half: page rasterisation deliberately walks
    # pdfium (Apache-2.0), keeping the AGPL surface to reading source documents.
    "pillow>=11.3,<13",
    "pypdfium2>=4.30,<5",
    # ppt_fetch / ppt_generate_image / ppt_image_search speak HTTP themselves.
    "httpx>=0.28.0,<1.0.0",
    "matplotlib>=3.11.1",
]

# The one line that makes this package findable: PluginDiscovery._scan_entry_points
# reads this group, takes the value as a bare package name, and loads
# raven-plugin.toml out of that package with importlib.resources.
[project.entry-points."raven.plugins"]
ppt-engine = "raven_ppt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raven_ppt"]

# raven-plugin.toml is package data, not a stray file: discovery resolves it
# through importlib.resources inside the installed package, so a wheel that
# ships the modules without it installs a plugin nothing can find. The engine's
# own assets ride the same way: shape/icon data and the DejaVu measuring fonts
# under services/assets, the deck-authoring skill, the fork's three drifted
# identity prompts, and -- once fetched against the pinned manifest -- the
# ten bundled templates.
[tool.hatch.build]
include = [
    "raven_ppt/**/*.py",
    "raven_ppt/raven-plugin.toml",
    "raven_ppt/prompts/*.md",
    "raven_ppt/assets/templates/*.pptx",
    "raven_ppt/services/assets/data/*.json",
    "raven_ppt/services/assets/fonts/*.ttf",
    "raven_ppt/services/assets/fonts/*.txt",
    "raven_ppt/skill/**/*.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "raven_ppt/",
    "pyproject.toml",
    "NOTICES.md",
    "LICENSES/",
]

[tool.uv.sources]
raven = { workspace = true }

[project]
name = "everos-memory"
version = "1.2.0"
description = "EverOS memory backend for Raven: dual-track semantic recall and the understand_media tool"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    {name = "EverMind"}
]
keywords = ["raven", "raven-plugin", "memory", "everos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "raven",
    # The substrate this adapter binds. Exact pin, not a range: the adapter
    # reaches internal (non-public) everos APIs, so an upgrade is a deliberate
    # act. Same pin the host carried while the plugin lived inside it.
    "everos[multimodal]==1.2.3",
    "httpx>=0.28.0,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
]

# The one line that makes this package findable: PluginDiscovery._scan_entry_points
# reads this group, takes the value as a bare package name, and loads
# raven-plugin.toml out of that package with importlib.resources.
[project.entry-points."raven.plugins"]
everos-memory = "raven_everos"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raven_everos"]

# raven-plugin.toml is package data, not a stray file: discovery resolves it
# through importlib.resources inside the installed package, so a wheel that
# ships the modules without it installs a plugin nothing can find.
[tool.hatch.build]
include = [
    "raven_everos/**/*.py",
    "raven_everos/raven-plugin.toml",
]

[tool.hatch.build.targets.sdist]
include = [
    "raven_everos/",
    "pyproject.toml",
]

[tool.uv.sources]
raven = { workspace = true }

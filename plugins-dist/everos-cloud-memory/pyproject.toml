[project]
name = "everos-cloud-memory"
version = "0.1.0"
description = "EverOS Cloud memory backend for Raven: dual-track semantic recall over the hosted EverOS API"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    {name = "EverMind"}
]
keywords = ["raven", "raven-plugin", "memory", "everos", "cloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]

# raven and httpx, nothing else: this plugin talks to a hosted service and
# never imports the everos engine, so a cloud-only install does not carry it.
dependencies = [
    "raven",
    "httpx>=0.28.0,<1.0.0",
]

# The one line that makes this package findable: PluginDiscovery._scan_entry_points
# reads this group, takes the value as a bare package name, and loads
# raven-plugin.toml out of that package with importlib.resources.
[project.entry-points."raven.plugins"]
everos-cloud-memory = "raven_everos_cloud"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raven_everos_cloud"]

# raven-plugin.toml is package data, not a stray file: discovery resolves it
# through importlib.resources inside the installed package, so a wheel that
# ships the modules without it installs a plugin nothing can find.
[tool.hatch.build]
include = [
    "raven_everos_cloud/**/*.py",
    "raven_everos_cloud/raven-plugin.toml",
]

[tool.hatch.build.targets.sdist]
include = [
    "raven_everos_cloud/",
    "pyproject.toml",
]

[tool.uv.sources]
raven = { workspace = true }

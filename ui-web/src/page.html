<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Raven</title>
<!-- Two, because each drawing carries its own ground instead of an alpha
     silhouette, and each is paired with the strip it stands out against rather
     than the one it sinks into: raven.svg is the ivory bird on ink and takes
     the light strip, raven-light.svg the charcoal bird on white and takes the
     dark one. So the tab holds a tile either way instead of a bird floating
     with no edge. One file inverted would not do what the pair does -- the halo
     is the same warm gold on both, and inverting gold lands on blue. The dark
     candidate is second because the last matching link is the one that wins.
     assets/raven.svg is also the mark the processor row wears
     (`ravenIconPath`), so a redraw there redraws the tab: they have been one
     file since the mark was first cut, and nothing yet wants them apart.
     The splash draws a third file, assets/agents/raven.svg: the same bird on
     no ground at all, which is what a mark standing on the page's own surface
     wants and what these two, carrying a ground each, cannot be. -->
<link rel="icon" type="image/svg+xml" href="assets/raven.svg" />
<link rel="icon" type="image/svg+xml" href="assets/raven-light.svg" media="(prefers-color-scheme: dark)" />
<style>
/*__STYLE__*/
</style>
</head>
<body>

<!-- What is left in here is what React cannot put on screen: the two
     pre-JavaScript shells, and the one empty host another root mounts into.
     Every other region of the page is rendered by src/App.tsx, which portals
     into this body after these three -- and the two shells are taken down at
     boot, so the body a reader ever sees is the React tree. -->

<!-- Boot splash: the literal first frame. Markup lives here, before anything
     else in <body>, so the browser paints it ahead of the app shell -- no
     flash of skeleton rows or half-drawn chrome. The demo hides it on window
     load; live mode keeps it up until the boot sequence has real data. -->
<div id="splash" aria-hidden="true">
  <div class="sp-in">
    <img class="sp-rv" src="assets/agents/raven.svg" alt="" width="64" height="64" decoding="async">
    <div class="sp-wl">Raven Agent</div>
    <div class="sp-bar"><i></i></div>
  </div>
</div>

<!-- First-run onboarding surface. Empty shell: the onboarding island roots
     itself in it (src/main.tsx) and renders the steps, driven by the same RPCs
     the TUI setup gate uses (setup.status / model.options / model.save_key /
     config.set), so the onboarding logic itself lives once, server-side.

     Static, and between the two shells on purpose: a portal can only append,
     so a region rendered from App.tsx lands after #noJs -- and this one has to
     stay where the page has always served it. -->
<div id="onb" hidden></div>

<div id="noJs" style="position:fixed;left:0;right:0;top:0;z-index:99;background:#e0a030;color:#16150f;
  font:13px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;padding:10px 16px">
  <b>这个页面的脚本没有运行</b> —— 所以只剩空壳：没有会话列表、没有对话、发送键是空的。
  多半是当前预览环境不执行 JavaScript。把文件保存到本地，用 Chrome 或 Safari 直接打开即可。
</div>

<script>
/* The digest of the asset tree this page was built from, hung on the window
   before anything reads it. Icon helpers append it to every asset URL, so a
   replaced drawing is a new URL and no client can answer it from a copy it
   decided was still fresh. See ui-web/build.py. */
window.__ASSETV = "__ASSETV__";
</script>
<script>
/*__MODERN__*/
</script>
</body>
</html>

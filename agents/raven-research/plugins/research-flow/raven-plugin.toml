# research-flow: the deep-research harness as a plugin.
#
# Config slice (plugins.config["research-flow"]): the product's drFlow block
# (camelCase keys - enabled, version, maxIterations, contextWindowTokens,
# thinkClosingTagRequired, identityOverride, promptSectionOverride,
# measuredGuidance, fetchMaxChars, search.*, digest.*, verify.*, budgetNote.*,
# forceFinalize.*, spinBreaker.*, fetchFloor.*, fetchGate.*, sufficiency.*,
# finalShape.*, conversation.*, askUser.*), minus the four the fork's LOOP
# consumed and no seam here reaches (toolsAllowlist, minimalContext,
# truncationWrapup, reactiveClamp - see config.py's _RETIRED_KEYS), plus the
# plugin-only keys:
#
#   search.apiKey   Serper key for web_search; falls back to $SERPER_API_KEY
#   fetch.apiKey    Jina reader key for web_fetch; falls back to $JINA_API_KEY
#   proxy           optional HTTP(S) proxy URL for both web tools
#   stateRoot       session-store root; defaults to <workspace>/research_flow
#
# config_schema stays empty on purpose: admission with an empty declaration is
# verbatim pass-through, and the slice is validated by the plugin's own
# FlowConfig (research_flow/config.py), which owns the full drFlow shape.

[plugin]
id = "research-flow"
version = "0.1.0"
display_name = "Research Flow"
enabled_by_default = true

[[plugin.contributes.hooks]]
name = "research_flow"
factory = "research_flow.plugin:make_hook"

# The three tools replace the kernel built-ins of the same names (the registry
# overwrites by name; plugin tools register after the defaults). A factory
# declines by returning None, and each has its own reason to: ask_user unless
# askUser.enabled and conversation.enabled are both on, web_search when no
# Serper key resolves, and all three (plus the hook) when the flow cannot be
# installed at all. A registered tool the contract never asks for, or one whose
# every call is an error string, is the mismatch the prompt clause exists to
# prevent; declining leaves the kernel's own built-in serving in its place.

[[plugin.contributes.tools]]
name = "web_search"
factory = "research_flow.plugin:make_web_search"

[[plugin.contributes.tools]]
name = "web_fetch"
factory = "research_flow.plugin:make_web_fetch"

[[plugin.contributes.tools]]
name = "ask_user"
factory = "research_flow.plugin:make_ask_user"

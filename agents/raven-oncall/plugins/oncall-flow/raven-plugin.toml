# oncall-flow: the on-call watch loop as a plugin.
#
# Config slice (plugins.config["oncall-flow"]): enabled (the product gate --
# absent or false means no surface is cast, the D6 shape), the optional
# watcher.pollIntervalSeconds knob (default 20.0, the fork's event-watcher
# interval), plus the plugin-only key:
#
#   stateRoot   campaign-state root; the launcher injects it at render time
#               (run.py setdefault), defaulting to <workspace>/oncall_flow
#
# config_schema stays empty on purpose: admission with an empty declaration is
# verbatim pass-through, and the slice is validated by the plugin's own
# FlowConfig (oncall_flow/config.py), which owns the slice shape.

[plugin]
id = "oncall-flow"
version = "0.1.0"
display_name = "Oncall Flow"
enabled_by_default = true

# The resident event watcher (paper: raven/contracts/services.py): a dumb
# no-LLM poll loop that pulls a campaign's pending keyed wake forward when
# its jobs go terminal or its progress turns unhealthy. Only a resident host
# starts it; the factory declines (returns None) when the slice leaves the
# flow off.

[[plugin.contributes.services]]
name = "oncall_event_watcher"
factory = "oncall_flow.watcher:make_event_watcher"

# The turn-frame hook (part 2c): the fork's loop-side glue as ONE contributed
# hook running four axes in a fixed internal order -- window identity and the
# faces' turn context (with the owner-instruction capture), turn accounting,
# the work-to-watch judgement with its provenance nudge, and the
# ops_check_later turn close. One row rather than four because the registry
# serves hook names sorted, and the axis order is part of the flow's
# contract; the factory declines when the slice leaves the flow off (D6).

[[plugin.contributes.hooks]]
name = "oncall_flow"
factory = "oncall_flow.flow:make_flow_hook"

# The ops tool set (part 2b). Every factory declines when the slice leaves
# the flow off, so a disabled product casts no schema at all -- the fork's
# gate (tools.oncall.enabled), said as plugin admission (D6). The scheduling
# faces declare bind_runtime and hold the wake grant; the loop registers
# plugin tools last, but no row here shadows a built-in: the fork's
# exec(machine=...) face is contributed under its own name (ops_exec), and
# ops_tune_launch stays off the menu on purpose (full-auto never competes
# with the round-by-round loop; `python -m oncall_flow.tune` is the D5 entry).

[[plugin.contributes.tools]]
name = "ops_tune_status"
factory = "oncall_flow.tools:make_ops_tune_status"

[[plugin.contributes.tools]]
name = "ops_submit"
factory = "oncall_flow.tools:make_ops_submit"

[[plugin.contributes.tools]]
name = "ops_check_later"
factory = "oncall_flow.tools:make_ops_check_later"

[[plugin.contributes.tools]]
name = "ops_note"
factory = "oncall_flow.tools:make_ops_note"

[[plugin.contributes.tools]]
name = "ops_campaigns"
factory = "oncall_flow.tools:make_ops_campaigns"

[[plugin.contributes.tools]]
name = "ops_connections"
factory = "oncall_flow.tools:make_ops_connections"

[[plugin.contributes.tools]]
name = "ops_declare"
factory = "oncall_flow.tools:make_ops_declare"

[[plugin.contributes.tools]]
name = "ops_kill"
factory = "oncall_flow.tools:make_ops_kill"

[[plugin.contributes.tools]]
name = "ops_outputs"
factory = "oncall_flow.tools:make_ops_outputs"

[[plugin.contributes.tools]]
name = "ops_edit_case_dict"
factory = "oncall_flow.tools:make_ops_edit_case_dict"

[[plugin.contributes.tools]]
name = "ops_case_changes"
factory = "oncall_flow.tools:make_ops_case_changes"

[[plugin.contributes.tools]]
name = "ops_ask_owner"
factory = "oncall_flow.tools:make_ops_ask_owner"

[[plugin.contributes.tools]]
name = "ops_finish"
factory = "oncall_flow.tools:make_ops_finish"

[[plugin.contributes.tools]]
name = "ops_exec"
factory = "oncall_flow.tools:make_ops_exec"

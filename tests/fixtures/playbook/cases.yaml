# Live-LLM regression cases for playbook generation, adapted from the seven
# product examples. Expectations follow the source-oriented mode rule (a dag
# is only produced when the user's input itself spells out steps), so several
# cases that the product doc showed as dag are expected to land in prompt
# mode here — that divergence is deliberate and tracked in the design doc's
# open questions.
#
# Consumed by tests/integration/test_playbook_real_llm.py, which runs only
# with an OpenRouter credential (OPENROUTER_API_KEY or ~/.raven/config.json).

- id: twitter-one-liner            # product example 1 (was dag there)
  input: "make me a playbook for posting content to twitter"
  expect:
    mode: prompt
    prompts_required: true

- id: weekly-feedback              # product example 2 (was dag there)
  input: "give me a weekly user-feedback analysis"
  expect:
    mode: prompt
    prompts_required: true

- id: issue-triage-with-pins       # product example 3 (was hybrid there)
  input: |
    build a GitHub issue triage playbook:
    - you must use the raven-issue-triage skill, do not invent your own criteria
    - only P0 files a ticket; list P1s for me to decide manually
  pinned_skills: [raven-issue-triage]
  expect:
    mode: prompt
    must_reference_skills: [raven-issue-triage]

- id: due-diligence                # product example 5 (prompt there too)
  input: "make me a due-diligence playbook"
  expect:
    mode: prompt
    prompts_required: true

- id: email-underspecified         # product example 6
  input: "automate handling my customer email"
  expect:
    mode: prompt
    open_questions_min: 1

- id: competitor-scan-steps        # product example 7 (light step phrasing)
  input: "build me a competitor research playbook: scan the market side and the technology side separately, then produce one report"
  expect:
    mode: dag
    node_count: 3
    parallel_pair: true            # the two scan nodes share no path

- id: explicit-sop                 # canonical dag path: user gives the steps
  input: |
    weekly feedback analysis, the flow is fixed:
    1. first pull the last 7 days of user feedback from slack and intercom
    2. then cluster the feedback into themes
    3. finally write a weekly report for the PM
  expect:
    mode: dag
    node_count: 3                  # faithful transcription: no invented steps
    # The four descriptive builtin rows (data-raven and friends) were retired:
    # they were labels, not agents -- every one dispatched the same provider,
    # model and tools. The roster the generator casts against holds the one
    # generic agent; per-step differentiation lives in each node's prompt.
    agents_used: [Raven]

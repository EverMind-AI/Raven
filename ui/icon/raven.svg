<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f2e6"/>
      <stop offset="1" stop-color="#e9dcc0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a44"/>
      <stop offset="1" stop-color="#23232b"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b94e"/>
      <stop offset="1" stop-color="#d99a2b"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8917c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e8917c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS squircle plate -->
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="204" fill="none" stroke="#c9b98f" stroke-opacity="0.45" stroke-width="6"/>

  <!-- tail -->
  <path d="M 620 760 L 790 850 L 660 866 Z" fill="#23232b"/>
  <path d="M 640 780 L 770 900 L 630 884 Z" fill="#2f2f39"/>

  <!-- body -->
  <ellipse cx="512" cy="716" rx="216" ry="168" fill="url(#body)"/>
  <!-- belly -->
  <ellipse cx="512" cy="762" rx="128" ry="92" fill="#4a4a56"/>

  <!-- wings -->
  <path d="M 320 660 q -70 60 -34 150 q 60 -6 96 -66 Z" fill="#2c2c35"/>
  <path d="M 704 660 q 70 60 34 150 q -60 -6 -96 -66 Z" fill="#2c2c35"/>

  <!-- head -->
  <circle cx="512" cy="452" r="264" fill="url(#body)"/>

  <!-- feather tuft -->
  <path d="M 486 196 q 10 -52 54 -64 q -12 40 -8 58 q 26 -30 62 -30 q -26 34 -34 58 Z" fill="#2c2c35"/>

  <!-- eyes -->
  <circle cx="428" cy="452" r="86" fill="#ffffff"/>
  <circle cx="596" cy="452" r="86" fill="#ffffff"/>
  <circle cx="442" cy="466" r="44" fill="#1c1c22"/>
  <circle cx="582" cy="466" r="44" fill="#1c1c22"/>
  <circle cx="456" cy="450" r="14" fill="#ffffff"/>
  <circle cx="596" cy="450" r="14" fill="#ffffff"/>

  <!-- cheeks -->
  <ellipse cx="368" cy="548" rx="52" ry="34" fill="url(#cheek)"/>
  <ellipse cx="656" cy="548" rx="52" ry="34" fill="url(#cheek)"/>

  <!-- beak -->
  <path d="M 472 520 L 552 520 L 512 596 Z" fill="url(#beak)"/>
  <path d="M 472 520 L 552 520 L 512 548 Z" fill="#f4cd7d" opacity="0.55"/>

  <!-- feet -->
  <ellipse cx="448" cy="872" rx="40" ry="18" fill="#d99a2b"/>
  <ellipse cx="576" cy="872" rx="40" ry="18" fill="#d99a2b"/>
</svg>

  b.appendChild(mk('span', 'lab', T('gui.detail.can_do')));
  const pg = mk('div', 'chips');
  (c.perms || []).forEach((p) => pg.appendChild(mk('span', 'tag warn', p)));
  if (!c.perms || !c.perms.length) pg.appendChild(mk('span', 'tag', T('gui.detail.no_ext')));
  b.appendChild(pg);

  if (c.state === 'on' || c.state === 'off' || c.state === 'fail' || c.state === 'need') {
    const foot = mk('div'); foot.style.cssText = 'border-top:1px solid var(--line-soft);padding-top:14px';
    const rm = mk('button', 'mini ghost danger', T('gui.detail.remove'));
    rm.onclick = () => confirmAsk(T('gui.detail.remove_title'),
      T('gui.detail.remove_body', { name: c.name }), T('gui.detail.remove_yes'), () => {
        c.state = 'add'; delete c.err; (c.fields || []).forEach((f) => delete f.val);
        closeDetail(); afterCapChange(c, T('gui.caps.removed_x', { name: c.name }));
      });
    foot.appendChild(rm);
    b.appendChild(foot);
  }

  $('#detail').dataset.open = 'true';
}
function closeDetail() { $('#detail').dataset.open = 'false'; dCur = null; }

/* ══ entrances: where you reach it ════════════════════════════════
   NOT a capability. A plugin is "what it can touch"; an entrance is
   "where you find it". Same brand can be both (Slack plugin vs Slack
   entrance) and the two point in opposite directions.              */
/* ══ module 2b: external agents ════════════════════════════════════
   Connect the agents already installed on this machine, so Raven can hand work
   to them. One row per agent; the rows come from `subagents.list` over RPC in
   the live layer, and from XAGENTS below in the standalone demo.

   A row is (name, kind, configured, enabled, probe_status, last test). Three
   facts, deliberately kept apart: `configured` is "Raven knows about it",
   `enabled` is "Raven may dispatch to it", and `probe_status` is "the machine
   can actually run it". Collapsing them is how a disabled agent reads as
   broken, or a missing binary reads as switched off. */
const XAGENTS = [
  { name: 'claude_code', preset: 'claude_code', kind: 'cli', configured: true, enabled: true,
    probe_status: 'ready', probe_detail: '', has_api_key: false, test_running: false,
    last_test_ok: true, last_test_at_ms: Date.now() - 3600e3, last_test_detail: '',
    upgrade_to: null, description: 'Claude Code CLI - strong general coding / agent tasks.' },
  { name: 'codex', preset: 'codex', kind: 'cli', configured: false, enabled: false,
    probe_status: 'missing', probe_detail: 'codex: command not found', has_api_key: false,
    test_running: false, last_test_ok: null, last_test_at_ms: null, last_test_detail: '',
    description: 'OpenAI Codex CLI - coding tasks.' },
  { name: 'hermes', preset: 'hermes', kind: 'cli', configured: false, enabled: false,
    probe_status: 'ready', probe_detail: '', has_api_key: false, test_running: false,
    last_test_ok: null, last_test_at_ms: null, last_test_detail: '',
    description: 'Hermes Agent CLI - general assistant with tool calling.' },
  { name: 'mirothinker', preset: 'mirothinker', kind: 'openai', configured: false, enabled: false,
    probe_status: 'unknown', probe_detail: '', has_api_key: false, test_running: false,
    last_test_ok: null, last_test_at_ms: null, last_test_detail: '',
    description: 'MiroMind deep-research (OpenAI-compatible HTTP).' },
];

let xaEdit = null;   /* name whose configure form is open */
let xaProbing = false;

/* Replaced wholesale by live.js. Demo: mutate the row in place so the page is
   still explorable with no gateway behind it. */
let xaLoad = async () => XAGENTS;

let xaAct = async (op, row, args) => {
  if (op === 'probe') return;
  if (op === 'connect') { row.configured = true; row.enabled = row.kind !== 'openai'; }
  if (op === 'remove') { row.configured = false; row.enabled = false; }
  if (op === 'upgrade') { row.kind = row.upgrade_to || row.kind; row.upgrade_to = null; }
  if (op === 'toggle') row.enabled = !!args.enabled;
  if (op === 'update') {
    if (args.new_name) row.name = args.new_name;
    if (args.description != null) row.description = args.description || row.description;
    if (args.api_key) { row.has_api_key = true; row.enabled = true; }
  }
  if (op === 'test') {
    row.last_test_ok = row.probe_status === 'ready';
    row.last_test_at_ms = Date.now();
  }
};

function xaKind(row) {
  return T(row.kind === 'openai' ? 'gui.agent.kind_openai'
    : row.kind === 'acp' ? 'gui.agent.kind_acp' : 'gui.agent.kind_cli');
}

/* The one-line health summary. Order matters: the reason it cannot run beats
   the fact that it is switched off, because that is the one the user has to act
   on. */
function xaState(row) {
  if (row.kind === 'openai' && !row.has_api_key) return { cls: 'bad', text: T('gui.agent.needs_key') };
  if (row.configured && !row.enabled && row.probe_status !== 'missing') {
    return { cls: 'off', text: T('gui.agent.disabled') };
  }
  /* Four probe verdicts, and they are not two. `attention` means the binary is
     there but nothing has verified it can do a task -- an amber nudge, not a
     failure; calling it broken would have the user reinstalling something that
     is installed. `unknown` is "not measured", which earns no colour at all. */
  if (row.probe_status === 'ready') return { cls: 'ok', text: T('gui.agent.ready') };
  if (row.probe_status === 'attention') return { cls: 'warn', text: row.probe_detail || T('gui.agent.unverified') };
  if (row.probe_status === 'unknown') return { cls: 'off', text: row.probe_detail || '' };
  return { cls: 'bad', text: row.probe_detail || T('gui.agent.missing') };
}

function xaTestLine(row) {
  if (row.test_running) return T('gui.agent.testing');
  if (row.last_test_ok == null) return T('gui.agent.test_never');
  /* fmtStamp comes from live.js, which the build appends into this same script;
     the standalone demo has no live layer, hence the guard. */
  const ago = !row.last_test_at_ms ? ''
    : typeof fmtStamp === 'function' ? fmtStamp(row.last_test_at_ms)
      : new Date(row.last_test_at_ms).toLocaleString();
  return T(row.last_test_ok ? 'gui.agent.test_ok' : 'gui.agent.test_bad', { ago });
}

async function xaRun(op, row, args) {
  try {
    await xaAct(op, row, args || {});
  } catch (e) {
    toast(T('gui.agent.failed', { detail: (e && (e.message || e.detail)) || String(e) }));
  }
  drawXa();
  drawXaBadge();
}

/* Configure: name, description, and -- only where one is needed -- the api key.
   Never the command line. Those fields come from the preset, which is version
   verified; letting the page edit them is how a working agent turns into a
   command nobody can account for. */
function xaForm(row) {
  const box = mk('div', 'pform');
  const nameIn = mk('input'); nameIn.type = 'text'; nameIn.value = row.name;
  const descIn = mk('textarea'); descIn.rows = 2; descIn.value = row.description || '';
  const keyIn = mk('input'); keyIn.type = 'password'; keyIn.autocomplete = 'off';
  keyIn.placeholder = row.has_api_key ? T('gui.agent.key_set') : '';

  const field = (labelKey, hintKey, input) => {
    const f = mk('div', 'agf');
    f.append(mk('label', null, T(labelKey)), input, mk('div', 'hint', T(hintKey)));
    return f;
  };
  box.appendChild(field('gui.agent.name', 'gui.agent.name_hint', nameIn));
  box.appendChild(field('gui.agent.desc', 'gui.agent.desc_hint', descIn));
  if (row.kind === 'openai') box.appendChild(field('gui.agent.key', 'gui.agent.key_hint', keyIn));

  const ctl = mk('div', 'ctl');
  const save = mk('button', 'mini', T('gui.agent.save'));
  save.onclick = () => {
    const patch = { new_name: nameIn.value.trim(), description: descIn.value, api_key: keyIn.value };
    xaEdit = null;
    xaRun(row.configured ? 'update' : 'connect', row, patch);
  };
  const cancel = mk('button', 'mini ghost', T('gui.agent.cancel'));
  cancel.onclick = () => { xaEdit = null; drawXa(); };
  ctl.append(save, cancel);
  box.appendChild(ctl);
  return box;
}

function drawXa() {
  const box = $('#xaBody');
  if (!box) return;
  box.innerHTML = '';

  const hero = mk('div', 'pmhero');
  hero.append(mk('h3', null, T('gui.agent.hero')), mk('p', null, T('gui.agent.hero_sub')));
  box.appendChild(hero);

  const on = XAGENTS.filter((a) => a.configured);
  const off = XAGENTS.filter((a) => !a.configured);

  const s1 = mk('div', 'csec');
  const hd = mk('div', 'hd');
  hd.append(mk('b', null, T('gui.agent.on')), mk('span', 'n', String(on.length)));
  const probe = mk('button', 'mini ghost', T(xaProbing ? 'gui.agent.probing' : 'gui.agent.probe'));
  probe.disabled = xaProbing;
  probe.onclick = () => xaRun('probe');
  hd.appendChild(probe);
  s1.appendChild(hd);

  if (!on.length) {
    s1.appendChild(mk('div', 'empty-note', T('gui.agent.none')));
  } else {
    const set = mk('div', 'fset');
    on.forEach((row) => {
      const st = xaState(row);
      const r = mk('div', 'pcard');
      const nm = mk('div', 'nm');
      const led = mk('span', 'led' + (st.cls === 'ok' ? '' : ' ' + st.cls));
      nm.append(led, mk('span', null, row.name), mk('span', 'kd', xaKind(row)));
      r.append(nm);
      const mo = mk('div', 'mo' + (st.cls === 'ok' || st.cls === 'off' ? '' : ' ' + st.cls),
        [st.text, xaTestLine(row)].filter(Boolean).join(' · '));
      r.appendChild(mo);
      /* What the verdict actually proved. It differs by transport -- an acp test
         completes a handshake and reads the agent's own capability list, a cli
         test dispatches a real turn -- so "passed" on its own would flatten two
         quite different claims into one word. */
      if (row.last_test_detail) {
        const note = mk('div', 'pnote clamp', row.last_test_detail);
        note.onclick = () => note.classList.toggle('clamp');
        r.appendChild(note);
      }
      /* The preset moved to another transport since this entry was written.
         Rewriting it silently would change its command line and invalidate every
         session handle bound to it, so the switch is offered, never applied. */
      if (row.upgrade_to) {
        const up = mk('div', 'keyrow');
        up.appendChild(mk('span', 'pnote', T('gui.agent.upgrade', { to: xaKind({ kind: row.upgrade_to }) })));
        const go = mk('button', 'mini', T('gui.agent.upgrade_do'));
        go.onclick = () => confirmAsk(T('gui.agent.upgrade_do'),
          T('gui.agent.upgrade_body', { name: row.name }), T('gui.agent.upgrade_do'),
          () => xaRun('upgrade', row));
        up.appendChild(go);
        r.appendChild(up);
      }

      if (xaEdit === row.name) {
        r.appendChild(xaForm(row));
      } else {
        const ctl = mk('div', 'ctl');
        if (row.test_running) {
          const stop = mk('button', 'mini ghost', T('gui.agent.test_cancel'));
          stop.onclick = () => xaRun('test_cancel', row);
          ctl.appendChild(stop);
        } else {
          const test = mk('button', 'mini ghost', T('gui.agent.test'));
          test.title = T('gui.agent.test_spend', { name: row.name });
          test.onclick = () => xaRun('test', row);
          ctl.appendChild(test);
        }
        const cfg = mk('button', 'mini ghost', T('gui.agent.configure'));
        cfg.onclick = () => { xaEdit = row.name; drawXa(); };
        ctl.appendChild(cfg);
        const tog = mk('button', 'mini ghost', T(row.enabled ? 'gui.agent.disable' : 'gui.agent.enable'));
        tog.onclick = () => xaRun('toggle', row, { enabled: !row.enabled });
        ctl.appendChild(tog);
        const rm = mk('button', 'mini ghost danger', T('gui.agent.disconnect'));
        rm.onclick = () => confirmAsk(T('gui.agent.disconnect'),
          T('gui.agent.disc_body', { name: row.name }), T('gui.agent.disconnect'),
          () => xaRun('remove', row));
        ctl.appendChild(rm);
        r.appendChild(ctl);
      }
      set.appendChild(r);
    });
    s1.appendChild(set);
  }
  box.appendChild(s1);

  const s2 = mk('div', 'csec');
  const hd2 = mk('div', 'hd');
  hd2.append(mk('b', null, T('gui.agent.off')), mk('span', 'n', String(off.length)));
  s2.appendChild(hd2);
  const g = mk('div', 'grid');
  off.forEach((row) => {
    const st = xaState(row);
    const card = mk('div', 'card');
    let th = 0;
    for (let i = 0; i < row.name.length; i++) th = (th * 31 + row.name.charCodeAt(i)) >>> 0;
    card.appendChild(mk('span', 'pmtile th' + (th % 8), row.name[0].toUpperCase()));
    const nm = mk('div', 'nm');
    nm.append(mk('span', null, row.name), mk('span', 'kd', xaKind(row)));
    card.append(nm);
    card.appendChild(mk('div', 'one', row.description || ''));
    if (st.text) card.appendChild(mk('div', 'st' + (st.cls === 'ok' || st.cls === 'off' ? '' : ' ' + st.cls), st.text));
    if (xaEdit === row.name) {
      card.appendChild(xaForm(row));
    } else {
      const ctl = mk('div', 'ctl');
      const b = mk('button', 'mini', T('gui.agent.connect'));
      b.onclick = (e) => {
        e.stopPropagation();
        /* An HTTP agent cannot answer without its key, so connecting it is the
           form rather than a one-click add: the alternative lands a disabled
           row and leaves the user hunting for why. */
        if (row.kind === 'openai') { xaEdit = row.name; drawXa(); return; }
        xaRun('connect', row, {});
      };
      ctl.appendChild(b);
      card.appendChild(ctl);
    }
    g.appendChild(card);
  });
  s2.appendChild(g);
  box.appendChild(s2);
}

/* The rail badge counts what needs a human: a connected agent the machine

/* The rail badge for capabilities that need attention. The composer used to
   carry a chip counting active capabilities too; it is gone -- how many tools
   are wired is a setup question, answered on the extensions page, not something
   to read while typing. What belongs under the field is the state of THIS
   session: how much context is left, and what the agent may do unasked. */
function drawCapsBadge() {
  const attn = attnCount();
  $('#plugBdg').textContent = String(attn);
  $('#plugBdg').hidden = attn === 0;
}

/* ---- context meter ------------------------------------------------
   Filled from the turn's own usage (message.complete carries context_used /
   context_max); hidden until a real window is known, since a ring drawn from a
   guessed denominator is worse than no ring. */
const CTX = { used: 0, max: 0, est: false };
const RING = 47.75;

function drawCtx() {
  const chip = $('#ctxChip');
  if (!chip) return;
  chip.hidden = !CTX.max;
  if (!CTX.max) return;
  const pct = Math.min(100, Math.max(0, Math.round((100 * CTX.used) / CTX.max)));
  chip.classList.toggle('warm', pct >= 70 && pct < 90);
  chip.classList.toggle('hot', pct >= 90);
  const fg = chip.querySelector('.fg');
  if (fg) fg.setAttribute('stroke-dashoffset', String(RING * (1 - pct / 100)));
  /* A resumed session's fill is counted from the stored transcript rather than
     reported by the provider, so it says so: a tilde is cheaper than a number
     that quietly pretends to be measured. */
  const tip = T('gui.ctx.tip', {
    used: fmtTokens(CTX.used),
    max: fmtTokens(CTX.max),
    pct: String(pct),
  });
  chip.dataset.tip = tip;
  chip.setAttribute('aria-label', tip);
}

const fmtTokens = (n) => (n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : String(n));

function setCtx(used, max, estimated) {
  if (typeof max === 'number' && max > 0) CTX.max = max;
  if (typeof used === 'number' && used >= 0) CTX.used = used;
  CTX.est = !!estimated;
  drawCtx();
}

/* ---- permission mode ----------------------------------------------
   Three tiers, ordered from the strictest to the one with no brakes, because
   that is the order a reader should meet them in. Front end only for now:
   nothing in the engine reads the choice yet, and the panel says so rather
   than letting the row imply a guarantee it cannot keep. The default is the
   behaviour Raven actually has today -- full access -- and it is the one tier
   drawn in the warning colour, since that is a fact about it, not decoration. */
const PERMS = [
  { id: 'ask', label: 'gui.perm.ask', sub: 'gui.perm.ask_h' },
  { id: 'smart', label: 'gui.perm.smart', sub: 'gui.perm.smart_h' },
  { id: 'full', label: 'gui.perm.full', sub: 'gui.perm.full_h', risk: true },
];
let perm = 'full';
try { perm = localStorage.getItem('raven.perm') || 'full'; } catch { perm = 'full'; }
if (!PERMS.some((p) => p.id === perm)) perm = 'full';

const PERM_ICO = {
  ask: '<path d="M12 3.5 19 6v5.5c0 4-2.9 7.4-7 9-4.1-1.6-7-5-7-9V6l7-2.5Z"/><path d="M9.6 10.2a2.4 2.4 0 1 1 3.3 2.2v1.1"/><path d="M12 16h.01"/>',
  smart: '<path d="M12 3.5 19 6v5.5c0 4-2.9 7.4-7 9-4.1-1.6-7-5-7-9V6l7-2.5Z"/><path d="M9 12.2l2 2 4-4.4"/>',
  full: '<path d="M12 3.5 19 6v5.5c0 4-2.9 7.4-7 9-4.1-1.6-7-5-7-9V6l7-2.5Z"/><path d="M12 8.6v3.6M12 15.2h.01"/>',
};

function drawPerm() {
  const cur = PERMS.find((p) => p.id === perm) || PERMS[0];
  $('#permName').textContent = T(cur.label);
  const chip = $('#permChip');
  /* No hover label: the chip already reads its own state, and the detail of
     each tier belongs in the panel the click opens. */
  delete chip.dataset.tip;
  chip.classList.toggle('risk', !!cur.risk);
  const ic = chip.querySelector('.pico');
  if (ic) ic.innerHTML = PERM_ICO[cur.id] || PERM_ICO.full;
  chip.setAttribute('aria-label', `${T('gui.perm.title')}: ${T(cur.label)}`);
}

function openPermPop() {
  const box = $('#permList'); box.innerHTML = '';
  PERMS.forEach((p) => {
    const r = mk('button', 'prow' + (p.risk ? ' risk' : ''));
    r.setAttribute('role', 'radio');
    r.setAttribute('aria-checked', String(p.id === perm));
    const g = mk('span', 'pic');
    g.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${PERM_ICO[p.id]}</svg>`;
    const txt = mk('span', 'txt');
    txt.append(mk('span', 'nm', T(p.label)), mk('span', 'sub', T(p.sub)));
    r.append(g, txt);
    if (p.id === perm) r.appendChild(ico(ACT_ICO.check, 'tick'));
    r.onclick = () => {
      perm = p.id;
      try { localStorage.setItem('raven.perm', perm); } catch { /* private mode */ }
      drawPerm(); closePermPop();
    };
    box.appendChild(r);
  });
  const pop = $('#permPop');
  pop.dataset.open = 'true';
  /* Anchored to the chip, not to an edge of the card: the chip sits in the
     middle of the bottom bar, and a panel pinned right pointed at nothing. */
  const dock = document.querySelector('.dock-in').getBoundingClientRect();
  const chip = $('#permChip').getBoundingClientRect();
  const w = pop.getBoundingClientRect().width;
  const left = Math.max(0, Math.min(dock.width - w, chip.left - dock.left - 8));
  pop.style.left = left + 'px';
  pop.style.right = 'auto';
  $('#permChip').setAttribute('aria-expanded', 'true');
}

function closePermPop() {
  $('#permPop').dataset.open = 'false';
  $('#permChip').setAttribute('aria-expanded', 'false');
}

const saved = (what) => toast(T('gui.saved', { what }));
// Filled in from system.version once the socket is up, and unknown until then:
// the running install is the only thing that knows its version, so a literal here
// would be a second source of truth that goes stale at every release. The rail
// foot and the About card both render this as "--" rather than as a guess.
let APP_VERSION = null;
let CONFIG_PATH = '~/.raven/config.json';
let SHOW_TOKENS = true;

/* Every displayed value is read through V(), so each page is written once:
   the demo answers with the fallback, live.js overrides V to read the config
   it pulled over settings.get. */
let V = (path, fallback) => fallback;

/* Real writes that only the live layer can perform. The demo keeps a local
   effect so the shell stays explorable; live.js swaps in the RPC. */
let deleteAllSessions = () => {
  SESS = []; cur = null; drawList(); $('#stage').innerHTML = '';
  $('#title').textContent = T('gui.new_task'); pitch();
};
let checkUpdate = () => notLive();

/* ---- the three tiers ------------------------------------------------
   A control either writes through, or it is tagged and refuses. Nothing sits
   in between: a switch that stays flipped after a change nothing stored is
   what this rework exists to kill.

   A tagged switch or segment never renders the new value to begin with -- both
   read their state from the last draw -- so the only thing to undo is text the
   reader typed. The refusal is spoken in the row, not in a toast: the live
   layer routes toasts to the console, where nobody is looking. */
function nlSay(el, reset, msg) {
  if (reset) reset();
  /* The row when the control sits in one, else the card: a chooser is a whole
     card wide, and the refusal has to land where the click did. */
  const host = el && el.closest ? el.closest('.crow') || el.closest('.scard') : null;
  const text = T(msg || 'gui.set.not_live');
  if (!host) { toast(text); return; }
  host.querySelectorAll('.nlmsg').forEach((n) => n.remove());
  const m = mk('div', 'nlmsg', text);
  host.appendChild(m);
  setTimeout(() => m.remove(), 3600);
}
const notLive = () => toast(T('gui.set.not_live'));
const deadSwi = (on, label) => { const s = swi(on, () => nlSay(s), label); return s; };
const deadText = (val, ph) => {
  const i = textField(val, () => nlSay(i, () => { i.value = val || ''; }), ph);
  return i;
};
const deadBtn = (label) => {
  const b = mk('button', 'mini ghost', label);
  b.onclick = () => nlSay(b);
  return b;
};
const deadSlider = (min, max, step, val, fmt) => {
  const w = slider(min, max, step, val, fmt, () => nlSay(w, () => {
    w.querySelector('input').value = val;
    w.querySelector('.val').textContent = fmt(val);
  }));
  return w;
};
/* Copy says so on itself: the same reason nlSay does not use a toast. */
function cpBtn(label, text) {
  const b = mk('button', 'mini ghost', label);
  b.onclick = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(String(text));
    b.textContent = T('gui.set.copied');
    setTimeout(() => { b.textContent = label; }, 1600);
  };
  return b;
}
const roVal = (text, dim) => mk('span', 'rov' + (dim ? ' dim' : ''), text || T('gui.set.unset'));

/* ---- write-through controls -----------------------------------------
   live.js points settingsWrite at the settings.set RPC; in the demo it
   stays null and every control below falls back to the tagged refusal.
   Vnull is V without the null-means-fallback collapse: memory.backend
   stores null as a real value ("plugin memory off"), and V would paint
   the schema default over it. */
let settingsWrite = null;
let Vnull = (path, fallback) => fallback;
/* EverOS model roles: live.js fills EVEROS over settings.everos and points
   everosWrite at settings.everosSet; in the demo both stay null/dead. */
let EVEROS = null;
let everosWrite = null;
let memEdit = null;
/* API usage stats: live.js fills USAGE over settings.usage on first view. */
let USAGE = null;
let usageLoad = null;

function wSwi(key, on, label) {
  const s = swi(on, (v) => {
    if (!settingsWrite) { nlSay(s); return; }
    settingsWrite(key, v, s);
  }, label);
  return s;
}
function wPick(key, opts, val, map) {
  return pick(opts, val, (v) => {
    if (!settingsWrite) { nlSay(null); return; }
    settingsWrite(key, map ? map(v) : v);
  });
}
function wText(key, val, ph, norm) {
  const i = textField(val, (v) => {
    if (!settingsWrite) { nlSay(i, () => { i.value = val || ''; }); return; }
    const out = norm ? norm(v) : v;
    if (out === undefined) { i.value = val || ''; return; }
    settingsWrite(key, out, i);
  }, ph);
  return i;
}
function wNum(key, val, min, max) {
  const i = textField(String(val), (v) => {
    const n = Number(v);
    if (!Number.isInteger(n) || n < min || n > max) { i.value = String(val); return; }
    if (!settingsWrite) { nlSay(i, () => { i.value = String(val); }); return; }
    settingsWrite(key, n, i);
  }, '');
  i.style.width = '90px';
  i.inputMode = 'numeric';
  return i;
}

/* ---- settings building blocks --------------------------------------
   A module is a few cards, each designed around what it actually is: a
   chooser whose options need a sentence, a set of numbers, a mirror of
   config.json, or a module that is off and should say what it would do. */
function scard(p, title, desc) {
  const c = mk('div', 'scard');
  if (title || desc) {
    const h = mk('div', 'ch');
    if (title) h.appendChild(mk('div', 't', title));
    if (desc) h.appendChild(mk('div', 'd', desc));
    c.appendChild(h);
  }
  p.appendChild(c);
  return c;
}
/* One footnote per card instead of a badge per row. */
function snote(c, text, code) {
  const n = mk('div', 'snote');
  n.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/>'
    + '<path d="M12 11.5v5M12 8h.01"/></svg>';
  const s = mk('span', null, text);
  if (code) { s.appendChild(document.createTextNode(' ')); s.appendChild(mk('code', null, code)); }
  n.appendChild(s);
  c.appendChild(n);
  return n;
}
function crow(c, label, ctl, hint) {
  const r = mk('div', 'crow');
  r.appendChild(mk('div', 'k', label));
  if (hint) r.appendChild(mk('div', 'h', hint));
  const w = mk('div', 'c'); w.appendChild(ctl); r.appendChild(w);
  c.appendChild(r);
  return r;
}
const TICK = '<svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>';
/* opts: [value, name, why]. `fn` null means the choice is explanatory only.
   Options that need no sentence render as a compact segment: a card grid
   with nothing to say per card is just empty space stacked N high. */
function pick(opts, val, fn, cls) {
  if (!cls && opts.every((o) => !o[2])) {
    const w = mk('div', 'sgm');
    opts.forEach(([v, name]) => {
      const b = mk('button', 'pk', name);
      b.setAttribute('aria-pressed', String(v === val));
      b.onclick = () => (fn ? fn(v) : nlSay(w));
      w.appendChild(b);
    });
    return w;
  }
  const w = mk('div', 'spick n' + opts.length + (cls ? ' ' + cls : ''));
  opts.forEach(([v, name, why]) => {
    const b = mk('button', 'pk');
    b.setAttribute('aria-pressed', String(v === val));
    const n = mk('div', 'n', name);
    n.insertAdjacentHTML('beforeend', TICK);
    b.appendChild(n);
    if (why) b.appendChild(mk('div', 'w', why));
    b.onclick = () => (fn ? fn(v) : nlSay(w));
    w.appendChild(b);
  });
  return w;
}
function statTiles(rows) {
  const w = mk('div', 'stats');
  rows.forEach(([v, k]) => {
    const t = mk('div', 'stat');
    t.append(mk('div', 'v' + (v == null ? ' none' : ''), v == null ? T('gui.set.nodata') : String(v)),
      mk('div', 'k', k));
    w.appendChild(t);
  });
  return w;
}
/* rows: [label, value, kind]. kind '' | 'unset' | 'ok' */
function kvList(rows) {
  const w = mk('div', 'skv');
  rows.forEach(([k, v, kind]) => {
    const r = mk('div', 'r');
    r.append(mk('span', 'k', k), mk('span', 'v' + (kind ? ' ' + kind : ''), v));
    w.appendChild(r);
  });
  return w;
}
/* The theme option is a miniature of the theme: three bars on the right ground
   read as "this is what the window will look like" faster than the word does. */
function themePick() {
  const w = mk('div', 'spick n3 thpick');
  const shot = (kind) => {
    const s = mk('div', 'shot ' + kind);
    s.appendChild(mk('div', 'r1'));
    const r2 = mk('div', 'r2');
    r2.append(mk('div', 'bar hd w45'), mk('div', 'bar w70'), mk('div', 'bar w45'));
    s.appendChild(r2);
    return s;
  };
  [['system', T('gui.set.theme_system')], ['light', T('gui.set.theme_light')],
    ['dark', T('gui.set.theme_dark')]].forEach(([v, name]) => {
    const b = mk('button', 'pk');
    b.setAttribute('aria-pressed', String(v === CFG.theme));
    if (v === 'system') {
      const g = mk('div', 'sysgrid');
      g.append(shot('lt'), shot('dk'));
      b.appendChild(g);
    } else {
      b.appendChild(shot(v === 'light' ? 'lt' : 'dk'));
    }
    const lb = mk('div', 'lb', name);
    lb.insertAdjacentHTML('beforeend', TICK);
    b.appendChild(lb);
    b.onclick = () => { CFG.theme = v; applyLook(); lookSave(); drawSettings(); };
    w.appendChild(b);
  });
  return w;
}
/* A font is chosen by looking at it, so the option renders in the face it sets
   -- the families are named in the stack, not only in the label. */
function fontPick() {
  const w = mk('div', 'spick n3 fpick');
  [['system', T('gui.set.codefont_system'), 'ui-monospace, monospace'],
    ['jet', 'JetBrains Mono', '"JetBrains Mono", ui-monospace, monospace'],
    ['sf', 'SF Mono', '"SF Mono", "SFMono-Regular", ui-monospace, monospace']]
    .forEach(([v, name, stack]) => {
      const b = mk('button', 'pk');
      b.setAttribute('aria-pressed', String(v === CFG.codeFont));
      const n = mk('div', 'n', name);
      n.insertAdjacentHTML('beforeend', TICK);
      const smp = mk('div', 'smp', 'const ok = 0 != O;');
      smp.style.fontFamily = stack;
      b.append(n, smp);
      b.onclick = () => { CFG.codeFont = v; applyLook(); lookSave(); drawSettings(); };
      w.appendChild(b);
    });
  return w;
}
function sempty(c, head, words, bullets) {
  const w = mk('div', 'sempty');
  w.appendChild(mk('div', 'h', head));
  if (words) w.appendChild(mk('div', 'w', words));
  if (bullets && bullets.length) {
    const ul = mk('ul');
    bullets.forEach((b) => ul.appendChild(mk('li', null, b)));

const onoff = (v) => T(v ? 'gui.set.on' : 'gui.set.off');

/* ---- appearance -----------------------------------------------------
   Each front end's own business, so it persists here rather than in the
   shared config -- and it does persist now: these used to toast "saved" and
   forget on reload. Language is the exception, it goes to config.language
   because the TUI and the agent's replies follow it. */
const LOOK_KEY = 'raven.gui.look';
/* Tells the desktop shell what ground colour this window actually shows, so
   its native launch splash can match on the NEXT run -- the page's theme
   lives in this origin's localStorage, which the shell cannot read before
   the page is up. No-op outside the shell. */
function shellTheme() {
  try {
    const t = document.documentElement.dataset.theme
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    window.webkit.messageHandlers.raven.postMessage({ type: 'theme', value: t });
  } catch { /* not the shell */ }
}
function applyLook() {
  const d = document.documentElement.dataset;
  if (CFG.theme === 'system') delete d.theme; else d.theme = CFG.theme;
  d.motion = CFG.motion;
  d.font = CFG.codeFont;
  shellTheme();
}
function lookSave() {
  try {
    localStorage.setItem(LOOK_KEY, JSON.stringify(
      { theme: CFG.theme, codeFont: CFG.codeFont, motion: CFG.motion }));
  } catch { /* private mode or quota: this tab only */ }
}
function lookLoad() {
  try {
    const o = JSON.parse(localStorage.getItem(LOOK_KEY) || 'null');
    if (o && typeof o === 'object') {
      if (o.theme) CFG.theme = o.theme;
      if (o.codeFont) CFG.codeFont = o.codeFont;
      if (o.motion) CFG.motion = o.motion;
    }
  } catch { /* fall back to the defaults in CFG */ }
  applyLook();
}

/* ---- notifications ---------------------------------------------------
   Front-end only: the OS notification fires when a turn finishes while the
   window is in the background. Preference persists per front end. */
const NTF_KEY = 'raven.gui.ntf';
const NTF = { on: false };
try {
  const o = JSON.parse(localStorage.getItem(NTF_KEY) || 'null');
  if (o && typeof o === 'object') NTF.on = !!o.on;
} catch { /* default off */ }
function ntfSave() {
  try { localStorage.setItem(NTF_KEY, JSON.stringify(NTF)); } catch { /* private mode */ }
}
function ntfPush(title, body, opts) {
  if (!NTF.on || !('Notification' in window) || Notification.permission !== 'granted') return;
  /* Only when the reader is away: a toast already covers the foreground. */
  if (!(opts && opts.force) && document.hasFocus()) return;
  try { new Notification(title, body ? { body } : undefined); } catch { /* platform quirk */ }
}

const isMac = () => /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const modKey = () => (isMac() ? '⌘' : 'Ctrl +');
const deviceLabel = () => `${(navigator.platform || '?')} · ` +
  T(/RavenShell/.test(navigator.userAgent) ? 'gui.set.acct.app' : 'gui.set.acct.web');

function seg(opts, val, fn) {
  const w = mk('div', 'seg');
  opts.forEach(([v, label]) => {
    const b = mk('button', null, label);
    b.setAttribute('aria-pressed', String(v === val));
    b.onclick = () => { fn(v); };
    w.appendChild(b);
  });
  return w;
}
function swi(on, fn, label) {
  const s = mk('button', 'swi');
  s.setAttribute('role', 'switch');
  s.setAttribute('aria-checked', String(on));
  if (label) s.setAttribute('aria-label', label);
  s.onclick = () => { fn(!on); };
  return s;
}
function slider(min, max, step, val, fmt, fn) {
  const w = mk('div'); w.style.cssText = 'display:flex;align-items:center';
  const i = mk('input'); i.type = 'range'; i.min = min; i.max = max; i.step = step; i.value = val;
  const out = mk('span', 'val', fmt(val));
  i.oninput = () => { out.textContent = fmt(Number(i.value)); };
  i.onchange = () => fn(Number(i.value));
  w.append(i, out);
  return w;
}
function textField(val, fn, ph) {
  const i = mk('input'); i.type = 'text'; i.value = val || ''; i.placeholder = ph || '';
  i.style.width = '230px';
  i.onchange = () => fn(i.value);
  return i;
}

/* ---- pages ----------------------------------------------------------
   One renderer per page, both layers. live.js overrides individual entries
   only where the real thing cannot be expressed through V(). */
const SET_PAGE = {

  account(p) {
    const c = scard(p);
    /* One sign-in affordance in the product, and it lives in the account
       panel -- a second button here would be a second thing to wire and a
       second thing to explain. This page states the state and points there. */
    if (AUTH.signed) {
      c.appendChild(kvList([
        [T('gui.set.acct.who'), AUTH.name || AUTH.email],
        [T('gui.set.acct.email'), AUTH.email || '--'],
      ].concat(AUTH.plan ? [[T('gui.set.acct.plan'), AUTH.plan]] : [])));
    } else {
      sempty(c, T('gui.acct.anon'));
    }
    const d = scard(p);
    d.appendChild(kvList([[T('gui.set.acct.device'), deviceLabel()]]));
  },

  /* The one module where every control is real, so it is the one module that
     earns visual controls: each option shows the thing it does. */
  look(p) {
    // Language first: it is the one switch that relabels every other row here,
    // in the TUI, and in what the agent writes back.
    const l = scard(p, T('gui.set.language'));
    l.appendChild(pick([['zh', T('gui.set.language_zh')], ['en', T('gui.set.language_en')]], LANG, (v) => {
      if (applyLang) { applyLang(v, { persist: true }); return; }
      LANG = v; applyI18n(); drawList(); drawSettings(); drawPerm(); drawCtx(); drawAcct();
    }));

    const t = scard(p, T('gui.set.theme'));
    t.appendChild(themePick());

    const f = scard(p, T('gui.set.codefont'));
    f.appendChild(fontPick());

    const m = scard(p, T('gui.set.motion'));
    crow(m, T('gui.set.motion'), swi(CFG.motion === 'off', (v) => {
      CFG.motion = v ? 'off' : 'on'; applyLook(); lookSave(); drawSettings();
    }, T('gui.set.motion')), T('gui.set.motion_w'));
  },

  notify(p) {
    const c = scard(p, T('gui.set.ntf.all'));
    const canNtf = 'Notification' in window;
    crow(c, T('gui.set.ntf.done'), swi(NTF.on, async (v) => {
      if (v && canNtf && Notification.permission !== 'granted') {
        const r = await Notification.requestPermission();
        if (r !== 'granted') { NTF.on = false; ntfSave(); drawSettings(); toast(T('gui.set.ntf.denied')); return; }
      }
      NTF.on = v && canNtf;
      ntfSave(); drawSettings();
      if (v && !canNtf) toast(T('gui.set.ntf.denied'));
    }, T('gui.set.ntf.all')));
    if (NTF.on) {
      const b = mk('button', 'mini ghost', T('gui.set.ntf.test'));
      b.onclick = () => ntfPush(T('gui.set.ntf.test_body'), '', { force: true });
      crow(c, T('gui.set.ntf.test'), b);
    }
  },

  usage(p) {
    /* Every open re-reads the counters -- what is on screen is a running
       total, and a cached one is wrong the moment the next call lands.
       The numbers already held are drawn immediately, so the refresh is
       silent rather than a skeleton flash. */
    if (usageLoad) usageLoad();
    if (!USAGE) {
      const c = scard(p);
      c.appendChild(mk('div', 'empty-note', T(usageLoad ? 'gui.set.usg.loading' : 'gui.set.nodata')));
      return;
    }
    const fmtTok = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M'
      : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n));
    const u = USAGE;
    const c = scard(p, `${T('gui.set.usg.llm')} · ${T('gui.set.usg.window', { d: u.days })}`);
    c.appendChild(statTiles([
      [String(u.llm.total.calls), T('gui.set.usg.calls')],
      [fmtTok(u.llm.total.input_tokens), T('gui.set.usg.in')],
      [fmtTok(u.llm.total.output_tokens), T('gui.set.usg.out')],
      ['$' + u.llm.total.cost_usd.toFixed(2), T('gui.set.usg.cost')]]));
    if (u.llm.models.length) {
      c.appendChild(kvList(u.llm.models.slice(0, 12).map((m) => [m.model,
        `${m.calls} × · ${fmtTok(m.input_tokens + m.output_tokens)} tok · $${m.cost_usd.toFixed(2)}`])));
    }
    const t = scard(p, `${T('gui.set.usg.tools')} · ${T('gui.set.usg.window', { d: u.days })}`);

      ['gui.set.kbd.grp_nav', [['gui.set.kbd.newtask', `${m} N`],

  model(p) {
    const card = scard(p, T('gui.set.mdl.providers'));
    const set = card.appendChild(mk('div', 'fset'));
    PROVIDERS.forEach((pv) => {
      const c = mk('div', 'pcard');
      const nm = mk('div', 'nm');

      c.append(nm, mk('div', 'mo', pv.models.join(' · ')));
      const ctl = mk('div', 'ctl');
      if (pv.on) {
        const d = mk('button', 'mini ghost', T('gui.model.disconnect'));

          T('gui.model.disconnect_body', { name: pv.name }), T('gui.model.disconnect'), () => {
            pv.on = false; pv.key = '';

            drawSettings();
          });
        ctl.appendChild(d);
      } else {
        ctl.appendChild(roVal(T('gui.model.not_connected'), true));
      }
      c.appendChild(ctl);
      const kr = mk('div', 'keyrow');

/* What a schedule means, in words. The raw five-field expression stays in
   the editor for whoever writes one, but nobody should have to read it. */
function cronExprHuman(expr) {
  const p = String(expr || '').trim().split(/\s+/);
  const raw = `cron ${expr}`;
  if (p.length !== 5) return raw;
  const [m, h, dom, mon, dow] = p;
  if (dom !== '*' || mon !== '*') return raw;
  const pad = (n) => String(n).padStart(2, '0');
  let day;
  if (dow === '*') day = T('gui.cron.h.daily');
  else if (dow === '1-5') day = T('gui.cron.h.weekdays');
  else if (dow === '0,6' || dow === '6,0') day = T('gui.cron.h.weekend');
  else if (/^[0-6](,[0-6])*$/.test(dow)) {
    day = dow.split(',').map((d) => T('gui.cron.h.dow' + d)).join('、');
  } else return raw;
  let time;
  const mN = /^\d+$/.test(m), hN = /^\d+$/.test(h);
  const hRange = h.match(/^(\d+)-(\d+)$/);
  const mStep = m.match(/^\*\/(\d+)$/), hStep = h.match(/^\*\/(\d+)$/);
  const mList = /^\d+(,\d+)+$/.test(m) ? m.split(',').map(Number) : null;
  if (mN && hN) time = `${pad(h)}:${pad(m)}`;
  else if (mN && /^\d+(,\d+)+$/.test(h)) time = h.split(',').map((x) => `${pad(x)}:${pad(m)}`).join('、');
  else if (hStep && mN) time = T('gui.cron.h.every_h', { n: hStep[1] });
  else if (mStep && h === '*') time = T('gui.cron.h.every_m', { n: mStep[1] });
  else {
    const span = hRange ? `${pad(hRange[1])}:00–${pad(hRange[2])}:59`
      : h === '*' ? T('gui.cron.h.allday') : null;
    let mm = null;
    if (mList) {
      mm = mList.length === 2 && mList[0] === 0 && mList[1] === 30
        ? T('gui.cron.h.half') : T('gui.cron.h.at_min', { m: mList.map(pad).join('/') });
    } else if (mStep) mm = T('gui.cron.h.every_m', { n: mStep[1] });
    else if (mN && hRange) mm = T('gui.cron.h.at_min', { m: pad(m) });
    if (span == null || mm == null) return raw;
    time = `${span} ${mm}`;
  }
  return `${day} ${time}`;
}
/* Demo rows carry a hand-written `when`; a real cron expr goes through the
   translator. live.js routes every kind through here via cronToRow. */
function cronWhen(j) {
  return j.freq === 'cron' && j.at ? cronExprHuman(j.at) : j.when;
}

function drawCron() {
  const box = $('#cronBody'); box.innerHTML = '';

  if (cronView) {
    const j = CRONS.find((x) => x.id === cronView);
    if (j) { drawCronDetail(box, j); return; }
    cronView = null;
  }

  const row = mk('div', 'herorow');
  const hero = mk('div', 'pmhero');
  hero.appendChild(mk('h3', null, T('gui.cron.hero')));
  row.appendChild(hero);
  const add = mk('button', 'mini gold', T('gui.cron_new'));
  add.onclick = () => openJobSheet();
  row.appendChild(add);
  box.appendChild(row);

  const fail = CRONS.filter((j) => j.on && j.runs[0] && !j.runs[0].ok);
  if (fail.length) {
    const b = mk('div', 'banner'); b.style.margin = '0 0 18px';
    b.append(mk('b', null, T('gui.cron.failing', { n: fail.length })));
    b.appendChild(mk('span', null, fail.map((j) => j.name).join(', ')));
    const go = mk('button', null, T('gui.cron.why'));
    go.onclick = () => openRun(fail[0], fail[0].runs[0]);
    b.appendChild(go);
    box.appendChild(b);
  }

  if (!CRONS.length) {
    box.appendChild(mk('div', 'empty-note', T('gui.cron.none')));
    return;
  }

  const set = mk('div', 'cronlist');
  CRONS.forEach((j) => set.appendChild(cronRow(j)));
  box.appendChild(set);
}

function cronRow(j) {
  const last = j.runs[0];
  const r = mk('div', 'cronjob' + (j.on && last && !last.ok ? ' bad' : ''));
  r.style.cursor = 'pointer';
  r.onclick = (e) => { if (e.target.closest('button')) return; openCronDetail(j); };

  const nm = mk('div', 'nm');
  nm.appendChild(mk('span', 'dot' + (!j.on ? '' : last && !last.ok ? ' err' : ' run')));
  nm.appendChild(mk('span', null, j.name));
  nm.appendChild(mk('span', 'when', T(DELIVER[j.deliver] || 'gui.deliver.app')));
  r.appendChild(nm);

  const meta = mk('div', 'mo');
  meta.textContent = j.on ? T('gui.cron.next', { when: j.when, next: j.next })
    : T('gui.cron.paused_meta', { when: j.when });
  r.appendChild(meta);

  const foot = mk('div', 'foot');
  if (last) {
    const chip = mk('button', 'mini ghost');
    chip.textContent = T('gui.cron.last_run',
      { at: last.at, state: T(last.ok ? 'gui.cron.ok' : 'gui.cron.failed'), dur: dur(last.ms) });
    if (!last.ok) chip.classList.add('danger');
    chip.onclick = () => openRun(j, last);
    foot.appendChild(chip);
    foot.appendChild(mk('span', 'mono', last.note)).style.cssText =

/* A run is a session. Opening one leaves the schedule and lands in the
   transcript, which is the whole point of scheduling anything. */
function openRun(j, run) {
  closeCron();
  const s = { id: 'n' + Date.now(), title: j.name, last: run.note,
    when: run.at, g: '今天', run: run.ok ? 'gtm' : null, status: run.ok ? null : 'err',
    from: 'cron', job: j.id };
  SESS.unshift(s); cur = s.id; drawList(); openSession(s);

    $('#stage').innerHTML = '';
    ask(j.what);
    errLine(run.note, T('gui.cron.rerun_note'));
  }
  toast(`打开了 ${run.at} 那次运行`);
}

function runNow(j) {

}

/* create / edit -- one form, two hosts: the new-job sheet and the detail
   page's config card both build from the same draft. */
let jobDraft = null;
function buildJobForm(b, draft, redraw) {
  const field = (label, hint, node) => {
    const w = mk('div', 'ff');
    w.appendChild(mk('label', null, label));
    w.appendChild(node);
    if (hint) w.appendChild(mk('span', 'hint', hint));
    b.appendChild(w);
    return node;
  };

  const nameIn = mk('input'); nameIn.type = 'text'; nameIn.value = draft.name;
  nameIn.placeholder = T('gui.job.name_ph');
  nameIn.oninput = () => { draft.name = nameIn.value; draft.blank = null; };
  /* Same rule as the schedule row: a refusal is the one state change with
     nothing for the reader to look at, so it is marked where it happened. */
  /* Marked per field, so "both are required" does not appear under the one the
     reader already filled in. */
  const blankName = draft.blank && !draft.name.trim();
  const blankWhat = draft.blank && !draft.what.trim();
  if (blankName) nameIn.dataset.bad = 'true';
  field(T('gui.job.name'), blankName ? T('gui.job.need_name') : null, nameIn);

  const what = mk('textarea');
  what.rows = 3; what.value = draft.what;
  what.placeholder = T('gui.job.what_ph');
  what.style.cssText = 'background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:9px 11px;outline:0;resize:vertical;font-size:13px;line-height:1.6';
  what.oninput = () => { draft.what = what.value; draft.blank = null; };
  /* Inline, because this field's border is inline: a stylesheet rule cannot
     reach past `style.cssText` above, so the mark has to be set where the
     border was. */
  if (blankWhat) { what.dataset.bad = 'true'; what.style.borderColor = 'var(--amber)'; }
  field(T('gui.job.what'), blankWhat ? T('gui.job.need_what') : null, what);

  const row = mk('div'); row.style.cssText = 'display:flex;gap:9px;align-items:center;flex-wrap:wrap';
  const fseg = seg(FREQ.map((f) => [f.id, T(f.label)]), draft.freq, (v) => {
    draft.freq = v; redraw();
  });
  row.appendChild(fseg);
  if (draft.freq === 'week') {
    /* A control, not free text. The weekday used to be read back out of the
       localized placeholder the field taught the reader to type, so an English
       "Fri 17:00" missed a Chinese-only pattern and fell through to Monday --
       with the hour still correct, so nothing looked wrong. */
    const wd = mk('select');
    for (let d = 0; d < 7; d++) {
      const o = mk('option', null, T('gui.cron.h.dow' + d));
      o.value = String(d);
      if (String(d) === String(draft.wd ?? 1)) o.selected = true;
      wd.appendChild(o);
    }
    wd.onchange = () => { draft.wd = Number(wd.value); draft.bad = null; };
    if (draft.wd == null) draft.wd = 1;
    row.appendChild(wd);
  }
  if (draft.freq === 'once') {
    /* The one-shot's own instant, round-tripped as an ISO string rather than
       re-derived from prose: `cron.save` takes `at_iso` and recomputes the
       delete-after-run flag from the kind, so the reminder stays a reminder. */
    const when = mk('input'); when.type = 'datetime-local'; when.style.width = '190px';
    when.value = draft.at_local || '';
    when.oninput = () => { draft.at_local = when.value; draft.bad = null; };
    row.appendChild(when);
  }
  if (draft.freq !== 'hour' && draft.freq !== 'once' && draft.freq !== 'week') {
    const at = mk('input'); at.type = 'text'; at.value = draft.at; at.style.width = '140px';
    at.placeholder = draft.freq === 'cron' ? '0 8 * * *' : '08:00';
    at.oninput = () => { draft.at = at.value; draft.bad = null; };
    row.appendChild(at);
    if (draft.freq === 'cron') {
      const hu = mk('span', 'hint');
      const refresh = () => { hu.textContent = cronExprHuman(at.value); };
      at.addEventListener('input', refresh); refresh();
      row.appendChild(hu);
    }
  }
  if (draft.freq === 'week') {
    const at = mk('input'); at.type = 'text'; at.value = draft.at; at.style.width = '90px';
    at.placeholder = '09:30';
    at.oninput = () => { draft.at = at.value; draft.bad = null; };
    row.appendChild(at);
  }
  /* A refused save is the one state change that leaves nothing to look at, so
     the reason goes on the control rather than into a toast -- which live mode
     redirects to the console, where the reader is not. Cleared by the redraw
     that any edit triggers. */
  field(T('gui.job.freq'), draft.bad ? T(draft.bad) : null, row);
  if (draft.bad) row.dataset.bad = 'true';

  const sel = mk('select');
  Object.entries(DELIVER).forEach(([k, v]) => {
    const o = mk('option', null, T(v)); o.value = k;
    if (k === draft.deliver) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => { draft.deliver = sel.value; };
  field(T('gui.job.deliver'), null, sel);
  return nameIn;
}

/* ══ slash commands ═══════════════════════════════════════════════
   Only what acts on THIS conversation. Navigation lives in the rail, so
   putting it here too would just be a second, worse way to click it.   */
/* Commands carry ids, not spellings: the palette renders whatever the
   active language calls them, and both spellings stay typeable. */
/* Two commands, deliberately. Anything else a palette could offer already has
   a button -- send/stop, the model chip, the answer footer, the rail -- and a
   second entry point for the same action is one more thing to keep in sync.
   What is left is what has no button: acting on the session as a whole. */
const SLASH = [
  { id: 'gui.compress', fn: () => {} },
  { id: 'gui.clear', fn: () => confirmAsk(T('gui.clear_title'), T('gui.clear_body'), T('gui.clear_yes'), () => {
      const s = sess(cur);
      $('#stage').innerHTML = ''; pitch();
      if (s) { s.run = null; s.last = T('gui.sess.not_started'); }
      use = null; drawMeter(); drawList();
    }) }
];

const slashCmd = (x) => '/' + slashName(x.id);
const slashDesc = (x) => slashHelp(x.id);

let slashRows = [], slashSel = 0;

function slashOpen() { return $('#slashPop').dataset.open === 'true'; }

function drawSlash(term) {
  const q = term.slice(1).toLowerCase();
  slashRows = SLASH.filter((x) => (!x.when || x.when())
    && (!q || x.id.includes(q) || slashName(x.id).toLowerCase().includes(q) || slashDesc(x).toLowerCase().includes(q)));
  slashSel = 0;
  const box = $('#slashList'); box.innerHTML = '';
  if (!slashRows.length) { closeSlash(); return; }
  slashRows.forEach((x, i) => {
    const r = mk('button', 'srow');
    r.setAttribute('role', 'option');
    r.setAttribute('aria-selected', String(i === 0));
    r.append(mk('span', 'cmd', slashCmd(x)), mk('span', 'd', slashDesc(x)));
    r.onmousedown = (e) => { e.preventDefault(); runSlash(x); };
    box.appendChild(r);
  });
  $('#slashPop').dataset.open = 'true';
}

function closeSlash() { $('#slashPop').dataset.open = 'false'; }

function moveSlash(d) {
  const items = [...$('#slashList').children];
  if (!items.length) return;
  items[slashSel].setAttribute('aria-selected', 'false');
  slashSel = (slashSel + d + items.length) % items.length;
  items[slashSel].setAttribute('aria-selected', 'true');
}

function runSlash(x) {
  closeSlash();
  ta.value = ''; taFit(); goState();
  clearTimeout(draftTick); dropDraft(draftOwner);
  x.fn();
}

/* ══ theme ════════════════════════════════════════════════════════ */
function toggleTheme() {
  const now = document.documentElement.dataset.theme
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = now === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  CFG.theme = next;
  shellTheme();
  if (setIsOpen()) drawSettings();
}

/* An IME sends its keystrokes as keydown too, so while a composition is open
   Enter belongs to the input method: it commits the candidate being typed
   (letters included, which is how CJK users type Latin). Acting on it would
   swallow the text the reader was in the middle of writing. Every Enter
   handler over a text field asks this first. keyCode 229 is the older spelling
   some IMEs still send instead of isComposing. */
const composing = (e) => !!(e.isComposing || e.keyCode === 229);

/* ══ wiring ═══════════════════════════════════════════════════════ */
const ta = $('#ta');
ta.addEventListener('input', () => {
  taFit(); goState();
  const v = ta.value;
  if (v.startsWith('/') && !v.includes(' ')) drawSlash(v); else closeSlash();
  clearTimeout(draftTick); draftTick = setTimeout(parkDraft, 250);
});
/* The debounce above can still be in flight when the tab goes away. */
window.addEventListener('beforeunload', parkDraft);
ta.addEventListener('keydown', (e) => {
  /* the whole handler, not just Enter: arrows and Tab drive the candidate list
     while an IME is composing */
  if (composing(e)) return;
  if (slashOpen()) {
    if (e.key === 'ArrowDown') { e.preventDefault(); return moveSlash(1); }
    if (e.key === 'ArrowUp') { e.preventDefault(); return moveSlash(-1); }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); return runSlash(slashRows[slashSel]); }
    // stopPropagation: the document handler also owns Escape, and dismissing
    // the menu must not fall through to "interrupt the running turn"
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); return closeSlash(); }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); fireSend(); }
});
ta.addEventListener('blur', () => setTimeout(closeSlash, 120));

/* Same reason as the copy button below: prose is replaced on every answer. */
document.addEventListener('click', (e) => {
  const p = e.target.closest && e.target.closest('code.pth');
  if (p) pathOpen(p.dataset.p);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const p = document.activeElement;
  if (p && p.classList && p.classList.contains('pth')) { e.preventDefault(); pathOpen(p.dataset.p); }
});

/* Code blocks come and go with every answer, so the click is caught once here
   rather than bound per block. The text comes from the DOM the reader sees. */
document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('.cbcp');
  if (!b) return;
  const blk = b.closest('.cblk');
  const pre = blk && blk.querySelector('pre');
  if (!pre) return;
  if (navigator.clipboard) navigator.clipboard.writeText(pre.textContent);
  b.classList.add('ok');
  b.title = T('gui.code.copied');
  b.setAttribute('aria-label', T('gui.code.copied'));
  setTimeout(() => {
    b.classList.remove('ok');
    b.title = T('gui.code.copy');
    b.setAttribute('aria-label', T('gui.code.copy'));
  }, 1500);
});

const _sc = $('#scroll');
/* Everything docked at the bottom moves: the composer grows with its content,
   queued rows and a clarify sheet stack above it. The pill hangs off .chat, a
   different positioned ancestor, so keeping them apart takes one measured
   number -- the distance from the chat column's bottom edge up to the top of
   the highest docked thing -- published for the CSS to offset against. */
function dockLift() {
  const chat = document.querySelector('.chat');
  const dock = document.querySelector('.dock');
  if (!chat || !dock) return;
  /* Measured against what the reader SEES, not the dock's box: the dock carries
     padding and an empty hint strip under the field, and offsetting against
     those parks the pill a finger's width above the composer for no reason. */
  let top = dock.getBoundingClientRect().bottom;
  /* Scoped to the dock on purpose: a clarify sheet lives in the transcript, so
     a global match would anchor the pill to wherever that sheet has scrolled.
     The card itself is included: its border and padding are visual height too,
     and measuring only its children parked the pill 6px into the glass. */
  dock.querySelectorAll('.dock-in, .dock-in > *').forEach((n) => {
    const r = n.getBoundingClientRect();
    if (r.height > 0) top = Math.min(top, r.top);
  });
  /* Written only on a real change: this also runs per scroll event, and a style
     write there would invalidate layout on every frame of a flick. */
  const v = Math.round(chat.getBoundingClientRect().bottom - top) + 'px';
  if (chat.style.getPropertyValue('--lift') !== v) chat.style.setProperty('--lift', v);
}
/* A textarea cannot size itself to its content, so the height is set here --
   but the ceiling stays in CSS and is read back, so there is one cap to tune
   and it can be viewport-relative. */
function taFit() {
  const el = $('#ta');
  el.style.height = 'auto';
  el.style.height = Math.min(parseFloat(getComputedStyle(el).maxHeight) || 168, el.scrollHeight) + 'px';
  dockLift();
}
/* Catches every reason the dock changes height -- typing, a pasted blob, queued
   rows, staged attachments -- without a call at each site. */
if (window.ResizeObserver) new ResizeObserver(dockLift).observe(document.querySelector('.dock'));
/* A popover above the composer is absolutely positioned, so opening one never
   resizes the dock and the observer above never fires: without this the pill
   would ignore the popover, and worse, keep whatever offset it was last given.
   Safe against a loop -- dockLift writes to .chat, which is outside .dock. */
new MutationObserver(dockLift).observe(document.querySelector('.dock'), {
  subtree: true, childList: true, attributes: true,
  attributeFilter: ['data-open', 'hidden', 'style', 'class'],
});
/* A vh-based cap changes with the window, so the height has to be recomputed. */
window.addEventListener('resize', taFit);

/* The pill only appears when the reader has left the tail. */
function drawPill() {
  const away = _sc.scrollHeight - _sc.scrollTop - _sc.clientHeight > 120;
  const pill = $('#backpill');
  pill.hidden = stick || !away;
  if (!pill.hidden) {
    /* The offset must be current the moment it appears, not from whenever the
       dock last changed shape. */
    dockLift();
    pill.dataset.tip = T('gui.pill.bottom');
    pill.setAttribute('aria-label', T('gui.pill.bottom'));
  }
}
$('#backpill').onclick = () => { stick = true; down(); drawPill(); };
_sc.addEventListener('wheel', (e) => { if (e.deltaY < 0) { stick = false; drawPill(); } }, { passive: true });
_sc.addEventListener('scroll', () => {
  if (_sc.scrollHeight - _sc.scrollTop - _sc.clientHeight < 4) stick = true;
  drawPill();
});
function fireSend() {
  const v = ta.value.trim(); if (!v && !hasAtts()) return;
  ta.value = ''; taFit();
  clearTimeout(draftTick); dropDraft(draftOwner);
  send(v); goState();
}
$('#go').onclick = () => (busy ? halt() : fireSend());
$('#attBtn').onclick = () => toast('demo：正式版在这里选文件或直接拖进来');

document.addEventListener('keydown', (e) => {
  /* Escape ends an open composition; it must not also close a panel or halt the
     running turn behind the reader's back. */
  if (composing(e)) return;
  const inField = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === 'Escape') {
    if (document.querySelector('.lightbox')) return closeImage();
    if ($('#acct').dataset.open === 'true') return toggleAcct(false);
    if ($('#veil').dataset.open === 'true') return $('#cfNo').click();
    if ($('#detail').dataset.open === 'true') return closeDetail();
    if ($('#jobVeil').dataset.open === 'true') return $('#jobNo').click();
    if ($('#cronPage').dataset.open === 'true') return closeCron();
    if ($('#memPage').dataset.open === 'true') return closeMem();
    if ($('#capsPage').dataset.open === 'true') return closeCaps();
    if ($('#xaPage').dataset.open === 'true') return closeXa();
    if ($('#connPage').dataset.open === 'true') return closeConn();
    if (setIsOpen()) return closeSet();
    if (busy) return halt();
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') {
    e.preventDefault(); setRail(true); toggleFind(true);
  }
  if ((e.metaKey || e.ctrlKey) && e.key === '\\') {
    e.preventDefault(); setRail(document.querySelector('.app').dataset.rail === 'off');
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n' && !inField) { e.preventDefault(); $('#newBtn').click(); }
});

$('#newBtn').onclick = () => {

/* ══ overlay scrollbars ══════════════════════════════════════════════
   One implementation for every scroller in the app, installed once by
   listening for scroll in the capture phase -- a panel drawn later, or a list
   that only exists while a dialog is open, is covered without registering
   anything. Thumbs are created on demand and parked in a fixed layer, so they
   float over the content instead of taking a column out of it.

   SB_HIDE is how long a bar stays after the last scroll event. Long enough to
   read where you are in a long transcript, short enough that it is gone before
   you look at the layout again. */
const SB_HIDE = 900;
const SB_MIN = 26;
const SB_PAD = 2;
const sbLayer = mk('div', 'sbars');
document.body.appendChild(sbLayer);
const sbMap = new WeakMap();

function sbRoot(el) {
  return el === document || el === document.documentElement || el === window
    ? document.scrollingElement : el;
}

function sbBars(el) {
  let b = sbMap.get(el);
  if (!b) {
    b = { v: null, h: null, timer: 0, drag: null };
    sbMap.set(el, b);
  }
  return b;
}

function sbThumb(bars, axis) {
  if (bars[axis]) return bars[axis];
  const t = mk('div', 'sbar');
  t.dataset.axis = axis;
  sbLayer.appendChild(t);
  bars[axis] = t;
  return t;
}

/* Geometry is read from the element every time rather than cached: a scroller
   can be resized, moved by a panel drag, or re-rendered under the same node. */
function sbPlace(el, bars, axis) {
  const vert = axis === 'v';
  const size = vert ? el.clientHeight : el.clientWidth;
  const full = vert ? el.scrollHeight : el.scrollWidth;
  if (!el.isConnected || full <= size + 1 || size < 40) {
    if (bars[axis]) { bars[axis].remove(); bars[axis] = null; }
    return;
  }
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const t = sbThumb(bars, axis);
  const track = (vert ? r.height : r.width) - SB_PAD * 2;
  const len = Math.max(SB_MIN, Math.round(track * (size / full)));
  const pos = (vert ? el.scrollTop : el.scrollLeft) / (full - size);
  const off = SB_PAD + Math.round((track - len) * Math.min(1, Math.max(0, pos)));
  if (vert) {
    t.style.cssText = `top:${r.top + off}px;left:${r.right - 8}px;width:6px;height:${len}px`;
  } else {
    t.style.cssText = `left:${r.left + off}px;top:${r.bottom - 8}px;height:6px;width:${len}px`;
  }
  sbDrag(t, el, axis);
  return t;
}

/* Whoever is showing a bar right now. A scroller that moved without being
   scrolled -- because an ancestor scrolled, or a panel next to it was dragged
   wider -- still has to have its thumb put back where the box now is. */
const sbLive = new Set();

function sbShow(el) {
  const bars = sbBars(el);
  ['v', 'h'].forEach((a) => {
    const t = sbPlace(el, bars, a);
    if (t) t.dataset.on = 'true';
  });
  sbLive.add(el);
  clearTimeout(bars.timer);
  bars.timer = setTimeout(() => {
    /* A bar being dragged must not time out from under the pointer. */
    if (bars.drag) return;
    ['v', 'h'].forEach((a) => { if (bars[a]) bars[a].dataset.on = 'false'; });
    sbLive.delete(el);
  }, SB_HIDE);
}

function sbSync(skip) {
  sbLive.forEach((el) => {
    if (el === skip) return;
    if (!el.isConnected) { sbHide(el); return; }
    const bars = sbBars(el);
    ['v', 'h'].forEach((a) => { if (bars[a]) sbPlace(el, bars, a); });
  });
}

function sbHide(el) {
  const bars = sbMap.get(el);
  sbLive.delete(el);
  if (!bars) return;
  clearTimeout(bars.timer);
  ['v', 'h'].forEach((a) => { if (bars[a]) { bars[a].remove(); bars[a] = null; } });
}

/* The native bar is gone, so the thumb has to be draggable itself or scrolling
   by grabbing the bar -- the one gesture a trackpad cannot do -- would be lost. */
function sbDrag(t, el, axis) {
  if (t._wired) return;
  t._wired = true;
  t.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const vert = axis === 'v';
    const bars = sbBars(el);
    const start = vert ? e.clientY : e.clientX;
    const from = vert ? el.scrollTop : el.scrollLeft;
    const size = vert ? el.clientHeight : el.clientWidth;
    const full = vert ? el.scrollHeight : el.scrollWidth;
    const track = (vert ? el.clientHeight : el.clientWidth) - SB_PAD * 2;
    const len = Math.max(SB_MIN, track * (size / full));
    bars.drag = true;
    t.dataset.drag = 'true';
    /* A pointer can be gone by the time this runs (released mid-dispatch, or a
       synthetic event); capture is an optimisation, not the drag itself. */
    try { t.setPointerCapture(e.pointerId); } catch { /* not capturable */ }
    document.body.style.userSelect = 'none';
    const move = (ev) => {
      const d = (vert ? ev.clientY : ev.clientX) - start;
      const ratio = (full - size) / Math.max(1, track - len);
      if (vert) el.scrollTop = from + d * ratio;
      else el.scrollLeft = from + d * ratio;
    };
    const up = () => {
      t.removeEventListener('pointermove', move);
      t.removeEventListener('pointerup', up);
      t.removeEventListener('pointercancel', up);
      delete t.dataset.drag;
      bars.drag = null;
      document.body.style.userSelect = '';
      sbShow(el);
    };
    t.addEventListener('pointermove', move);
    t.addEventListener('pointerup', up);
    t.addEventListener('pointercancel', up);
  });
}

document.addEventListener('scroll', (e) => {
  const el = sbRoot(e.target);
  if (!el || el.nodeType !== 1) return;
  sbShow(el);
  sbSync(el);
}, true);
/* Resizing moves every box at once, and a bar mid-fade would be left hanging
   over whatever landed under it. */
window.addEventListener('resize', () => { sbLive.forEach(sbHide); });

/* ══ resizable panels ════════════════════════════════════════════════
   Both panels drag the same way, so the differences are data: which variable
   the grip writes, which direction widens it, and the bounds. The floor and
   ceiling are not decoration -- a 90px rail cannot show a session title and a
   900px panel leaves no transcript -- and the ceiling is additionally clamped
   against the window so a drag can never squeeze the chat below its floor. */
const PANE = {
  rail: { v: '--rail', min: 190, max: 420, key: 'raven.gui.railw', edge: 'left' },
  ws:   { v: '--wsw',  min: 320, max: 760, key: 'raven.gui.wsw',   edge: 'right' }
};
/* The chat's floor is a CSS token because the grid enforces it too -- read it
   back instead of keeping a second copy of the number here. */
const cssPx = (name) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || 0;
function paneMax(p) {
  const railOff = document.querySelector('.app').dataset.rail === 'off';
  const taken = p.edge === 'right' && !railOff ? document.querySelector('.rail').offsetWidth : 0;
  return Math.max(p.min, Math.min(p.max, window.innerWidth - taken - cssPx('--chat-min')));
}
function paneSet(name, px, persist) {
  const p = PANE[name];
  const w = Math.round(Math.max(p.min, Math.min(paneMax(p), px)));
  document.documentElement.style.setProperty(p.v, w + 'px');
  if (persist) { try { localStorage.setItem(p.key, String(w)); } catch {} }
  sbSync();
  return w;
}
/* A width stored on a wide screen must not survive onto a narrow one unusably,
   so the stored value is re-clamped rather than trusted. */
function paneLoad() {
  Object.keys(PANE).forEach((name) => {
    let v = null;
    try { v = localStorage.getItem(PANE[name].key); } catch {}
    if (v) paneSet(name, parseFloat(v), false);
  });
}
function gripDrag(el, name) {
  const p = PANE[name];
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const startX = e.clientX;
    const start = cssPx(p.v) || p.min;
    el.dataset.drag = 'true';
    el.setPointerCapture(e.pointerId);
    /* While dragging, the pointer is over the transcript half the time; without
       this the drag keeps selecting text under it. */
    document.body.style.userSelect = 'none';
    const move = (ev) => {
      const d = ev.clientX - startX;
      paneSet(name, start + (p.edge === 'right' ? -d : d), false);
      dockLift();
    };
    const up = () => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      delete el.dataset.drag;
      document.body.style.userSelect = '';
      paneSet(name, cssPx(p.v), true);
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });
  /* Keyboard: the grip is a real separator, so arrows move it. */
  el.tabIndex = 0;
  el.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 40 : 10;
    const cur = cssPx(p.v) || p.min;
    if (e.key === 'ArrowLeft') { e.preventDefault(); paneSet(name, cur + (p.edge === 'right' ? step : -step), true); }
    if (e.key === 'ArrowRight') { e.preventDefault(); paneSet(name, cur + (p.edge === 'right' ? -step : step), true); }
  });
}

/* Shrinking the window must re-clamp both, or the chat loses its floor. */
window.addEventListener('resize', () => {

    paneSet(n, cssPx(PANE[n].v) || PANE[n].min, false);

/* ══ boot ═════════════════════════════════════════════════════════
   Each step is isolated: one failure used to abort the whole sequence and
   leave the static shell on screen with no session list, no transcript and
   no clue why. Now a failure is visible and the rest still renders.      */
function bootError(where, e) {
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;background:#d96a5b;color:#fff;'
    + 'font:12px/1.5 ui-monospace,monospace;padding:8px 14px;white-space:pre-wrap';
  const at = ((e && e.stack) || '').split('\n')[1] || '';
  bar.textContent = T('gui.boot_fail', { where, err: (e && e.message) || e }) + `\n${at.trim()}`;
  document.body.appendChild(bar);
  if (window.console) console.error('[boot]', where, e);
}

const _spT0 = Date.now();
function hideSplash(minMs) {
  const s = document.getElementById('splash');
  if (!s) return;
  const wait = Math.max(0, (minMs == null ? 600 : minMs) - (Date.now() - _spT0));
  setTimeout(() => {
    s.dataset.off = '1';
    setTimeout(() => s.remove(), 560);
  }, wait);
}

/* First-run flow. `be` is the backend: { options, saveKey, setModel, recheck }.
   Live mode maps these onto the exact RPCs the TUI setup gate drives
   (model.options / model.save_key / config.set key=model / setup.status), so
   the onboarding *logic* exists once, server-side; this function is only the
   face. Resolves after the user is through and the overlay has faded. */
function showOnboard(be) {
  const onb = document.getElementById('onb');
  const box = mk('div', 'ob');
  onb.innerHTML = '';
  onb.appendChild(box);
  onb.hidden = false;
  delete onb.dataset.off;

  let providers = [];
  let sel = null;
  let model = null;

  const DOT_STEPS = ['provider', 'creds', 'model'];
  const dots = (cur) => {
    const d = mk('div', 'ob-dots');
    DOT_STEPS.forEach((n) => {
      const i = mk('i');
      if (n === cur) i.className = 'on';
      d.appendChild(i);
    });
    return d;
  };
  const step = (center) => {
    const s = mk('div', 'ob-step');
    if (center) s.dataset.center = '1';
    box.innerHTML = '';
    box.appendChild(s);
    return s;
  };
  const busy = async (btn, fn) => {
    btn.disabled = true;
    try { return await fn(); } finally { btn.disabled = false; }
  };
  const errOf = (e) => (e && e.data && (e.data.detail || e.data.reason)) || (e && e.message) || String(e);
  const raven = () => {
    const img = mk('img', 'ob-rv');
    img.src = 'assets/ravens/main-agent.webp';
    img.alt = '';
    return img;
  };
  const authBadge = (p) => {
    if (p.authenticated) return mk('span', 'bd on', T('gui.onb.connected'));
    return mk('span', 'bd', p.auth_type === 'oauth' ? 'OAuth' : p.auth_type === 'local' ? 'URL' : 'API Key');
  };

  return new Promise((resolve) => {
    const finish = () => {
      onb.dataset.off = '1';
      setTimeout(() => { onb.hidden = true; onb.innerHTML = ''; resolve(); }, 500);
    };

    function welcome() {
      const s = step(true);
      const btn = mk('button', 'ob-btn', T('gui.onb.start'));
      const err = mk('div', 'ob-err');
      btn.onclick = () => busy(btn, async () => {
        err.textContent = '';
        try {
          const r = await be.options();
          providers = (r && r.providers) || [];
          provider();
        } catch (e) { err.textContent = T('gui.onb.err_generic', { err: errOf(e) }); }
      });
      s.append(raven(), mk('div', 'ob-t', T('gui.onb.welcome_t')), mk('div', 'ob-s', T('gui.onb.welcome_s')), btn, err);
    }

    function provider() {
      const s = step();
      const list = mk('div', 'ob-list');
      providers.forEach((p) => {
        const row = mk('button', 'ob-row');
        row.type = 'button';
        row.append(mk('span', 'nm', p.name || p.slug), authBadge(p));
        row.onclick = () => { sel = p; model = null; (p.authenticated ? modelPick : creds)(); };
        list.appendChild(row);
      });
      const back = mk('button', 'ob-ghost', T('gui.onb.back'));
      back.onclick = welcome;
      s.append(mk('div', 'ob-t', T('gui.onb.provider_t')), mk('div', 'ob-s', T('gui.onb.provider_s')), list, back, dots('provider'));
    }

    function creds() {
      const s = step();
      const err = mk('div', 'ob-err');
      const back = mk('button', 'ob-ghost', T('gui.onb.back'));
      back.onclick = provider;
      const title = mk('div', 'ob-t', T('gui.onb.key_t', { name: sel.name || sel.slug }));

      if (sel.auth_type === 'oauth') {
        /* The one thing the GUI cannot do for the user: OAuth sign-in runs in
           a terminal (`raven provider login ...`), same as the TUI's own
           instruction. Shown verbatim with a copy button, then re-probed. */
        const cmdText = `raven provider login ${sel.slug.replace(/_/g, '-')}`;
        const cmd = mk('div', 'ob-cmd');
        const cp = mk('button', '', T('gui.onb.copy'));
        cp.type = 'button';
        cp.onclick = () => {
          if (navigator.clipboard) navigator.clipboard.writeText(cmdText).catch(() => {});
          cp.textContent = T('gui.onb.copied');
          setTimeout(() => { cp.textContent = T('gui.onb.copy'); }, 1600);
        };
        cmd.append(mk('code', '', cmdText), cp);
        const btn = mk('button', 'ob-btn', T('gui.onb.oauth_check'));
        btn.onclick = () => busy(btn, async () => {
          err.textContent = '';
          try {
            const r = await be.options();
            providers = (r && r.providers) || providers;
            const fresh = providers.find((p) => p.slug === sel.slug);
            if (fresh && fresh.authenticated) { sel = fresh; modelPick(); }
            else err.textContent = T('gui.onb.oauth_wait');
          } catch (e) { err.textContent = T('gui.onb.err_generic', { err: errOf(e) }); }
        });
        s.append(title, mk('div', 'ob-s', T('gui.onb.oauth_s')), cmd, btn, err, back, dots('creds'));
        return;
      }

      const isLocal = sel.auth_type === 'local';
      const needsBase = isLocal || !!sel.needs_api_base;
      const form = mk('div', 'ob-form');
      let keyIn = null;
      let baseIn = null;
      if (!isLocal) {
        keyIn = mk('input', 'ob-in');
        keyIn.type = 'password';
        keyIn.placeholder = T('gui.onb.key_ph');
        keyIn.autocomplete = 'off';
        keyIn.spellcheck = false;
        form.appendChild(keyIn);
      }
      if (needsBase) {
        baseIn = mk('input', 'ob-in');
        baseIn.type = 'text';
        baseIn.placeholder = T('gui.onb.base_ph');
        baseIn.autocomplete = 'off';
        baseIn.spellcheck = false;
        form.appendChild(baseIn);
      }
      const btn = mk('button', 'ob-btn', T('gui.onb.next'));
      const ready = () => (!keyIn || !!keyIn.value.trim()) && (!baseIn || !!baseIn.value.trim());
      btn.disabled = true;
      form.querySelectorAll('input').forEach((i) => i.addEventListener('input', () => { btn.disabled = !ready(); }));
      btn.onclick = () => busy(btn, async () => {
        err.textContent = '';
        try {
          const r = await be.saveKey(sel.slug, keyIn ? keyIn.value.trim() : '', baseIn ? baseIn.value.trim() : '');
          if (r && r.provider) sel = r.provider;
          modelPick();
        } catch (e) { err.textContent = T('gui.onb.err_generic', { err: errOf(e) }); }
      });
      s.append(title, mk('div', 'ob-s', T(isLocal ? 'gui.onb.local_s' : 'gui.onb.key_s')), form, btn, err, back, dots('creds'));
    }

    function modelPick() {
      const s = step();
      const err = mk('div', 'ob-err');
      const models = (sel.models || []).slice();
      const list = mk('div', 'ob-list');
      const btn = mk('button', 'ob-btn', T('gui.onb.finish'));
      btn.disabled = true;
      const draw = (q) => {
        list.innerHTML = '';
        models.filter((m) => !q || m.toLowerCase().includes(q)).forEach((m) => {
          const row = mk('button', 'ob-row');
          row.type = 'button';
          row.appendChild(mk('span', 'nm', m));
          if (m === model) row.dataset.sel = '1';
          row.onclick = () => { model = m; draw(q); btn.disabled = false; };
          list.appendChild(row);
        });
      };
      draw('');
      btn.onclick = () => busy(btn, async () => {
        err.textContent = '';
        try {
          await be.setModel(model, sel.slug);
          if (await be.recheck()) done();
          else err.textContent = T('gui.onb.err_generic', { err: 'provider not configured' });
        } catch (e) { err.textContent = T('gui.onb.err_generic', { err: errOf(e) }); }
      });
      const back = mk('button', 'ob-ghost', T('gui.onb.back'));
      back.onclick = provider;
      const head = [mk('div', 'ob-t', T('gui.onb.model_t')), mk('div', 'ob-s', T('gui.onb.model_s'))];
      if (models.length > 8) {
        const f = mk('input', 'ob-in');
        f.placeholder = T('gui.onb.search_ph');
        f.style.marginTop = '18px';
        f.autocomplete = 'off';
        f.spellcheck = false;
        f.addEventListener('input', () => draw(f.value.trim().toLowerCase()));
        head.push(f);
      }
      s.append(...head, list, btn, err, back, dots('model'));
    }

    function done() {
      const s = step(true);
      s.append(raven(), mk('div', 'ob-t', T('gui.onb.done_t')), mk('div', 'ob-s', T('gui.onb.done_s')));
      setTimeout(finish, 1500);
    }

    welcome();
  });
}

/* Demo: the splash lifts on load; ?onboard=1 previews the first-run flow on
   canned data (a design pass without wiping ~/.raven). Live mode owns both
   moments itself (window.__liveBoot) -- it holds the splash until real data
   has landed and asks setup.status whether onboarding is due. */
addEventListener('load', () => {
  if (window.__liveBoot) return;
  hideSplash(250);
  if (/[?&]onboard=1/.test(location.search)) showOnboard(demoOnbBackend());
});

function demoOnbBackend() {
  const wait = (v, ms) => new Promise((r) => setTimeout(() => r(v), ms == null ? 420 : ms));
  const P = [
    { slug: 'anthropic', name: 'Anthropic', auth_type: 'key', authenticated: false,
      models: ['claude-fable-5', 'claude-opus-5', 'claude-sonnet-5', 'claude-haiku-4-5'] },
    { slug: 'openai', name: 'OpenAI', auth_type: 'key', authenticated: false,
      models: ['gpt-5.2', 'gpt-5.2-mini', 'o5', 'gpt-4.1'] },
    { slug: 'minimax_global', name: 'MiniMax Global', auth_type: 'oauth', authenticated: false,
      models: ['MiniMax-M2.5', 'MiniMax-M2'] },
    { slug: 'deepseek', name: 'DeepSeek', auth_type: 'key', authenticated: false,
      models: ['deepseek-chat', 'deepseek-reasoner'] },
    { slug: 'ollama', name: 'Ollama', auth_type: 'local', needs_api_base: true, authenticated: false,
      models: ['qwen3:32b', 'llama4:70b'] }
  ];
  let pokes = 0;
  return {
    options() {
      /* Second re-probe flips the OAuth row to signed-in, so the preview can
         walk the "not yet -> try again -> through" path once. */
      if (pokes++ >= 2) P.find((p) => p.slug === 'minimax_global').authenticated = true;
      return wait({ model: '', provider: '', providers: P.map((p) => ({ ...p })) });
    },
    saveKey(slug) {
      const p = P.find((x) => x.slug === slug);
      p.authenticated = true;
      return wait({ provider: { ...p } });
    },
    setModel() { return wait({ applied: true }, 600); },
    recheck() { return wait(true, 300); }
  };
}
</script>

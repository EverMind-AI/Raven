<script>
/* ═══════════════════════════════════════════════════════════════════
   Front-end demo. The transcript renderer consumes the same event
   shapes Raven's JSON-RPC gateway already emits (episode.start /
   thinking.delta / token.delta / tool.start / tool.complete /
   message.complete), so going live means replacing replay() with a
   socket — the rendering code below does not change.
   ═══════════════════════════════════════════════════════════════════ */
// If the script runs at all, this marker goes; if you still see it, it did not.
(() => { const n = document.getElementById('noJs'); if (n) n.remove(); })();

const $ = (s) => document.querySelector(s);
const mk = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* ── i18n ────────────────────────────────────────────────────────────
   The catalogue is spliced in from i18n/messages.json at build time —
   the same file the TUI generates its own copy from, so one edit moves
   both front ends. LANG mirrors config.language. */
const I18N = /*__I18N__*/{ "slash": {}, "ui": {} };
let LANG = 'en';
/* Assigned by live.js, which owns the RPC write. Null in the offline demo,
   where flipping the language is a local repaint and nothing more. */
let applyLang = null;

const fillVars = (s, vars) =>
  vars ? String(s).replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m)) : String(s);

const T = (key, vars, fallback) => {
  const e = I18N.ui[key] || {};
  return fillVars(e[LANG] != null ? e[LANG] : (e.en != null ? e.en : (fallback != null ? fallback : key)), vars);
};

const slashText = (id) => {
  const e = I18N.slash[id] || {};
  return (LANG !== 'en' && e[LANG]) || e.en || {};
};
const slashName = (id) => slashText(id).name || id;
const slashHelp = (id) => slashText(id).help || '';

/* Static markup carries keys, not copy: data-i18n for text, -ph for a
   placeholder, -title / -aria for the two attributes that are read out. */
function applyI18n(root) {
  (root || document).querySelectorAll('[data-i18n]').forEach((n) => { n.textContent = T(n.dataset.i18n); });
  (root || document).querySelectorAll('[data-i18n-ph]').forEach((n) => { n.placeholder = T(n.dataset.i18nPh); });
  (root || document).querySelectorAll('[data-i18n-title]').forEach((n) => { n.title = T(n.dataset.i18nTitle); });
  (root || document).querySelectorAll('[data-i18n-aria]').forEach((n) => {
    n.setAttribute('aria-label', T(n.dataset.i18nAria));
  });
  (root || document).querySelectorAll('[data-i18n-tip]').forEach((n) => {
    n.dataset.tip = T(n.dataset.i18nTip);
  });
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
}

const ICON_SEND = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h13M12 5l7 7-7 7"/></svg>';
const ICON_STOP = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>';

/* Verbs come from i18n; a tool without an entry keeps its raw name rather
   than getting a made-up translation. mcp_* names show as [server] tool. */
const MCP_RE = /^mcp_([^_]+)_(.+)$/;
const rawVerb = (n) => {
  const m = MCP_RE.exec(n || '');
  return m ? m[2].split('_').join(' ') : String(n || '').split('_').join(' ');
};
const verb = (n) => T('gui.act.v.' + n, null, rawVerb(n));
const verbIng = (n) => T('gui.act.ing.' + n, null, rawVerb(n));
/* One unit while it still fits in one: seconds under a minute, minutes and
   seconds under an hour, hours on top of that. The smaller fields are padded so
   a column of durations lines up instead of jittering. */
const dur = (ms) => {
  const t = Math.max(0, Math.round(ms / 1000));
  const p = (n) => String(n).padStart(2, '0');
  if (t >= 3600) return `${Math.floor(t / 3600)}h${p(Math.floor(t % 3600 / 60))}m${p(t % 60)}s`;
  if (t >= 60) return `${Math.floor(t / 60)}m${p(t % 60)}s`;
  return ms < 10000 ? `${(ms / 1000).toFixed(1)}s` : `${t}s`;
};

const ICON_CP = '<svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none"'
  + ' stroke="currentColor" stroke-width="1.7" aria-hidden="true">'
  + '<rect x="9" y="9" width="11" height="11" rx="2.4"/>'
  + '<path d="M15 5.5A1.5 1.5 0 0 0 13.5 4H6a2 2 0 0 0-2 2v7.5A1.5 1.5 0 0 0 5.5 15"/></svg>'
  + '<svg class="ck" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
  + ' stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

/* An icon-only button whose verb lives in the hover pill ([data-tip]). */
/* One copy glyph for every footer that offers to copy something. */
const COPY_ICO = '<rect x="9" y="9" width="11" height="11" rx="2.5"/>'
  + '<path d="M5.5 15H5a1.5 1.5 0 0 1-1.5-1.5v-8A1.5 1.5 0 0 1 5 4h8A1.5 1.5 0 0 1 14.5 5.5V6"/>';

function tipBtn(inner, label, cls) {
  const b = mk('button', cls ? 'icb ' + cls : 'icb');
  b.dataset.tip = label;
  b.setAttribute('aria-label', label);
  b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${inner}</svg>`;
  return b;
}
/* No toasts for tiny actions: the button reports back through its own tip. */
function tipFlash(b, word) {
  const keep = b.dataset.tip;
  b.dataset.tip = word;
  setTimeout(() => { b.dataset.tip = keep; }, 1400);
}

/* ══ typed values in prose ═══════════════════════════════════════════
   An answer carries several kinds of value, and they are not the same thing to
   a reader: a URL is somewhere to go, a path is a file to look at, a command is
   text to copy. Each gets the affordance its kind earns and nothing more.

   The rule for a path is that it is only ever clickable when it can actually be
   opened -- wsPathOf returns a workspace-relative path or null, and live.js
   replaces it with the resolver the workspace file view itself uses. A path
   that merely looks like one stays plain text: a dead link is worse than no
   link. Demo mode keeps a shape test so the canned transcript still reads. */
let wsPathOf = (s) => {
  const t = String(s).trim().replace(/:\d+(?::\d+)?$/, '');
  if (!/^[\w.@+-]+(?:\/[\w.@+-]+)+$/.test(t)) return null;
  return /\.\w{1,8}$/.test(t) ? t : null;
};
let pathOpen = (rel) => { setWs(true, 'file'); };

/* markdown: headings, bold, code, lists, tables */
/* A list item at any indent. Depth comes from the indent, so a sub-list reads
   as a sub-list instead of landing in the prose as a literal "- ..." line. */
const LI_RE = /^([ \t]*)([-*+]|\d{1,3}[.)])[ \t]+(.*)$/;
const TASK_RE = /^\[([ xX])\][ \t]+/;

/* Where a newline in the source becomes a newline on screen. A single newline
   inside a paragraph is the model's own wrapping, not a break the reader asked
   for -- honouring it left ragged half-lines everywhere ("GitHub 仓库:" on one
   line, the url on the next). So lines flow back together, and only these earn
   a break: a blank line (a new paragraph), an explicit hard break (two trailing
   spaces or a backslash), and any block of its own -- a heading, a list, a
   quote, a table, a code card, a rule.
   The joint takes a space only between two ASCII words; between CJK characters
   a space would open a visible hole. */
const BREAK = '<div class="brk"></div>';
const HARD_BR = /(?:[ \t]{2,}|\\)$/;
const CJK = /[　-〿㐀-䶿一-鿿豈-﫿＀-￯]/;
/* The two shapes that keep their own line because a run of them IS the layout:
   an enumerated step, and a bolded lead-in. Glued together they read as one
   run-on sentence. */
const KEEP_LINE = /^(?:\*\*|第[一二三四五六七八九十百千两0-9]+[步条点章节项个]?[、.,:：)）]?)/;
function flow(lines, inl) {
  return lines.reduce((out, raw, k) => {
    const text = raw.replace(/[ \t]+$/, '').replace(/\\$/, '');
    if (!k) return inl(text);
    const prev = lines[k - 1].trimEnd();
    /* A line the author indented by hand is layout -- a command, a snippet the
       model wrote without a fence -- so it keeps its own line. */
    if (HARD_BR.test(lines[k - 1]) || KEEP_LINE.test(text) || /^(?: {4,}|\t)/.test(raw)) {
      return `${out}<br>${inl(text)}`;
    }
    /* Only two CJK characters meeting need no space; anywhere Latin is involved
       the joint would otherwise weld a word to the next one. */
    const gap = CJK.test(prev.slice(-1)) && CJK.test(text.slice(0, 1)) ? '' : ' ';
    return out + gap + inl(text);
  }, '');
}

/* Items carry their own indent, so nesting is rebuilt here rather than by
   recursive parsing: each item swallows the deeper items that follow it. */
function listHtml(items, inl) {
  if (!items.length) return '';
  const base = items[0].ind, ord = items[0].ord;
  const tag = ord ? 'ol' : 'ul';
  let out = `<${tag}${ord && items[0].num !== 1 ? ` start="${items[0].num}"` : ''}>`;
  let k = 0;
  while (k < items.length) {
    const it = items[k];
    /* Numbers turning into bullets at the same depth is a new list to a
       reader, so it is one here too. */
    if (it.ind <= base && it.ord !== ord) return `${out}</${tag}>${listHtml(items.slice(k), inl)}`;
    k += 1;
    const kids = [];
    while (k < items.length && items[k].ind > it.ind) kids.push(items[k++]);
    const cls = it.task == null ? '' : ` class="tk${it.task ? ' on' : ''}"`;
    out += `<li${cls}>${flow(it.text, inl)}${listHtml(kids, inl)}</li>`;
  }
  return `${out}</${tag}>`;
}

function md(src) {
  /* Only http(s) is turned into a link, and the scheme is matched literally --
     an answer that mentions a URL should be openable, but nothing in the text
     gets to choose the scheme. The match is limited to the ASCII characters a
     URL may contain, so CJK prose running straight up against the URL with no
     space ends the match; a trailing ASCII stop is not swallowed either. */
  const link = (s) => s.replace(/https?:\/\/[\w\-.~:/?#[\]@!$&'()*+,;=%]+/g, (u) => {
    /* esc() has already run, so a quote or an angle bracket AROUND the url is
       now an entity whose every character is legal inside one. Cut there --
       but not at the '&' of a real query string, which is '&amp;'. */
    const stop = u.replace(/&(?:quot|gt|lt|#\d+);?[\s\S]*$/, '');
    const rest = u.slice(stop.length);
    /* A closing paren belongs to the url when the url opened one:
       .../Foo_(bar) is one link, "(see https://a.com/x)" is not. */
    const paired = (stop.match(/\(/g) || []).length >= (stop.match(/\)/g) || []).length;
    const tail = (new RegExp(paired ? '[.,;:!?\'"\\]}]+$' : '[.,;:!?\'")\\]}]+$').exec(stop) || [''])[0];
    const url = tail ? stop.slice(0, -tail.length) : stop;
    return `<a href="${url}" target="_blank" rel="noreferrer noopener">${url}</a>${tail}${rest}`;
  });
  /* Backticks are the author's own signal that this is a value, not prose, so
     the path test only ever runs inside them -- guessing at bare words in a
     sentence would turn ordinary text into fake links. */
  const codeSpan = (s) => {
    const rel = wsPathOf(s);
    if (!rel) return `<code>${s}</code>`;
    return `<code class="pth" data-p="${rel}" role="link" tabindex="0">${s}</code>`;
  };
  /* esc() FIRST, always: every attribute built below (href, data-p) relies on
     a literal quote already being an entity by the time it gets there.
     Then code spans and links are set aside as placeholders before emphasis and
     autolinking run -- otherwise a glob in backticks pairs its own stars with
     the next bold in the line, and the bare-url pass reaches into an href it
     just built. Everything comes back at the end. */
  const inl = (s) => {
    const held = [];
    const keep = (html) => `\u0001${held.push(html) - 1}\u0001`;
    let t = esc(s).replace(/`([^`]+)`/g, (_, c) => keep(codeSpan(c)));
    /* [text](target) is the form a model writes far more often than a bare url.
       http(s) becomes a link, a workspace path becomes the usual chip, and any
       other target is dropped -- a dead link is worse than plain text. */
    t = t.replace(/!?\[([^\]\n]*)\]\(([^\s)]+)\)/g, (_, tx, u) => {
      if (/^https?:\/\//.test(u)) {
        return keep(`<a href="${u}" target="_blank" rel="noreferrer noopener">${tx || u}</a>`);
      }
      return wsPathOf(u) ? keep(codeSpan(u)) : (tx || u);
    });
    t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^\w*])\*([^\s*][^*]*)\*(?![\w*])/g, '$1<em>$2</em>');
    return link(t).replace(/\u0001(\d+)\u0001/g, (_, k) => held[+k]);
  };
  const L = src.split('\n'); const o = []; let i = 0;
  while (i < L.length) {
    const l = L[i];
    /* Indentation is allowed on the fence: a fenced block inside a list item is
       something models write constantly, and anchoring at column 0 left it in
       the prose as literal backtick lines. The body is dedented by the fence's
       own indent, never past its content. */
    const fen = /^([ \t]*)(`{3,}|~{3,})/.exec(l);
    if (fen) {
      const pad = fen[1].length;
      const mark = fen[2][0];
      const bars = fen[2].length;
      const flat = (s) => (s.slice(0, pad).trim() ? s : s.slice(pad));
      /* What closes this block, and nothing else: the same marker, at least as
         many of it, carrying no info string, and not indented deeper than the
         opener. A model demonstrating markdown nests a ```bash inside a
         ```markdown -- taking that inner fence as the closer spills the rest of
         the answer into the prose with a stray ``` in it. */
      const closes = (s) => {
        const m = new RegExp(`^([ \\t]*)(\\${mark}{${bars},})[ \\t]*$`).exec(s);
        return !!m && m[1].replace(/\t/g, '    ').length <= pad + 3;
      };
      /* Only an info string that looks like a language name earns a header --
         anything else would put junk in the label. */
      const info = l.trim().slice(bars).trim().split(/\s+/)[0];
      const lang = /^[\w+#.-]{1,16}$/.test(info) ? info : '';
      const lines = []; i++;
      while (i < L.length && !closes(L[i])) lines.push(flat(L[i++]));
      i++;
      /* A command is there to be run somewhere else, so it gets a one-click
         copy rather than asking the reader to sweep-select it by hand. The
         button carries no payload: the click reads the block's text, which
         is the escaped source already on screen. */
      /* A fence holding nothing but one URL or one path is a value the model
         wrapped out of habit, not a listing: a card with a copy button around a
         single link is the wrong shape for it. Render it as the value it is. */
      const only = lines.length === 1 ? lines[0].trim() : '';
      if (/^https?:\/\/\S+$/.test(only) || (only && !/\s/.test(only) && wsPathOf(only))) {
        o.push(`<p>${inl(/^https?:/.test(only) ? only : '`' + only + '`')}</p>`);
        continue;
      }
      const cp = `<button class="cbcp" type="button" title="${esc(T('gui.code.copy'))}"`
        + ` aria-label="${esc(T('gui.code.copy'))}">${ICON_CP}</button>`;
      const pre = `<pre>${esc(lines.join('\n'))}</pre>`;
      o.push(lang
        ? `<div class="cblk lang"><div class="cbhd"><span class="cblang">${esc(lang)}</span>${cp}</div>${pre}</div>`
        : `<div class="cblk">${pre}${cp}</div>`);
      continue;
    }
    if (/^\|/.test(l) && /^\|[\s:|-]+\|/.test(L[i+1] || '')) {
      /* An escaped pipe stays inside its cell: splitting on the raw character
         tears the row, and a torn row is a wrong table (a regex alternation or
         a shell pipeline in a cell is enough to trigger it). */
      const cut = (r) => r.replace(/\\\|/g, '\u0001').replace(/^\||\|$/g, '')
        .split('|').map((c) => c.trim().replace(/\u0001/g, '|'));
      const h = cut(l); i += 2; const b = [];
      while (i < L.length && /^\|/.test(L[i])) b.push(cut(L[i++]));
      o.push(`<div class="tw"><table><thead><tr>${h.map((c) => `<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${
        b.map((r) => `<tr>${r.map((c) => `<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      continue;
    }
    /* Heading depth caps at two visual levels: chat answers are short, and a
       six-deep outline in a message column reads as noise. # and ## share the
       section size; everything deeper shares the subsection size. */
    const h = /^(#{1,6})\s+(.*)/.exec(l);
    if (h) { const tag = h[1].length <= 2 ? 'h2' : 'h3'; o.push(`<${tag}>${inl(h[2])}</${tag}>`); i++; continue; }
    if (/^>\s?/.test(l)) { const q = [];
      while (i < L.length && /^>\s?/.test(L[i])) q.push(L[i++].replace(/^>\s?/, ''));
      o.push(`<blockquote>${flow(q, inl)}</blockquote>`); continue; }
    /* A "---" the model wrote between sections is a break, and it should read as
       one -- but drawn as a rule, and models write a lot of them, an answer ends
       up striped with full-width lines. Leaving it as literal "---" was wrong
       too. So it becomes the thing it means: a wider gap, no ink. Runs of them
       collapse into one. */
    if (/^ {0,3}(-{3,}|\*{3,}|_{3,})[ \t]*$/.test(l)) {
      if (o[o.length - 1] !== BREAK) o.push(BREAK);
      i++; continue;
    }
    if (LI_RE.test(l)) {
      const items = [];
      while (i < L.length) {
        const m = LI_RE.exec(L[i]);
        if (m) {
          /* A checklist is a list of states, so the mark renders as one -- the
             answer is already written, there is nothing here to toggle. */
          const tk = TASK_RE.exec(m[3]);
          items.push({ ind: m[1].replace(/\t/g, '    ').length, ord: /\d/.test(m[2]),
            num: parseInt(m[2], 10) || 1, task: tk ? tk[1] !== ' ' : null,
            text: [tk ? m[3].slice(tk[0].length) : m[3]] });
          i++; continue;
        }
        /* An indented fence is a block that belongs to the item, not more of its
           text: breaking here hands it to the fence scanner. */
        if (/^[ \t]*(?:```|~~~)/.test(L[i])) break;
        /* A blank line between items is a spacing habit, not the end of the
           list: only a blank followed by something that is not an item closes
           it. Getting this wrong splits one list into several <ul>s, which
           shows up as double gaps between the items. */
        if (!L[i].trim() && (LI_RE.test(L[i + 1] || '') || /^[ \t]+\S/.test(L[i + 1] || ''))) {
          /* A blank line before a continuation is the item's second paragraph,
             so the break the author wrote survives the flow join. */
          const cur = items[items.length - 1];
          if (cur && /^[ \t]+\S/.test(L[i + 1] || '')) cur.text[cur.text.length - 1] += '  ';
          i++; continue;
        }
        /* An indented line that is not an item continues the one above it --
           but a line indented well past the item's own text is a block the
           author laid out by hand, so it keeps its line. */
        if (items.length && /^[ \t]+\S/.test(L[i])) {
          const cur = items[items.length - 1];
          const deep = L[i].replace(/\t/g, '    ').search(/\S/) >= cur.ind + 4;
          if (deep) cur.text[cur.text.length - 1] += '  ';
          cur.text.push(L[i++].trim());
          continue;
        }
        break;
      }
      o.push(listHtml(items, inl)); continue;
    }
    if (!l.trim()) { i++; continue; }
    /* The first line is taken unconditionally: a line every block scanner above
       declined -- a table header whose delimiter row has not streamed in yet is
       the one that happens -- still has to be consumed, or this scanner spins on
       it forever with the tab locked up. */
    const p = [L[i++]];
    while (i < L.length && L[i].trim()
      && !/^(#{1,6}\s|>\s?|\||```|~~~| {0,3}(-{3,}|\*{3,}|_{3,})[ \t]*$)/.test(L[i])
      && !LI_RE.test(L[i])) p.push(L[i++]);
    o.push(`<p>${flow(p, inl)}</p>`);
  }
  return o.join('');
}

/* ══ composer drafts ══════════════════════════════════════════════
   Unsent text belongs to the session it was typed in. One textarea is shared
   by every session, so switching without parking the text carried a
   half-written message into the next conversation -- where the next Enter
   would have sent it. Keyed by session id ('new' while a task has no id yet)
   and mirrored to localStorage, so a reload (the upgrade flow forces one)
   does not eat the draft either. */
const DRAFT_KEY = 'raven.gui.drafts';
const DRAFT_MAX = 30;
let draftOwner = null;
let draftTick = null;

function draftsRead() {
  try {
    const o = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    return o && typeof o === 'object' ? o : {};
  } catch { return {}; }
}
function draftsWrite(all) {
  const keys = Object.keys(all);
  if (keys.length > DRAFT_MAX) {
    keys.sort((a, b) => (all[a].at || 0) - (all[b].at || 0))
      .slice(0, keys.length - DRAFT_MAX)
      .forEach((k) => delete all[k]);
  }
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(all)); } catch { /* quota or private mode */ }
}
/* Park under the session that owned the composer while the text was typed,
   never under the one being opened. */
function parkDraft() {
  const key = draftOwner || cur || 'new';
  const text = $('#ta').value;
  const all = draftsRead();
  if (text.trim()) all[key] = { t: text, at: Date.now() };
  else delete all[key];
  draftsWrite(all);
}
function loadDraft(id) {
  draftOwner = id || 'new';
  const el = $('#ta');
  el.value = (draftsRead()[draftOwner] || {}).t || '';
  taFit();
  goState();
}
function dropDraft(id) {
  const all = draftsRead();
  delete all[id || 'new'];
  draftsWrite(all);
}

/* ══ approval sheet ═══════════════════════════════════════════════
   An approval request is the same kind of interruption as ask_user -- the turn
   is blocked on the reader -- so it wears the same clothes: the sheet above the
   composer, numbered options, Esc/close means no. A centred modal made the two
   read as different classes of event and put the answer somewhere the reader
   was not already looking. */
function approveSheet(prompt, onAllow, onDeny) {
  document.querySelectorAll('.csheet').forEach((n) => n.remove());
  const sheet = mk('div', 'csheet perm');
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-modal', 'true');
  sheet.setAttribute('aria-label', T('gui.confirm.title'));

  let answered = false;
  const close = (fn) => {
    if (answered) return;
    answered = true;
    document.removeEventListener('keydown', onKey, true);
    sheet.remove();
    dockLift();
    if (fn) fn();
  };

  const head = mk('div', 'hd');
  const q = mk('div', 'q', T('gui.confirm.title'));
  const x = mk('button', 'ic tipdn');
  x.appendChild(ico('M7 7l10 10M17 7 7 17'));
  x.dataset.tip = T('gui.confirm.deny');
  x.setAttribute('aria-label', T('gui.confirm.deny'));
  x.onclick = () => close(onDeny);
  head.append(q, x);
  sheet.appendChild(head);

  /* The request itself is the agent's own words about what it wants to do, so
     it is quoted rather than restated. */
  const body = mk('div', 'body');
  body.appendChild(mk('div', 'what', prompt || ''));
  const opts = [
    [T('gui.confirm.allow'), () => close(onAllow)],
    [T('gui.confirm.deny'), () => close(onDeny)],
  ];
  opts.forEach(([label, fn], i) => {
    const b = mk('button', 'opt' + (i === 0 ? ' go' : ''));
    b.append(mk('span', 'n', String(i + 1)), mk('span', null, label));
    b.onclick = fn;
    body.appendChild(b);
  });
  sheet.appendChild(body);

  function onKey(e) {
    if (composingNow(e)) return;
    if (e.key === 'Escape') { e.preventDefault(); return close(onDeny); }
    const n = Number(e.key);
    if (n === 1 || n === 2) { e.preventDefault(); opts[n - 1][1](); }
  }
  document.addEventListener('keydown', onKey, true);

  const dockIn = document.querySelector('.dock-in');
  dockIn.appendChild(sheet);
  dockLift();
  const first = sheet.querySelector('.opt');
  if (first) first.focus();
  return { close: () => close(null) };
}

/* ══ context menu ═════════════════════════════════════════════════
   One rule for right-click everywhere in the window, because the old answer was
   "whatever that element happened to wire up": a few rows opened the app menu,
   the transcript swallowed the event entirely, and everything else fell through
   to the host's own menu -- Look Up / Translate / Services, in the system's
   language, over a file tree. Three different panels for the same gesture.

   The rule:
   1. In a text field, or over a real text selection, the host menu wins. It has
      paste, dictation, spelling and Look Up, and none of that is ours to
      reimplement.
   2. On a surface that declares actions (a session, a change, a file, a
      command, a link), the app menu opens with those actions -- localized, same
      panel as the row's own "..." button.
   3. Anywhere else, nothing opens. Chrome has no context actions, and a menu
      offering only Services is noise. */
function ctxMenu(el, items) { el._ctx = items; }

/* Every menu that copies something reports it the same way, and a clipboard the
   host refused is not worth an error the reader cannot act on. */
function copyToClip(text, done) {
  if (!navigator.clipboard) return;
  navigator.clipboard.writeText(String(text)).then(() => toast(done), () => {});
}

function nativeCtxOk(t) {
  if (t.closest('input, textarea, select, [contenteditable="true"]')) return true;
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !String(sel).trim()) return false;
  /* Only when the click is actually inside the selected text -- a selection
     left behind elsewhere on the page is not what this click is about. */
  return sel.containsNode(t, true) || (t.contains(sel.anchorNode) && t.contains(sel.focusNode));
}

document.addEventListener('contextmenu', (e) => {
  if (nativeCtxOk(e.target)) return;
  e.preventDefault();
  for (let n = e.target; n && n !== document; n = n.parentElement) {
    if (!n._ctx) continue;
    const items = n._ctx();
    if (items && items.length) menuAt(e.clientX, e.clientY, items);
    return;
  }
});

function menuAt(x, y, items) {
  const m = $('#menu'); m.innerHTML = '';
  items.forEach((it) => {
    if (it === '-') { m.appendChild(mk('hr')); return; }
    const b = mk('button', it.bad ? 'bad' : null, it.label);
    b.onclick = () => { m.dataset.open = 'false'; it.fn(); };
    m.appendChild(b);
  });
  m.dataset.open = 'true';
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, innerWidth - r.width - 8) + 'px';
  m.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
}
document.addEventListener('pointerdown', (e) => {
  if (!e.target.closest('#menu')) $('#menu').dataset.open = 'false';
  if (!e.target.closest('#permPop') && !e.target.closest('#permChip')) closePermPop();
  if (!e.target.closest('#acct') && !e.target.closest('#meBtn')) toggleAcct(false);
}, true);

/* Shell window drag: the OS title bar is hidden, so the header band has to do
   its job. WebKit's implicit background-drag heuristic proved fragile (it
   silently stopped once the band gained positioned content), so the shell is
   told explicitly -- grab anywhere in the band that is not a control. */
const dragBand = (e) => {
  if (document.documentElement.dataset.shell !== '1' || e.button !== 0) return false;
  if (!e.target.closest('.railtop, .top, .ws-top')) return false;
  return !e.target.closest('button, a, input, textarea, select, [role="link"], .grip');
};
document.addEventListener('mousedown', (e) => {
  if (!dragBand(e)) return;
  try { window.webkit.messageHandlers.raven.postMessage({ type: 'drag' }); } catch { /* browser */ }
});
document.addEventListener('dblclick', (e) => {
  if (!dragBand(e)) return;
  try { window.webkit.messageHandlers.raven.postMessage({ type: 'zoom' }); } catch { /* browser */ }
});

/* ══ module 1a: session rail ══════════════════════════════════════ */
const listOpen = new Set();
/* Collapsed rail groups survive reloads; expanded is the default. */
const grpFold = new Set((() => {

})());
const saveGrpFold = () => {
  try { localStorage.setItem('raven.gui.grpfold', JSON.stringify([...grpFold])); } catch { /* private mode */ }
};

/* One writer for the whole rail, because the surfaces stack: the settings dialog
   layers over a module page, which layers over the chat, and every one of them
   has a row that would claim to be current on its own. Deciding it in one place
   from the topmost surface is what makes two selected rows impossible, rather
   than three call sites each remembering to clear the others.

   The new-task row stands for a draft -- a draft has no session id, so an empty
   `cur` is its state -- but only while nothing covers it. */
function markNewCurrent() {
  const app = document.querySelector('.app');
  const pageUp = app && app.dataset.page === 'on' ? Object.keys(NAV_OF).find(
    (p) => $('#' + p) && $('#' + p).dataset.open === 'true') : null;
  /* A NAV_OF entry may be a function: the capabilities section is one page
     shared by two rail modules, so which button it belongs to is a question
     about the page's current content. */
  const btnOf = (p) => (typeof NAV_OF[p] === 'function' ? NAV_OF[p]() : NAV_OF[p]);
  const top = pageUp ? btnOf(pageUp) : (!cur ? 'newBtn' : null);
  ['newBtn', 'skillBtn', 'plugBtn', 'xaBtn', 'connBtn', 'memBtn', 'cronBtn'].forEach((id) => {
    const b = $('#' + id);
    if (b) b.setAttribute('aria-current', String(id === top));
  });
}

function drawList() {
  markNewCurrent();
  const box = $('#list'); box.innerHTML = '';
  const hit = (s) => !query
    || s.title.toLowerCase().includes(query) || (s.last || '').toLowerCase().includes(query);
  const rows = SESS.filter(hit);

  if (query && !rows.length) {
    box.appendChild(mk('div', 'empty-note', T('gui.rail.no_hits', { q: query })));
    return;
  }

  if (query) {
    box.appendChild(mk('span', 'lab', T('gui.rail.search_hits', { n: rows.length })));
    rows.forEach((s) => box.appendChild(sessRow(s)));
    return;
  }

  // Every group gets the same collapsible eyebrow: caret + label + count +
  // hairline. 定时任务 and 最近 are permanent fixtures of the rail (rendered
  // even when empty); 置顶 only exists while something is pinned.
  const put = (label, items, action, cap, key, always) => {
    if (!items.length && !always) return;
    const gid = key || label;
    const folded = grpFold.has(gid);
    const h = mk('div', 'grp');
    h.setAttribute('role', 'button');
    h.tabIndex = 0;
    h.setAttribute('aria-expanded', String(!folded));
    const car = mk('span', 'car');
    car.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5 15 12l-6.5 6.5"/></svg>';
    h.append(car, mk('span', 'lab', label), mk('span', 'n', String(items.length)), mk('span', 'rule'));
    if (action) {
      const go = mk('button', 'grp-go', T('gui.rail.manage'));
      go.onclick = (e) => { e.stopPropagation(); action(e); };
      h.appendChild(go);
    }
    const flip = () => {
      if (folded) grpFold.delete(gid); else grpFold.add(gid);
      saveGrpFold(); drawList();
    };
    h.onclick = flip;
    h.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };
    box.appendChild(h);
    if (folded) return;
    if (!items.length) { box.appendChild(mk('div', 'grp-empty', T('gui.rail.none'))); return; }
    // A long tail of old sessions buries the rail's other groups, so a group
    // with a cap shows its head and folds the rest behind one row.
    const open = listOpen.has(key);
    const shown = cap && !open ? items.slice(0, cap) : items;
    shown.forEach((s) => box.appendChild(sessRow(s)));
    if (!cap || items.length <= cap) return;
    const more = mk('button', 'grp-more',
      open ? T('gui.rail.collapse') : T('gui.rail.expand_rest', { n: items.length - cap }));
    more.setAttribute('aria-expanded', String(open));
    more.onclick = () => { if (open) listOpen.delete(key); else listOpen.add(key); drawList(); };
    box.appendChild(more);
  };

  put(T('gui.rail.pinned'), rows.filter((s) => s.pin), null, null, 'pin');
  put(T('gui.rail.from_cron'), rows.filter((s) => !s.pin && s.from === 'cron'), openCron, 5, 'cron', true);
  const rest = rows.filter((s) => !s.pin && s.from !== 'cron');
  put(T('gui.rail.recent'), GROUPS.flatMap((g) => rest.filter((s) => s.g === g)), null, 15, 'recent', true);
}

/* A title is whatever the prompt or the job name started with, and a leading
   emoji turns a dense column of rows into a column of stickers. Display only:
   the stored title keeps its icon, and a title that is nothing BUT an icon
   stays as it is rather than rendering an empty row. */
const LEAD_ICO = /^(?:[\s\u00A0]*[\p{Extended_Pictographic}\p{Emoji_Modifier}\p{Regional_Indicator}\u{1F3FB}-\u{1F3FF}\uFE0F\u200D]+)+[\s\u00A0]*/u;
function plainTitle(t) {
  const raw = t == null ? '' : String(t);
  return raw.replace(LEAD_ICO, '').trim() || raw;
}

function sessRow(s) {
  const row = mk('div', 'sess');
  row.setAttribute('role', 'button');
  row.tabIndex = 0;
  row.setAttribute('aria-current', String(s.id === cur));

  const t = mk('div', 't');
  const live = s.id === cur && busy ? 'run' : s.status;
  // run/done speak from the tail slot instead (see .sess .sig); err and que
  // stay a leading dot -- they are conditions of the session, not of a turn
  // the reader is waiting on.
  const tail = live === 'run' || live === 'done' ? live : null;
  if (live && !tail) t.appendChild(mk('span', 'dot ' + live));
  t.appendChild(mk('span', null, plainTitle(s.title)));
  // The stamp is always rendered -- it is what gives the tail its width. A
  // marker hides the text in place rather than replacing the element, so the
  // row does not resize when a turn starts or ends.
  const w = mk('span', 'w');
  w.appendChild(mk('span', 'wt', s.when));
  if (tail) {
    w.dataset.sig = tail;
    // The state is only colour and motion otherwise, and the stamp behind it
    // is visibility:hidden, so name it for a reader who gets the row as text.
    const label = T(tail === 'run' ? 'gui.sess.running' : 'gui.sess.finished');
    w.setAttribute('aria-label', label);
    w.title = label;
    w.appendChild(mk('i'));
  }
  row.append(t, w);

  const more = mk('button', 'more', '⋯');
  more.setAttribute('aria-label', T('gui.cron.menu_aria', { name: plainTitle(s.title) }));
  more.onclick = (e) => { e.stopPropagation(); const r = more.getBoundingClientRect(); openSessMenu(s, r.right, r.bottom + 4); };
  row.appendChild(more);

  const go = () => { showPage(null); if (s.id !== cur) { cur = s.id; drawList(); openSession(s); } };
  row.onclick = go;
  row.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  ctxMenu(row, () => sessItems(s));
  return row;
}

function sessItems(s) {
  return [
    { label: T('gui.sess.rename'), fn: () => { if (s.id !== cur) { cur = s.id; drawList(); openSession(s); } renameTitle(); } },
    { label: T(s.pin ? 'gui.sess.unpin' : 'gui.sess.pin'),
      fn: () => { s.pin = !s.pin; drawList(); toast(T(s.pin ? 'gui.pinned_ok' : 'gui.unpinned_ok')); } },
    '-',
    { label: T('gui.sess.delete'), bad: true, fn: () => removeSession(s) }
  ];
}
function openSessMenu(s, x, y) { menuAt(x, y, sessItems(s)); }

function removeSession(s) {
  const at = SESS.indexOf(s);
  dropDraft(s.id);
  SESS = SESS.filter((x) => x.id !== s.id);
  undoBin = { s, at };
  if (cur === s.id) { const nx = SESS[0]; if (nx) { cur = nx.id; openSession(nx); } }
  drawList();
  toast(T('gui.sess.deleted_x', { title: s.title }), { label: T('gui.undo'), fn: () => {
    SESS.splice(undoBin.at, 0, undoBin.s); undoBin = null; drawList();
  } });
}

/* inline rename in the top bar; the list follows */
function renameTitle() {
  const h = $('#title'); if (!h) return;
  const s = sess(cur); if (!s) return;
  const inp = mk('input', 'titin');
  inp.value = s.title;
  h.replaceWith(inp);
  $('#renameBtn').hidden = true;
  inp.focus(); inp.select();
  const finish = (commit) => {
    const v = inp.value.trim();
    const t = commit && v ? v : s.title;
    s.title = t;
    const nh = mk('h1', null, plainTitle(t)); nh.id = 'title';
    inp.replaceWith(nh);
    $('#renameBtn').hidden = false;
    drawList();
  };
  inp.onblur = () => finish(true);
  inp.onkeydown = (e) => {
    if (composing(e)) return;
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); inp.onblur = null; finish(false); }
  };
}

/* ══ module 1b: the conversation ══════════════════════════════════ */
function openSession(s) {
  parkDraft(); loadDraft(s.id);
  // Opening it IS reading it: the finished marker has done its job and the
  // row goes back to carrying its timestamp.
  if (s.status === 'done') s.status = null;
  markNewCurrent();
  stop_(); busy = false; q = []; use = null; kids = []; tl = []; raw = []; lastRun = null;
  wsReset();
  setWs(false);
  $('#title').textContent = plainTitle(s.title);
  $('#stage').innerHTML = '';
  $('#flash').textContent = '';
  drawQ(); drawMeter(); goState(); drawBanner();
  if (s.run) {
    const r = RUNS[s.run];
    use = r.use; kids = r.kids; lastRun = r;
    setCtx(((r.use && r.use.in) || 0) + ((r.use && r.use.out) || 0), 200000);
    ask(r.ask); replay(r, true);
  } else if (s.status === 'err') {
    ask('把支付回调那块拆成两个 handler');
    errLine('找不到模块 stripe（internal/pay/callback.go:12）', '装上依赖或改用内置 http 客户端后重试。');
  } else {
    pitch();
  }
}

function pitch() {
  /* The empty state is the composer itself, moved to the visual centre --
     no mark, no facts, no title. ask()/renderHistory lift the flag the
     moment real content lands. */
  const c = document.querySelector('.chat');
  if (c) c.dataset.fresh = '1';
}

/* The composer appends an "[attachments]" note plus "- path" bullets for the
   model; the reader gets chips instead. Parsed against both language variants
   of the note, since history may have been written under the other one. */
function splitAtts(text) {
  const notes = Object.values(I18N.ui['gui.att.note'] || {});
  for (const note of notes) {
    if (!note) continue;
    const ix = text.lastIndexOf('\n\n' + note + '\n');
    if (ix < 0) continue;
    const tail = text.slice(ix + note.length + 3).split('\n');
    if (!tail.length || !tail.every((l) => !l.trim() || /^- /.test(l))) continue;
    return {
      body: text.slice(0, ix),
      atts: tail.filter((l) => /^- /.test(l)).map((l) => l.slice(2).trim()),
    };
  }
  return { body: text, atts: [] };
}

/* Uploaded path -> data URL, filled in by the upload path (live.js). An image
   the reader just sent should look like an image in their own message, and the
   bytes are already in the page; attachments travel to the agent as paths, so
   this is the only place they can be recovered from. */
const ATT_IMG = new Map();

/* Full-size view for any image in the page — a staged thumbnail or one already
   sent. Clicking anywhere closes it; Escape is wired into the global chain. */
function closeImage() {
  document.querySelectorAll('.lightbox').forEach((n) => n.remove());
}

function openImage(src, name) {
  closeImage();
  const box = mk('button', 'lightbox');
  box.setAttribute('aria-label', T('gui.img.close'));
  const img = mk('img');
  img.src = src;
  img.alt = name || '';
  box.appendChild(img);
  box.onclick = closeImage;
  document.body.appendChild(box);
  box.focus();
}

/* Past this many, the row collapses: a wall of thumbnails buries the sentence
   it was sent with, and past two filenames the chips stop being readable. */
const ATT_SHOW_IMG = 3;
const ATT_SHOW_DOC = 2;

/* What was handed over, drawn above what was said about it. Images show
   themselves; a stack of them collapses to one pile with a count, files to one
   chip with a count -- either opens the whole set on click. */
function attBox(paths, expanded) {
  const box = mk('div', 'abox');
  const imgs = paths.filter((p) => ATT_IMG.has(String(p)));
  const docs = paths.filter((p) => !ATT_IMG.has(String(p)));
  const openAll = () => box.replaceWith(attBox(paths, true));

  const thumb = (p, live) => {
    const src = ATT_IMG.get(String(p));
    const nm = String(p).split('/').pop();
    const img = mk('img', 'shot');
    img.src = src;
    img.alt = nm;
    if (live) {
      img.title = T('gui.img.open', { name: nm });
      img.onclick = () => openImage(src, nm);
    }
    return img;
  };
  const chip = (p) => {
    const c = mk('button', 'achip');
    c.appendChild(mk('span', 'nm', String(p).split('/').pop()));
    c.title = p;
    c.onclick = () => { if (typeof showFile === 'function') showFile(p); };
    return c;
  };

  /* A lone image keeps its own proportions; several are squared off so the row
     reads as one set instead of a ragged filmstrip. */
  if (imgs.length > 1) box.classList.add('set');
  if (imgs.length && (expanded || imgs.length <= ATT_SHOW_IMG)) {
    imgs.forEach((p) => box.appendChild(thumb(p, true)));
  } else if (imgs.length) {
    const pile = mk('button', 'pile');
    pile.append(thumb(imgs[0], false), mk('span', 'cnt', `${imgs.length}`));
    pile.title = T('gui.att.show_all');
    pile.onclick = openAll;
    box.appendChild(pile);
  }
  if (docs.length && (expanded || docs.length <= ATT_SHOW_DOC)) {
    docs.forEach((p) => box.appendChild(chip(p)));
  } else if (docs.length) {
    const more = mk('button', 'achip more');
    more.appendChild(mk('span', 'nm', T('gui.att.n_files', { n: docs.length })));
    more.title = T('gui.att.show_all');
    more.onclick = openAll;
    box.appendChild(more);
  }
  return box;
}

function ask(text, when) {
  const ch = document.querySelector('.chat');
  if (ch) delete ch.dataset.fresh;
  stick = true;                      // sending always snaps back to the tail
  const { body, atts: files } = splitAtts(String(text));
  const w = mk('div', 'ask in');
  if (files.length) w.appendChild(attBox(files, false));
  /* No empty bubble under a file sent on its own. */
  if (body.trim()) {
    const bEl = mk('div', 'b', body);
    /* A long message folds to a preview so it cannot bury the reply;
       the fold keeps the full text in the DOM (copy still copies it all). */
    if (body.length > 640 || body.split('\n').length > 12) {
      bEl.classList.add('clip');
      const tg = mk('button', 'qfold', T('gui.ask.expand'));
      tg.setAttribute('aria-expanded', 'false');
      tg.onclick = () => {
        const open = !bEl.classList.toggle('clip');
        tg.textContent = T(open ? 'gui.ask.collapse' : 'gui.ask.expand');
        tg.setAttribute('aria-expanded', String(open));
        if (!open) bEl.scrollIntoView({ block: 'nearest' });
      };
      w.append(bEl, tg);
    } else w.appendChild(bEl);
  }
  /* Same footer grammar as an answer -- what the reader typed is quotable and
     locatable in time too. Mirrored, since the bubble sits on the right. */
  const foot = mk('div', 'ansfoot');
  const acts = mk('div', 'acts');
  const cp = mk('button');
  cp.dataset.tip = T('gui.answer.copy');
  cp.setAttribute('aria-label', T('gui.answer.copy'));
  cp.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${COPY_ICO}</svg>`;
  cp.onclick = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(body);
    tipFlash(cp, T('gui.answer.copied'));
  };
  acts.appendChild(cp);
  foot.appendChild(acts);
  foot.appendChild(mk('span', 'turnmeta', when || stamp(Date.now())));
  w.appendChild(foot);
  stageBox().appendChild(w); down();
}

function errLine(what, how) {
  const w = mk('div', 'errline in');
  w.append(mk('b', null, T('gui.fail')));
  w.appendChild(mk('span', 'm', `${what} — ${how}`));
  const b = mk('button', 'mini', T('gui.retry'));
  b.onclick = () => { w.remove(); send('把支付回调那块拆成两个 handler'); };
  w.appendChild(b);
  stageBox().appendChild(w); down();
}

/* ══ transcript: three voices, three folding depths ═══════════════
   Machine work renders as quiet activity rows, never cards. A stretch of
   consecutive calls is one work segment: folded it is one phrase line;
   opened, one row per call; a call with output opens further into its
   detail block — the only place raw commands, paths and results appear.
   Folding may hide detail but never hides a failure. */
/* Every fold in the transcript changes the height of what is above the reader,
   and the browser's own scroll anchoring may pick a node BELOW the click --
   which slides the line you just clicked out from under the cursor. So pin that
   row: measure it, mutate, correct the scroll by the difference.

   The correction has to run with smooth scrolling off. The container sets
   `scroll-behavior: smooth` for the tail-follow, and under it an assignment to
   scrollTop animates -- turning the fix into a visible glide, which is the very
   thing it exists to prevent. */
function pinRow(el, mutate) {
  const sc = $('#scroll');
  const was = el.getBoundingClientRect().top;
  mutate();
  if (!sc) return;
  const keep = sc.style.scrollBehavior;
  sc.style.scrollBehavior = 'auto';
  sc.scrollTop += el.getBoundingClientRect().top - was;
  sc.style.scrollBehavior = keep;
}

const MIN_RUN_STEPS = 2;      // silent steps to merge into one segment
const SLOW_CALL_MS = 10000;   // a settled row shows its time only past this
const DTL_MAX_LINES = 80;

const shortArg = (a, max = 40) => {
  if (!a) return '';
  const one = String(a).replace(/\s+/g, ' ').trim();
  return one.length > max ? one.slice(0, max - 1) + '…' : one;
};

/* Normalize a call's identity: unwrap the tool_call meta tool (the row must
   name the inner tool, not the wrapper), spot mcp_<server>_<tool> names. */
function actId(name, rawArgs) {
  let a = (rawArgs && typeof rawArgs === 'object') ? rawArgs : wsArgs(name, rawArgs);
  let via = false;
  if (name === 'tool_call' && typeof a.name === 'string') {
    via = true;
    name = a.name;
    a = (a.arguments && typeof a.arguments === 'object') ? a.arguments : {};
  }
  const m = MCP_RE.exec(name);
  return { name, args: a, via, srv: m ? m[1] : null };
}

/* Line icons for the activity rows. A row names its kind of work by shape
   before it is read, so a stretch of work scans without parsing every verb.
   Tools that share a kind share a glyph on purpose (all three web tools are a

const ACT_ICO = {

  clock: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17ZM12 7.5V12l3.4 2',
  image: 'M4.5 5.5h15v13h-15zM8.6 11.2a1.55 1.55 0 1 0 0-3.1 1.55 1.55 0 0 0 0 3.1ZM6 17.5l4.5-4.5 3.5 3.5 2.5-2.5 2.5 2.5',

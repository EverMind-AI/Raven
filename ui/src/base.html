<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Raven</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   Ink & Amber — Raven's visual system.
   Raven lives in a terminal, so the monospace face is the DISPLAY face
   (wordmark, labels, data); the sans carries only prose. Neutrals are
   warm and biased toward the amber accent rather than a default grey.
   ═══════════════════════════════════════════════════════════════════ */
:root {
  /* Paper. White ground and plain neutral greys; modules separate by a faint
     shift in ground colour, not by rules -- a drawn line is the exception, for
     content that needs one (tables, diffs). Colour is spent only where
     something is actually happening: a link, a live dot, an error. */
  --ink:      #ffffff;
  --surface:  #f7f7f7;
  --raised:   #f0f0f0;
  --line:     #e7e7e7;
  --line-soft:#f0f0f0;
  --text:     #1a1a1a;
  --muted:    #6b6b6b;
  --faint:    #9d9d9d;
  --link:     #3b6fd4;
  --amber:    #a8801c;
  --amber-dp: #eee4c8;
  --moss:     #3f7d2c;
  --clay:     #b4402f;
  --gold:     #9a7016;
  --sky:      #2f6d9e;
  --shadow:   0 14px 34px -22px rgba(28, 27, 25, .35);
  /* Card elevation, two steps: resting and lifted. A tight contact shadow
     plus a wide low-alpha bloom -- paper raised off the desk, not a glow. */
  --elev:     0 1px 2px rgba(28, 27, 25, .05), 0 6px 16px -10px rgba(28, 27, 25, .14);
  --elev-up:  0 2px 4px rgba(28, 27, 25, .06), 0 14px 30px -12px rgba(28, 27, 25, .22);
  /* The workspace panel shares the chat's white; this soft spill at its left
     edge is the whole boundary. Two layers: a 4% contact edge where the
     surfaces meet, and a wide low-alpha falloff that fades into the page. */
  --seam:     -1px 0 0 rgba(28, 27, 25, .05), -16px 0 32px -18px rgba(28, 27, 25, .16);

  /* Inset of the two panel toggles from their window edge. Both sides read it,
     so the buttons stay put when the panel they control opens or closes. */
  --edge: 10px;

  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Code", "Cascadia Mono",
          Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  /* Brand voice only -- the wordmark, nothing in the UI chrome. */
  --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;

  --step--1: 12px;
  --step-0:  14.5px;
  --step-1:  17px;
  --step-2:  22px;
  --step-3:  30px;

  /* Both panel widths are draggable, so they are variables the grip writes to.
     The bounds live in PANE next to the drag code, where they can also be
     clamped against the window. */
  --rail: 258px;
  --wsw: 420px;
  --chat-min: 430px;
  /* In px, not ch: a ch unit resolves against the font of whatever element
     uses it, so the banner (12.5px) and the transcript column (14.5px)
     computed different widths from the same token and their edges never
     lined up. 744px leaves a ~700px reading measure -- around 45 CJK or 80
     latin characters a line, which is where prose stops needing a head turn.
     Transcript, banner and composer all read from this one token, so the
     column and the field it is typed into always share an edge. */
  --col: 744px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ink:      #16150f;
    --surface:  #1e1c14;
    --raised:   #272419;
    --line:     #3a3527;
    --line-soft:#2c2819;
    --text:     #f7f2e4;
    --muted:    #a39b82;
    --faint:    #736c58;
    --link:     #86abe4;
    --amber:    #e8cf49;
    --amber-dp: #6f6114;
    --moss:     #7fbf6a;
    --clay:     #d96a5b;
    --gold:     #e0a030;
    --sky:      #6fa8d6;
    --shadow:   0 18px 40px -24px #000c;
    --elev:     0 1px 2px rgba(0, 0, 0, .45), 0 6px 16px -8px rgba(0, 0, 0, .5);
    --elev-up:  0 2px 5px rgba(0, 0, 0, .5), 0 16px 34px -12px rgba(0, 0, 0, .65);
    --seam:     -1px 0 0 rgba(0, 0, 0, .4), -16px 0 32px -16px rgba(0, 0, 0, .5);
  }
}

/* the viewer's toggle must win over the media query, both directions */
:root[data-theme="dark"] {
  --ink: #16150f; --surface: #1e1c14; --raised: #272419; --line: #3a3527;
  --line-soft: #2c2819; --text: #f7f2e4; --muted: #a39b82; --faint: #736c58;
  --link: #86abe4; --amber: #e8cf49; --amber-dp: #6f6114; --moss: #7fbf6a;
  --clay: #d96a5b; --gold: #e0a030; --sky: #6fa8d6; --shadow: 0 18px 40px -24px #000c;
  --elev: 0 1px 2px rgba(0, 0, 0, .45), 0 6px 16px -8px rgba(0, 0, 0, .5);
  --elev-up: 0 2px 5px rgba(0, 0, 0, .5), 0 16px 34px -12px rgba(0, 0, 0, .65);
  --seam: -1px 0 0 rgba(0, 0, 0, .4), -16px 0 32px -16px rgba(0, 0, 0, .5);
}
:root[data-theme="light"] {
  --ink: #ffffff; --surface: #f7f7f7; --raised: #f0f0f0; --line: #e7e7e7;
  --line-soft: #f0f0f0; --text: #1a1a1a; --muted: #6b6b6b; --faint: #9d9d9d;
  --link: #3b6fd4; --amber: #a8801c; --amber-dp: #eee4c8; --moss: #3f7d2c;
  --clay: #b4402f; --gold: #9a7016; --sky: #2f6d9e;
  --shadow: 0 14px 34px -22px rgba(26,26,26,.35);
  --elev: 0 1px 2px rgba(28, 27, 25, .05), 0 6px 16px -10px rgba(28, 27, 25, .14);
  --elev-up: 0 2px 4px rgba(28, 27, 25, .06), 0 14px 30px -12px rgba(28, 27, 25, .22);
  --seam: -1px 0 0 rgba(28, 27, 25, .05), -16px 0 32px -18px rgba(28, 27, 25, .16);
}

* { box-sizing: border-box; }
/* every display rule below would otherwise beat the hidden attribute */
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
/* Below the floor the window scrolls sideways instead of the layout folding
   itself away: the rail and the reading column both have a width under which
   they simply cannot do their job. */
html { overflow-x: auto; overflow-y: hidden; background: var(--ink); }
body {
  background: var(--ink); color: var(--text);
  font: var(--step-0)/1.65 var(--sans);
  -webkit-font-smoothing: antialiased; overflow: hidden;
  min-width: 780px;
}
button, input, select, textarea { font: inherit; color: inherit; }
/* Controls are furniture, not copy: a double-click that selects a row label
   leaves a selection behind, and the next right-click anywhere near it summons
   the host's Look Up menu instead of ours. Text worth copying lives in content
   (answers, code, logs), never inside a button. */
button { background: none; border: 0; cursor: pointer; }
button, [role="button"] { -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 3px; }

/* ── scrollbars ─────────────────────────────────────────────────────────
   Every scroller in the app is scrolled the same way, so it gets the same bar:
   drawn only while it moves, and drawn ON TOP of the content. The native one
   is off everywhere because it does the opposite -- a classic bar is part of
   the box, so the session list reflowed a few pixels narrower the moment its
   content outgrew it, and the same list looked like two different widths
   depending on how many sessions you had.

   The thumbs live in one fixed layer instead of inside each scroller: a bar
   inside an `overflow: hidden` box, or one in a box with its own stacking
   context, would be clipped by the very thing it belongs to. */
* { scrollbar-width: none; }
::-webkit-scrollbar { width: 0; height: 0; }
.sbars { position: fixed; inset: 0; z-index: 88; pointer-events: none; }
.sbar {
  position: fixed; border-radius: 4px; opacity: 0; pointer-events: auto;
  background: color-mix(in oklab, var(--faint) 60%, transparent);
  transition: opacity .22s ease, background .12s;
}
.sbar[data-on="true"] { opacity: 1; }
.sbar:hover, .sbar[data-drag="true"] { background: var(--muted); }
/* Nothing to grab while it is invisible, or a stray click near the edge would
   land on a bar that is not there. */
.sbar:not([data-on="true"]) { pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .sbar { transition: none; } }

/* utility label: the mono face doing display duty */
.lab {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--faint);
}
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Measure the viewport directly instead of inheriting a 100% chain: any link
   in that chain resolving to auto leaves the shell short and the page ends in
   a band of empty white. dvh also tracks mobile browser chrome. */
.app { display: grid; grid-template-columns: var(--rail) 1fr; height: 100vh; height: 100dvh; }

/* ── rail ──────────────────────────────────────────────────────────── */
/* No rule at the seam: the rail's grey against the chat's white is the whole
   boundary, the way the reference renderer does it. The grip hover keeps the
   seam findable. */
.rail {
  background: var(--surface);
  display: flex; flex-direction: column; min-height: 0; position: relative;
}

/* Resize grip: a 6px target straddling the seam, invisible until the pointer is
   on it, and then only the seam itself darkens -- a visible handle would be one
   more piece of furniture on a page that is mostly type. Hit area is wider than
   the line it moves, because a 1px target is not a target. */
.grip {
  position: absolute; top: 0; bottom: 0; width: 6px; z-index: 6;
  cursor: col-resize; background: none; border: 0; padding: 0;
}
.grip::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: 2px; width: 2px;
  background: var(--faint); opacity: 0; transition: opacity .12s;
}
.grip:hover::after, .grip[data-drag="true"]::after { opacity: .55; }
.rail .grip { right: -3px; }
.chat .grip { right: -3px; }
/* No seam to drag when the panel is shut, and none in single-column mode. */
.split:not([data-open="true"]) #wsGrip { display: none; }

/* Rail header: two icon chores only. The wordmark used to live here and cost a
   whole row for a name the footer already carries. */
/* flex:none, or a long session list shrinks this row and its height stops
   matching the main header's. */
/* Left-aligned, toggle first: the panel toggle has to sit at the window's edge
   in the same spot whether the rail is open or shut, so that clicking it never
   moves it out from under the pointer. --edge is that shared inset, and the
   collapsed-rail twin in the chat header uses it too. */
/* Same height as the chat header, or the toggle jumps vertically when the rail
   closes and its twin in that header takes over. */
.railtop { display: flex; align-items: center; justify-content: flex-start; gap: 2px;
  flex: none; height: 54px; padding: 0 var(--edge); }
.app[data-rail="off"] .top { padding-left: var(--edge); }
/* Desktop shell hides the OS title bar, so this row shares the traffic-light
   band: --tl-row / --tl-pad are measured from the real buttons and injected by
   the shell, and the fallbacks match a standard macOS title bar. */
:root[data-shell="1"] .railtop { height: var(--tl-row, 38px); padding-left: var(--tl-pad, 78px); }
:root[data-shell="1"] .top { height: var(--tl-row, 38px); }
:root[data-shell="1"][data-rail="off"] .top { padding-left: var(--tl-pad, 78px); }
/* In the shell this band IS the title bar: it drags the window (see the
   pointerdown handler by the popover closers), so its text must not be
   selectable or every drag attempt starts a selection instead. */
:root[data-shell="1"] .railtop, :root[data-shell="1"] .top,
:root[data-shell="1"] .ws-top { -webkit-user-select: none; user-select: none; }
/* Search and collapse are chores, not destinations: icon-only, quiet,
   and out of the way in the top-right corner. */
.ghost-ic {
  flex: none; color: var(--faint); padding: 5px; border-radius: 6px;
  display: grid; place-items: center; line-height: 1;
}
.ghost-ic:hover { color: var(--text); background: var(--raised); }
.ghost-ic[aria-expanded="true"] { color: var(--text); background: var(--raised); }
/* The buttons written in markup size their own glyph; the ones built with ico()
   have no width or height attribute, and an unsized inline SVG collapses to
   nothing. One rule here rather than a size at every call site. */
.ghost-ic svg { width: 15px; height: 15px; }

.rail-nav { display: grid; padding: 0 8px 4px; }
.rail-nav + .find { margin-top: 0; }

/* The new-task action is a row in this list, not a control dropped on top of
   it: a bordered box here made the column read as two unrelated things. It
   keeps the shared row shape -- including the row rhythm, since a nudge of
   extra space under just this one row read as a misalignment -- and earns its
   emphasis by being selected while the draft is open. */

.find { margin: 0 10px 6px; position: relative; }
.find input {
  width: 100%; background: none; border: 1px solid transparent; border-radius: 6px;
  padding: 4px 26px 4px 28px; outline: 0; font-size: 12.5px;
}
.find input:hover { border-color: var(--line); }
.find input:focus { border-color: var(--muted); background: var(--ink); }
.find input::placeholder { color: var(--faint); }
.find .ic { position: absolute; left: 8px; top: 5px; color: var(--faint); pointer-events: none; }
.find .clr { position: absolute; right: 5px; top: 2px; color: var(--faint); padding: 2px 4px; border-radius: 4px; }
.find .clr:hover { color: var(--text); }

.list { flex: 1; overflow-y: auto; padding: 0 8px 8px; min-height: 0; scrollbar-gutter: stable; }
.list .lab { padding: 10px 10px 3px; display: block; }
/* Rail group eyebrow: caret + label + count + hairline. The rule and the
   caret are what separate a heading from the session rows under it. */
.list .grp {
  display: flex; align-items: center; gap: 7px;
  padding: 13px 4px 5px 6px; cursor: pointer; user-select: none;
}
.list .grp:first-child { padding-top: 6px; }
.list .grp .car { display: grid; place-items: center; flex: none; color: var(--faint); }
.list .grp .car svg {
  width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2.2;
  stroke-linecap: round; stroke-linejoin: round;
  transform: rotate(90deg); transition: transform .18s ease;
}
.list .grp[aria-expanded="false"] .car svg { transform: rotate(0deg); }
@media (prefers-reduced-motion: reduce) { .list .grp .car svg { transition: none; } }
.list .grp .lab { padding: 0; flex: none; }
.list .grp .n {
  font-family: var(--mono); font-size: 10px; color: var(--faint);
  font-variant-numeric: tabular-nums; flex: none;
}
.list .grp .rule { flex: 1; height: 1px; background: var(--line-soft); }
.list .grp:hover .lab, .list .grp:hover .car, .list .grp:hover .n { color: var(--muted); }
.list .grp:focus-visible { outline: 1px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
.grp-empty { font-size: 12px; color: var(--faint); padding: 3px 10px 5px 23px; }
.grp .grp-go { font-size: 11px; color: var(--faint); padding: 2px 8px 2px 4px; border-radius: 5px; flex: none; }
.grp .grp-go:hover { color: var(--amber); }
.grp-more {
  display: block; width: 100%; text-align: left; font-size: 12px; color: var(--faint);
  padding: 6px 10px; border-radius: 8px; margin-top: 1px;
}
.grp-more:hover { color: var(--text); background: var(--surface); }

/* One line per session. The summary line doubled the row height and the
   title already says what the session is; the group header carries the date. */
.sess .t {
  display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1;
  white-space: nowrap; overflow: hidden;
}
.sess .t span { overflow: hidden; text-overflow: ellipsis; }
/* The stamp is a fixed-width note on the row, so it keeps its own weight when
   the row goes bold. */
.sess .w {
  flex: none; font-family: var(--mono); font-size: 10.5px; color: var(--faint);
  font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.sess[aria-current="true"] .w { color: var(--muted); }
/* Hover changes colour and nothing else: the row keeps its title clipped and
   its time in place, so the list never reflows under the cursor. The row menu
   is on right-click (and on keyboard focus, for a11y). */
.sess .more {
  flex: none; position: absolute; right: 8px; opacity: 0; pointer-events: none;
  color: var(--muted); padding: 1px 5px; border-radius: 5px; line-height: 1;
  background: var(--raised);
}
.sess .more:focus-visible { opacity: 1; pointer-events: auto; }
.sess .ren {
  grid-column: 1 / -1; background: var(--ink); border: 1px solid var(--muted);
  border-radius: 5px; padding: 3px 6px; font-size: 13px; outline: 0; width: 100%;
}

/* Streaming and just-finished take the stamp's slot rather than the dot's.
   A row that is working is worth watching, and the tail is where the eye
   already goes for the time -- while the answer is still coming the clock is
   the least interesting thing the row can say. The stamp comes back the
   moment the session has been read, so this never accumulates.

   The stamp text stays in the box and is hidden rather than removed, and the
   marker is absolutely positioned over it. A stamp is anywhere from "昨天"
   (21px) to "2026年12月30日" (83px), so swapping the text out for a marker
   would resize the tail and shove the title -- the row visibly twitched on
   every transition. Holding the text's box keeps the swap free of reflow
   without pinning every row to the width of the longest possible date. */
.sess .w[data-sig] { position: relative; }
.sess .w[data-sig] .wt { visibility: hidden; }
.sess .w[data-sig] i {
  position: absolute; right: 0; top: 50%; margin-top: -3px;
  width: 6px; height: 6px; border-radius: 50%; display: block;
}
.sess .w[data-sig="run"] i { background: var(--amber); animation: pulse 1.6s ease-in-out infinite; }
/* Done is a ring, not a disc: a filled dot reads as another running state at
   a glance, and the whole point is that these two are told apart in passing. */
.sess .w[data-sig="done"] i {
  box-shadow: inset 0 0 0 1.5px var(--moss); animation: sigin .5s ease backwards;
}
@keyframes sigin { from { opacity: 0; transform: scale(.4); } }

.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.dot.run { background: var(--amber); animation: pulse 1.6s ease-in-out infinite; }
.dot.err { background: var(--clay); }
.dot.que { background: var(--gold); }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .3; transform: scale(.75); } }
@media (prefers-reduced-motion: reduce) {
  .sess .w[data-sig] i, .dot.run { animation: none; }
}

.empty-note { padding: 46px 12px; font-size: 12.5px; color: var(--faint); text-align: center; line-height: 2; }

/* A hairline seam above the identity row: without it the foot reads as the
   last session in the list rather than a fixture of the rail. */
.rail-foot { padding: 8px 6px 6px; border-top: 1px solid var(--line-soft); margin-top: 4px; }

.me {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  padding: 5px 8px; border-radius: 7px;
}
.me:hover { background: var(--raised); }
.me[aria-expanded="true"] { background: var(--raised); }
.me .av {
  flex: none; width: 24px; height: 24px; border-radius: 50%;
  background: var(--amber-dp); color: var(--amber);
  display: grid; place-items: center; font-size: 12px; font-weight: 600;
}
.me .av.anon { background: var(--raised); color: var(--faint); }
.me .av.anon svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.7; }
.me .who { flex: 1; min-width: 0; display: grid; }
.me .who .n { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me .who .s {
  font-family: var(--mono); font-size: 10.5px; color: var(--faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.me .chev { flex: none; color: var(--faint); font-size: 11px; }

/* Account popover, anchored above the rail foot. Width and left edge are set
   from the foot button in toggleAcct(), so the panel and the row it grows out
   of read as one column instead of two boxes that nearly line up. Inner padding
   is 4+5 to land content on the foot row's 6+8 text edge. */
.acct {
  position: fixed; z-index: 30; width: 268px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); padding: 5px 4px; display: none;
}
.acct[data-open="true"] { display: block; animation: up .16s ease backwards; }
/* Signed out, the head IS the sign-in control: a panel that opens on the
   identity should let you press the identity, not a separate button below it. */
.acct .head {
  display: flex; gap: 9px; align-items: center; width: 100%; text-align: left;
  padding: 7px 5px; border-radius: 8px;
}
.acct button.head:hover { background: var(--raised); }
.acct .head .av {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  background: var(--amber-dp); color: var(--amber);
  display: grid; place-items: center; font-size: 13px; font-weight: 600;
}
/* Signed out there is no initial to show, so the ring is drawn empty and quiet
   rather than seeded with a letter nobody chose. */
.acct .head .av.anon { background: var(--raised); color: var(--faint); }
.acct .head .av.anon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; }
.acct .head .who { flex: 1; min-width: 0; }
.acct .head .n { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct .head .s {
  font-family: var(--mono); font-size: 10.5px; color: var(--faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.acct .head .soon {
  flex: none; font-family: var(--mono); font-size: 9.5px; letter-spacing: .04em;
  padding: 1px 5px; border-radius: 4px; background: var(--raised); color: var(--faint);
}
.acct hr { border: 0; border-top: 1px solid var(--line-soft); margin: 4px 5px; }
.acct .item {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  padding: 7px 5px; border-radius: 8px; font-size: 13px; color: var(--muted);
}
.acct .item svg {
  width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8;
  color: var(--faint);
}
.acct button.item:hover { background: var(--raised); color: var(--text); }
.acct button.item:hover svg { color: var(--text); }
.acct .item .kbd, .acct .item .val {
  margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--faint);
}
/* Language and appearance switch in place -- reaching settings to flip either
   one costs more clicks than the flip is worth. */
.acct .item .seg { margin-left: auto; }
.acct .item .seg button { padding: 3px 8px; font-size: 10.5px; }

/* Collapsed rail: ONE track, not `0 1fr`. A display:none grid item leaves the
   grid entirely, so with two tracks the main pane fell into the 0px one and
   the whole right side rendered zero-wide. */
.app[data-rail="off"] { grid-template-columns: 1fr; }
.app[data-rail="off"] .rail { display: none; }
/* One row shape for the whole rail -- the new-task action, the module links and
   every session line -- so the column reads as one list instead of three. */
.navi, .sess {
  position: relative; display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 5px 10px; border-radius: 6px; text-align: left; cursor: pointer;
  font-size: 13.5px; color: var(--muted);
}
.navi:hover, .sess:hover { background: var(--raised); color: var(--text); }
/* Selected is not a stronger hover, and it is not a coloured block either: the
   row lifts onto the page's own ground with a hairline ring and the faintest
   shadow, so it reads as a raised chip against the rail rather than as a
   highlighter stroke. The accent shrinks from a wash over the whole row to the
   glyph alone -- one small precise amber mark carries "you are here", which is
   all it was ever being asked to say. Hover stays neutral, so "where the
   pointer is" and "where you are" still never read alike. */
.navi[aria-current="true"], .sess[aria-current="true"] {
  background: var(--ink); color: var(--text); font-weight: 500;
  box-shadow: inset 0 0 0 1px var(--line-soft), 0 1px 2px rgba(0, 0, 0, .045);
}
.navi[aria-current="true"]:hover, .sess[aria-current="true"]:hover { background: var(--ink); }
.navi[aria-current="true"] svg { color: var(--amber); }
/* A module page covers the chat, so the page is where you are; the session
   behind it keeps a readable label but drops the lift rather than leaving two
   rows looking selected at once. */
.app[data-page="on"] .sess[aria-current="true"] { background: none; box-shadow: none; font-weight: 400; }
.navi svg, .sess svg { flex: none; }
/* generic: it also rides on the workspace chip in the top bar */
.bdg {
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  background: var(--gold); color: var(--ink); border-radius: 9px; padding: 1px 6px;
}
:root[data-theme="light"] .bdg { color: #faf7ee; }
/* An attention badge counts real state. In live mode the demo's mock counts are
   painted by boot before the first RPC resolves, which flashed a badge on the
   rail on every refresh -- live.js marks the counts pending until they land,
   and CSS wins over whatever the demo writers put there in the meantime. */
.rail[data-counts="pending"] .bdg { display: none; }
.navi .bdg { margin-left: auto; }
.navi .k { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--faint); }

/* ── main ──────────────────────────────────────────────────────────── */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0;
  transition: padding-right .24s ease; }
.main[data-shift="true"] { padding-right: 340px; }

/* No rule under the header: the same short fade the composer uses, so the
   header and the transcript read as one sheet rather than two stacked panes.
   z-index puts the fade above the transcript -- code blocks inside the scroller
   are positioned too, and would otherwise paint over it on the way up. */
.top {
  display: flex; align-items: center; gap: 10px; padding: 0 20px;
  height: 54px; flex: none; position: relative; z-index: 2;
}
.top::after {
  content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 24px;
  background: linear-gradient(to bottom, var(--ink), transparent); pointer-events: none;
}
.top h1 {
  font-size: var(--step-0); font-weight: 600; margin: 0; min-width: 0; max-width: 52%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default;
}
/* rename affordance: an icon that appears on hover, editing only the title box */
#renameBtn { opacity: 0; transition: opacity .14s; }
.top:hover #renameBtn, #renameBtn:focus-visible { opacity: 1; }
.top .titin {
  min-width: 0; width: min(420px, 52%); background: var(--ink);
  border: 1px solid var(--faint); border-radius: 7px; padding: 4px 9px; outline: 0;
  font-size: var(--step-0); font-weight: 600; color: var(--text); font-family: inherit;
}
.top .spacer { flex: 1; min-width: 0; }
/* The workspace toggle is the rail toggle mirrored -- same icon, divider on the
   right -- so the two panels read as one pair of controls. Unseen changes ride
   the corner as a count, because collapsing the panel must not hide that files
   changed. */
.wstog { position: relative; }
.wstog .bdg {
  position: absolute; top: -2px; right: -4px; pointer-events: none;
  font-size: 9px; padding: 0 4px; line-height: 13px;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  border: 0; border-radius: 7px; padding: 3px 8px;
  font-family: var(--mono); font-size: 11px; color: var(--faint);
}
.chip:hover { color: var(--text); background: var(--surface); }
.chip[aria-expanded="true"] { border-color: var(--faint); color: var(--text); background: var(--surface); }
.led { width: 5px; height: 5px; border-radius: 50%; background: var(--moss); flex: none; }
.led.warn { background: var(--gold); }
.led.bad { background: var(--clay); }

/* Context is a quantity, so it gets a quantity's shape: a ring that fills --
   and only the ring. The fill and its colour already answer "is this fine?"
   at a glance; the exact tokens are a hover away, not a number the reader has
   to walk past on every line. */
.chip.ctx { font-variant-numeric: tabular-nums; padding: 4px 6px; }
.chip .ring { width: 13px; height: 13px; flex: none; transform: rotate(-90deg); }
.chip .ring circle { fill: none; stroke-width: 3.4; }
.chip .ring .bg { stroke: var(--line); }
.chip .ring .fg { stroke: currentColor; stroke-dasharray: 47.75;
  transition: stroke-dashoffset .35s ease; }
/* The colour is the warning, not a separate badge: quiet until the window is
   worth thinking about, amber while it is filling, clay when it is nearly out. */
.chip.ctx.warm { color: var(--gold); }
.chip.ctx.hot { color: var(--clay); }
.chip .pico { width: 12px; height: 12px; flex: none; }
/* The tier with no brakes says so in the chip: same shape, warning colour. */
.chip.risk { color: var(--clay); }
.chip.risk:hover { color: var(--clay); background: color-mix(in oklab, var(--clay) 10%, transparent); }

/* Permission rows: a shield per tier, the name, and the sentence that decides
   the choice -- a reader picking a permission level is reading the consequence,
   not the label, so the sentence is not a hover away. */
.pop .prow { align-items: flex-start; padding: 8px 9px; }
.pop .prow .pic { flex: none; width: 15px; height: 15px; margin-top: 1px; color: var(--faint); }
.pop .prow .pic svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; }
.pop .prow.risk .pic { color: var(--clay); }
.pop .prow .nm { font-weight: 600; }
.pop .prow .sub { display: block; font-size: 11px; line-height: 1.5; color: var(--faint); margin-top: 2px;
  white-space: normal; }
.pop .prow .txt { flex: 1; min-width: 0; text-align: left; }
.pop .prow[aria-checked="true"] { background: var(--raised); }
.pop .prow .tick { flex: none; width: 13px; height: 13px; color: var(--amber); margin-top: 2px; }
.pop .note { padding: 7px 9px 4px; font-size: 10.5px; line-height: 1.5; color: var(--faint); }

.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; scroll-behavior: smooth; scrollbar-gutter: stable; }
/* Bottom inset tracks the floating composer (--lift is the card's height plus
   its offset, published by dockLift), so the last message always clears the
   glass with room to spare -- growing exactly when the textarea does. */
.col { max-width: var(--col); margin: 0 auto; padding: 22px 22px calc(var(--lift, 96px) + 26px); min-width: 0; }

.banner {
  /* minus the column's side padding, so the card lines up with the prose edge */
  max-width: calc(var(--col) - 44px); margin: 14px auto 0; padding: 9px 14px;
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--line); border-left: 2px solid var(--gold);
  border-radius: 0 8px 8px 0; background: var(--surface); font-size: 12.5px;
}
.banner b { font-weight: 600; }
.banner span { color: var(--muted); flex: 1; }
.banner button { color: var(--amber); font-size: 12.5px; white-space: nowrap; }
.banner button:hover { text-decoration: underline; }
.banner .x { color: var(--faint); }

.flash { max-width: var(--col); margin: 0 auto; padding: 10px 22px 0;
  font-family: var(--mono); font-size: 11.5px; color: var(--gold); }

/* ── first run ─────────────────────────────────────────────────────── */
/* The opening is the app's face: one soft pool of the brand's light behind
   the mark, raised fact cards, and nothing else raising its voice. */
.pitch { padding: 5vh 0 0; position: relative; }
.pitch::before {
  content: ''; position: absolute; inset: -60px -80px auto -80px; height: 320px;
  background: radial-gradient(560px 280px at 18% 12%,
    color-mix(in oklab, var(--amber) 8%, transparent), transparent 72%);
  pointer-events: none;
}
.pitch > * { position: relative; }
.pitch .mark {
  width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center;
  background-color: color-mix(in oklab, var(--amber) 13%, var(--ink));
  background-image: linear-gradient(160deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 58%);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--amber) 24%, transparent), var(--elev);
}
:root[data-theme="dark"] .pitch .mark { background-image: linear-gradient(160deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, 0) 58%); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .pitch .mark { background-image: linear-gradient(160deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, 0) 58%); }
}
.pitch h2 {
  font-family: var(--mono); font-size: var(--step-3); font-weight: 600;
  letter-spacing: -.03em; margin: 20px 0 10px; text-wrap: balance;
}
.pitch h2 em { font-style: normal; color: var(--amber); }
.pitch p { color: var(--muted); max-width: 58ch; margin: 0 0 26px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 28px; }
.fact {
  background: var(--ink); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--elev); padding: 15px 16px;
}
.fact b { display: block; font-family: var(--mono); font-size: var(--step-1); color: var(--amber); }
.fact span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; }

/* ── transcript ────────────────────────────────────────────────────── */
/* User speaks from the right in a bubble, Raven answers from the left as
   plain prose. No avatars, no prefix glyphs -- side and shape already say
   who is talking. */
/* Attachments stack above the bubble rather than inside it: a handed-over file
   is a thing, the sentence is what was said about it, and one bubble holding
   both made the picture look like punctuation. */
.ask { display: flex; flex-direction: column; align-items: flex-end; margin: 30px 0 22px; }
.ask .b {
  max-width: 78%; background: var(--raised); border-radius: 15px 15px 4px 15px;
  padding: 9px 15px; white-space: pre-wrap; line-height: 1.6;
  overflow-wrap: break-word;
}
/* Folded long message: ~12 lines, fading out instead of cutting mid-glyph. */
.ask .b.clip {
  max-height: 20em; overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent 100%);
  mask-image: linear-gradient(180deg, #000 70%, transparent 100%);
}
.ask .qfold {
  font-size: 12px; color: var(--muted); margin-top: 3px;
  padding: 2px 8px; border-radius: 6px;
}
.ask .qfold:hover { color: var(--text); background: var(--surface); }

.step { margin: 10px 0; min-width: 0; }
/* One spacing for every step, deliberately not "more room once this step has
   spoken": a rule that keys off content changes its own layout the instant the
   first token lands, and the whole transcript below it visibly jumps down.
   12px is the same gap the rows inside a step use, so crossing a step boundary
   does not read as an extra blank line -- a turn is one narrative, and the
   model's call count is not something the reader should feel. */
.step + .step { margin-top: 12px; }

/* legacy quiet notice row (halt) */
.act {
  display: flex; align-items: baseline; gap: 7px;
  font-family: var(--mono); font-size: var(--step--1); color: var(--muted);
}
.act .g { color: var(--faint); flex: none; }
.act .arg { color: var(--faint); }

.tog { cursor: pointer; user-select: none; }
/* clicking a fold must not leave a lingering slab behind: the keyboard gets a
   hairline ring, the mouse gets nothing but a colour shift */
.wrow:focus, .think:focus, .tfh:focus { outline: none; }
.wrow:focus-visible, .think:focus-visible, .tfh:focus-visible {
  outline: 1px solid var(--line); outline-offset: 3px;
}

/* thinking: a shimmering one-liner while streaming, a quiet fold after */
.think {
  display: flex; align-items: center; gap: 7px;
  font-size: 13.5px; color: var(--muted);
  padding: 3px 8px; margin: 2px -8px; border-radius: 7px;
}
.think { width: fit-content; max-width: 100%; }
.think .g { color: var(--faint); flex: none; width: 10px; font-size: 11px; }
.think .lb { flex: none; }
.think .tm { color: var(--faint); margin-left: auto; flex: none; font-size: 11px;
  font-variant-numeric: tabular-nums; }
.think.live .lb {
  background: linear-gradient(90deg, var(--muted) 30%, var(--text) 50%, var(--muted) 70%);
  background-size: 200% 100%; -webkit-background-clip: text; background-clip: text;
  color: transparent; animation: shine 1.6s linear infinite;
}
@keyframes shine { to { background-position: -200% 0; } }

/* the opened thought is quiet prose behind a hairline, not a filled card: it is
   the model muttering, and it should not outweigh what it actually said */
.cot {
  font-size: 13px; line-height: 1.75; color: var(--muted);
  border-left: 1px solid var(--line); padding: 2px 0 2px 13px; margin: 4px 0 10px;
  white-space: pre-wrap; max-height: 220px; overflow-y: auto;
}

/* work: one quiet line per call, in the same reading rhythm as the prose
   around it — an icon names the kind of work, the verb and target read as a
   sentence, and everything else (timings, raw output) waits in the detail. */
/* One spacing for everything in a work block -- the summary line, an ask
   exchange beside it, the rows behind it -- declared once on the container.
   Per-child margins had the summary sitting tighter to the first row than the
   rows sat to each other, which reads as a misalignment. */
.wk { margin: 12px 0; min-width: 0; display: grid; gap: 5px; }
.wkin { display: grid; gap: 5px; min-width: 0; }
/* The icon is what this line leads with, so the icon is what sits on the
   transcript's left edge. fit-content keeps a hover or focus state hugging its
   own line instead of growing a full-width bar. */
.wrow {
  display: flex; align-items: center; gap: 7px; color: var(--muted);
  width: fit-content; max-width: 100%;
  font-size: 13.5px; line-height: 1.5; padding: 3px 8px; margin: 0 -8px;
  border-radius: 7px;
}
.wrow.tog:hover .vb, .wrow.tog:hover .ar { color: var(--text); }
.wrow.tog:hover .ic, .wrow.tog:hover .cv { color: var(--muted); }
.wrow .ic { width: 13px; height: 13px; flex: none; color: var(--faint); }
.wrow.run .ic { animation: breathe 1.5s ease-in-out infinite; }
.wrow .g { color: var(--faint); flex: none; width: 12px; font-size: 11px; }
/* the verb is the quiet part; what it acted on is what the eye wants */
.wrow .vb { flex: none; }
.wrow .vb .srv { color: var(--faint); }
.wrow .ar { color: var(--text); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* an empty target would still spend a flex gap, opening a hole after the verb */
.wrow .ar:empty { display: none; }
/* the answer that came back from an ask: the row's payload, so it keeps full
   strength while the question it answers stays quiet */
.wrow.qa .ic { color: var(--amber); }
.wrow.qa .ar { color: var(--muted); }
.wrow .an { flex: none; color: var(--text); }
.wrow .an::before { content: '→'; color: var(--faint); margin-right: 6px; }
/* One caret, one place: every fold in the transcript -- thinking, a call with
   detail, a work summary, a collapsed turn -- ends with the same drawn
   chevron, the last thing on its line, and it turns rather than swaps. The
   rows are fit-content, so the line's own end is the one edge every row
   actually has; icons keep the hard left edge for the kind of work. */
.cv {
  flex: none; width: 11px; height: 11px; color: var(--faint);
  transition: transform .16s ease, color .12s;
}
.open > .cv, .tfold.open > .tfh > .cv { transform: rotate(90deg); }
.cvslot { display: none; }
.wrow .tm { color: var(--faint); flex: none; margin-left: auto; font-size: 11.5px;
  font-variant-numeric: tabular-nums; }
.wrow .chip { flex: none; font-size: 10.5px; padding: 0 6px; border-radius: 8px; line-height: 16px; }
/* diff counts read as plain numbers next to the path, not as a pill */
.wrow .diffn { flex: none; font-family: var(--mono); font-size: 11.5px; }
.wrow .diffn .a { color: var(--moss); }
.wrow .diffn .d { color: var(--clay); }
.chip.bad { color: var(--clay); background: color-mix(in oklab, var(--clay) 12%, transparent); }
.wrow.bad .vb, .wrow.bad .ic, .wrow.bad .g { color: var(--clay); }
.wrow .err { color: var(--clay); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrow.wait .vb, .wrow.wait .ic { color: var(--amber); }

/* detail card: the only place raw commands, paths and output appear. A titled
   card, so the reader knows what they opened before reading the body. */
.dtl {
  margin: 6px 0 10px; background: var(--ink); border: 1px solid var(--line);
  border-radius: 10px; font-family: var(--mono); font-size: 11.5px;
  line-height: 1.7; color: var(--muted); min-width: 0; overflow: hidden;
}
.dtl .dhd {
  display: flex; align-items: center; gap: 9px; padding: 7px 11px; font-size: 11px;
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.dtl .dhd .nm { color: var(--text); min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
/* A path title is a link into the viewer, so it says so on hover rather than
   carrying an underline that would fight the card's own quiet header. */
.dtl .dhd button.nm { font: inherit; text-align: left; }
.dtl .dhd button.nm:hover { color: var(--amber); text-decoration: underline;
  text-underline-offset: 2px; }
.dtl .dhd .ct { flex: none; }
.dtl .dhd .ct .a { color: var(--moss); }
.dtl .dhd .ct .d { color: var(--clay); }
.dtl .dhd .cp { margin-left: auto; width: 22px; height: 22px; }
.dtl .dhd .cp:hover { background: var(--raised); }
.dtl .bd { padding: 9px 11px; max-height: 300px; overflow: auto; }
.dtl pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
.dtl .cmd { color: var(--text); overflow-wrap: anywhere; }
.dtl .cmd::before { content: '$ '; color: var(--faint); }
.dtl .hd { color: var(--faint); font-size: 10.5px; letter-spacing: .04em; margin: 8px 0 3px; }
.dtl .hd:first-child { margin-top: 0; }
.dtl .trunc, .dtl .more { color: var(--faint); font-style: italic; margin-top: 6px; }
.dtl a { color: var(--sky); text-decoration: none; overflow-wrap: anywhere; }
.dtl a:hover { text-decoration: underline; }
.dtl .exit { font-size: 10.5px; padding: 0 6px; border-radius: 8px; }
.dtl .exit.ok { color: var(--moss); background: color-mix(in oklab, var(--moss) 12%, transparent); }
.dtl .exit.bad { color: var(--clay); background: color-mix(in oklab, var(--clay) 12%, transparent); }
.dtl .dline { white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 6px; margin: 0 -6px; }
.dtl .dline.a { background: color-mix(in oklab, var(--moss) 13%, transparent); color: var(--moss); }
.dtl .dline.d { background: color-mix(in oklab, var(--clay) 13%, transparent); color: var(--clay); }
.dtl .dline.gap { color: var(--faint); font-style: italic; }
.dtl .act2 { margin-top: 8px; }
.dtl .act2 button { font: 11px var(--mono); color: var(--sky); padding: 0; }
.dtl .act2 button:hover { text-decoration: underline; }

/* hot-update notice: dist on disk is newer than the loaded page — a quiet
   amber row in the rail foot; reloading is always the reader's click */
.upnote {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 7px 10px; margin-bottom: 6px; border-radius: 8px;
  border: 1px solid var(--line); border-left: 2px solid var(--amber);
  background: var(--surface); font-size: 12px; color: var(--muted);
  cursor: pointer; text-align: left;
}
.upnote:hover { color: var(--text); border-color: var(--faint); }
.upnote .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--amber);
  flex: none; animation: breathe 1.4s ease-in-out infinite; }
.upnote .t { flex: 1; min-width: 0; }
.upnote .rl { color: var(--amber); font-weight: 600; flex: none; }

/* upgrade shade: the server is being replaced under us, so the page holds
   still and reports what it is waiting for until serve answers again */
.upshade {
  position: fixed; inset: 0; z-index: 90; display: grid; place-items: center;
  background: color-mix(in oklab, var(--ink) 72%, transparent); backdrop-filter: blur(3px);
}
/* `upcard`, not `card`: the rail's .card is a three-column grid and would lay
   this dialog out sideways */
.upshade .upcard {
  display: block; width: min(420px, calc(100vw - 48px)); background: var(--ink);
  border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px;
  box-shadow: var(--shadow);
}
.upshade .hd { display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--text); }
.upshade .hd .t { flex: 1; min-width: 0; }
.upshade .hd .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--amber);
  flex: none; animation: breathe 1.4s ease-in-out infinite; }
.upshade .sub { margin-top: 8px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.upshade .cmd {
  margin-top: 10px; display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 11.5px; color: var(--text);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
}
.upshade .cmd code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.upshade .cmd button { color: var(--faint); font: inherit; background: none; border: 0; cursor: pointer; }
.upshade .cmd button:hover { color: var(--text); }
.upshade .foot { display: flex; justify-content: flex-end; margin-top: 14px; }

/* turn fold: once the answer lands, everything that led to it collapses to a
   single line, and a hairline separates that line from the answer below */
.tfold { margin: 14px 0 12px; }
.tfold + .answer { margin-top: 0; }
/* One hard left edge for the transcript: whatever a line leads with — an icon,
   a chevron, or its own first word — starts on that edge. Its rows sit right
   underneath, so the gap stays small enough to read as one block. */
.tfh {
  display: flex; align-items: center; gap: 7px; width: fit-content; max-width: 100%;
  text-align: left; color: var(--faint); font-size: 13px;
  padding: 3px 8px; margin: 0 -8px 6px;
  border: 0; border-radius: 7px; background: none; cursor: pointer;
}
.tfb > .step:first-child { margin-top: 0; }
.tfb .step > .wk { margin-top: 0; }
.tfh:hover .cv { color: var(--muted); }
.tfold::after { content: ''; display: block; height: 1px; background: var(--line); }
.tfb[hidden] { display: none; }
.tfb { margin-bottom: 12px; }

/* One type for every line that stands in for finished work -- "thought",
   "done", a stretch summary. They had drifted to 13 / 13.5px in two different
   greys, which made three lines of the same kind read as three kinds of thing.
   Declared together so they cannot drift again. */
.think, .tfh, .wrow.sum { font-size: 13px; color: var(--muted); }
.think .tm, .tfh .tm, .wrow.sum .tm { color: var(--faint); }
/* An empty clock still spends its flex gap, which pushed the caret one whole
   gap further from the label on every line whose time happened to be blank --
   two folds side by side then looked like two different components. */
.think .tm:empty, .tfh .tm:empty, .wrow .tm:empty { display: none; }
.think:hover, .tfh:hover, .wrow.sum:hover { color: var(--text); }
/* the phrase is a summary of the rows underneath, not a target of its own */
.wrow.sum .ar { color: var(--muted); }
.wrow.sum:hover .ar { color: var(--text); }

/* the turn is never silent: a breathing dot fills the gap before events */
.status { display: flex; align-items: center; gap: 9px; font-family: var(--mono);
  font-size: 12px; color: var(--muted); margin: 14px 0; }
.status .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--amber);
  animation: breathe 1.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .25; transform: scale(.8); } }

/* attachments above the ask bubble — an image shows itself, a file shows its
   name, and a set too big to lay out flat shows one of itself plus a count */
.abox {
  display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: flex-end;
  gap: 6px; max-width: 78%;
}
.abox + .b { margin-top: 7px; }
.abox .shot {
  display: block; max-width: min(280px, 100%); max-height: 200px; width: auto; height: auto;
  border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in;
}
/* several images are squared off to one size: the row reads as one set, and a
   portrait next to a landscape stops dictating the height of the whole row */
.abox.set .shot { width: 84px; height: 84px; object-fit: cover; border-radius: 12px; }
.abox .shot:hover { border-color: var(--faint); }

/* the collapsed pile: the top image, two card edges peeking out behind it, and
   how many there are. Space for the edges is reserved by margin so the pile
   never overlaps the bubble beside it. */
.pile {
  position: relative; isolation: isolate; padding: 0; border: 0; background: none;
  line-height: 0; cursor: pointer; margin: 0 7px 7px 0;
}
.pile::before, .pile::after {
  content: ''; position: absolute; inset: 0; z-index: -1;
  border-radius: 12px; border: 1px solid var(--line); background: var(--raised);
}
.pile::before { transform: translate(4px, 4px); }
.pile::after { transform: translate(8px, 8px); }
.pile .shot { cursor: pointer; }
.pile:hover .shot { border-color: var(--faint); }
/* top-right, not bottom-right: the stack edges peek out of the bottom corner,
   and a count sitting on top of them read as one smudge */
.pile .cnt {
  position: absolute; right: 5px; top: 5px; min-width: 21px; height: 18px; padding: 0 5px;
  display: flex; align-items: center; justify-content: center; border-radius: 9px;
  background: color-mix(in oklab, var(--ink) 76%, transparent); color: #fff;
  font-family: var(--mono); font-size: 11px; line-height: 1;
}
.pile .cnt::before { content: '\00d7'; margin-right: 1px; opacity: .7; }

/* one way to look at an image, wherever it was clicked from */
.lightbox {
  position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; padding: 32px;
  background: color-mix(in oklab, var(--ink) 82%, transparent); backdrop-filter: blur(4px);
  cursor: zoom-out; border: 0;
}
.lightbox img {
  max-width: 100%; max-height: 100%; width: auto; height: auto;
  border-radius: 12px; box-shadow: var(--shadow);
}
.achip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 240px;
  background: var(--ink); border: 1px solid var(--line); border-radius: 8px;
  padding: 3px 10px; font-size: 12px; color: var(--muted); cursor: pointer;
}
.achip:hover { border-color: var(--faint); color: var(--text); }
.achip .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* the file equivalent of the pile: one chip with an edge behind it */
.achip.more { position: relative; isolation: isolate; margin: 0 4px 4px 0; }
.achip.more::after {
  content: ''; position: absolute; inset: 0; z-index: -1;
  border-radius: 8px; border: 1px solid var(--line); background: var(--raised);
  transform: translate(4px, 4px);
}

/* back-to-bottom pill, shown only while the reader is scrolled up */
/* --lift is the measured height of everything docked at the bottom (composer,
   queued rows, a clarify sheet). A constant here would be wrong the moment the
   composer grows a line, which is exactly when the pill matters. */
.backpill {
  position: absolute; left: 50%; bottom: calc(var(--lift, 96px) + 12px);
  transform: translateX(-50%); transition: bottom .18s ease;
  width: 32px; height: 32px; display: grid; place-items: center; padding: 0;
  background: var(--ink); color: var(--muted); border: 1px solid var(--line);
  border-radius: 50%; z-index: 5;
  box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 18px -8px rgba(0,0,0,.25);
}
.backpill:hover { color: var(--text); border-color: var(--faint); }
.backpill svg {
  width: 15px; height: 15px; fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}
.backpill[hidden] { display: none; }

/* mid-turn narration is speech, not metadata: it reads at full strength, like
   the reference transcripts do — only the answer footer marks the final say */
.say { margin: 12px 0 2px; }
.cot { overflow-wrap: anywhere; }

.answer { margin-top: 20px; position: relative; }
.acts { display: flex; align-items: center; gap: 1px; margin-top: 8px; }
.acts button {
  position: relative; width: 27px; height: 27px; display: grid; place-items: center;
  color: var(--faint); border: 0; border-radius: 7px; padding: 0;
  transition: color .12s, background .12s;
}
.acts button:hover { color: var(--text); background: var(--surface); }
.acts button svg {
  width: 15px; height: 15px; fill: none; stroke: currentColor;
  stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
}
/* The footer belongs to the message the pointer is on, not to the page: at rest
   a turn is just what was said, and the actions and the time arrive when they
   can be used. The row keeps its space either way, so nothing shifts on hover
   -- and focus reveals it too, since a keyboard has no pointer to hover with. */
.answer .acts, .answer .turnmeta, .ask .acts, .ask .turnmeta {
  opacity: 0; transition: opacity .12s;
}
.answer:hover .acts, .answer:hover .turnmeta, .ask:hover .acts, .ask:hover .turnmeta,
.answer:focus-within .acts, .answer:focus-within .turnmeta,
.ask:focus-within .acts, .ask:focus-within .turnmeta { opacity: 1; }
/* Any control can carry its label in a hover pill instead of on the row:
   set data-tip and the row stays icons only. .tipdn flips the pill below,
   for controls docked against the top of the window. */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip); position: absolute; bottom: calc(100% + 5px); left: 50%;
  transform: translateX(-50%); background: var(--text); color: var(--ink);
  font: 400 11px/1.4 var(--sans); letter-spacing: 0; padding: 3px 7px; border-radius: 6px;
  white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s;
  z-index: 60;
}
[data-tip]:hover::after { opacity: 1; }
[data-tip].tipdn::after { bottom: auto; top: calc(100% + 5px); }

/* The shared icon button: a quiet square that shows its verb on hover. */
.icb {
  position: relative; width: 24px; height: 24px; flex: none;
  display: inline-grid; place-items: center; padding: 0; border-radius: 6px;
  color: var(--faint); transition: color .12s, background .12s;
}
.icb:hover { color: var(--text); background: var(--surface); }
.icb:disabled { opacity: .4; cursor: default; }
.icb svg {
  width: 14px; height: 14px; fill: none; stroke: currentColor;
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
}

.errline {
  display: flex; align-items: center; gap: 9px; margin: 16px 0;
  border: 1px solid var(--line); border-left: 2px solid var(--clay);
  border-radius: 0 8px 8px 0; background: var(--surface); padding: 9px 13px; font-size: 12.5px;
}
.errline .m { flex: 1; color: var(--muted); }
.errline b { color: var(--clay); font-family: var(--mono); font-size: 11.5px; }


/* prose */
/* break-word, not anywhere: an unbroken token longer than the line (a URL, a
   hash) wraps instead of pushing the column sideways, while normal words
   still break only at their own boundaries. */
.prose { line-height: 1.72; overflow-wrap: break-word; }
.prose > :first-child { margin-top: 0; }
.prose h2 {
  font-family: var(--mono); font-size: var(--step-1); font-weight: 600;
  letter-spacing: -.02em; margin: 26px 0 10px; text-wrap: balance;
}
.prose h3 { font-size: var(--step-0); margin: 20px 0 6px; color: var(--text); }
.prose p { margin: 10px 0; }
.prose .brk { height: 14px; }
.prose ul, .prose ol { margin: 10px 0; padding-left: 18px; }
/* A list is a column of rows, not prose: at the paragraph reading measure an
   item that is one code chip floats in a line box half again its own height,
   and the stack of chips then reads as a row of buttons. */
.prose li { margin: 2px 0; line-height: 1.5; }
.prose li code { padding: 0 4px; }
/* A nested level belongs to its parent item, not to the section, so it sits
   tighter than a top-level list. */
.prose li > ul, .prose li > ol { margin: 3px 0 1px; padding-left: 16px; }
.prose li::marker { color: var(--faint); }
.prose ol > li::marker { font-variant-numeric: tabular-nums; }
/* A checklist carries its state in the marker; the answer is already written,
   so nothing here is a control. */
.prose li.tk { list-style: none; }
.prose li.tk::before { content: '○'; color: var(--faint); margin-right: 7px; }
.prose li.tk.on::before { content: '✓'; color: var(--moss); }
.prose del { color: var(--faint); }
/* quoted lines keep the muted voice and a hairline, same family as .cot */
.prose blockquote {
  margin: 10px 0; padding: 2px 0 2px 13px; color: var(--muted);
  border-left: 2px solid var(--line);
}
.prose strong { color: var(--text); font-weight: 650; }
.prose code {
  font-family: var(--mono); font-size: 12.5px; background: var(--raised);
  padding: 1px 5px; border-radius: 4px;
}
/* Code is content, not a caption: it reads at text weight on a filled block,
   with no outline competing with the prose rules around it. */
.prose pre {
  font-family: var(--mono); font-size: 12.5px; line-height: 1.75; margin: 14px 0;
  background: var(--raised); border-radius: 10px; color: var(--text);
  padding: 12px 15px; overflow-x: auto; tab-size: 2;
}
/* The margin lives on the wrapper so the button can be positioned against the
   block itself: with it on the <pre> the margin collapses through and every
   offset here is measured from the wrong edge -- which is what put the button
   below the middle of a one-line block. */
.cblk { position: relative; margin: 14px 0; }
.cblk > pre { margin: 0; padding-right: 46px; }
/* A fence that names its language is a listing: it gets a header to name it,
   and the button moves into that header so it never sits over the code. A bare
   fence is usually one command or a line of output -- no header, and the button
   stays out of the way until the pointer is on the block. */
.cblk.lang { background: var(--raised); border-radius: 10px; overflow: hidden; }
.cblk.lang > pre { background: none; border-radius: 0; padding: 11px 15px 13px; }
/* The header is a tone shift inside the same box, not a ruled bar: the label
   strip reads as part of the block, with the seam carried by the colour step
   alone. */
.cbhd {
  display: flex; align-items: center; justify-content: space-between;
  height: 31px; padding: 0 5px 0 15px;
  background: color-mix(in oklab, var(--text) 4%, transparent);
}
.cblang { font-size: 11.5px; color: var(--muted); letter-spacing: .01em; }
/* Borderless, icon-only, square: a bordered pill with a word in it reads as a
   form control dropped onto the code. Always drawn, never revealed on hover --
   a button that exists only while the pointer is already inside the block is a
   button nobody finds. */
.cbcp {
  position: absolute; top: 6px; right: 6px; width: 26px; height: 26px;
  display: grid; place-items: center; border: 0; border-radius: 7px;
  color: var(--faint); background: none;
  transition: color .12s, background .12s;
}
.cbhd .cbcp { position: static; }
.cbcp:hover { color: var(--text); background: color-mix(in oklab, var(--ink) 55%, transparent); }
.cbcp .ck { display: none; }
.cbcp.ok { opacity: 1; color: var(--moss); background: none; }
.cbcp.ok .ic { display: none; }
.cbcp.ok .ck { display: block; }
/* A path is a destination, and it has to say so at a glance: an underline on the
   same grey ground every other inline value uses reads as more code, so the
   openable ones get their own tinted ground, an outline, and a file glyph. */
.prose code.pth {
  cursor: pointer; color: var(--amber); background: var(--amber-dp);
  border: 1px solid color-mix(in oklab, var(--amber) 28%, transparent);
  border-radius: 6px; padding: 0 6px 0 5px; text-decoration: none;
  transition: background .12s, border-color .12s;
}
.prose code.pth::before {
  content: ""; display: inline-block; width: 10px; height: 11px;
  margin-right: 4px; vertical-align: -1px; background: currentColor;
  -webkit-mask: var(--pthico) center / contain no-repeat;
  mask: var(--pthico) center / contain no-repeat;
}
:root {
  --pthico: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.2"><path d="M7 2.5h7L19 8v13.5H5V2.5z"/><path d="M13.5 2.5V8H19"/></svg>');
}
.prose code.pth:hover {
  background: color-mix(in oklab, var(--amber) 26%, var(--amber-dp));
  border-color: color-mix(in oklab, var(--amber) 55%, transparent);
}
.prose code.pth:focus-visible { outline: 1px solid var(--amber); outline-offset: 1px; }
/* Web links are blue -- the one colour every reader already parses as "goes
   somewhere else". Amber stays on workspace paths, which open in-app. */
.prose a {
  color: var(--link); text-decoration: underline;
  text-decoration-thickness: 1px; text-underline-offset: 2.5px;
  text-decoration-color: color-mix(in oklab, var(--link) 45%, transparent);
}
.prose a:hover { text-decoration-color: var(--link); }
.tw { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line-soft); border-radius: 9px; }
.prose table { border-collapse: collapse; width: 100%; font-size: 13px; }
.prose th, .prose td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line-soft); }
.prose th {
  font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--faint); background: var(--surface); white-space: nowrap;
}
/* An identifier is quoted, not styled: the header row is already mono and
   uppercased for emphasis, and both of those are wrong for code -- uppercasing
   renames `run_subagent_dag`, and a filled chip inside the tinted header reads
   as a stray box. In the header, code sheds the chip and keeps its own case. */
.prose th code {
  background: none; padding: 0; font-size: inherit;
  text-transform: none; letter-spacing: 0; color: var(--muted);
}
/* Same reasoning inside a heading: a 12.5px filled box under a 17px mono
   heading sits below its cap line and reads as debris. */
.prose h2 code, .prose h3 code { background: none; padding: 0; font-size: inherit; }
.prose tr:last-child td { border-bottom: 0; }
/* First column carries the row's subject, so it leads -- but it wraps: models
   routinely put a whole sentence there, and nowrap turned a table that fitted
   into one that scrolls sideways. */
.prose td:first-child { font-weight: 600; }
/* In a data cell the chip is the only thing marking the value as code, so it
   stays -- just tight enough that a lone identifier sits on the same line as
   the plain text in the cell beside it. */
.prose td code { font-size: 12px; padding: 0 4px; }

.caret { display: inline-block; width: 7px; height: 14px; background: var(--amber);
  vertical-align: -2px; animation: bl 1.1s steps(2, end) infinite; }
@keyframes bl { 50% { opacity: 0; } }
.spin { display: inline-block; animation: sp 1.1s linear infinite; color: var(--amber); }
@keyframes sp { to { transform: rotate(360deg); } }
/* backwards, not both: a forwards-filled transform animation stays in effect
   forever, which makes every arrived block a permanent stacking context and
   traps its hover pills (z-index 60) under the composer glass. */
.in { animation: up .22s ease backwards; }
@keyframes up { from { opacity: 0; transform: translateY(3px); } }

/* Panels arrive from their own edge: opacity plus a short slide, never the grid
   track (see the note above .split).
   Opening only, and deliberately. An exit animation needs the element to outlive
   the state flip, which means holding that flip on a timer -- and a throttled tab
   stretches a 170ms hold into seconds, leaving a panel that was told to close
   sitting there at zero opacity. Measured: 2000ms, panel still open. A close that
   can strand the UI is worse than a close with no animation, and closing is also
   the direction nobody is waiting to look at. */
@keyframes paneInL { from { opacity: 0; transform: translateX(-14px); } }
@keyframes paneInR { from { opacity: 0; transform: translateX(14px); } }
.rail { animation: paneInL .19s ease backwards; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  .scroll { scroll-behavior: auto; }
}
:root[data-motion="off"] * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
:root[data-motion="off"] .scroll { scroll-behavior: auto; }
/* The code-font picker offers what a developer machine tends to have; a face
   that is not installed falls through the stack, same as any font menu. */
:root[data-font="jet"] { --mono: "JetBrains Mono", "SFMono-Regular", ui-monospace, monospace; }
:root[data-font="sf"] { --mono: "SF Mono", "SFMono-Regular", ui-monospace, monospace; }

/* ── composer ──────────────────────────────────────────────────────── */
/* A frosted card floating over the transcript, not a bar the page ends at.
   The transcript scrolls underneath and stays legible through the glass --
   that ghosting IS the transition, which is why the old fade band above the
   composer is gone. Only the card takes pointer events; the gutter around it
   still belongs to the page. */
.dock { position: absolute; left: 0; right: 0; bottom: 5px; padding: 0 22px;
  z-index: 5; pointer-events: none; }
/* Below the card, not inside it: a legal-ish caption printed on the glass
   would read as part of the reader's own draft.

   It also carries the strip's ground. The glass hides what scrolls behind the
   card, but the band under it was see-through, so the transcript's next line
   surfaced beside the caption. Full-bleed past the dock's side padding and down
   to the window edge, and opaque from its own top edge -- a fade there is a
   window the transcript shows through, however short. It starts above the
   card's bottom instead, where the card itself is what covers the seam. */
.ainote {
  text-align: center; font-size: 10px; color: var(--faint); letter-spacing: .02em;
  margin: -12px -22px -5px; padding: 26px 22px 7px; position: relative; z-index: -1;
  background: var(--ink);
}
.dock-in { max-width: var(--col); margin: 0 auto; position: relative; pointer-events: auto;
  /* Slightly denser at the top: the glass reads as a material with a light
     source, not a flat translucent rect. The inset white line is the rim
     catching that light -- it is what sells the pane as glass in dark mode
     and disappears harmlessly into the light theme. */
  --rim: inset 0 1px 0 color-mix(in oklab, #fff 9%, transparent);
  background: linear-gradient(
    color-mix(in oklab, var(--ink) 76%, transparent),
    color-mix(in oklab, var(--ink) 60%, transparent));
  -webkit-backdrop-filter: blur(26px) saturate(1.5);
  backdrop-filter: blur(26px) saturate(1.5);
  /* No drawn outline: a 1px line is what makes a floating thing look pasted
     on. The edge is only where the glass stops blurring, held by shadow and
     the rim light; the near-invisible border is just an anti-fringe seam. */
  border: 1px solid color-mix(in oklab, var(--line) 40%, transparent);
  border-radius: 18px;
  padding: 12px 14px; transition: border-color .15s;
  box-shadow: var(--rim), 0 1px 2px rgba(0, 0, 0, .05), 0 6px 16px -8px rgba(0, 0, 0, .1),
    0 12px 32px -14px rgba(0, 0, 0, .18), 0 32px 72px -26px rgba(0, 0, 0, .28);
}
/* Drag-over highlight moved up from the field: the card is the drop target
   the reader sees. */
.dock-in:has(.field.drop) { border-color: var(--amber); }

/* One appearance for the whole turn: the wave and the clock never change, only
   the word does (starting / writing / working). Dimming the row and slowing the
   wave on the way to "working" made a state the reader is not meant to act on
   look like an event -- the clock beside it is what proves the stream is alive,
   and the word is what says which kind of alive.

   It rides the tail of the transcript, so it sits where the answer's own footer
   will sit once the turn lands -- same column, same size -- and the one reads as
   the other settling. */
.turnlive {
  display: flex; align-items: center; gap: 8px; margin: 9px 0 2px;
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.turnlive .wave { display: flex; align-items: flex-end; gap: 2px; height: 9px; }
.turnlive .wave i {
  width: 2px; height: 9px; border-radius: 1px; background: var(--amber);
  transform-origin: bottom; animation: wave 1.05s ease-in-out infinite;
}
.turnlive .wave i:nth-child(2) { animation-delay: .16s; }
.turnlive .wave i:nth-child(3) { animation-delay: .32s; }
@keyframes wave { 0%, 100% { transform: scaleY(.34); } 50% { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) {
  .turnlive .wave i { animation: none; transform: scaleY(.6); }
}

.queued { margin-bottom: 9px; display: grid; gap: 3px; }
.qrow {
  display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px;
  color: var(--muted); border-left: 2px solid var(--faint); padding: 2px 0 2px 9px;
}
.qrow .v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qrow input { flex: 1; min-width: 0; background: var(--ink); border: 1px solid var(--muted);
  border-radius: 5px; padding: 2px 6px; outline: 0; font-family: var(--mono); font-size: 12px; }
.qrow .icb { width: 22px; height: 22px; }

/* Bare inside the card: the frosted card carries the outline, so a second
   border here would read as a box in a box. */
.field {
  display: flex; align-items: flex-end; gap: 8px;
  border: 0; border-radius: 0; background: none; box-shadow: none;
  padding: 4px 8px 0;
}
.field .c { font-family: var(--mono); color: var(--amber); padding-bottom: 3px; }
/* The ceiling is viewport-relative on purpose: a fixed 168px eats a third of a
   short window, and what it eats is the tail of the transcript the reader is
   writing about. This is the single source for the cap -- taFit() reads it back
   rather than repeating the number. */
/* Two lines at rest: an input that opens at one cramped line undersells
   itself as the main act of the page. */
textarea {
  flex: 1; resize: none; border: 0; outline: 0; background: none;
  min-height: 46px; max-height: min(200px, 24vh); padding: 2px 0; line-height: 1.6;
}
textarea::placeholder { color: var(--faint); }
/* WebKit paints its own focus ring on text controls; ours is the container
   border, so suppress it where we already show focus. */
textarea:focus, textarea:focus-visible,
.field input:focus, .field input:focus-visible,
.csheet input:focus, .csheet input:focus-visible,
.mpick input:focus, .mpick input:focus-visible { outline: none; box-shadow: none; }

/* attachments staged above the composer */
.atts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.att {
  display: inline-flex; align-items: center; gap: 7px; max-width: 260px;
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: 8px;
  padding: 4px 6px 4px 9px; font-size: 12px; color: var(--muted);
}
.att .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att .sz { font-family: var(--mono); font-size: 10.5px; color: var(--faint); flex: none; }
.att .rm { color: var(--faint); padding: 2px 4px; border-radius: 5px; line-height: 1; flex: none; }
.att .rm:hover { color: var(--clay); background: var(--raised); }
.att.up { opacity: .55; }
/* a staged image is shown, not named: the thumbnail IS the chip, with the
   remove button floating over its corner. Every thumbnail is the same square
   whatever the image's shape — a row of staged files should read as a row of
   equal tiles, so the crop happens inside the tile. */
.att.img { position: relative; padding: 0; border: 0; background: none; width: 64px; height: 64px; }
.att.img img { display: block; width: 100%; height: 100%; object-fit: cover;
  border-radius: 8px; border: 1px solid var(--line-soft); cursor: zoom-in; }
.att.img img:hover { border-color: var(--faint); }
.att.img .rm {
  position: absolute; top: 3px; right: 3px; padding: 1px 4px; border-radius: 6px;
  background: color-mix(in oklab, var(--ink) 72%, transparent); color: var(--text);
  opacity: 0; transition: opacity .12s;
}
.att.img:hover .rm, .att.img .rm:focus-visible { opacity: 1; }
.ansfoot { display: flex; align-items: center; gap: 8px; margin-top: 6px; margin-left: -5px; flex-wrap: wrap; }
.ansfoot .acts { margin-top: 0; }
/* Mirrored against the right edge the bubble is aligned to. */
.ask > .ansfoot { flex-direction: row-reverse; margin-left: 0; margin-right: -5px; }
.turnmeta { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.field.drop { border-color: var(--amber); background: color-mix(in oklab, var(--amber) 6%, var(--ink)); }
.tool-btn {
  flex: none; color: var(--faint); padding: 5px; border-radius: 7px; line-height: 1;
  opacity: .7; transition: opacity .15s, color .15s;
}
.dock-in:focus-within .tool-btn, .tool-btn:hover { opacity: 1; }
.tool-btn:hover { color: var(--text); background: var(--raised); }
.go {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  background: var(--text); color: var(--ink); display: grid; place-items: center;
  transition: opacity .15s, background .15s;
}
.go:disabled { opacity: .22; cursor: default; }
.go.halt { background: var(--clay); color: #fff; }

/* wraps instead of pushing the usage line past the edge on a narrow window */
.under { display: flex; align-items: center; gap: 8px 10px; margin-top: 10px; padding: 0 4px 1px 6px; flex-wrap: wrap; }
.tries { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.try {
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px;
  font-size: 12.5px; color: var(--muted); background: var(--ink); box-shadow: var(--elev);
  transition: color .14s ease, border-color .14s ease, transform .14s ease, box-shadow .14s ease;
}
.try:hover { color: var(--text); border-color: var(--faint); transform: translateY(-1px); box-shadow: var(--elev-up); }
@media (prefers-reduced-motion: reduce) { .try, .try:hover { transform: none; transition: none; } }
.try:hover { border-color: var(--faint); color: var(--text); }
.meter { font-family: var(--mono); font-size: 11px; color: var(--faint);
  font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: auto;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* capability popover above the composer */
/* model picker: provider column + model column, fixed height so a provider
   with 100+ models cannot grow the popover past the window */
.mpick {
  position: fixed; z-index: 46; width: 520px; max-width: calc(100% - 32px);
  background: var(--ink); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 16px 40px #00000024; overflow: hidden;
  display: grid; grid-template-rows: auto 262px auto; animation: up .16s ease both;
}
.mpick .find { display: flex; align-items: center; gap: 8px; padding: 9px 12px;
  border-bottom: 1px solid var(--line-soft); }
.mpick .find input { flex: 1; min-width: 0; border: 0; outline: 0; background: none;
  font: inherit; font-size: 13px; color: var(--text); }
.mpick .cols { display: grid; grid-template-columns: 168px 1fr; min-height: 0; }
.mpick .provs { border-right: 1px solid var(--line-soft); overflow-y: auto; padding: 6px; }
.mpick .models { overflow-y: auto; padding: 6px; }
.mpick .row {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  padding: 7px 9px; border-radius: 7px; font-size: 13px; color: var(--text);
}
.mpick .row:hover { background: var(--surface); }
.mpick .provs .row.dim { opacity: .35; }
.mpick .provs .row.dim:hover { background: none; }
.mpick .row[aria-selected="true"] { background: var(--raised); }
.mpick .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mpick .row .ct { font-family: var(--mono); font-size: 10.5px; color: var(--faint); flex: none; }
.mpick .row .tick { color: var(--amber); flex: none; }
.mpick .models .row { font-family: var(--mono); font-size: 12px; }
.mpick .models .row .sub { font-size: 10.5px; color: var(--faint); }
.mpick .empty { padding: 18px 12px; font-size: 12.5px; color: var(--faint); text-align: center; }
.mpick .foot { border-top: 1px solid var(--line-soft); padding: 7px 12px;
  display: flex; justify-content: space-between; align-items: center; }
.mpick .foot button { font-size: 11.5px; color: var(--amber); }
.mpick .foot button:hover { text-decoration: underline; }
.mpick .foot .hint { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

.pop {
  position: absolute; bottom: calc(100% + 8px); right: 0; width: 296px; z-index: 15;
  background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
  box-shadow: var(--shadow); padding: 6px; display: none;
}
.pop[data-open="true"] { display: block; animation: up .16s ease both; }
.pop.slash { left: 0; right: auto; width: 320px; }
.pop .hd { display: flex; align-items: center; padding: 6px 8px 8px; }
.srow {
  display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
  padding: 7px 9px; border-radius: 7px; font-size: 13.5px;
}
.srow[aria-selected="true"] { background: var(--raised); }
.srow .cmd { font-family: var(--mono); color: var(--text); font-weight: 600; flex: none; }
.srow .d { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop .hd .lab { flex: 1; }
.pop .hd button { font-size: 11.5px; color: var(--amber); }
.pop .hd button:hover { text-decoration: underline; }
.prow {
  display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 7px;
  font-size: 13px; width: 100%; text-align: left;
}
.prow:hover { background: var(--raised); }
.prow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .st { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

/* ── workspace ─────────────────────────────────────────────────────
   The right half is not a log, it is the thing being worked on: the page
   the agent is driving, the file it is writing, the files it produced. */
/* No transition on grid-template-columns: it interpolates track sizes, which
   freezes at the start frame whenever the tab is throttled -- the panel then
   reads as "open but zero wide". The panel fades in instead. */
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 0; }
/* The panel track is the dragged width; the chat keeps a floor so a bare `1fr`
   cannot collapse to zero. The drag clamps against that same floor, so the two
   never fight. */
.split[data-open="true"] { grid-template-columns: minmax(var(--chat-min), 1fr) var(--wsw); }
/* Too narrow to split: the workspace takes over, chat is one tap away.
   ONE track, not `0 1fr` -- display:none removes the chat from the grid, so
   with two tracks the workspace fell into the 0px one and rendered 1px wide. */
@media (max-width: 1040px) {
  .split[data-open="true"] { grid-template-columns: 1fr; }
  .split[data-open="true"] .chat { display: none; }
  /* The hidden chat column takes the header that clears the traffic lights with
     it, so with the rail also collapsed the panel's own header inherits the
     band -- otherwise its first tab lands under the close button. */
  :root[data-shell="1"][data-rail="off"] .split[data-open="true"] .ws-top {
    padding-left: var(--tl-pad, 78px);
  }
}
.chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
/* New-task state: no header title, the composer holds the centre line. */
.chat[data-fresh] #title, .chat[data-fresh] #renameBtn { visibility: hidden; }
/* Below the true centre: the lockup owns the upper field, the composer
   answers it from just under the fold. */
.chat[data-fresh] .dock { bottom: 35%; transform: translateY(50%); }
/* The composer's box is what the crew perches on, so it has to be the
   containing block for them, and it must not clip what hangs over its edge. */
.chat[data-fresh] .dock-in { overflow: visible; }
.dock { container-type: inline-size; container-name: dock; }
/* Hero proportions: a 744px two-row box reads wide and flat against a small

  video: 'M4.5 6.5h10v11h-10zM14.5 11l5-3v8l-5-3',
  ask: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17ZM9.8 9.6a2.2 2.2 0 1 1 3.4 1.9c-.8.5-1.2 1-1.2 2M12 16.6h.01',
  bad: 'M12 4.5 20.5 19H3.5L12 4.5ZM12 10v3.6M12 16.4h.01',
  dot: 'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17ZM8.5 12h7',
  chev: 'M9.5 6.5 15 12l-5.5 5.5',
  check: 'M5 12.5l4.5 4.5L19 7',
};
/* Every fold in the transcript turns the same chevron. */
const chev = () => ico(ACT_ICO.chev, 'cv');
function actIco(name) {
  switch (name) {
    case 'read_file': case 'read_skill': return ACT_ICO.doc;
    case 'write_file': case 'edit_file': return ACT_ICO.pen;
    case 'list_dir': return ACT_ICO.folder;
    case 'grep': case 'find': case 'tool_search': return ACT_ICO.find;
    case 'exec': return ACT_ICO.term;
    case 'web_search': case 'web_fetch': case 'deep_research': return ACT_ICO.globe;
    case 'understand_media': return ACT_ICO.doc;
    case 'image_generate': return ACT_ICO.image;
    case 'video_generate': return ACT_ICO.video;
    case 'text_to_speech': return ACT_ICO.sound;
    case 'message': return ACT_ICO.chat;
    case 'cron': return ACT_ICO.clock;
    case 'spawn': case 'use_skill': return ACT_ICO.star;
    case 'ask_user': return ACT_ICO.ask;
    default: return ACT_ICO.dot;
  }
}

/* One-line label for a call, derived from its arguments. The row carries a
   short label only; raw arguments live in the detail block. */
function actLabel(name, a, display) {
  if (display) return String(display);
  switch (name) {
    case 'read_file': case 'write_file': case 'edit_file':
      return wsShortPath(a.path || '');
    case 'list_dir': return a.path ? wsShortPath(a.path) + '/' : '';
    case 'grep': return String(a.pattern || '') + (a.glob ? '  ' + a.glob : '');
    case 'find': return String(a.pattern || '');
    case 'exec': return String(a.intent || a.command || '');
    case 'web_search': case 'deep_research': case 'tool_search':
      return a.query ? '“' + String(a.query) + '”' : '';
    case 'web_fetch': return String(a.url || '').replace(/^https?:\/\//, '');
    case 'understand_media': {
      const ps = Array.isArray(a.paths) ? a.paths.map((p) => String(p).split('/').pop()) : [];
      return ps.length > 2 ? `${ps[0]} ×${ps.length}` : ps.join(' ');
    }
    case 'spawn': return String(a.label || String(a.task || '').split('\n')[0]);
    case 'message': return a.channel ? '→ ' + String(a.channel) : String(a.content || '').split('\n')[0];
    case 'cron': return [a.action, a.cron_expr, a.every_seconds ? `${a.every_seconds}s` : '',
      String(a.message || '').split('\n')[0]].filter(Boolean).join(' · ');
    case 'use_skill': case 'read_skill': return String(a.skill_id || '');
    case 'image_generate': case 'video_generate': return String(a.prompt || '').split('\n')[0];
    case 'text_to_speech': return String(a.text || '').split('\n')[0];
    default: {
      const v = Object.values(a || {}).find((x) => typeof x === 'string' && x.trim());
      return v ? String(v) : '';
    }
  }
}

/* The line shown on a failed row: the first error-shaped line if there is
   one, else the first non-empty line. */
const firstErrLine = (res) => {
  const lines = String(res || '').split('\n').filter((x) => x.trim());
  const hit = lines.find((x) => /error|failed|traceback|could not|denied|exception/i.test(x));
  const l = hit || lines[0];
  return l ? shortArg(l.replace(/^\s*\[|\]\s*$/g, ''), 62) : '';
};

function newStep() {
  const step = mk('div', 'step in');

  /* thinking: the thought streams in the open, the way the answer does, and
     folds to a quiet "thought · Ns" once work or prose takes over. Showing
     only its last line while it ran made the live thought read as one more
     tool row -- and the one thing a reader wants from a thought in flight is
     to be able to read it. */
  const row = mk('div', 'think tog');
  const lb = mk('span', 'lb', T('gui.think.label'));
  const ttm = mk('span', 'tm');
  row.append(lb, ttm, chev());
  row.hidden = true;
  const cot = mk('div', 'cot'); cot.hidden = true;
  let on = false;
  /* Once the reader works the fold themselves, the stream stops driving it. */
  let pinned = false;
  const set = (v) => { on = v; row.classList.toggle('open', on); cot.hidden = !on; };
  const flip = () => pinRow(row, () => { pinned = true; set(!on); });
  row.onclick = flip;
  row.tabIndex = 0;
  row.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };

  const say = mk('div', 'say prose');
  const wk = mk('div', 'wk');
  const wksum = mk('div', 'wrow tog'); wksum.hidden = true;
  const wkin = mk('div', 'wkin'); wkin.hidden = true;
  wk.append(wksum, wkin);
  step.append(row, cot, say, wk);
  stageBox().appendChild(step);

  /* The rows stay collapsed behind the summary from the first call onward, and
     the reader's own click outranks the stream from then on -- same rule as the
     thought above. */
  let wkPinned = false;
  const setWk = wireSummary(wksum, wkin, false);
  wksum.onclick = () => { wkPinned = true; setWk(wkin.hidden); };

  const st = {
    step, lb, cot, say, wk, wksum, wkin, set,
    calls: [], hasThink: false, hasSay: false, failed: false, thinkT0: 0, thinkMs: 0, wkT0: 0,
    reveal() {
      row.hidden = false;
      if (!row.classList.contains('live')) {
        row.classList.add('live');
        st.thinkT0 = Date.now();
        if (!pinned) set(true);
      }
      lb.textContent = T('gui.think.live');
      /* Follow the newest line, but only while the reader is already at the
         bottom of the thought -- scrolling back to read costs nothing then. */
      if (on && cot.scrollHeight - cot.scrollTop - cot.clientHeight < 40) {
        cot.scrollTop = cot.scrollHeight;
      }
      down();
    },
    /* Called by anything that supersedes the thought: a call, prose, the end
       of the step. Idempotent -- the clock must stop when thinking stopped,
       not keep counting the work that followed. */
    thinkDone(secs) {
      if (row.hidden) return;
      if (row.classList.contains('live')) {
        row.classList.remove('live');
        st.thinkMs += Date.now() - st.thinkT0;
        if (!pinned) set(false);
      }
      lb.textContent = T('gui.think.label');
      const s = secs != null ? secs : Math.round(st.thinkMs / 1000);
      if (s > 0) ttm.textContent = `${s}s`;
    },
    /* Repaint the stretch's one line. Called on every start and every landing,
       so the phrase grows with the run ("ran a command" -> "searched x4 - ran a
       command") instead of the rows stacking up. */
    paintWork() {
      if (!st.calls.length) return;
      if (!st.wkT0) st.wkT0 = Date.now();
      /* One call is its own summary: a line above it would repeat the same verb
         and the same clock, and cost a click to reach the row it describes. */
      if (st.calls.length === 1) { wksum.hidden = true; wkin.hidden = false; return; }
      /* The step that just outgrew a single call folds its rows away for the
         first time -- from here on the summary line stands for the run. */
      if (wksum.hidden && !wkPinned) setWk(false);
      paintSummary(wksum, st.calls, st.wkT0);
      /* A failure is the one thing worth opening unasked. */
      if (st.failed && !wkPinned && wkin.hidden) setWk(true);
    },
    /* The per-call clock already ticks; this rides it to keep the stretch's
       own clock moving without rebuilding the row ten times a second. */
    tickWork() {
      if (wksum.hidden || !st.wkT0 || !wksum.classList.contains('run')) return;
      const t = wksum.querySelector('.tm');
      if (t) t.textContent = dur(Date.now() - st.wkT0);
    },
    tool(name, args, display) { st.thinkDone(); return newCall(st, name, args, display); },
    seal() { st.thinkDone(); foldWork(st); }
  };
  wksum.onkeydown = (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); wkPinned = true; setWk(wkin.hidden); }
  };
  return st;
}

/* One activity row per call: spinner + present-tense verb + ticking clock
   while it runs; a settled verb, chips and duration once it lands. */
function newCall(st, rawName, rawArgs, display) {
  const id = actId(rawName, rawArgs);
  const c = {
    name: id.name, args: id.args, via: id.via, srv: id.srv,
    label: actLabel(id.name, id.args, display),
    done: false, ok: true, ms: 0, res: '', truncated: false, hunk: null,
  };
  /* Restored history carries no arguments — a hunk computed from nothing
     would show a lying "+1 −0" chip over one blank line. */
  if (id.name === 'edit_file' && typeof id.args.old_text === 'string' && typeof id.args.new_text === 'string') {
    c.hunk = hunkFromEdit(id.args.old_text, id.args.new_text);
  }
  if (id.name === 'write_file' && typeof id.args.content === 'string') {
    c.hunk = hunkFromWrite(id.args.content);
  }
  st.calls.push(c);

  const row = mk('div', 'wrow run' + (id.name === 'ask_user' ? ' wait' : ''));
  const g = ico(actIco(id.name), 'ic');
  const vb = mk('span', 'vb');
  if (c.srv) vb.appendChild(mk('span', 'srv', `[${c.srv}] `));
  vb.appendChild(document.createTextNode(verbIng(c.name)));
  const tm = mk('span', 'tm', '…');
  /* Hidden until the call settles and turns out to have a detail block; it
     then becomes the fold caret, the last thing on the line like every other
     caret in the transcript. */
  const cv = mk('span', 'cvslot');
  row.append(g, vb, tm, cv);
  st.wkin.appendChild(row);
  st.paintWork();
  down();

  const t0 = Date.now();
  const tick = setInterval(() => {
    const s = (Date.now() - t0) / 1000;
    tm.textContent = s >= 10 ? `${Math.round(s)}s` : `${s.toFixed(1)}s`;
    st.tickWork();
    if (s > 1800) clearInterval(tick);
  }, 100);

  c.el = { row, g, vb, cv, tm };
  return {
    done(ok, res, ms, diff, truncated) {
      clearInterval(tick);
      Object.assign(c, {
        done: true, ok, res: String(res == null ? '' : res),
        ms: ms || 0, truncated: !!truncated,
      });
      if (diff) c.hunk = hunkFromUnified(diff);
      tl.push({ name: c.name, arg: c.label, ms: c.ms, ok });
      raw.push(`tool.complete  ${c.name}  ok=${ok}  ${c.ms}ms`);
      if (!ok) st.failed = true;
      settleCall(st, c);
      st.paintWork();
      down();
    }
  };
}

function settleCall(st, c) {
  const { row, g, vb, cv, tm } = c.el;
  row.classList.remove('run', 'wait');
  vb.textContent = '';
  if (c.srv) vb.appendChild(mk('span', 'srv', `[${c.srv}] `));
  vb.appendChild(document.createTextNode(verb(c.name)));
  /* A settled row keeps no clock: the turn's total is in the answer footer, so
     a per-row time is only worth the ink when the call was genuinely slow. */
  tm.textContent = c.ms >= SLOW_CALL_MS ? dur(c.ms) : '';
  if (c.hunk && (c.hunk.add || c.hunk.del)) {
    const dn = mk('span', 'diffn');
    dn.append(mk('span', 'a', `+${c.hunk.add}`), document.createTextNode(' '),
      mk('span', 'd', `-${c.hunk.del}`));
    row.insertBefore(dn, tm);
  }
  if (!c.ok) {
    row.classList.add('bad');
    if (g.firstChild) g.firstChild.setAttribute('d', ACT_ICO.bad);
    const first = firstErrLine(c.res);
    if (first) row.insertBefore(mk('span', 'err', first), tm);
  }
  const dtl = dtlFor(c);
  if (!dtl) { cv.remove(); return; }
  dtl.hidden = true;
  row.after(dtl);
  row.classList.add('tog');
  cv.replaceWith(chev());
  row.tabIndex = 0;
  const flip = () => pinRow(row, () => {
    dtl.hidden = !dtl.hidden;
    row.classList.toggle('open', !dtl.hidden);
  });
  row.onclick = flip;
  row.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };
}

/* The detail block. Per-tool: a diff for edits, `$ command` + tail + exit
   chip for exec, a clickable link for fetches, plain preview otherwise. */
function dtlFor(c) {
  const d = mk('div', 'dtl');
  const bd = mk('div', 'bd');
  const addPre = (text) => {
    let lines = String(text || '').split('\n');
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    if (!lines.length) return;
    const over = lines.length - DTL_MAX_LINES;
    if (over > 0) lines = lines.slice(0, DTL_MAX_LINES);
    bd.appendChild(mk('pre', null, lines.join('\n')));
    if (over > 0) bd.appendChild(mk('div', 'more', `… +${over}`));
  };
  /* Every card is titled: what it is, what it changed, and one click to take
     the raw text with you. */
  const head = (name, hunk, copyText, openPath) => {
    const h = mk('div', 'dhd');
    /* A card titled with a path is the shortest route from "the agent wrote
       this" to reading it, so the title opens the viewer rather than being a
       label you then go hunting for in the panel. */
    if (openPath) {
      const b = mk('button', 'nm pth', name);
      b.dataset.p = openPath;
      b.title = openPath;
      b.onclick = (e) => { e.stopPropagation(); pathOpen(openPath); };
      h.appendChild(b);
    } else {
      h.appendChild(mk('span', 'nm', name));
    }
    if (hunk && (hunk.add || hunk.del)) {
      const ct = mk('span', 'ct');
      ct.append(mk('span', 'a', `+${hunk.add}`), document.createTextNode(' '),
        mk('span', 'd', `-${hunk.del}`));
      h.appendChild(ct);
    }
    if (copyText) {
      const b = tipBtn('<rect x="9" y="9" width="11" height="11" rx="2.4"/>'
        + '<path d="M15 5.5A1.5 1.5 0 0 0 13.5 4H6a2 2 0 0 0-2 2v7.5A1.5 1.5 0 0 0 5.5 15"/>',
      T('gui.dtl.copy'), 'cp');
      b.onclick = (e) => {
        e.stopPropagation();
        if (navigator.clipboard) navigator.clipboard.writeText(copyText);
        tipFlash(b, T('gui.answer.copied'));
      };
      h.appendChild(b);
    }
    d.appendChild(h);
  };

  if (c.name === 'edit_file' || c.name === 'write_file') {
    if (c.hunk && c.hunk.rows.length) {
      const rows = c.hunk.rows.slice(0, 120);
      head(wsShortPath(c.args.path || ''), c.hunk,
        rows.map((r) => (r[0] === 'gap' ? '' : r[1])).join('\n'), c.args.path || '');
      rows.forEach((r) => {
        if (r[0] === 'gap') bd.appendChild(mk('div', 'dline gap', `⋯ ${r[1].length}`));
        else bd.appendChild(mk('div', 'dline' + (r[0] === 'add' ? ' a' : r[0] === 'del' ? ' d' : ''), r[1] || ' '));
      });
      const act = mk('div', 'act2');
      const b = mk('button', null, T('gui.dtl.open_ws'));
      b.onclick = (e) => { e.stopPropagation(); setWs(true, 'diff'); };
      act.appendChild(b);
      bd.appendChild(act);
    }
    if (!c.ok) addPre(c.res);
  } else if (c.name === 'exec') {
    const cmd = String(c.args.command || '');
    head(cmd || T('gui.dtl.output'), null, cmd || c.res);
    if (cmd) bd.appendChild(mk('div', 'cmd', cmd));
    /* the shell appends its own "Exit code: N" line — lift it into a chip */
    const lines = String(c.res || '').trimEnd().split('\n');
    const m = /^Exit code:\s*(-?\d+)$/.exec(lines[lines.length - 1] || '');
    let exit = null;
    if (m) { exit = Number(m[1]); lines.pop(); }
    addPre(lines.join('\n'));
    if (exit != null) {
      const w = mk('div');
      w.style.marginTop = '6px';
      w.appendChild(mk('span', 'exit ' + (exit === 0 ? 'ok' : 'bad'), T('gui.dtl.exit', { n: exit })));
      bd.appendChild(w);
    }
  } else if (c.name === 'web_fetch') {
    const url = String(c.args.url || '');
    head(url || T('gui.dtl.plain'), null, url || c.res);
    if (url) {
      const aEl = document.createElement('a');
      aEl.href = url; aEl.target = '_blank'; aEl.rel = 'noopener'; aEl.textContent = url;
      bd.appendChild(aEl);
    }
    addPre(c.res);
  } else {
    /* The target titles the card -- it is no longer on the row, and "output" as
       a title tells the reader nothing about which file or pattern this was. */
    let title = shortArg(c.label, 120);
    if (!title && (c.via || c.srv)) title = shortArg(JSON.stringify(c.args), 120);
    if (c.via) title = T('gui.dtl.via') + (title ? ' · ' + title : '');
    head(title || T('gui.dtl.plain'), null, String(c.res || ''));
    addPre(c.res);
  }
  if (c.truncated) bd.appendChild(mk('div', 'trunc', T('gui.dtl.trunc')));
  /* The row carries the verb alone, so the argument has nowhere else to live:
     a card that is only a title is still the one place to read what ran. */
  if (!d.querySelector('.dhd') && c.label) {
    const fp = typeof c.args.path === 'string' ? c.args.path : '';
    head(shortArg(c.label, 160), null, c.label, fp);
  }
  if (bd.childElementCount) d.appendChild(bd);
  return d.childElementCount ? d : null;
}

/* One line for a stretch of calls: what ran, how many of each, how long. It is
   painted while the calls are still landing and again once they settle, so a
   running stretch reads as one growing line instead of a column of rows with
   their arguments spelled out -- and the run never changes shape as it ends.
   A stretch with a failure opens itself, and folding it by hand keeps the
   failure chip on the summary: the fold never hides what went wrong. */
function paintSummary(sum, calls, t0) {
  const live = calls.some((c) => !c.done);
  sum.innerHTML = '';
  sum.classList.add('sum');
  sum.classList.toggle('run', live);
  const one = calls.every((c) => c.name === calls[0].name);
  sum.appendChild(ico(one ? actIco(calls[0].name) : ACT_ICO.dot, 'ic'));
  sum.appendChild(mk('span', 'ar', phraseOf(calls)));
  const f = calls.filter((c) => c.done && !c.ok).length;
  if (f) sum.appendChild(mk('span', 'chip bad', T('gui.n_failed', { n: f })));
  /* Running: how long this stretch has been going. Settled: what it cost.
     Both belong in the same slot -- one turns into the other. */
  const total = live ? Date.now() - (t0 || Date.now()) : calls.reduce((a, c) => a + (c.ms || 0), 0);
  sum.appendChild(mk('span', 'tm', total ? dur(total) : ''));
  sum.appendChild(chev());
  sum.hidden = false;
}

function wireSummary(sum, body, startOpen) {
  let open;
  const setOpen = (v) => { open = v; sum.classList.toggle('open', open); body.hidden = !open; };
  /* Pinned on the reader's own toggles only. The stream calls setOpen too (a
     failure opens its run), and pinning there would fight the tail-follow. */
  sum.onclick = () => pinRow(sum, () => setOpen(!open));
  sum.tabIndex = 0;
  sum.onkeydown = (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    pinRow(sum, () => setOpen(!open));
  };
  setOpen(!!startOpen);
  return setOpen;
}

function buildSummary(sum, calls, body, startOpen) {
  paintSummary(sum, calls, null);
  wireSummary(sum, body, startOpen);
}

/* The stretch was already one line while it ran, so sealing only repaints it as
   settled. It deliberately does NOT expand short runs: a two-call stretch that
   unfolded itself the moment the turn ended would change shape under the
   reader's eyes, for two rows they can open with one click. */
function foldWork(st) {
  st.paintWork();
}

/* Verbs and counts only -- no targets. The folded line answers "what kind of
   work happened here"; a 26-character slice of a regex or a shell pipeline
   answers nothing, and the full argument is on the row one click below.
   Counted over the whole stretch rather than per adjacent run: interleaved
   calls read as "ran a command - read - ran a command", which says the same
   verb twice and makes the reader count. Order is first appearance. */
function phraseOf(calls) {
  const n = new Map();
  calls.forEach((c) => n.set(c.name, (n.get(c.name) || 0) + 1));
  return [...n].map(([name, k]) => (k === 1
    ? verb(name)
    : T('gui.act.n.' + name, { n: k }, `${verb(name)} ×${k}`))).join(' · ');
}

/* Once the answer has landed, everything that led to it — thinking, mid-turn
   narration, activity rows — collapses behind one line. The answer is what the
   reader came back for; the work stays one click away. Scanning back from the
   tail stops at the turn's own boundary, so earlier turns keep their folds.

   A turn gets ONE fold: work that lands after an early fold joins that fold
   rather than stacking a second header, so a turn that alternated between
   narrating and working does not read as a column of "done" lines. */
/* "done" and how long it took are two readings, so they are two spans: the
   clock is the same faint mono as every other elapsed time on the page, and an
   empty one collapses instead of leaving a gap before the caret. */
function foldTime(fold, time) {
  const lb = fold.querySelector('.tfh > .lb');
  const tm = fold.querySelector('.tfh > .tm');
  if (lb) lb.textContent = T('gui.fold.done');
  if (tm) tm.textContent = time || '';
}

function collapseTurn(time) {
  const stage = stageBox();
  const nodes = [];
  let open_ = null;
  for (let n = stage.lastElementChild; n; n = n.previousElementSibling) {
    if (n.classList.contains('ask')) break;
    if (n.classList.contains('tfold')) { open_ = n; break; }
    if (n.classList.contains('step')) nodes.unshift(n);
  }
  if (!nodes.length) return null;
  if (open_) {
    const body = open_.querySelector('.tfb');
    nodes.forEach((n) => body.appendChild(n));
    foldTime(open_, time);
    return open_;
  }
  /* Every turn that led somewhere folds the same way, thinking included: one
     "done" line is what the reader looks for after the answer, and a turn that
     only thought must not be the one exception that stays expanded.
     An empty step is still not worth a header -- a caret over nothing. */
  const solid = (n) => !!n.querySelector('.wrow:not([hidden]), .think:not([hidden])')
    || !!(n.querySelector('.say') && n.querySelector('.say').textContent.trim());
  if (!nodes.some(solid)) return null;

  const fold = mk('div', 'tfold');
  const head = mk('button', 'tfh');
  head.append(mk('span', 'lb'), mk('span', 'tm'), chev());
  head.setAttribute('aria-label', T('gui.fold.aria'));
  const body = mk('div', 'tfb');
  nodes[0].before(fold);
  nodes.forEach((n) => body.appendChild(n));
  fold.append(head, body);
  foldTime(fold, time);

  let open = false;
  const set = (v) => {
    open = v;
    body.hidden = !open;
    fold.classList.toggle('open', open);
    head.setAttribute('aria-expanded', String(open));
  };
  head.onclick = () => pinRow(head, () => set(!open));
  set(false);
  return fold;
}

/* Consecutive silent steps read as one stretch of work: their rows move under
   a single summary line — the work segment spans episode boundaries. */
function foldSilentRuns(steps) {
  let i = 0;
  while (i < steps.length) {
    if (!isSilent(steps[i])) { i += 1; continue; }
    let j = i;
    while (j < steps.length && isSilent(steps[j])) j += 1;
    if (j - i >= MIN_RUN_STEPS) mergeRun(steps.slice(i, j));
    i = j;
  }
}
const isSilent = (st) => !st.hasSay && !st.hasThink && !st.hasQA && !st.failed && st.calls.length > 0;

function mergeRun(group) {
  const calls = group.flatMap((st) => st.calls);
  if (!calls.length || !calls.every((c) => c.done)) return;
  const holder = mk('div', 'step in');
  const wk = mk('div', 'wk');
  const sum = mk('div', 'wrow tog');
  const body = mk('div', 'wkin');
  wk.append(sum, body);
  holder.appendChild(wk);
  group.forEach((st) => { [...st.wkin.children].forEach((n) => body.appendChild(n)); });
  buildSummary(sum, calls, body, false);
  group[0].step.replaceWith(holder);
  group.slice(1).forEach((st) => st.step.remove());
}

/* An ask_user round trip is part of the work, not a message the reader typed:
   question and answer share one row, beside the activity rows of the tool that
   asked. Echoing only the answer, as a user bubble, lost the question entirely
   and put an `.ask` node in the middle of the turn -- which reads as a new turn,
   and since folding stops at a turn boundary it stranded every row before it
   outside the fold. Long text ellipsizes and the full pair is one click away. */
const QA_Q = 62, QA_A = 34;
function askEcho(question, answer, opts) {
  const o = opts || {};
  const q = String(question || '').replace(/\s+/g, ' ').trim();
  const a = String(answer || '').replace(/\s+/g, ' ').trim();
  const row = mk('div', 'wrow qa');
  row.append(ico(ACT_ICO.ask, 'ic'),
    mk('span', 'vb', T(o.skipped ? 'gui.qa.skipped' : 'gui.qa.answered')),
    mk('span', 'ar', shortArg(q, QA_Q)));
  if (a && !o.skipped) row.appendChild(mk('span', 'an', shortArg(a, QA_A)));
  const cv = mk('span', 'cvslot');
  row.appendChild(cv);
  (o.host || stageBox()).appendChild(row);
  if (q.length <= QA_Q && a.length <= QA_A) { cv.remove(); down(); return row; }

  const dtl = mk('div', 'dtl');
  const bd = mk('div', 'bd');
  bd.append(mk('div', 'hd', T('gui.qa.q')), mk('pre', null, q));
  if (a) bd.append(mk('div', 'hd', T('gui.qa.a')), mk('pre', null, a));
  dtl.appendChild(bd);
  dtl.hidden = true;
  row.after(dtl);
  row.classList.add('tog');
  cv.replaceWith(chev());
  row.tabIndex = 0;
  const flip = () => pinRow(row, () => { dtl.hidden = !dtl.hidden; row.classList.toggle('open', !dtl.hidden); });
  row.onclick = flip;
  row.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };
  down();
  return row;
}

/* The turn is never silent: a breathing dot fills the dead air between
   pressing send and the first event. Any content kills it. */
let statusEl = null;
function showStatus(text) {
  killStatus();
  statusEl = mk('div', 'status in');
  statusEl.append(mk('span', 'pip'), mk('span', null, text));
  $('#stage').appendChild(statusEl);
  down();
}
function killStatus() { if (statusEl) { statusEl.remove(); statusEl = null; } }

/* When an answer landed. Today's answers need only a clock; anything older
   needs the date to mean anything, so it carries the full stamp. */
function stamp(when) {
  const d = when instanceof Date ? when : new Date(when);
  if (!d || isNaN(d.getTime())) return '';
  const p = (n) => String(n).padStart(2, '0');
  const hm = `${p(d.getHours())}:${p(d.getMinutes())}`;
  const now = new Date();
  const sameYear = d.getFullYear() === now.getFullYear();
  const today = sameYear && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
  if (today) return hm;
  /* The year only earns its place once it is not the current one: four digits on
     every line of an afternoon's work is four digits of nothing. */
  const md = `${p(d.getMonth() + 1)}-${p(d.getDate())} ${hm}`;
  return sameYear ? md : `${d.getFullYear()}-${md}`;
}

function answerBlock(text) {
  const box = mk('div', 'answer in');
  const body = mk('div', 'prose');
  const acts = mk('div', 'acts');
  /* Icons, like the live footer: the row is 27px squares, and a word in one of
     them wraps to a column of single characters. */
  const add = (label, path, fn) => {
    const b = mk('button');
    b.dataset.tip = label;
    b.setAttribute('aria-label', label);
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;
    b.onclick = fn;
    acts.appendChild(b);
  };
  add(T('gui.answer.copy'), COPY_ICO,
    () => { navigator.clipboard && navigator.clipboard.writeText(text); toast('已复制到剪贴板'); });
  add(T('gui.answer.branch'), '<circle cx="7" cy="6" r="2.2"/><circle cx="7" cy="18" r="2.2"/>'
    + '<circle cx="17" cy="8" r="2.2"/><path d="M7 8.2v7.6"/>'
    + '<path d="M17 10.2v1.3a3.5 3.5 0 0 1-3.5 3.5H10"/>', () => {
    const s = { id: 'n' + Date.now(), title: (sess(cur) ? sess(cur).title : '新任务') + ' 的分支',
      last: '从上一轮回复分叉', when: '刚刚', g: '今天', run: null };
    SESS.unshift(s); cur = s.id; drawList(); openSession(s); toast('已分叉出新会话');
  });
  box.append(body, acts);
  stageBox().appendChild(box);
  return body;
}

/* ══ replay (swap for a socket to go live) ════════════════════════ */
/* Every event is scheduled up front, so `t` is the cumulative offset from
   the start of the run. later() measures from the moment it is called, so
   anything scheduled from *inside* a fired callback must use a plain delay
   — passing the cumulative offset there would defer it by the whole run. */
function replay(run, instant) {
  let st = null; const open_ = {}; let t = 0; const steps = [];
  const fire = (fn, d) => {
    if (instant) { fn(); return; }
    t += d || 0;
    later(t, () => { markLive(true); fn(); });
  };
  const TYPE_MS = 24;

  eventsFor(run).forEach((e) => {
    if (e.t === 'ep') fire(() => {
      if (st) st.seal();
      st = newStep(); steps.push(st); raw.push('episode.start');
    }, e.d);
    else if (e.t === 'think') fire(() => {
      st.hasThink = true;
      st.cot.textContent = e.x;
      st.reveal();
      st.thinkDone(e.s);
      if (!instant) { st.set(true); later(1400, () => st.set(false)); }
    }, e.d);
    else if (e.t === 'say') fire(() => { st.hasSay = true; st.say.innerHTML = md(e.x); down(); }, e.d);
    else if (e.t === 't+') fire(() => {
      open_[e.id] = st.tool(e.n, e.a); raw.push(`tool.start     ${e.n}`);
      open_[e.id].meta = { n: e.n, a: e.a, st };
      wsOnTool(e.n, e.a, instant);
    }, e.d);
    else if (e.t === 't-') fire(() => {
      const h = open_[e.id];
      if (!h) return;
      h.done(e.ok, e.r, e.ms, e.diff);
      if (!e.ok) h.meta.st.failed = true;
      wsOnToolDone(h.meta.n, h.meta.a, e.ok, e.r, e.ms, e.diff);
    }, e.d);
    else if (e.t === 'answer') {
      const parts = e.x.match(/[\s\S]{1,26}/g) || [];
      fire(() => {
        const body = answerBlock(e.x);
        if (instant) { body.innerHTML = md(e.x); down(); return; }
        let n = 0;
        parts.forEach((_, k) => later(k * TYPE_MS, () => {
          n += parts[k].length;
          body.innerHTML = md(e.x.slice(0, n)) + (k < parts.length - 1 ? '<span class="caret"></span>' : '');
          down();
        }));
      }, e.d);
      if (!instant) t += parts.length * TYPE_MS;
    }
    else if (e.t === 'end') fire(() => {
      if (st) st.seal();
      foldSilentRuns(steps);
      collapseTurn(null);
      busy = false; use = run.use; kids = run.kids;
      setCtx(((run.use && run.use.in) || 0) + ((run.use && run.use.out) || 0), 200000);
      raw.push('message.complete');
      const s = sess(cur);
      if (s) { s.last = run.key === 'gtm' ? '抓取了官网，出了对比表' : '3 runs, 0 failures'; s.status = null; }
      drawMeter(); goState(); drawList();
      if (q.length) { const nx = q.shift(); drawQ(); send(nx); }
    }, 300);
  });
}

/* ══ composer ═════════════════════════════════════════════════════ */
/* Overridden by the live layer, which owns the attachment tray. A file on its
   own is a message -- "look at this" is what dropping it already said -- so an
   empty field with something attached must still be sendable. */
function hasAtts() { return false; }

function goState() {
  const b = $('#go');
  if (busy) { b.disabled = false; b.classList.add('halt'); b.innerHTML = ICON_STOP; b.setAttribute('aria-label', T('gui.stop')); }
  else {
    b.disabled = !$('#ta').value.trim() && !hasAtts();
    b.classList.remove('halt'); b.innerHTML = ICON_SEND; b.setAttribute('aria-label', T('gui.send'));
  }
}

function drawQ() {
  const box = $('#queued'); box.innerHTML = '';
  q.forEach((text, i) => {
    const row = mk('div', 'qrow');
    const v = mk('span', 'v', text);
    const ed = tipBtn(`<path d="${ACT_ICO.pen}"/>`, T('gui.q.edit'));
    const rm = tipBtn('<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>', T('gui.q.remove'));
    ed.onclick = () => {
      const inp = mk('input'); inp.value = text;
      v.replaceWith(inp); inp.focus(); inp.select();
      const done = (commit) => { if (commit && inp.value.trim()) q[i] = inp.value.trim(); drawQ(); };
      inp.onblur = () => done(true);
      inp.onkeydown = (e) => {
        if (composing(e)) return;
        if (e.key === 'Enter') { e.preventDefault(); done(true); }
        if (e.key === 'Escape') { inp.onblur = null; done(false); }
      };
    };
    rm.onclick = () => { q.splice(i, 1); drawQ(); };
    row.append(v, ed, rm);
    box.appendChild(row);
  });
}

/* ONE row for the whole life of a turn: it appears the moment the message is
   sent, rides the tail of the transcript under whatever is streaming, and gives
   way to the answer's own footer when the turn lands. Three labels, one clock:
     sent, nothing back yet        -> starting
     content arriving              -> writing
     QUIET_MS with no event at all -> working (dimmed)
   The clock plus that demotion is what proves the stream is alive; an animation
   on its own keeps dancing over a dead socket. A separate "starting" row on top
   of this one said the same thing twice. */
const QUIET_MS = 3000;
let liveT0 = 0, liveSeen = 0, liveTick = null, liveRow = null, liveGot = false;
/* Accepting the turn is not the same as producing something: message.start
   keeps the clock honest without letting the row claim output that has not
   arrived, so only content flips the label to "writing". */
function markLive(content) { liveSeen = Date.now(); if (content) liveGot = true; }
function turnLiveRow() {
  if (liveRow) return liveRow;
  liveRow = mk('div', 'turnlive');
  const wave = mk('span', 'wave');
  wave.setAttribute('aria-hidden', 'true');
  wave.append(mk('i'), mk('i'), mk('i'));
  liveRow.append(wave, mk('span', 'lb'));
  liveRow.setAttribute('aria-live', 'off');
  return liveRow;
}
function drawTurnLive() {
  const row = turnLiveRow();
  if (!busy) {
    row.remove();
    if (liveTick) { clearInterval(liveTick); liveTick = null; }
    liveT0 = 0;
    liveGot = false;
    return;
  }
  if (!liveT0) { liveT0 = Date.now(); liveSeen = liveT0; }
  const paint = () => {
    const stage = $('#stage');
    /* Only moved when something new landed after it: re-inserting a node
       restarts its CSS animation, so an unconditional append would make the
       wave stutter four times a second. */
    if (stage && stage.lastElementChild !== row) stage.appendChild(row);
    const quiet = Date.now() - liveSeen > QUIET_MS;
    /* Silence outranks "starting": a turn that has said nothing for seconds is
       working, whether or not it ever got going. Only the word changes -- the
       row keeps one appearance from send to answer. */
    const key = quiet ? 'gui.live.working' : liveGot ? 'gui.live.streaming' : 'gui.live.starting';
    row.querySelector('.lb').textContent = T(key, { t: dur(Date.now() - liveT0) });
  };
  paint();
  if (!liveTick) liveTick = setInterval(paint, 250);
}

function drawMeter() {
  $('#meter').textContent = busy ? T('gui.meter.running')
    : use ? T('gui.meter.usage', { calls: use.calls, in: (use.in / 1000).toFixed(1), out: (use.out / 1000).toFixed(1) })
    : '';
  drawTurnLive();
}

const pickRun = (s) => /超时|timeout|登录|bug|修|fix|报错|定位|回调/.test(s) ? RUNS.fix : RUNS.gtm;

function send(text) {
  if (busy) { q.push(text); drawQ(); toast('已排队，本轮结束后发出'); return; }
  const p = $('#stage').querySelector('.pitch'); if (p) p.remove();
  ask(text);
  busy = true; use = null; tl = []; raw = [];
  drawMeter(); goState(); drawList();
  const run = pickRun(text);
  lastRun = run;
  const s = sess(cur);
  if (s && !s.run) {
    s.run = run.key; s.status = null;
    if (s.title === '新任务') { s.title = run.title; $('#title').textContent = plainTitle(s.title); }
    drawList();
  }
  replay(run, false);
}

function halt() {
  stop_(); busy = false;
  const r = mk('div', 'act in');
  r.append(mk('span', 'g'), mk('span', 'arg', '已中断 · 上面的步骤保留'));
  $('#stage').appendChild(r);
  drawMeter(); goState(); drawList(); down();
}

/* ══ workspace ════════════════════════════════════════════════════
   The transcript answers "what happened". This panel answers "what is the
   state of my machine now" -- which files the agent rewrote, what it ran in
   a shell, where it went on the web. Anything that only restates the
   transcript belongs in the transcript, not here.

   It never opens itself: a pane that interrupts gets closed for good. The
   badge on the header chip does the asking. And it is never the only place a
   fact appears, so collapsing it can't lose information.            */
let wsTab = 'diff', wsOpen = false, wsWide = false, wsPicked = false;

const WS = {
  changes: [],   // { key, path, kind:'edit'|'write', add, del, hunks, turn, open }
  cmds: [],      // { id, cmd, cwd, running, code, ms, tail:[] }
  urls: [],      // { url, kind:'fetch'|'search', at }
  file: null,    // files view: opened file  { path, lines, ro, truncated }
  turn: 0,       // bumped per turn so Changes can group "this turn" vs earlier
  unseen: 0      // changes arrived while the panel was closed or on another view
};

function wsReset() {
  WS.changes = []; WS.cmds = []; WS.urls = []; WS.file = null; WS.turn = 0; WS.unseen = 0;
  wsTab = 'diff'; wsPicked = false;
  /* Subagents belong to the session that spawned them, so they leave with it
     -- carrying the list into the next conversation would attribute one
     conversation's background work to another. */
  AGENTS = []; agentOpen = null;
  const dot = $('#wsAgentRun'); if (dot) dot.hidden = true;
}

/* ── resumed sessions ──────────────────────────────────────────────────
   The panel is rebuilt from the stored calls rather than starting empty after a
   reload: session.resume carries every assistant tool_call WITH its arguments,
   which is the same input the live hooks are fed, so replaying them yields the
   same rows, the same diffs and the same turn grouping. */
function wsOnHistory(messages) {
  (messages || []).forEach((m) => {
    if (!m) return;
    if (m.role === 'user' && m.text && m.text.trim()) { WS.turn += 1; return; }
    if (m.role !== 'assistant' || !Array.isArray(m.tool_calls)) return;
    m.tool_calls.forEach((c) => {
      let args = null;
      try { args = JSON.parse(c.arguments || '{}'); } catch (e) { return; }
      if (args && typeof args === 'object') wsOnTool(String(c.name || ''), args, true);
    });
  });
  /* Restored rows have no completion event coming: a command reads as finished
     with an unknown status rather than as still running, and nothing counts as
     unread because none of it arrived while the reader was away. */
  WS.cmds.forEach((c) => { if (c.running) { c.running = false; c.code = null; c.ms = null; } });
  WS.urls.forEach((u) => { u.at = T('gui.ws.turn_earlier'); });
  WS.changes.forEach((c) => { c.seen = true; });
  WS.unseen = 0;
  bumpWs();
}

/* ── diff from the edit arguments ───────────────────────────────────────
   edit_file carries old_text and new_text, which IS the ground truth of the
   change, so the diff needs no backend support at all. Long runs of
   unchanged context are folded to one clickable row. */
const CTX_KEEP = 3;

function hunkFromEdit(oldText, newText) {
  const del = String(oldText || '').split('\n');
  const add = String(newText || '').split('\n');
  let head = 0;
  while (head < del.length && head < add.length && del[head] === add[head]) head += 1;
  let tail = 0;
  while (tail < del.length - head && tail < add.length - head
         && del[del.length - 1 - tail] === add[add.length - 1 - tail]) tail += 1;
  const rows = [];
  const lead = del.slice(0, head);
  if (lead.length > CTX_KEEP) rows.push(['gap', lead.slice(0, lead.length - CTX_KEEP)]);
  lead.slice(Math.max(0, lead.length - CTX_KEEP)).forEach((l) => rows.push(['ctx', l]));
  del.slice(head, del.length - tail).forEach((l) => rows.push(['del', l]));
  add.slice(head, add.length - tail).forEach((l) => rows.push(['add', l]));
  const rest = del.slice(del.length - tail);
  rest.slice(0, CTX_KEEP).forEach((l) => rows.push(['ctx', l]));
  if (rest.length > CTX_KEEP) rows.push(['gap', rest.slice(CTX_KEEP)]);
  return { rows, add: add.length - head - tail, del: del.length - head - tail };
}

function hunkFromWrite(content) {
  const all = String(content == null ? '' : content).split('\n');
  /* A file ending in a newline splits to a trailing "" that is not a line;
     counting it would report one more added line than any diff tool does. */
  if (all.length > 1 && all[all.length - 1] === '') all.pop();
  const rows = all.slice(0, 40).map((l) => ['add', l]);
  if (all.length > 40) rows.push(['gap', all.slice(40)]);
  return { rows, add: all.length, del: 0 };
}

/* A tool that reports its own unified diff (or a replay that carries one)
   lands here instead: same row shape, so the view does not care which. */
/* Accepts the wire's unified-diff string or an array of its lines. The two
   ---/+++ file headers are dropped: they name the file the row already names,
   and read as one deletion and one addition if left in. */
function hunkFromUnified(lines) {
  const rows = []; let add = 0, del = 0;
  const src = typeof lines === 'string' ? lines.split('\n') : (lines || []);
  src.filter((l) => !/^(---|\+\+\+)( |$)/.test(String(l))).forEach((raw) => {
    const l = String(raw);
    if (l.startsWith('@@')) { rows.push(['ctx', l]); return; }
    if (l.startsWith('+')) { rows.push(['add', l.slice(1)]); add += 1; return; }
    if (l.startsWith('-')) { rows.push(['del', l.slice(1)]); del += 1; return; }
    rows.push(['ctx', l.replace(/^ /, '')]);
  });
  return { rows, add, del };
}

/* The two front ends hand over different shapes -- the live RPC gives the
   whole argument object, the demo replay gives the one string it displays.
   Normalising here keeps every caller downstream simple. */
function wsArgs(name, args) {
  if (args && typeof args === 'object') return args;
  const s = String(args == null ? '' : args);
  if (name === 'exec') return { command: s };
  if (name === 'web_fetch') return { url: s };
  if (name === 'web_search') return { query: s };
  return { path: s };
}

/* Tools report absolute paths; the workspace root is the same on every row and
   carries no information. live.js overrides this with the real root. */
function wsShortPath(p) { return String(p); }

/* One row per path, not per call: five edits to the same file is one changed
   file with five hunks, which is how a person thinks about it. */
function wsRecordChange(path, kind, hunk) {
  const key = String(path);
  let c = WS.changes.find((x) => x.key === key && x.turn === WS.turn);
  if (!c) {
    const shown = wsShortPath(key);
    const cut = shown.lastIndexOf('/');
    /* The newest change is the one you came here to read, so it arrives
       expanded. `auto` marks it as opened by us, so the next arrival folds it
       back without touching a row the reader opened on purpose. */
    WS.changes.forEach((x) => { if (x.auto) { x.open = false; x.auto = false; } });
    c = { key, dir: cut < 0 ? '' : shown.slice(0, cut + 1), name: cut < 0 ? shown : shown.slice(cut + 1),
      kind, add: 0, del: 0, hunks: [], turn: WS.turn, open: true, auto: true, seen: false };
    WS.changes.unshift(c);
  }
  if (kind === 'write') c.kind = 'write';
  c.add += hunk.add; c.del += hunk.del;
  c.hunks.push(hunk);
  return c;
}

function setWs(open, tab) {
  wsOpen = open;
  if (tab) wsTab = tab;
  /* Collapsing leaves expanded mode too: coming back to a full-window panel
     that was dismissed is never what the reader meant. */
  if (!open) setWsFull(false);
  $('#split').dataset.open = String(open);
  const b = $('#wsBtn');
  b.setAttribute('aria-expanded', String(open));
  const k = open ? 'gui.collapse_ws' : 'gui.expand_ws';
  b.dataset.tip = T(k); b.setAttribute('aria-label', T(k));
  if (open) drawWs();
  bumpWs();
}

/* Expanded is a display mode, not a width: the panel leaves the grid and covers
   the window, so nothing here touches --wsw and the dragged width is waiting
   unchanged on the way back. */
function setWsFull(on) {
  wsWide = !!on;
  $('#split').dataset.full = String(wsWide);
  const b = $('#wsWide');
  b.classList.toggle('on', wsWide);
  const k = wsWide ? 'gui.ws.restore_panel' : 'gui.ws.expand_panel';
  b.dataset.tip = T(k); b.setAttribute('aria-label', T(k));
  b.setAttribute('aria-pressed', String(wsWide));
}

/* The header chip is the only thing allowed to interrupt, and only by
   counting. Running commands add a dot so "still going" reads at a glance.

   The count is CHANGED FILES, not tool calls: five edits to one file is one
   thing to look at, and "+5" for a single file reads as a lie. */
function bumpWs() {
  WS.unseen = WS.changes.filter((c) => !c.seen).length;
  const n = WS.unseen;
  const chip = $('#wsBdg');
  chip.textContent = n ? `+${n}` : '';
  chip.hidden = n === 0;
  const u = $('#wsUnseen');
  if (u) { u.textContent = n ? `+${n}` : ''; u.hidden = n === 0; }
  const running = WS.cmds.some((c) => c.running);
  const dot = $('#wsRun');
  if (dot) dot.hidden = !running;
}

/* Picking a view is a commitment: from then on that view shows its own empty
   note rather than being replaced by the launcher. */
function wsPick(tab) {
  wsTab = tab; wsPicked = true;
  drawWs(); bumpWs();
}

/* Bumped on every redraw. A view that fetches before it can render (the file
   tree) must re-check this before appending, or a slow fs.list lands in
   whatever view the user switched to meanwhile. */
let wsEpoch = 0;
const wsStale = (mine) => mine !== wsEpoch;

function drawWs() {
  wsEpoch += 1;
  [...$('#wsTabs').children].forEach((b) => b.setAttribute('aria-selected', String(b.dataset.w === wsTab)));
  const box = $('#wsBody'); box.innerHTML = '';
  /* Each view that needs one stamps its own; clearing here keeps a stale
     layout mode from following the reader into the next tab. */
  delete box.dataset.view;
  const bare = !WS.changes.length && !WS.cmds.length && !WS.urls.length;
  /* The browser is a place, not a report: it works with an empty session, so it
     is never behind the launcher the way "what changed" has to be. */
  if (wsTab === 'browser') return drawWsWeb(box);
  /* Like the browser, this is a place rather than a report on the current
     turn: a session's subagents are worth opening even when nothing has
     been touched yet, so it sits ahead of the launcher. */
  if (wsTab === 'agents') { box.dataset.view = 'agents'; return drawWsAgents(box); }
  if (bare && !wsPicked) return drawWsLaunch(box);
  if (wsTab === 'term') return drawWsTerm(box);
  if (wsTab === 'file') return drawWsFile(box);
  drawWsChanges(box);
}

const ICO = {
  diff: 'M4 4h16v16H4zM12 8.5v7M8.5 12h7',
  file: 'M4 7.5c0-1.1.9-2 2-2h3.5l2 2.5H18c1.1 0 2 .9 2 2v7c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2v-9.5Z',
  term: 'M3.5 5h17v14h-17zM7.5 10l2.5 2-2.5 2M12.5 14.5H16',
  web: 'M4.5 12h15M12 4.5c-4.5 4.5-4.5 10.5 0 15M12 4.5c4.5 4.5 4.5 10.5 0 15',
  ext: 'M10 6H6.5A2.5 2.5 0 0 0 4 8.5v9A2.5 2.5 0 0 0 6.5 20h9a2.5 2.5 0 0 0 2.5-2.5V14M14 4h6v6M20 4l-9 9',
  doc: 'M7 3.5h7L18.5 8v10.5a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2ZM13.5 3.5V8h4.5',
  up: 'M14.5 6.5 9 12l5.5 5.5'
};
function ico(d, cls) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none');

  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d); s.appendChild(p);

}

function drawWsLaunch(box) {
  const w = mk('div', 'wslaunch');
  [['diff', ICO.diff, 'gui.ws.changes', 'gui.ws.sub.changes'],
   ['term', ICO.term, 'gui.ws.terminal', 'gui.ws.sub.terminal'],
   ['file', ICO.file, 'gui.ws.files', 'gui.ws.sub.files'],
   ['browser', ICO.web, 'gui.ws.browser', 'gui.ws.sub.browser']].forEach(([tab, d, name, sub]) => {
    const b = mk('button', 'lcard');

}

function drawWsChanges(box) {
  if (!WS.changes.length) {
    box.appendChild(mk('div', 'wsnote', T('gui.ws.no_changes')));
    return;
  }
  let group = null;
  /* Rendering the list IS looking at it, so the badge clears here rather than
     at some separate "mark read" moment that could drift out of sync. */
  WS.changes.forEach((c) => { c.seen = true; });
  WS.changes.forEach((c) => {
    const g = c.turn === WS.turn ? 'gui.ws.turn_now' : 'gui.ws.turn_earlier';
    if (g !== group) { group = g; box.appendChild(mk('div', 'wsgrp', T(g))); }
    box.appendChild(chgRow(c));
  });
}

function chgRow(c) {
  const row = mk('div', 'chg' + (c.flash ? ' flash' : ''));
  c.flash = false;
  const hd = mk('div', 'chghd');
  hd.setAttribute('role', 'button');
  hd.setAttribute('tabindex', '0');
  hd.setAttribute('aria-expanded', String(!!c.open));
  const chip = mk('i', 'chgc ' + c.kind, T('gui.ws.chip.' + c.kind));
  chip.title = T('gui.ws.chip.' + c.kind + '_t');
  hd.appendChild(chip);
  /* direction:rtl on .chgp keeps the file NAME visible when a long path has to
     ellipsize -- the tail is what identifies the file, not the root. */
  const p = mk('span', 'chgp');
  p.appendChild(document.createTextNode(c.name));
  if (c.dir) p.insertBefore(mk('span', 'dir', c.dir), p.firstChild);
  p.title = c.key;
  hd.appendChild(p);
  const st = mk('span', 'chgs');
  if (c.add) st.appendChild(mk('span', 'a', `+${c.add}`));
  if (c.del) st.appendChild(mk('span', 'd', `−${c.del}`));
  hd.appendChild(st);
  /* File actions live behind this, not in a bar under the row: the list is read
     top to bottom, and a strip of icons per expanded file breaks that column. */
  const more = mk('button', 'chgm', '\u22EF');
  more.setAttribute('aria-label', T('gui.ws.actions'));
  more.onclick = (e) => { e.stopPropagation(); chgMenu(c, more.getBoundingClientRect()); };
  hd.appendChild(more);
  hd.onclick = () => { c.open = !c.open; c.auto = false; drawWs(); };
  hd.onkeydown = (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault(); c.open = !c.open; c.auto = false; drawWs();
  };
  ctxMenu(hd, () => chgItems(c));
  row.appendChild(hd);
  if (!c.open) return row;

  const d = mk('div', 'diff');
  c.hunks.forEach((h, hi) => {
    if (hi) d.appendChild(mk('div', 'hsep'));
    h.rows.forEach((r, ri) => {
      if (r[0] === 'gap') {
        const g = mk('button', 'gap', `··· ${T('gui.ws.expand_lines', { n: r[1].length })} ···`);
        g.onclick = (e) => {
          e.stopPropagation();
          h.rows.splice(ri, 1, ...r[1].map((l) => ['ctx', l]));
          drawWs();
        };
        d.appendChild(g);
        return;
      }
      d.appendChild(mk('div', 'dl ' + r[0], r[1] === '' ? ' ' : r[1]));
    });
  });
  row.appendChild(d);
  return row;
}

function chgItems(c) {
  return [
    { label: T('gui.ws.open'), fn: () => wsOpenPath(c.key) },
    { label: T('gui.ws.copy_path_do'), fn: () => copyToClip(c.key, T('gui.ws.copy_path')) },
  ];
}
function chgMenu(c, r) { menuAt(r.left, r.bottom + 6, chgItems(c)); }

function drawWsTerm(box) {
  if (!WS.cmds.length) { box.appendChild(mk('div', 'wsnote', T('gui.ws.no_cmds'))); return; }
  WS.cmds.forEach((c) => {
    const r = mk('div', 'cmdr');
    const l = mk('div', 'cmdl');
    l.append(mk('span', 'pr', '$'), mk('span', 'c', c.cmd));
    r.appendChild(l);
    const m = mk('div', 'cmdm');
    if (c.cwd) m.appendChild(mk('span', null, wsShortPath(c.cwd)));
    if (c.running) m.appendChild(mk('span', 'exitc run', T('gui.ws.running')));
    else {
      if (c.ms != null) m.appendChild(mk('span', null, c.ms >= 1000 ? `${(c.ms / 1000).toFixed(1)}s` : `${c.ms}ms`));
      if (c.code != null) {
        const okc = c.code === 0;
        m.appendChild(mk('span', 'exitc ' + (okc ? 'ok' : 'bad'),
          okc ? T('gui.ws.exit_ok') : T('gui.ws.exit_bad', { code: c.code })));
      }
    }
    r.appendChild(m);
    ctxMenu(r, () => [
      { label: T('gui.ws.copy_cmd'), fn: () => copyToClip(c.cmd, T('gui.ws.copied_cmd')) },
    ].concat(c.tail.length
      ? [{ label: T('gui.ws.copy_out'), fn: () => copyToClip(c.tail.join('\n'), T('gui.ws.copied_out')) }]
      : []));
    if (c.tail.length) {
      const t = mk('div', 'tail');
      c.tail.forEach((line) => t.appendChild(mk('div', null, line)));
      r.appendChild(t);
      /* Autoscroll only while it is still producing: yanking a finished log
         back to the bottom fights someone reading it. */
      if (c.running) requestAnimationFrame(() => { t.scrollTop = t.scrollHeight; });
    }
    box.appendChild(r);
  });
}

/* ══ subagents ════════════════════════════════════════════════════
   Work this conversation handed off. The list is scoped to the session that
   spawned them -- another conversation's background work is not this panel's
   business -- and opening one draws its whole run with the transcript
   renderer, so a subagent reads exactly like the thread that started it. */
let AGENTS = [];
let agentOpen = null;    // id of the run whose context is on screen
/* Answered by live.js once a call has come back -32601. The shell's own canned
   replay never says that, so on its own it reports every surface present --
   which is what the demo is for. */
let rpcAbsent = () => false;
let agentsLoad = null;   // () => void        -- refresh AGENTS from the server
let agentRender = null;  // (box, id) => void -- draw one run into a box

function agentSpan(it) {
  const t0 = it.started_at ? new Date(it.started_at).getTime() : 0;
  if (!t0) return '';
  const t1 = it.ended_at ? new Date(it.ended_at).getTime() : Date.now();
  return dur(Math.max(t1 - t0, 1000));
}

function agentDot(status) {
  return status === 'run' ? 'run' : status === 'error' ? 'bad' : 'ok';
}

function drawWsAgents(box) {
  if (agentOpen) return drawWsAgentCtx(box);
  if (agentsLoad) agentsLoad();
  if (!AGENTS.length) {
    const e = mk('div', 'wsempty');
    /* An empty list and a server that cannot list are different things, and
       the reader is the one who has to tell them apart -- the second one is not
       waiting for work to appear. */
    e.appendChild(mk('div', 'ttl', T(rpcAbsent('subagent') ? 'gui.ws.agents_absent' : 'gui.ws.agents_none')));
    box.appendChild(e);
    return;
  }
  const list = mk('div', 'salist');
  AGENTS.forEach((it) => {
    const row = mk('div', 'sarow');
    row.setAttribute('role', 'button');
    row.tabIndex = 0;
    row.appendChild(mk('span', 'dot ' + agentDot(it.status)));
    const b = mk('div', 'bd');
    b.appendChild(mk('div', 'nm', plainTitle(it.label)));
    const st = mk('div', 'st');
    st.appendChild(mk('span', null, T('gui.ws.agent_' + agentDot(it.status))));
    const span = agentSpan(it);
    if (span) st.appendChild(mk('span', 'sp', span));
    b.appendChild(st);
    row.appendChild(b);
    row.appendChild(mk('span', 'chev', '›'));
    const go = () => { agentOpen = it.id; drawWs(); };
    row.onclick = go;
    row.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    list.appendChild(row);
  });
  box.appendChild(list);
}

function drawWsAgentCtx(box) {
  const it = AGENTS.find((a) => a.id === agentOpen) || { label: agentOpen, status: 'run' };
  const hd = mk('div', 'sahd');
  const back = mk('button', 'back');
  back.appendChild(ico(ICO.up));
  back.appendChild(mk('span', null, T('gui.cron.back')));

     push the header it belongs to off the top of the panel. */
  const stage = mk('div', 'satx');

function drawWsWeb(box) {

/* ── tool-event hooks ──────────────────────────────────────────────────
   Fed the FULL argument object, because that is where the diff lives. */
function wsOnTool(name, args, silent) {
  const a = wsArgs(name, args);
  const path = a.path || a.file_path || '';
  let hit = null;
  if (name === 'edit_file' && path) {
    hit = wsRecordChange(path, 'edit', hunkFromEdit(a.old_text, a.new_text));
  } else if (name === 'write_file' && path) {
    hit = wsRecordChange(path, 'write', hunkFromWrite(a.content));
  } else if (name === 'exec' && a.command) {
    WS.cmds.unshift({ cmd: String(a.command), cwd: a.working_dir || '',
      running: true, code: null, ms: null, tail: [] });
  } else if (name === 'web_fetch' && a.url) {
    WS.urls.unshift({ url: String(a.url), kind: 'fetch', at: T('gui.sess.just_now') });
  } else if (name === 'web_search' && a.query) {
    WS.urls.unshift({ url: String(a.query), kind: 'search', at: T('gui.sess.just_now') });
  } else return;

  if (hit && wsOpen && wsTab === 'diff') hit.flash = true;
  /* Draw before counting: the Changes view marks rows seen as it renders, so
     counting first would flash a badge that the very next line clears. */
  if (wsOpen) drawWs();
  bumpWs();
}

function wsOnToolDone(name, args, ok, preview, ms, diff) {
  const a = wsArgs(name, args);
  if (name === 'exec') {
    const c = WS.cmds.find((x) => x.running && x.cmd === String(a.command || ''));
    if (c) {
      c.running = false; c.ms = ms == null ? null : ms;
      const lines = String(preview || '').split('\n').filter((l) => l !== '');
      /* The shell tool appends its own "Exit code: N" line. That is the real
         exit status -- read it into the chip, and drop the duplicate line. */
      const last = lines.length ? lines[lines.length - 1] : '';
      const said = last.match(/^Exit code:\s*(-?\d+)$/);
      if (said) { c.code = Number(said[1]); lines.pop(); } else c.code = ok ? 0 : 1;
      c.tail = lines.slice(-12);
    }
  }
  /* The tool's own diff is the ground truth -- for a whole-file write it is the
     only record of what was replaced, which the arguments cannot show. It
     replaces the hunk guessed at tool.start. */
  if (diff && diff.length && /^(edit_file|write_file)$/.test(name)) {
    const path = a.path || a.file_path || '';
    const c = WS.changes.find((x) => x.key === path && x.turn === WS.turn);
    if (c) {
      const h = hunkFromUnified(diff);
      const stale = c.hunks.pop();
      if (stale) { c.add -= stale.add; c.del -= stale.del; }
      c.hunks.push(h); c.add += h.add; c.del += h.del;
    }
  }
  if (wsOpen) drawWs();
  bumpWs();
}

$('#wsBtn').onclick = () => setWs(!wsOpen);

/* 1-4 pick a view while the panel has focus. Cmd-J is bound with the rest of
   the global shortcuts. */
$('#ws').addEventListener('keydown', (e) => {

  const pick = { 1: 'diff', 2: 'file', 3: 'term', 4: 'browser' }[e.key];
  if (!pick) return;
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  e.preventDefault();
  wsPick(pick);
});


/* ══ module 2: capabilities page ══════════════════════════════════ */
let extTab = 'skill', cKind = 'all', cQuery = '', dCur = null;

/* Only one module page at a time. They used to cover the whole window, so
   two open at once was invisible; now that the rail stays put, the one behind
   shows through. */
const NAV_OF = {
  capsPage: () => (extTab === 'plugin' ? 'plugBtn' : 'skillBtn'),
  xaPage: 'xaBtn',
  connPage: 'connBtn',
  memPage: 'memBtn',
  cronPage: 'cronBtn',
};

function showPage(id) {
  Object.keys(NAV_OF).forEach((p) => { $('#' + p).dataset.open = String(p === id); });
  /* Read by the rail: while a page is up it owns the selected state, so the
     session behind it stops claiming one too. */
  document.querySelector('.app').dataset.page = id ? 'on' : 'off';
  markNewCurrent();
  /* caps and memory both use the shared detail drawer */
  if (id !== 'capsPage' && id !== 'memPage') closeDetail();
}

/* Switching module resets the filters: a query typed while browsing skills is
   not a question about plugins. */
function extSet(tab) {
  if (!tab || tab === extTab) return;
  extTab = tab; cKind = 'all'; cQuery = '';
  $('#cq').value = '';
  [...$('#cKind').children].forEach((c, i) => c.setAttribute('aria-pressed', String(i === 0)));
  closeDetail();
}

function openCaps(tab) { extSet(tab); showPage('capsPage'); drawCaps(); }
const openSkills = () => openCaps('skill');
const openPlugins = () => openCaps('plugin');
function closeCaps() { showPage(null); closeDetail(); }
/* A dialog, so it layers over whatever you were reading rather than replacing
   it -- but the rail still marks itself, since that is where you came from. */
/* Called from markNewCurrent, which runs during the first draw -- so it has to
   tolerate being asked before the dialog's markup is in the document. */
function setIsOpen() {
  const v = $('#setVeil');
  return !!v && v.dataset.open === 'true';
}
function openSet() {
  $('#setVeil').dataset.open = 'true';
  markNewCurrent();
  $('#setModal').focus();
}
function closeSet() {
  $('#setVeil').dataset.open = 'false';

}

function drawCaps() {
  const box = $('#capsBody'); box.innerHTML = '';
  const title = T(extTab === 'plugin' ? 'gui.tab.plugins' : 'gui.tab.skills');
  $('#capsTitle').textContent = title;
  $('#capsPage').setAttribute('aria-label', title);
  $('#advAdd').hidden = extTab !== 'plugin';
  $('#cq').placeholder = T('gui.caps.search_' + extTab);

  const list = extTab === 'skill' ? SKILLS : PLUGINS;
  const byState = (c) => cKind === 'all'
    || (cKind === 'on' && c.state === 'on' && !needsAttn(c))
    || (cKind === 'attn' && needsAttn(c))
    || (cKind === 'add' && c.state === 'add');
  const rows = list.filter((c) => byState(c)
    && (!cQuery || (c.name + c.one + (c.cat || '') + reachText(c.reach)).toLowerCase().includes(cQuery)));

  const section = (label, items, cls, hint) => {
    if (!items.length) return;
    const s = mk('div', 'csec' + (cls ? ' ' + cls : ''));
    const hd = mk('div', 'hd');
    hd.append(mk('b', null, label), mk('span', 'n', String(items.length)));
    if (hint) hd.appendChild(mk('span', 'n', '· ' + hint));
    s.appendChild(hd);
    const g = mk('div', 'grid');
    items.forEach((c) => g.appendChild(capCard(c)));
    s.appendChild(g);
    box.appendChild(s);
  };

  // Blocked items pin above everything: a missing key is a to-do, not
  // something the user should have to discover by browsing.
  section(T('gui.caps.sec_attn'), rows.filter(needsAttn), 'attn', T('gui.caps.sec_attn_h'));
  section(T('gui.caps.sec_on'), rows.filter((c) => (c.state === 'on' || c.state === 'off') && !needsAttn(c)));
  section(T('gui.caps.sec_add'), rows.filter((c) => c.state === 'add'), '',
    T(extTab === 'skill' ? 'gui.caps.from_skills' : 'gui.caps.from_market'));

  if (!rows.length) box.appendChild(mk('div', 'empty-note', T('gui.caps.none')));

  drawCapsBadge();
}

/* Tools are a fixed inventory the agent ships with, not a store -- which is
   why they live in Settings under the agent, not in a module that exists for
   adding and removing things. Rendered by SET_PAGE.toolset. */
function toolLine(t) {
  const r = mk('div', 'trow' + (t.on ? '' : ' off'));

  nm.appendChild(mk('span', null, t.name));

function reachBadge(reach) {
  const b = mk('span', 'kd' + (reach === 'auth' ? ' auth' : ''), reachText(reach));
  b.title = reachHint(reach);
  return b;
}

function capCard(c) {
  // div+role, not <button>: the card holds real buttons (switch, 配置) and a
  // button may not contain interactive descendants
  const card = mk('div', 'card' + (c.state === 'fail' ? ' dead' : needsAttn(c) ? ' attn' : ''));
  card.setAttribute('role', 'button');
  card.tabIndex = 0;
  card.onkeydown = (e) => { if (e.key === 'Enter') openDetail(c.id); };
  // Same stable-hue letter tile as the plugin market (hash duplicated so the
  // base shell keeps working without live.js).
  let th = 0;
  for (let i = 0; i < c.name.length; i++) th = (th * 31 + c.name.charCodeAt(i)) >>> 0;
  card.appendChild(mk('span', 'pmtile th' + (th % 8), (c.name[0] || '?').toUpperCase()));
  const nm = mk('div', 'nm');
  // The badge answers "where does my data go", which "built-in vs external"
  // does NOT answer — that is why it rides on every row in all three tabs.
  nm.append(mk('span', null, c.name), reachBadge(c.reach));
  card.append(nm, mk('div', 'one', c.one));

  const st = STATE_TXT[c.state];
  const line = mk('div', 'st ' + (c.update && c.state === 'on' ? 'new' : st.cls));
  line.textContent = c.state === 'fail' ? c.err
    : c.update && c.state === 'on' ? T('gui.caps.update_to', { from: c.ver, to: c.update })
    : c.state === 'need' ? T('gui.caps.needs_cfg')
    : T(st.t);
  card.appendChild(line);

  const ctl = mk('div', 'ctl');
  if (c.state === 'need' || c.state === 'fail') {
    const b = mk('button', 'mini', T(c.state === 'fail' ? 'gui.caps.repair' : 'gui.caps.configure'));
    b.onclick = (e) => { e.stopPropagation(); openDetail(c.id); };
    ctl.appendChild(b);
  } else if (c.state === 'add') {
    const b = mk('button', 'mini ghost', T('gui.add'));
    b.onclick = (e) => { e.stopPropagation(); addCap(c); };
    ctl.appendChild(b);
  } else {
    ctl.appendChild(switchFor(c));
  }
  card.appendChild(ctl);
  card.onclick = () => openDetail(c.id);
  return card;
}

function switchFor(c) {
  const s = mk('button', 'swi');
  s.setAttribute('role', 'switch');
  s.setAttribute('aria-checked', String(c.state === 'on'));
  s.setAttribute('aria-label', T('gui.caps.toggle_aria', { name: c.name }));
  s.onclick = (e) => {
    e.stopPropagation();
    c.state = c.state === 'on' ? 'off' : 'on';
    afterCapChange(c, T(c.state === 'on' ? 'gui.caps.enabled_x' : 'gui.caps.disabled_x', { name: c.name }));
  };
  return s;
}

function addCap(c) {
  c.state = c.fields && c.fields.length ? 'need' : 'on';
  afterCapChange(c, T(c.state === 'on' ? 'gui.caps.added_on' : 'gui.caps.added_need', { name: c.name }));
  if (c.state === 'need') openDetail(c.id);
}

function afterCapChange(c, msg) {
  drawCaps(); drawCapsBadge(); drawBanner();
  if (dCur === c.id) openDetail(c.id);
  toast(msg, c.state === 'on'
    ? { label: T('gui.caps.back_to_chat'), fn: () => { closeCaps(); $('#ta').focus(); } }
    : null);
}

function openDetail(id) {
  const c = cap(id); if (!c) return;
  dCur = id;
  if ($('#capsPage').dataset.open !== 'true') openCaps();
  $('#dTitle').textContent = c.name;
  const b = $('#dBody'); b.innerHTML = '';

  const st = STATE_TXT[c.state];
  const head = mk('div');
  const badge = mk('span', 'tag' + (st.cls === 'warn' || st.cls === 'bad' ? ' warn' : ''), T(st.t));
  head.appendChild(badge);
  if (c.update && c.state === 'on') {
    const up = mk('button', 'mini', T('gui.detail.update_to_v', { v: c.update }));
    up.style.marginLeft = '8px';
    up.onclick = () => {
      c.ver = c.update; delete c.update;
      afterCapChange(c, T('gui.detail.updated_v', { v: c.ver }));
    };
    head.appendChild(up);
  }
  b.appendChild(head);

  b.appendChild(mk('p', null, c.one)).style.cssText = 'margin:0;color:var(--muted);font-size:13px';
  if (c.why) b.appendChild(mk('div', 'note', c.why)).style.borderTop = '0';

  if (c.state === 'fail') {
    const e = mk('div', 'probe bad', '⚠ ' + c.err);
    b.appendChild(e);
  }

  const dl = mk('dl', 'kv');
  const kv = (k, v) => { dl.append(mk('dt', null, k), mk('dd', null, v)); };
  kv(T('gui.detail.kind'), T(SKILLS.includes(c) ? 'gui.detail.kind_skill' : 'gui.detail.kind_plugin'));
  kv(T('gui.detail.reach'), `${reachText(c.reach)} · ${reachHint(c.reach)}`);
  if (c.cat) kv(T('gui.detail.category'), c.cat);
  kv(T('gui.detail.source'), c.src);
  kv(T('gui.detail.version'), c.ver);
  if (c.account) kv(T('gui.detail.account'), c.account);
  b.appendChild(dl);

  if (c.fields && c.fields.length) {
    b.appendChild(mk('span', 'lab', T('gui.detail.config')));
    const box = mk('div'); box.style.cssText = 'display:grid;gap:9px';
    const inputs = [];
    c.fields.forEach((f) => {
      const w = mk('div'); w.style.cssText = 'display:grid;gap:5px';
      w.appendChild(mk('label', null, f.k)).style.cssText = 'font-size:12.5px;color:var(--muted)';
      const inp = mk('input');
      inp.type = f.pw ? 'password' : 'text';
      inp.placeholder = f.ph || '';
      if (f.val) inp.value = f.val;
      w.appendChild(inp); box.appendChild(w); inputs.push([f, inp]);
    });
    b.appendChild(box);

    const row = mk('div'); row.style.cssText = 'display:flex;gap:8px;margin-top:4px';
    const save = mk('button', 'mini', T(c.state === 'on' ? 'gui.detail.save' : 'gui.detail.save_on'));
    save.onclick = () => {
      const missing = inputs.some(([f, i]) => !i.value.trim() && f.pw);
      if (missing) { toast(T('gui.detail.need_cred')); inputs[0][1].focus(); return; }
      inputs.forEach(([f, i]) => { f.val = i.value; });
      c.state = 'on'; delete c.err;
      afterCapChange(c, T('gui.caps.enabled_x', { name: c.name }));
    };
    row.appendChild(save);
    b.appendChild(row);
  }

  if (PLUGINS.includes(c)) {
    const probe = mk('div');
    const t = mk('button', 'mini ghost', T('gui.detail.test'));
    const out = mk('div', 'probe');
    t.onclick = () => {
      out.className = 'probe'; out.textContent = T('gui.detail.testing');
      setTimeout(() => {
        if (c.state === 'fail') { out.className = 'probe bad'; out.textContent = '✗ ' + c.err; }
        else if (c.state === 'on') {
          out.className = 'probe ok';
          out.textContent = '✓ ' + T('gui.detail.test_ok', { n: c.tools.length });
        } else { out.className = 'probe'; out.textContent = T('gui.detail.test_off'); }
      }, 900);

    probe.append(t, out);
    b.appendChild(probe);
  }

  if (c.tools && c.tools.length) {
    b.appendChild(mk('span', 'lab', T('gui.detail.tools')));
    const g = mk('div', 'chips');

    b.appendChild(g);

   lockup. Narrower box, larger lockup -- the pair balances near 1:2. */
.chat[data-fresh] .dock-in { max-width: 640px; }
/* The wordmark above the centred composer: glyph + name, one warm breath of
   light behind them, nothing else. Hidden the moment content exists. */
/* ── the crew ────────────────────────────────────────────────────
   Five characters perched on the composer. Purely decorative: no pointer
   events, empty alt, aria-hidden -- the textarea, the buttons and the reader's
   focus order are untouched. Positions are anchored to the composer box, so
   they follow it when it grows a line rather than floating off on their own.
   Only on screen while the task is still empty; the first message takes the
   whole column and they go. */
/* Three layers, not one. The concept sheet uses occlusion: Content leans over
   the top edge and the card cuts off its lower half, which is what welds the
   group to the composer instead of parking it in front. So the back layer
   sits under the card and the front layer over it, with the card between.
   Both track the composer's own box: same width, same centring. */
.crew { position: absolute; top: 0; left: 0; right: 0; max-width: 640px; height: 0;
  margin: 0 auto; pointer-events: none; user-select: none; display: none; }
.crew-back  { z-index: 1; }
.crew-front { z-index: 3; }
.chat[data-fresh] .crew { display: block; animation: crewin .45s ease backwards; }
/* The card is the middle layer, and it has to say so: without a z-index of
   its own it would paint in DOM order and swallow the front four. */
/* Opaque only while the task is empty. backdrop-filter samples whatever is
   behind the element and paints the blurred result, which swallows anything
   layered underneath -- that is what hid the character meant to lean from
   behind the card. With no transcript below yet the glass has nothing to
   show through it anyway, so it costs nothing here and stays untouched the
   moment there is content to read through it. */
.chat[data-fresh] .dock-in {
  position: relative; z-index: 2;
  background: var(--ink);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
.rv { position: absolute; height: auto; display: block; }
/* The contact shadow is what welds them to the card. On the layer, not on
   each image: one filter means one compositing layer instead of five, which
   is what broke rendering when these lived inside the backdrop-filtered box.
   Soft and offset down -- a character standing on an edge casts onto it. */
.crew-front { filter: drop-shadow(0 10px 9px rgba(17, 21, 30, .30)) drop-shadow(0 2px 3px rgba(17, 21, 30, .18)); }
.crew-back  { filter: drop-shadow(0 8px 8px rgba(17, 21, 30, .24)); }

/* Measured off the finished render (composer 930x168 there) and expressed
   against this one: widths are ratios of the composer's width, the perched
   three are placed by that same ratio, the two at the sides by its height.
   Content overhangs the left edge slightly, exactly as the sheet does. */
.rv-content  { width: 124px; left: -1.6%; top: -82px; }
.rv-main     { width: 118px; left: 32.2%; top: -114px; }
.rv-research { width: 107px; left: 76.3%; top: -88px; }
.rv-coding   { width: 86px;  right: -74px; top: 14px; }
.rv-data     { width: 97px;  left: -79px;  top: 58px; }
/* Narrower column: the two at the sides tuck in before they reach the
   controls. The perched three keep their footing. */
@container dock (max-width: 900px) {
  .rv-coding { right: -44px; width: 72px; }
  .rv-data   { left: -40px;  width: 74px; }
}
/* Narrower still: only the pair that frames the composer survives, and
   Content comes to the front -- a short card would cut away too much of it. */
@container dock (max-width: 720px) {
  .rv-coding, .rv-data, .rv-research { display: none; }
  .crew-back { z-index: 3; }
  .rv-content { width: 92px; left: 1%;  top: -58px; }
  .rv-main    { width: 92px; left: 46%; top: -77px; }
}
@keyframes crewin { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .chat[data-fresh] .crew { animation: none; } }
/* The offset from the composer's centre is half its height plus the breathing
   room: too small a number and the wordmark sits on the box's shoulder. */
#brand {
  position: absolute; left: 0; right: 0; bottom: calc(35% + 300px);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  gap: 0; pointer-events: none; z-index: 4;
}
.chat[data-fresh] #brand { display: flex; animation: brandin .5s cubic-bezier(.2, .7, .3, 1) backwards; }
/* Slot for the mark. Empty until there is artwork to put in it -- a mark that
   is not ready is worse than a wordmark standing on its own. */
#brand .mk { width: 62px; height: 62px; flex: none; margin-bottom: 22px; }
#brand .mk:empty { display: none; }
/* One name in one voice: the serif is the whole gesture, so nothing in it is
   set apart by colour or weight. */
#brand .wl {
  font-family: var(--serif); font-size: 70px; font-weight: 400;
  letter-spacing: -.008em; color: var(--text); line-height: 1;
}
@keyframes brandin { from { opacity: 0; transform: translateY(12px); } }
@media (prefers-reduced-motion: reduce) { .chat[data-fresh] #brand { animation: none; } }

/* The panel shares the chat's ground: what it shows -- a page, a file, a
   diff -- is content, and content sits on white. The boundary is --seam, a
   soft spill over the chat's edge that reads as the panel resting above the
   page rather than a second grey slab beside it. */
.ws { display: flex; flex-direction: column;
  min-width: 0; min-height: 0; overflow: hidden; background: var(--ink);
  box-shadow: var(--seam);
  /* Above the chat header (z2) AND the dock (z5): both are positioned scrims
     in the chat column, and the seam shadow painting under either died at
     that band -- the boundary must run the full window height or it reads
     as a tear. Level with the dock, later in the DOM, so the seam wins;
     still under the grip (z6), which has to stay grabbable at the edge. */
  position: relative; z-index: 5;
  animation: paneInR .19s ease backwards; }
.split:not([data-open="true"]) .ws { display: none; }
/* Expanded: the panel takes the window. What is on screen then is the file, the
   terminal or the page -- the transcript is not squeezed alongside it, it is
   simply behind it, and the same toggle in the same corner brings it back. */
/* The state sits on .split because the seam grip it has to hide lives in the
   chat column, not in the panel. */
.split[data-full="true"] .ws {
  position: fixed; inset: 0; z-index: 60;
  animation: up .16s ease both;
}
.split[data-full="true"] #wsGrip { display: none; }
/* Covering the window means covering the traffic lights' band too. */
:root[data-shell="1"] .split[data-full="true"] .ws-top { padding-left: var(--tl-pad, 78px); }
/* The panel starts at the top of the window, so its header row sits beside the
   chat header instead of below it: the two have to be the same height or their
   bottom hairlines disagree by 16px across the seam. */
/* The right inset matches the chat header's, so the panel toggle lands on the
   same pixel column whether it is the one in this row or the one in the chat
   header. */
.ws-top { flex: none; display: flex; align-items: center; gap: 8px; min-height: 54px;
  padding: 7px 20px 7px 9px; position: relative; z-index: 2; }
/* Same fade as the chat header, in the panel's own ground colour. */
.ws-top::after {
  content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 24px;
  background: linear-gradient(to bottom, var(--ink), transparent); pointer-events: none;
}
:root[data-shell="1"] .ws-top { min-height: var(--tl-row, 38px); }
/* Exactly one panel toggle on screen: the open panel owns the corner. */
.split[data-open="true"] #wsBtn { display: none; }
.ws-body { flex: 1; overflow: auto; min-height: 0; }
.ws-acts { flex: none; display: flex; gap: 1px; }
.wsfull .in, .wsfull.on .ex { display: none; }
.wsfull.on .in { display: block; }
/* ── workspace switcher ────────────────────────────────────────────────
   Only the active view spells its name out. That keeps four views inside a
   340px panel without the row reflowing every time you switch. */
.wseg { flex: 1; min-width: 0; display: flex; gap: 1px; }
.wseg button { display: flex; align-items: center; gap: 5px; border: 0; background: none;
  cursor: pointer; color: var(--muted); font: inherit; font-size: 12.5px;
  padding: 5px 7px; border-radius: 7px; }
.wseg button:hover { background: var(--raised); color: var(--text); }
.wseg button[aria-selected="true"] { background: var(--raised); color: var(--text); }
.wseg button svg { width: 15px; height: 15px; flex: none; }
.wseg .lb { display: none; }
.wseg button[aria-selected="true"] .lb { display: inline; }
.wseg .bdg { font-family: var(--mono); font-size: 10px; line-height: 1; color: var(--moss);
  background: color-mix(in oklab, var(--moss) 14%, transparent); border-radius: 8px; padding: 2.5px 5px; }
.wseg .rundot { width: 6px; height: 6px; border-radius: 50%; background: var(--moss); flex: none; }
@media (prefers-reduced-motion: no-preference) {
  .wseg .rundot { animation: pulse 1.6s ease-in-out infinite; }
}

.wsnote { padding: 26px 20px; color: var(--faint); font-size: 12.5px; line-height: 1.75; }
.wsgrp { padding: 11px 12px 3px; font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
  color: var(--faint); text-transform: uppercase; }

/* ── changes ───────────────────────────────────────────────────────────
   The one question a person actually has about an agent: what did it change
   in my files. Path plus a real diff, straight from the edit arguments. */
.chg { border-bottom: 1px solid var(--line-soft); }
.chghd { display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer;
  min-width: 0; width: 100%; border: 0; background: none; font: inherit; text-align: left; }
.chghd:hover { background: var(--raised); }
.chghd:focus-visible { outline: 1px solid var(--amber); outline-offset: -1px; }
/* Reserved, not injected on hover: appearing space would nudge the counts
   sideways every time the pointer crossed a row. */
.chgm { flex: none; width: 20px; height: 20px; margin-left: -2px; border-radius: 5px;
  display: grid; place-items: center; font-size: 13px; line-height: 1;
  color: var(--faint); visibility: hidden; }
.chg:hover .chgm, .chgm:focus-visible { visibility: visible; }
.chgm:hover { background: var(--line); color: var(--text); }
.chgc { flex: none; width: 17px; height: 17px; border-radius: 4px; display: grid; place-items: center;
  font-family: var(--mono); font-size: 9.5px; line-height: 1; font-style: normal; }
.chgc.edit { color: var(--amber); background: color-mix(in oklab, var(--amber) 15%, transparent); }
.chgc.write { color: var(--moss); background: color-mix(in oklab, var(--moss) 15%, transparent); }
.chgp { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-size: 12.5px; direction: rtl; text-align: left; }
.chgp .dir { color: var(--faint); }
.chgs { flex: none; font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
.chgs .a { color: var(--moss); } .chgs .d { color: var(--clay); margin-left: 5px; }

/* ── files: same row grammar as everything else in the panel.
      NOT .trow -- the extensions page already owns that name with a grid
      layout, and the later rule wins. ──────────────────────────────── */
.wsgrp.path { text-transform: none; letter-spacing: .08em; }
@media (prefers-reduced-motion: no-preference) {
  .chg.flash .chghd { animation: rowflash .9s ease; }
  @keyframes rowflash { 0%, 45% { background: color-mix(in oklab, var(--moss) 16%, transparent); } }
}
.chgnote { padding: 2px 12px 9px 37px; font-size: 11px; color: var(--faint); line-height: 1.7; }
.chgnote.lost { padding: 11px 12px 14px; border-top: 1px solid var(--line-soft); }
.diff { font-family: var(--mono); font-size: 11px; line-height: 1.65; padding-bottom: 7px; }
/* No sideways scroll: a diff you have to drag horizontally cannot be read at a
   glance, so a long line wraps and its continuation keeps the gutter indent. */
.diff .dl { white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 12px 0 28px; position: relative; }
.diff .dl::before { position: absolute; left: 12px; }
.diff .add { background: color-mix(in oklab, var(--moss) 13%, transparent); color: var(--text); }
.diff .add::before { content: "+"; color: var(--moss); }
.diff .del { background: color-mix(in oklab, var(--clay) 13%, transparent); color: var(--muted); }
.diff .del::before { content: "\2212"; color: var(--clay); }
.diff .ctx { color: var(--muted); }
.diff .gap { color: var(--faint); cursor: pointer; padding: 1px 12px 1px 28px; font-size: 10.5px;
  border-top: 1px dashed var(--line-soft); border-bottom: 1px dashed var(--line-soft);
  border-left: 0; border-right: 0; background: none; font-family: var(--mono); width: 100%; text-align: left; }
.diff .gap:hover { background: var(--raised); color: var(--muted); }
/* Separate hunks: without a rule, two edits to one file read as one
   continuous stretch of code that was never actually contiguous. */
.diff .hsep { height: 0; margin: 5px 0; border-top: 1px dashed var(--line); }

/* ── terminal: an audit trail, not a shell ─────────────────────────── */
.cmdr { border-bottom: 1px solid var(--line-soft); padding: 9px 12px; }
.cmdl { display: flex; align-items: baseline; gap: 7px; font-family: var(--mono); font-size: 11.5px; }
.cmdl .pr { color: var(--faint); flex: none; }
.cmdl .c { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--text); }
.cmdm { display: flex; gap: 8px; margin-top: 3px; align-items: center; flex-wrap: wrap;
  font-family: var(--mono); font-size: 10px; color: var(--faint); }
.exitc { padding: 1.5px 6px; border-radius: 6px; line-height: 1.5; }
.exitc.ok { color: var(--moss); background: color-mix(in oklab, var(--moss) 12%, transparent); }
.exitc.bad { color: var(--clay); background: color-mix(in oklab, var(--clay) 12%, transparent); }
.exitc.run { color: var(--moss); }
.tail { margin-top: 6px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 7px;
  font-family: var(--mono); font-size: 10.5px; line-height: 1.7; color: var(--muted);
  padding: 6px 9px; max-height: 132px; overflow-y: auto; }
.tail div { white-space: pre-wrap; overflow-wrap: anywhere; }

/* ── browser: the live page, shared with the agent ─────────────────────────
   The frame is a JPEG the backend renders from the same Chromium the agent's
   tools drive, so a click here and a click from a tool land on one page. The
   image is the surface, which means every pointer event has to be mapped from
   its displayed size back to page coordinates before being forwarded. */
/* tab strip: the browser's spine. One row, active tab carried on the ink
   ground, the rest recede onto the surface. */
.btabs {
  display: flex; align-items: flex-end; gap: 3px; padding: 6px 6px 0;
  background: var(--surface); overflow-x: auto; scrollbar-width: none; flex: none;
}
.btabs::-webkit-scrollbar { display: none; }
.btab {
  display: flex; align-items: center; gap: 7px; min-width: 0; max-width: 200px; flex: 0 1 auto;
  padding: 6px 7px 6px 10px; border: 1px solid transparent; border-bottom: 0;
  border-radius: 8px 8px 0 0; font-size: 11.5px; color: var(--muted); cursor: default;
}
.btab:hover { background: var(--raised); color: var(--text); }
.btab[aria-current="true"] {
  background: var(--ink); border-color: var(--line-soft); color: var(--text);
}
.btab .fav { width: 13px; height: 13px; flex: none; border-radius: 3px; }
.btab .fav.ltr {
  display: grid; place-items: center; background: var(--raised);
  font-family: var(--mono); font-size: 8.5px; font-weight: 700; color: var(--muted);
}
.btab .tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btab .bx {
  flex: none; width: 15px; height: 15px; display: grid; place-items: center;
  border-radius: 4px; color: var(--faint); font-size: 12px; line-height: 1; visibility: hidden;
}
.btab:hover .bx, .btab[aria-current="true"] .bx { visibility: visible; }
.btab .bx:hover { background: var(--line); color: var(--text); }
.btab .ld { width: 10px; height: 10px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--line); border-top-color: var(--amber); animation: bspin .8s linear infinite; }
@keyframes bspin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .btab .ld { animation: none; } }
.btab-new {
  flex: none; width: 24px; height: 24px; display: grid; place-items: center; align-self: center;
  border-radius: 6px; color: var(--muted); font-size: 15px; line-height: 1;
}
.btab-new:hover { background: var(--raised); color: var(--text); }

.bbar { display: flex; align-items: center; gap: 6px; padding: 7px 8px;
  border-bottom: 1px solid var(--line-soft); background: var(--ink); position: relative; }
.bbar .nav { display: flex; gap: 2px; flex: none; }
.burl { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; }
.burl .sec {
  position: absolute; left: 8px; width: 12px; height: 12px; pointer-events: none;
  color: var(--faint);
}
.burl .sec.ok { color: var(--moss); }
.burl .sec.warn { color: var(--gold); }
.bbar .url {
  flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 9px 5px 26px; font-family: var(--mono); font-size: 11.5px;
  color: var(--text); outline: 0;
  transition: border-color .13s ease, box-shadow .13s ease, background .13s ease;
}
.bbar .url:focus {
  border-color: var(--amber); background: var(--ink);
  box-shadow: 0 0 0 3px color-mix(in oklab, var(--amber) 13%, transparent);
}
/* loading progress: an indeterminate amber sweep pinned under the toolbar */
.bprog { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; z-index: 2; }
.bprog i {
  display: block; height: 100%; width: 34%; background: var(--amber); border-radius: 2px;
  animation: bslide 1.1s ease-in-out infinite;
}
@keyframes bslide { 0% { transform: translateX(-110%); } 100% { transform: translateX(400%); } }
@media (prefers-reduced-motion: reduce) { .bprog i { animation: none; width: 100%; opacity: .45; } }
/* navigation error: an honest page, not a status-line mumble */
.berr {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 10px;
  justify-items: center; background: var(--ink); padding: 24px; text-align: center; z-index: 3;
}
.berr .h { font-size: 13.5px; font-weight: 600; }
.berr .w { font-size: 12px; color: var(--muted); max-width: 46ch; line-height: 1.7; overflow-wrap: anywhere; }
.bstage { position: relative; background: #fff; min-height: 0; overflow: hidden; touch-action: none; }
:root[data-theme="dark"] .bstage { background: #0e0e11; }
/* The live view: the panel body stops scrolling and the stage takes all of it.
   The page's viewport is resized to the stage, so the frame fits 1:1; contain
   only matters for the beat between a resize and the restream. */
.ws-body[data-view="web"] { display: flex; flex-direction: column; overflow: hidden; }
.ws-body[data-view="web"] .bstage { flex: 1; }
.bstage .shot { display: block; width: 100%; height: 100%; object-fit: contain; cursor: default; outline: 0; }
.bstage.hot { outline: 2px solid var(--amber-dp); outline-offset: -2px; }
/* Keystrokes land here so an IME can compose; the reader never sees it. */
.bstage .kbsink { position: absolute; left: 0; top: 0; width: 1px; height: 1px;
  opacity: 0; border: 0; padding: 0; pointer-events: none; }
.bstage .waiting {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 12px; color: var(--faint); background: var(--ink);
}
.bnote { padding: 18px 16px; display: grid; gap: 9px; justify-items: start; }
.bnote .h { font-size: 13px; font-weight: 600; }
.bnote .w { font-size: 12px; color: var(--muted); line-height: 1.6; }
.bnote code { font-family: var(--mono); font-size: 11px; background: var(--surface);
  border: 1px solid var(--line-soft); border-radius: 5px; padding: 2px 6px; display: inline-block; }
.bnote .urls { display: grid; gap: 1px; width: 100%; }
.urow { display: flex; align-items: center; gap: 9px; padding: 8px 12px; min-width: 0; width: 100%;
  border: 0; border-bottom: 1px solid var(--line-soft); background: none; font: inherit;
  text-align: left; cursor: pointer; }
.urow:hover { background: var(--raised); }
.urow > svg { width: 14px; height: 14px; flex: none; color: var(--faint); }
.urow .u { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 12.5px; color: var(--text); }
.urow .u small { display: block; font-family: var(--mono); font-size: 10px; color: var(--faint); }
.urow .ext { flex: none; opacity: 0; color: var(--muted); }
.urow:hover .ext { opacity: 1; }

/* ── launcher: what the panel shows before anything has happened.
      A pane that reads "nothing here" 90% of the time trains people to
      ignore it for good, so the empty state teaches instead. ───────── */
/* ── subagents panel ─────────────────────────────────────────────
   A row is a run: state, what it was asked to do, how long it took. The
   detail below it is a transcript, so it gets a transcript's own scroller
   and the chat column's reading width rather than the panel's padding. */
.wsempty { padding: 26px 16px; color: var(--faint); font-size: 12px; text-align: center; }
.salist { padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 2px; }
.sarow { display: flex; align-items: center; gap: 9px; padding: 9px 10px;
  border-radius: 9px; cursor: pointer; }
.sarow:hover { background: var(--surface); }
.sarow .bd { flex: 1; min-width: 0; }
.sarow .nm { font-size: 13px; color: var(--text); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.sarow .st { display: flex; gap: 8px; font-size: 11px; color: var(--faint); margin-top: 2px; }
.sarow .st .sp { font-family: var(--mono); }
.sarow .chev { color: var(--faint); font-size: 15px; flex: none; }
.sarow:hover .chev { color: var(--text); }
.sahd { display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
  padding: 10px 12px 12px; border-bottom: 1px solid var(--line-soft); }
.sahd .trow { display: flex; align-items: center; gap: 8px; min-width: 0; width: 100%; }
.sahd .trow b { font-size: 14px; font-weight: 600; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.sahd .trow .sp { font-family: var(--mono); font-size: 11px; color: var(--faint); flex: none; }
.sahd .back { flex: none; white-space: nowrap; }
.sahd .back svg { width: 14px; height: 14px; }
/* The panel body stops scrolling so the transcript can: two nested scrollers
   both taking the wheel is how a reader loses their place. */
.ws-body[data-view="agents"] { display: flex; flex-direction: column; overflow: hidden; }
.satx { flex: 1; min-height: 0; overflow: auto; padding: 14px 12px 20px; }
.satx .ask, .satx .ans, .satx .step, .satx .stp { max-width: 100%; }
.wslaunch { padding: 22px 14px 14px; }
.wslaunch > p { margin: 0 0 16px; font-size: 12px; color: var(--faint); line-height: 1.75; }
.lcard { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 10px 12px; margin-bottom: 7px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--ink); cursor: pointer; font: inherit; }
.lcard:hover { background: var(--raised); border-color: var(--faint); }
.lcard svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.lcard .t { flex: 1; min-width: 0; font-size: 12.5px; color: var(--text); }
.lcard .t small { display: block; font-size: 10.5px; color: var(--faint); }

.fbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; flex: none;
  border-bottom: 1px solid var(--line-soft); background: var(--ink);
  -webkit-user-select: none; user-select: none; }
/* The path, not just the name: which of three README.md it is matters more than
   a few characters of width. */
.fbar .nm { flex: 1; min-width: 0; font-family: var(--mono); font-size: 11.5px; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fbar .nm b { font-weight: 500; color: var(--text); }
.fbar .nm i { font-style: normal; color: var(--faint); }
/* The folder is the tree's switch: it sits where the path begins, which is the
   one place in the view that is about where the file lives. */
.fbar .ftog { flex: none; }
.fbar .ftog[aria-pressed="false"] { color: var(--faint); }
.code { font-family: var(--mono); font-size: 11.5px; line-height: 1.7; padding: 8px 0 20px; }
.code .ln { display: flex; }
.code .ln > i { flex: none; width: 36px; text-align: right; padding-right: 11px; color: var(--faint);
  font-style: normal; user-select: none; }
.code .ln > span { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 12px; }
.code .ln.a { background: color-mix(in oklab, var(--moss) 13%, transparent); }
.code .ln.a > span { color: var(--moss); }
.code .ln.r { background: color-mix(in oklab, var(--clay) 13%, transparent); }
.code .ln.r > span { color: var(--clay); }
.code .ln.click { cursor: pointer; }
.code .ln.click:hover { background: var(--raised); }

/* ── file tree ──────────────────────────────────────────────────────────
   The workspace as one tree, with the file open beside it rather than instead
   of it: reading a file is the moment you most want to see where it sits. */
.ws-body[data-view="file"] { overflow: hidden; display: flex; }
/* Two panes, always: the reading side exists before there is anything in it, so
   opening a file changes what one pane holds and never the shape of the view.
   One bar spans both of them -- what is open is a property of the view, not of
   its right half, and a bar that stopped at the seam cut the header in two. The
   tree starts under it; the seam only divides the halves below. */
.fwrap { display: flex; flex-direction: column; width: 100%; min-width: 0; min-height: 0; }
.frow { position: relative; flex: 1; display: grid; min-height: 0;
  grid-template-columns: var(--ftw, 208px) 1fr; }
.fwrap[data-tree="off"] .frow { grid-template-columns: 0 1fr; }
.fwrap[data-tree="off"] .ftree { display: none; }
.fwrap[data-tree="off"] .grip { left: 0; margin-left: 0; }
/* Pinned to its own column: taking the tree out of the flow would otherwise
   slide the file into the zero-width one and leave the pane blank. */
.frow > .fpane { grid-column: 2; }
.frow > .grip { left: var(--ftw, 208px); margin-left: -3px; }
.ftree { display: flex; flex-direction: column; min-width: 0; min-height: 0;
  border-right: 1px solid var(--line-soft); background: var(--surface); }
/* The field carries its own glass: icon inside, hairline box, quiet until
   focused. It searches the workspace, so it reads as a search field, not a
   strainer bolted to the top of a list. */
.ftq { flex: none; position: relative; padding: 9px 10px 7px; }
.ftq svg { position: absolute; left: 19px; top: 50%; margin-top: -5.5px; width: 13px; height: 13px;
  color: var(--faint); pointer-events: none; }
.ftq input {
  display: block; width: 100%; font: inherit; font-size: 12px; color: var(--text);
  background: var(--ink); border: 1px solid var(--line); border-radius: 8px;
  padding: 5px 8px 5px 27px;
}
.ftq input:focus { outline: 0; border-color: color-mix(in oklab, var(--amber) 45%, var(--line)); }
.ftq input::-webkit-search-cancel-button { -webkit-appearance: none; }
.ftlist { flex: 1; overflow: auto; min-height: 0; padding-bottom: 12px; }
.ftrow {
  display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
  padding: 4px 10px 4px 0; border: 0; background: none; font: inherit; font-size: 12.5px;
  color: var(--text); cursor: pointer;
}
/* -color, not the shorthand: rows carry their indent guides as an inline
   background-image, and the shorthand would wipe them on every hover. */
.ftrow:hover { background-color: var(--raised); }
.ftrow.on { background-color: var(--amber-dp); }
.ftrow .sp { width: 11px; flex: none; }
.ftrow[aria-expanded="true"] > .cv { transform: rotate(90deg); }
/* The glyph is tinted by what the file is -- the one cue that survives at 13px,
   where the shapes of a .md and a .json icon are the same handful of pixels. */
.ftrow .fi { width: 13px; height: 13px; flex: none; color: var(--faint); }
.ftrow .fi.k-md { color: var(--moss); }
.ftrow .fi.k-cfg { color: var(--gold); }
.ftrow .fi.k-code { color: var(--sky); }
.ftrow .fi.k-img { color: var(--clay); }
.ftrow[aria-expanded="true"] .fi.k-dir { color: var(--muted); }
.ftrow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Search hit inside a name: a chip of the selection colour, not bold alone --
   at 12.5px bold barely reads, and the chip survives on a hovered row. */
.ftrow .hl { background: var(--amber-dp); border-radius: 3px; font-weight: 500; }
/* Result rows: where it lives, right-aligned, eating its own start when it is
   too long -- the name and the tail of the path are the parts that matter. */
.ftrow .pth { flex: 1; min-width: 0; padding-left: 10px; text-align: right;
  font-family: var(--mono); font-size: 10px; color: var(--faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; }
.ftrow:has(.pth) .nm { flex: none; max-width: 62%; }
.ftrow .sz {
  flex: none; margin-left: auto; padding-left: 8px; font-family: var(--mono);
  font-size: 10px; color: var(--faint);
}
.ftrow:not(:hover) .sz { visibility: hidden; }
.ftleaf { padding: 5px 10px; font-size: 11.5px; color: var(--faint); }
.fpane { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.fpane .fbody { flex: 1; overflow: auto; min-height: 0; }
/* Nothing open: say so quietly and keep the pane's own furniture, so the empty
   state reads as a pane waiting rather than a layout that has not loaded. */
.fempty { flex: 1; display: grid; place-content: center; justify-items: center; gap: 9px;
  padding: 24px; text-align: center; color: var(--faint); }
.fempty svg { width: 26px; height: 26px; opacity: .5; }
.fempty .t { font-size: 12px; }

/* ── file viewer ────────────────────────────────────────────────────────
   A file the agent produced is opened to be looked at, so each kind renders
   as itself: prose for markdown, the picture for an image, the page for HTML.
   Numbered source lines are the fallback, not the default -- and stay one
   click away for the kinds that have a rendered form. */
.fbar .kseg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }
.fbar .kseg button { padding: 3px 9px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.fbar .kseg button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.fview { min-height: 0; }
.fview .prose { padding: 14px 14px 26px; }
.fview .shot { display: block; padding: 14px; }
.fview .shot img {
  max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line-soft);
  background: var(--surface);
}
/* The response carries `Content-Security-Policy: sandbox`, so the frame already
   has an opaque origin; the attribute repeats it for the same reason a lock has
   two turns, and withholding allow-scripts keeps an artifact from running. */
.fview iframe { width: 100%; height: min(72vh, 720px); border: 0; background: #fff; display: block; }
.fview .csvw { overflow-x: auto; padding: 12px 14px 26px; }
.fview table.csvt { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.fview table.csvt th, .fview table.csvt td {
  border: 1px solid var(--line-soft); padding: 4px 9px; text-align: left; white-space: nowrap;
}
.fview table.csvt th { background: var(--surface); font-weight: 600; position: sticky; top: 0; }
.fview .binote { padding: 20px 16px; display: grid; gap: 8px; justify-items: start; }
.fview .binote .h { font-size: 13px; }
.fview .binote .w { font-size: 12px; color: var(--muted); line-height: 1.6; }
.fview .vspin { padding: 22px 16px; font-size: 12px; color: var(--faint); }
.fview .verr { padding: 18px 16px; font-size: 12.5px; color: var(--clay); line-height: 1.6; }

/* ── switch ────────────────────────────────────────────────────────── */
.swi {
  flex: none; width: 32px; height: 18px; border-radius: 10px; background: var(--line);
  position: relative; transition: background .16s;
}
.swi::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
  border-radius: 50%; background: var(--faint); transition: transform .16s, background .16s;
}
.swi[aria-checked="true"] { background: var(--amber-dp); }
.swi[aria-checked="true"]::after { transform: translateX(14px); background: var(--amber); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line-soft);
  border: 1px solid var(--line-soft); border-radius: 9px; overflow: hidden; }
.tile { background: var(--ink); padding: 11px 13px; }
.tile b { display: block; font-family: var(--mono); font-size: var(--step-1); font-variant-numeric: tabular-nums; }
.tile span { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--faint); margin-top: 3px; }

.bar { height: 4px; border-radius: 3px; background: var(--raised); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--amber); }

.tl { display: grid; gap: 6px; font-family: var(--mono); font-size: 11.5px; }
.tl-row { display: grid; grid-template-columns: 3px 1fr auto; gap: 9px; align-items: center; }
.tl-row i { height: 100%; min-height: 14px; border-radius: 2px; background: var(--moss); }
.tl-row i.bad { background: var(--clay); }
.tl-row span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-row b { color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }

.tree { font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: grid; gap: 2px; }
.tree .n { color: var(--text); }
.tree .sub { padding-left: 15px; color: var(--faint); }

.note { font-size: 12px; color: var(--faint); line-height: 1.65; border-top: 1px solid var(--line-soft); padding-top: 14px; }
.raw { font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: pre-wrap;
  background: var(--surface); border-radius: 7px; padding: 9px 11px; max-height: 190px; overflow: auto; }
details summary { cursor: pointer; font-family: var(--mono); font-size: 11px; color: var(--faint);
  letter-spacing: .1em; text-transform: uppercase; }
details summary:hover { color: var(--text); }
details[open] summary { margin-bottom: 8px; }

/* ═══ full-page modules (capabilities / settings) ═══════════════════ */
/* Modules replace the conversation, not the whole window: the rail stays put
   so you never lose your place in the session list. */
.page {
  position: fixed; inset: 0 0 0 var(--rail); z-index: 24; background: var(--ink);
  display: none; flex-direction: column;
}

.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 26px 60px; }

}

.trow {

/* capabilities */

/* ── skill market (SkillHub): shares the plugin tab's card grammar ──── */
.hubgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(264px, 1fr)); gap: 14px; }

/* Loading placeholders: same card shell, shimmering blocks where text goes. */

.pmhead { display: flex; align-items: center; gap: 11px; min-width: 0; }

}

:root[data-theme="dark"] .pmtile.th0 { background-color: #46390f; color: #ecc95c; }
:root[data-theme="dark"] .pmtile.th1 { background-color: #47241c; color: #e89684; }
:root[data-theme="dark"] .pmtile.th2 { background-color: #25381c; color: #9ccb84; }

:root[data-theme="dark"] .pmtile.th7 { background-color: #2b2f35; color: #aeb8c4; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .pmtile.th0 { background-color: #46390f; color: #ecc95c; }
  :root:not([data-theme="light"]) .pmtile.th1 { background-color: #47241c; color: #e89684; }
  :root:not([data-theme="light"]) .pmtile.th2 { background-color: #25381c; color: #9ccb84; }
  :root:not([data-theme="light"]) .pmtile.th3 { background-color: #1d3346; color: #8fc0e8; }
  :root:not([data-theme="light"]) .pmtile.th4 { background-color: #302946; color: #b3a4e8; }
  :root:not([data-theme="light"]) .pmtile.th5 { background-color: #1b3c37; color: #86cfc2; }
  :root:not([data-theme="light"]) .pmtile.th6 { background-color: #43202f; color: #e392b8; }
  :root:not([data-theme="light"]) .pmtile.th7 { background-color: #2b2f35; color: #aeb8c4; }
}
/* name + publisher stack beside the tile */
.pmid { min-width: 0; display: grid; gap: 1px; }
.pmnm { display: flex; align-items: center; gap: 5px; min-width: 0;
  font-family: var(--mono); font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }

.pmcnt { font-family: var(--mono); font-size: 10.5px; color: var(--faint);
  display: inline-flex; gap: 6px; align-items: center; min-width: 0; }
.pmsign { font-size: 10px; padding: 2px 7px; border-radius: 999px; font-family: var(--mono);
  letter-spacing: .05em; white-space: nowrap; }
.pmsign.gold { color: var(--gold); background: color-mix(in oklab, var(--gold) 12%, transparent); }
.pmsign.faint { color: var(--muted); background: var(--surface); }
/* status pill: dot + word, never colour alone */
.pmst { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted);
  background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 8px; }
.pmst.ok { color: var(--moss); background: color-mix(in oklab, var(--moss) 10%, transparent); }
.pmst.bad { color: var(--clay); background: color-mix(in oklab, var(--clay) 10%, transparent); }

.pminstbtn {

.pmperm .pmdot { background: var(--gold); position: relative; top: -2px; }
.pmdesc { font-size: 12.5px; color: var(--muted); line-height: 1.7; white-space: pre-wrap; }
.pmtool {
  font-family: var(--mono); font-size: 11px; color: var(--muted);

}

.csec { margin-top: 28px; }
.csec > .hd { display: flex; align-items: baseline; gap: 9px; margin-bottom: 12px; }

}

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }

.card {

/* standalone so it works in cards, provider rows and schedule rows alike */

.mini {

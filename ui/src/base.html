.mini.gold:hover { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.mini[disabled] { opacity: .55; pointer-events: none; }
.mini.ghost { border-color: var(--line); color: var(--muted); }
.mini.ghost:hover { color: var(--text); border-color: var(--faint); }

.adv { margin-top: 30px; border-top: 1px solid var(--line-soft); padding-top: 16px; }
.adv .row { display: flex; gap: 9px; margin-top: 12px; flex-wrap: wrap; }
.adv input {
  background: var(--surface); border: 1px solid var(--line); border-radius: 7px;
  padding: 7px 10px; outline: 0; font-family: var(--mono); font-size: 12.5px; flex: 1; min-width: 150px;
}
.adv input:focus { border-color: var(--muted); }

/* capability detail: a floating sheet centered over the page. The scrim owns
   the click-away; the panel settles in with a short lift, never a slide. */
.detail {
  position: fixed; inset: 0; z-index: 26; display: flex;
  align-items: center; justify-content: center; padding: 4vh 18px;
  background: rgba(26, 24, 20, .4);
  opacity: 0; pointer-events: none; transition: opacity .22s ease;
}
:root[data-theme="dark"] .detail { background: rgba(6, 6, 8, .55); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .detail { background: rgba(6, 6, 8, .55); }
}
.detail[data-open="true"] { opacity: 1; pointer-events: auto; }
.detail .dpanel {
  width: min(600px, 94vw); max-height: min(78vh, 740px); min-height: 0;
  display: flex; flex-direction: column; overflow: hidden; position: relative;
  background: var(--ink); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, .22), 0 4px 16px rgba(0, 0, 0, .1);
  transform: translateY(10px) scale(.985);
  transition: transform .3s cubic-bezier(.22, .61, .36, 1);
}
.detail[data-open="true"] .dpanel { transform: none; }
@media (prefers-reduced-motion: reduce) { .detail, .detail .dpanel { transition: none; } }
.detail header { flex: none; display: flex; align-items: center; gap: 10px; padding: 16px 16px 0 22px; }
.detail header b { flex: 1; font-size: 13.5px; }
/* When the body carries its own pmdhead identity block, the header title is
   left empty and the row collapses to a floating close control. */
.detail header:has(b:empty) { position: absolute; top: 12px; right: 12px; padding: 0; z-index: 1; }
.detail header:has(b:empty) b { display: none; }
.detail .body { overflow-y: auto; padding: 18px 22px 24px; display: grid; gap: 18px; min-height: 0; }
.dx {
  width: 30px; height: 30px; border-radius: 999px; flex: none;
  display: grid; place-items: center; color: var(--muted);
  transition: background .13s ease, color .13s ease;
}
.dx:hover { background: var(--raised); color: var(--text); }
.kv { display: grid; grid-template-columns: 74px 1fr; gap: 6px 10px; font-size: 12.5px; }
.kv dt { color: var(--faint); font-family: var(--mono); font-size: 11px; }
.kv dd { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.tag {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px;
}
.tag.warn { border-color: var(--gold); color: var(--gold); }
.probe { font-family: var(--mono); font-size: 11.5px; margin-top: 9px; }
.probe.ok { color: var(--moss); }
.probe.bad { color: var(--clay); }
.mini.danger, .mini.ghost.danger {
  color: var(--clay); border-color: color-mix(in oklab, var(--clay) 50%, transparent);
}
.mini.danger:hover, .mini.ghost.danger:hover {
  background: color-mix(in oklab, var(--clay) 12%, transparent); border-color: var(--clay); color: var(--clay);
}

/* settings — a dialog with its own two panes: the nav and the panel scroll
   independently, so a long panel never drags the section list off screen. */
.setveil { background: #0006; backdrop-filter: blur(3px); }
.smodal {
  width: min(1000px, 94vw); height: min(680px, 88vh);
  display: grid; grid-template-columns: 208px 1fr;
  background: var(--ink); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: 0 24px 64px -20px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.12);
  overflow: hidden; animation: up .18s ease both;
}
/* Same seam grammar as the app shell: the rail's grey against the body's
   white is the boundary, no rule. */
.snav {
  display: grid; grid-template-rows: auto 1fr auto; min-height: 0;
  background: var(--surface);
}
.snav .brandrow { padding: 14px 16px 6px; }
.snav .wm {
  font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: -.01em;
}
.snavlist { overflow-y: auto; min-height: 0; padding: 0 8px 8px; display: grid; gap: 0; align-content: start; }
/* Tight enough that all 14 sections fit without the rail scrolling: a section
   list you have to scroll to see hides half the settings. */
.snav button.sitem {
  text-align: left; padding: 5px 10px; border-radius: 7px; font-size: 12.5px; color: var(--muted);
  display: flex; align-items: center; gap: 9px; line-height: 1.55;
}
.snav button.sitem:hover { background: var(--raised); color: var(--text); }
.snav button.sitem[aria-current="true"] { background: var(--ink); color: var(--text); font-weight: 600;
  box-shadow: inset 0 0 0 1px var(--line-soft); }
.snav button.sitem svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor;
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; color: var(--faint); }
.snav button.sitem[aria-current="true"] svg { color: var(--amber); }
/* 14 sections stay findable only under group headings. */
.snav .grp {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--faint); padding: 11px 10px 4px;
}
.snav .grp:first-child { padding-top: 2px; }
/* The panels will never cover every key; the file always does, so the file has
   a permanent home here instead of a "more" row hidden under each panel. */
.cfgfile {
  display: flex; align-items: center; gap: 9px; text-align: left; width: 100%;
  padding: 11px 16px; border-top: 1px solid var(--line-soft); color: var(--muted);
}
.cfgfile:hover { background: var(--raised); color: var(--text); }
.cfgfile svg { width: 15px; height: 15px; flex: none; color: var(--faint); }
.cfgfile .t { display: grid; gap: 1px; min-width: 0; }
.cfgfile .l { font-size: 12.5px; }
.cfgfile .p { font-family: var(--mono); font-size: 10px; color: var(--faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sbody { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
.shd {
  display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 14px;
  border-bottom: 1px solid var(--line-soft);
}
.shd .ttl { flex: 1; min-width: 0; }
.shd h3 { font-size: 16.5px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.shd .sub { font-size: 12.5px; color: var(--muted); margin: 3px 0 0; line-height: 1.5; }
.spanels { overflow-y: auto; min-height: 0; padding: 18px 20px 26px; }

/* ── settings building blocks ───────────────────────────────────────────
   A module is a few cards, not a table: the card is what carries a heading,
   a purpose and, when the value cannot be written from here, one honest note
   at the bottom instead of a badge on every row. */
.scard {
  border: 1px solid var(--line-soft); border-radius: 12px; padding: 15px 16px;
  display: grid; gap: 12px; align-content: start;
}
.scard + .scard { margin-top: 14px; }
.scard > .ch { display: grid; gap: 3px; }
.scard > .ch .t { font-size: 13.5px; font-weight: 600; }
.scard > .ch .d { font-size: 12px; color: var(--muted); line-height: 1.55; }
.scard.flat { border: 0; padding: 0; }
/* A card is a grid, so a lone button in one would stretch edge to edge and read
   as a bar rather than as something to press. */
.scard > button { justify-self: start; }
.snote {
  display: flex; align-items: flex-start; gap: 7px; font-size: 11.5px; color: var(--faint);
  line-height: 1.5; border-top: 1px solid var(--line-soft); padding-top: 10px;
}
.snote svg { width: 13px; height: 13px; flex: none; margin-top: 1px; fill: none; stroke: currentColor;
  stroke-width: 1.7; stroke-linecap: round; }
.snote code { font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* choice cards: for a setting whose options need a sentence each. A segmented
   control cannot say what "read-only" would actually stop the agent doing. */
.spick { display: grid; gap: 8px; }
.spick.n2 { grid-template-columns: 1fr 1fr; }
.spick.n3 { grid-template-columns: repeat(3, 1fr); }
.spick .pk {
  text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
  display: grid; gap: 4px; align-content: start; color: var(--text);
  transition: border-color .12s, background .12s;
}
.spick .pk:hover { background: var(--surface); }
.spick .pk[aria-pressed="true"] { border-color: var(--amber); background: var(--amber-dp); }
.spick .pk .n { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.spick .pk .n .tick { width: 13px; height: 13px; margin-left: auto; color: var(--amber); flex: none;
  fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  opacity: 0; }
.spick .pk[aria-pressed="true"] .n .tick { opacity: 1; }
.spick .pk .w { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.spick .pk[disabled] { opacity: .5; cursor: not-allowed; }

/* segment: the no-sentence enum. Same pressed language as the cards. */
.sgm { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; width: max-content; }
.sgm .pk { padding: 7px 15px; font-size: 12.5px; color: var(--muted); transition: background .12s, color .12s; }
.sgm .pk + .pk { border-left: 1px solid var(--line); }
.sgm .pk:hover[aria-pressed="false"] { background: var(--surface); }
.sgm .pk[aria-pressed="true"] { background: var(--amber-dp); color: var(--text); font-weight: 600; }

/* about: identity line, then everything else in one diagnostics card */
.abtid { display: flex; align-items: center; gap: 12px; }
.abtid .nm { font-size: 16px; font-weight: 650; display: flex; align-items: baseline; gap: 8px; }
.abtid .nm .ver { font-family: var(--mono); font-size: 11.5px; font-weight: 400; color: var(--muted); }
.abtid > .mini { margin-left: auto; }
.abtlog { display: flex; align-items: center; gap: 8px; }
.abtlog code { font-size: 11.5px; color: var(--muted); }

/* EverOS model roles: one folded line per role, an edit area on demand */
.mrole { display: grid; gap: 9px; }
.mrole + .mrole { border-top: 1px solid var(--line-soft); padding-top: 10px; }
.mrole .hd { display: flex; align-items: center; gap: 10px; }
.mrole .hd .kchip { flex: none; width: 118px; }
.mrole .hd .mo {
  flex: 1; min-width: 0; font-family: var(--mono); font-size: 11.5px; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mrole .hd .mo.dim { color: var(--faint); font-family: inherit; }
.mrole .ff { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mrole .ff input { width: 100%; }
.mrole .ff .mfacts { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }

/* cron detail: the job's own page. Cards speak the same language as the
   list cards (ink ground, 13px radius, soft elevation); the header status
   line owns the schedule-in-words so the form does not repeat it. */
.cdstat { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.cdstat .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex: none; }
.cdstat .dot.on { background: var(--moss); }
.cdcard {
  border: 1px solid var(--line); border-radius: 13px; padding: 18px 20px;
  background: var(--ink); box-shadow: var(--elev); display: grid; gap: 14px;
}
.cdcard + .cdcard { margin-top: 16px; }
.cdcard > .t { font-size: 13.5px; font-weight: 650; display: flex; align-items: baseline; gap: 8px; }
.cdcard > .t .n { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--faint); }
.cdcard > .d { font-size: 11.5px; color: var(--faint); }
.cdfoot { display: flex; justify-content: flex-end; border-top: 1px solid var(--line-soft); padding-top: 13px; }
.cdruns { display: grid; min-width: 0; }
.cdrun {
  display: flex; align-items: center; gap: 11px; padding: 10px 6px; cursor: pointer;
  border-top: 1px solid var(--line-soft); font-size: 12.5px; text-align: left;
  border-radius: 7px; width: 100%; min-width: 0; max-width: 100%;
  transition: background .12s;
}
.cdrun:first-child { border-top: 0; }
.cdrun:hover { background: var(--surface); }
.cdrun .st { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.cdrun .st.ok { background: var(--moss); }
.cdrun .st.bad { background: var(--clay); }
.cdrun .at { font-family: var(--mono); font-size: 11.5px; color: var(--text); flex: none; }
.cdrun .note { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--faint); }
.cdrun .chev { flex: none; color: var(--faint); font-size: 14px; }
.cdrun:hover .chev { color: var(--text); }

/* theme picker: the option shows the thing it does, in miniature */
.thpick .pk { padding: 0; overflow: hidden; gap: 0; }
.thpick .shot { height: 62px; display: grid; grid-template-columns: 22px 1fr; border-bottom: 1px solid var(--line-soft); }
.thpick .shot .r1 { border-right: 1px solid var(--line-soft); }
.thpick .shot .r2 { padding: 9px 8px; display: grid; gap: 5px; align-content: start; }
.thpick .shot .bar { height: 5px; border-radius: 3px; }
.thpick .shot .bar.w70 { width: 70%; }
.thpick .shot .bar.w45 { width: 45%; }
.thpick .lb { padding: 8px 10px; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.thpick .lb .tick { width: 13px; height: 13px; margin-left: auto; color: var(--amber); flex: none;
  fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; opacity: 0; }
.thpick .pk[aria-pressed="true"] .lb .tick { opacity: 1; }
/* Both grounds are drawn with fixed values, not tokens: the point of the
   preview is to show the theme you are NOT in. */
.thpick .lt { background: #fdfdfc; }
.thpick .lt .r1 { background: #f6f5f2; }
.thpick .lt .bar { background: #d9d6cf; }
.thpick .lt .bar.hd { background: #96918a; }
.thpick .dk { background: #17171a; }
.thpick .dk .r1 { background: #1f1f23; }
.thpick .dk .bar { background: #3a3a40; }
.thpick .dk .bar.hd { background: #7a7a84; }
.thpick .sysgrid { display: grid; grid-template-columns: 1fr 1fr; height: 62px;
  border-bottom: 1px solid var(--line-soft); }
.thpick .sysgrid > * { height: 100%; }

/* font picker: a rendered sample beats the family name */
.fpick .pk { gap: 6px; }
.fpick .smp { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }

/* stat tiles: what a usage module is actually for */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border: 1px solid var(--line-soft); border-radius: 10px; padding: 11px 12px; display: grid; gap: 3px; }
.stat .v { font-family: var(--mono); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums;
  letter-spacing: -.02em; }
.stat .v.none { color: var(--faint); font-weight: 400; }
.stat .k { font-size: 11.5px; color: var(--muted); }

/* read-only mirrors of config.json: the value is the content, so it leads */
.skv { display: grid; gap: 1px; }
.skv .r { display: flex; align-items: baseline; gap: 14px; padding: 8px 0; }
.skv .r + .r { border-top: 1px solid var(--line-soft); }
.skv .r .k { font-size: 12.5px; color: var(--muted); flex: none; min-width: 132px; }
.skv .r .v { font-family: var(--mono); font-size: 12px; margin-left: auto; text-align: right;
  overflow-wrap: anywhere; }
.skv .r .v.unset { color: var(--faint); font-family: inherit; font-size: 12px; }
.skv .r .v.ok { color: var(--moss); }

/* a module that is off says what turning it on would do */
.sempty { display: grid; gap: 9px; justify-items: start; padding: 4px 0 2px; }
.sempty .h { font-size: 13px; font-weight: 600; }
.sempty .w { font-size: 12px; color: var(--muted); line-height: 1.6; }
.sempty ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.sempty li { font-size: 12px; color: var(--muted); line-height: 1.5; }

/* keyboard sheet: grouped, two columns, caps aligned */
.kbdg { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
.kbdg .g { display: grid; gap: 1px; align-content: start; }
.kbdg .gt {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--faint); padding-bottom: 5px;
}
.kbdg .r { display: flex; align-items: center; gap: 12px; padding: 6px 0; font-size: 12.5px; }
.kbdg .r + .r { border-top: 1px solid var(--line-soft); }
.kbdg .r kbd {
  margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; background: var(--surface);
  white-space: nowrap;
}
.srow { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.srow.end { justify-content: flex-end; }

/* label + control, inside a card. No per-row "not wired" badge: the card says
   it once at the bottom, which is one reading instead of six. */
.crow { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; align-items: center; }
.crow + .crow { border-top: 1px solid var(--line-soft); padding-top: 11px; margin-top: -1px; }
.crow .k { grid-column: 1; font-size: 13px; }
.crow .h { grid-column: 1; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.crow .c { grid-column: 2; grid-row: 1 / span 2; justify-self: end; align-self: center; }
.crow input[type="text"], .crow input[type="password"] { width: 190px; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.kchip {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px;
}
.kchip .led { width: 5px; height: 5px; border-radius: 50%; background: var(--moss); }
.kchip.off { color: var(--faint); }
.kchip.off .led { background: var(--line); }
/* One credential per line: fixed label column so the inputs align. */
.tkrow { display: flex; align-items: center; gap: 8px; padding: 7px 0; }
.tkrow + .tkrow { border-top: 1px solid var(--line-soft); }
.tkrow .kchip { flex: none; width: 128px; justify-content: flex-start; }
.tkrow input { flex: 1 1 auto; min-width: 0; }
.tkrow .mini { flex: none; }

.rov { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
/* A control with nothing behind it refuses out loud, where the click landed,
   and the draw it triggers snaps the control back to the stored truth. */
.nlmsg { grid-column: 1 / -1; font-size: 12px; color: var(--clay); margin-top: 2px; }
/* One bar for both boot failures, so neither is styled inline at the call. */
.topfail {
  position: fixed; left: 0; right: 0; top: 0; z-index: 99; background: var(--clay); color: #fff;
  font: 13px/1.6 var(--mono); padding: 10px 16px; text-align: center; white-space: pre-wrap;
}
.rov.dim { color: var(--faint); }

.panel { display: none; }
.panel[data-on="true"] { display: block; animation: up .18s ease backwards; }
.panel h3 { font-family: var(--mono); font-size: var(--step-1); font-weight: 600; margin: 0 0 4px; letter-spacing: -.02em; }
.panel > p.sub { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }

.fset { display: grid; gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft);
  border-radius: 10px; overflow: hidden; }
input[type="text"], input[type="password"], select {
  background: var(--surface); border: 1px solid var(--line); border-radius: 7px;
  padding: 7px 10px; outline: 0; font-family: var(--mono); font-size: 12.5px;
}
input[type="text"]:focus, input[type="password"]:focus, select:focus { border-color: var(--muted); }
input[type="range"] { accent-color: var(--amber); width: 190px; }
.val { font-family: var(--mono); font-size: 12px; color: var(--amber); margin-left: 9px;
  font-variant-numeric: tabular-nums; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { padding: 6px 13px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); font-weight: 600; }
.seg button:hover[aria-pressed="false"] { background: var(--surface); }

/* ── scheduled work: job cards ride the market card language ───────── */
.herorow { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 10px 0 18px; }
.herorow .pmhero { margin: 0; }
.cronlist { display: grid; gap: 12px; }
.cronjob {
  display: grid; grid-template-columns: 1fr auto; gap: 5px 14px; align-items: start;
  border: 1px solid var(--line); border-radius: 13px; background: var(--ink);
  box-shadow: var(--elev); padding: 15px 16px 12px;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.cronjob:hover { border-color: var(--faint); box-shadow: var(--elev-up); }
.cronjob.bad { border-left: 2px solid var(--clay); }
.cronjob .nm { display: flex; align-items: center; gap: 9px; min-width: 0;
  font-family: var(--mono); font-size: 13.5px; font-weight: 600; }
.cronjob .nm > span:not(.dot):not(.when) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cronjob .when {
  font-family: var(--mono); font-size: 10.5px; font-weight: 400; color: var(--muted);
  background: var(--surface); border-radius: 6px; padding: 2px 8px; white-space: nowrap; flex: none;
}
.cronjob .mo { font-family: var(--mono); font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.cronjob .ctl { grid-column: 2; grid-row: 1 / span 2; align-self: center; display: flex; gap: 7px; }
.cronjob .foot {
  grid-column: 1 / -1; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line-soft);
  display: flex; gap: 9px; align-items: center; flex-wrap: wrap;
}

/* ── data & memory: stat-tab band + rows + kv profile ───────────────── */
.memstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0 0 14px; }
.mstat {
  text-align: left; border: 1px solid var(--line); border-radius: 12px; background: var(--ink);
  box-shadow: var(--elev); padding: 12px 14px 11px; min-width: 0;
  transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
.mstat:hover { border-color: var(--faint); box-shadow: var(--elev-up); }
.mstat[aria-pressed="true"] {
  border-color: color-mix(in oklab, var(--amber) 50%, transparent);
  background: color-mix(in oklab, var(--amber) 6%, var(--ink));
}
.mstat .k { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.mstat .v { font-family: var(--mono); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 3px 0 1px; }
.mstat[aria-pressed="true"] .v { color: var(--amber); }
.mstat .h { font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.memtools { display: flex; gap: 10px; align-items: center; margin: 0 0 14px; }
.memtools .cfind { max-width: 420px; }
.memtools .n { font-family: var(--mono); font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.memlist { display: grid; gap: 10px; }
.memrow {
  text-align: left; border: 1px solid var(--line); border-radius: 12px; background: var(--ink);
  box-shadow: var(--elev); padding: 12px 15px 11px; display: grid; gap: 4px; cursor: pointer;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.memrow:hover { border-color: var(--faint); box-shadow: var(--elev-up); }
.memrow:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.memrow .t { display: flex; gap: 9px; align-items: baseline; min-width: 0; }
.memrow .t b { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.memrow .t .when { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
.memrow .s {
  font-size: 12.5px; color: var(--muted); line-height: 1.65;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.memrow .meta { display: flex; gap: 8px; align-items: center; margin-top: 3px; flex-wrap: wrap; }
.mmeter { width: 76px; height: 4px; border-radius: 999px; background: var(--raised); overflow: hidden; flex: none; }
.mmeter i { display: block; height: 100%; background: var(--amber); border-radius: 999px; }
.memkv {
  border: 1px solid var(--line); border-radius: 12px; background: var(--ink);
  box-shadow: var(--elev); padding: 4px 16px;
}
.memkv .row { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
.memkv .row:last-child { border-bottom: 0; }
.memkv .k {
  font-family: var(--mono); font-size: 10.5px; color: var(--faint);
  text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px;
}
.memkv .v { font-size: 13px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
.memnote { font-size: 11.5px; color: var(--faint); margin-top: 8px; line-height: 1.7; }
.mempre { font-size: 12.5px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }

/* minmax(0, 1fr), not 1fr: a grid track's automatic minimum is min-content, so
   one long unbroken string in column 1 -- a probe that reported 2000 characters
   of an agent's stdout -- widens the track until the controls in column 2 leave
   the viewport entirely, with no horizontal scroll to reach them. */
.pcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center;
  background: var(--ink); padding: 13px 15px; }
.pcard .nm { grid-column: 1; grid-row: 1; display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; font-weight: 600; }
.pcard .mo { grid-column: 1; grid-row: 2; font-family: var(--mono); font-size: 11.5px; color: var(--faint);
  overflow-wrap: anywhere; }
.pcard .ctl { grid-column: 2; grid-row: 1 / span 2; align-self: center; justify-self: end;
  display: flex; gap: 7px; }
.pcard .keyrow { grid-row: 3; }
.keyrow { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 9px; }
.keyrow input { flex: 1; min-width: 0; }

/* provider card, expanded: credentials, model list, disconnect */
.pcard.open { background: var(--surface); }
.pcard .tagm {
  font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--amber);
  border: 1px solid var(--amber-dp); border-radius: 999px; padding: 1px 6px; font-weight: 500;
}
.pform { grid-column: 1 / -1; display: grid; gap: 10px; margin-top: 12px; }
.pform .keyrow { grid-row: auto; margin-top: 0; }
.pform .cmd {
  display: flex; align-items: center; gap: 8px; background: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px 7px 11px;
}
.pform .cmd code {
  flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--text);
  overflow-x: auto; white-space: nowrap;
}
/* external-agent module: reuses .pcard / .card / .pform, and adds only the
   stacked label-input-hint field they have no shape for. */
.agf { display: grid; gap: 4px; }
.agf label { font-size: 12px; color: var(--muted); }
.agf input, .agf textarea { width: 100%; }
.agf .hint { font-size: 11.5px; color: var(--faint); line-height: 1.6; }
.led.off { background: var(--line); }
.pcard .mo.bad, .card .st.bad { color: var(--clay); }
.pcard .mo.warn, .card .st.warn { color: var(--gold); }
.pnote { font-size: 11.5px; color: var(--faint); line-height: 1.7; overflow-wrap: anywhere; }
/* A failing agent's own output is the most useful thing on the card and the
   longest: clamped to four lines so one bad row cannot push every other agent
   off the screen, and clicking it shows the rest. */
.pnote.clamp {
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
  overflow: hidden; cursor: pointer;
}
.perr { font-size: 12px; color: var(--clay); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 6px; }
.chipm {
  display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 11px;
  color: var(--muted); background: var(--ink); border: 1px solid var(--line);
  border-radius: 999px; padding: 2px 5px 2px 9px;
}
.chipm button { color: var(--faint); font-size: 10px; line-height: 1; padding: 2px 3px; border-radius: 4px; }
.chipm button:hover { color: var(--clay); background: var(--raised); }
.foldrow {
  display: block; width: 100%; text-align: left; font-size: 12.5px; color: var(--muted);
  padding: 9px 15px; border: 1px solid var(--line-soft); border-top: 0;
  border-radius: 0 0 10px 10px; background: var(--ink);
}
.foldrow:hover { background: var(--surface); color: var(--text); }
.fset:has(+ .foldrow) { border-radius: 10px 10px 0 0; }
.pickm { gap: 8px; padding: 6px 11px; }
.pickm .car { color: var(--faint); font-size: 10px; }

/* ── dialogs, toasts, palette ──────────────────────────────────────── */
/* clarify bottom sheet (ask_user): slides up above the composer.
   Foldable; closing skips the question instead of interrupting the turn. */
/* Anchored to .dock-in so it always shares the composer's axis and width,
   whatever the rail / workspace split is doing. */
.csheet {
  position: absolute; left: 0; right: 0; bottom: calc(100% + 10px); z-index: 45;
  background: var(--ink); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 14px 36px #0000001f; padding: 12px 14px;
  animation: sheetUp .2s ease; max-height: 380px; overflow-y: auto;
}
@keyframes sheetUp { from { opacity: 0; transform: translateY(16px); } }
.csheet .hd { display: flex; align-items: center; gap: 6px; }
.csheet .q { font-weight: 600; font-size: 13.5px; line-height: 1.5; flex: 1; min-width: 0; }
.csheet[data-fold="true"] .q { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
/* Drawn, not typed: as text glyphs these two sat on different baselines inside
   equal boxes, so the caret read as sagging next to the cross. */
.csheet .ic { border: 0; background: none; color: var(--faint);
  border-radius: 6px; width: 24px; height: 24px; flex: none; cursor: pointer;
  display: grid; place-items: center; }
.csheet .ic svg { width: 13px; height: 13px; stroke-linecap: round; stroke-linejoin: round;
  transition: transform .15s; }
.csheet[data-fold="true"] .ic .cv { transform: rotate(180deg); }
.csheet .ic:hover { color: var(--text); background: var(--raised); }
.csheet .body { display: grid; gap: 4px; margin-top: 8px; }
.csheet[data-fold="true"] .body, .csheet[data-fold="true"] .foot { display: none; }
.csheet .opt { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
  padding: 8px 10px; border: 0; border-radius: 8px; background: var(--surface);
  cursor: pointer; font: inherit; font-size: 13px; color: var(--text); }
.csheet .opt:hover, .csheet .opt:focus-visible { background: var(--raised); outline: 0; }
.csheet .n { font-family: var(--mono); font-size: 10.5px; color: var(--faint); flex: none;
  width: 17px; height: 17px; border-radius: 5px; background: var(--raised);
  display: grid; place-items: center; }
.csheet .opt:hover .n { background: var(--ink); }
.csheet .other { padding: 8px 10px; border-radius: 8px; background: var(--surface);
  display: flex; align-items: center; gap: 10px; }
.csheet .other input { flex: 1; min-width: 0; border: 0; background: none;
  font: inherit; font-size: 13px; color: var(--text); outline: 0; }
.csheet .foot { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
.csheet .foot .btn { padding: 5px 12px; font-size: 12px; }
/* An approval request is the same sheet with the agent's own sentence quoted
   above the two answers -- what it wants to do is the thing being judged. */
.csheet.perm .what {
  font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--text);
  background: var(--surface); border-left: 2px solid var(--amber);
  border-radius: 0 7px 7px 0; padding: 8px 10px; margin-bottom: 8px;
  overflow-wrap: anywhere; max-height: 168px; overflow-y: auto;
}
.csheet.perm .opt.go .n { background: var(--amber-dp); color: var(--amber); }

.veil { position: fixed; inset: 0; background: #0009; display: none; place-items: center; z-index: 40; }
.veil[data-open="true"] { display: grid; }
.sheet { width: min(460px, 92vw); background: var(--surface); border: 1px solid var(--line);
  border-radius: 13px; overflow: hidden; box-shadow: var(--shadow); }
.sheet header { padding: 16px 20px 0; font-weight: 600; }
.sheet .body { padding: 12px 20px 18px; color: var(--muted); font-size: 13.5px; }
.sheet footer { padding: 0 20px 16px;
  display: flex; justify-content: flex-end; gap: 9px; }
/* job-sheet form fields */
.ff { display: grid; gap: 6px; }
.ff + .ff { margin-top: 16px; }
.ff > label { font-size: 12.5px; font-weight: 600; color: var(--text); }
.ff .hint { font-size: 11.5px; color: var(--muted); }
/* A refused save: the reason is the hint, in the palette's own warning colour
   rather than a new one -- the theme already carries it for both schemes. */
.ff:has([data-bad]) .hint { color: var(--amber); }
/* Both shapes the mark takes: on a wrapper, where the schedule row puts it
   because the complaint is about the row as a whole, and on the control itself,
   where a per-field complaint puts it. A descendant combinator alone matched
   only the first, so the marked field was the one that did not look marked. */
.ff [data-bad] input, .ff [data-bad] select, .ff [data-bad] textarea,
.ff input[data-bad], .ff select[data-bad], .ff textarea[data-bad] { border-color: var(--amber); }
.ff input[type="text"] { width: 100%; }
.btn { border: 1px solid var(--line); border-radius: 7px; padding: 7px 15px; font-size: 13px; }
.btn:hover { border-color: var(--faint); }
.btn.key { background: var(--text); border-color: var(--text); font-weight: 600; color: var(--ink); }
.btn.bad { background: var(--clay); border-color: var(--clay); color: #fff; font-weight: 600; }

.toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  z-index: 50; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 12px;
  background: var(--raised); border: 1px solid var(--line); border-radius: 9px;
  padding: 9px 14px; box-shadow: var(--shadow); font-size: 13px; max-width: 90vw;
  animation: rise .2s ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(7px); } }
.toast .t { color: var(--text); }
.toast button { color: var(--amber); font-size: 12.5px; white-space: nowrap; }
.toast button:hover { text-decoration: underline; }

.pal { position: fixed; inset: 0; z-index: 45; background: #0007; display: none; }
.pal[data-open="true"] { display: block; }
.palbox {
  width: min(560px, 92vw); margin: 12vh auto 0; background: var(--surface);
  border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--shadow); overflow: hidden;
}
.palbox input { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line-soft);
  padding: 14px 16px; outline: 0; font-size: var(--step-0); font-family: var(--sans); }
.palist { max-height: 320px; overflow-y: auto; padding: 6px; }
.pitem { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 8px 10px; border-radius: 7px; font-size: 13.5px; }
.pitem[aria-selected="true"] { background: var(--raised); }
.pitem .g { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--faint); margin-left: auto; }
.pitem .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* context menu -- same glass as the composer dock: it floats over arbitrary
   content, so it is the material for floating things here, not a grey slab.
   The blur is what separates it from whatever it happens to cover. */
.menu {
  position: fixed; z-index: 42; min-width: 178px; padding: 5px;
  background: linear-gradient(
    color-mix(in oklab, var(--ink) 86%, transparent),
    color-mix(in oklab, var(--ink) 76%, transparent));
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid color-mix(in oklab, var(--line) 55%, transparent);
  border-radius: 12px;
  box-shadow: inset 0 1px 0 color-mix(in oklab, #fff 9%, transparent),
    0 1px 2px rgba(0, 0, 0, .06), 0 10px 24px -12px rgba(0, 0, 0, .2),
    0 24px 56px -22px rgba(0, 0, 0, .3);
  display: none;
}
.menu[data-open="true"] { display: block; animation: menu-in .12s ease; }
@keyframes menu-in { from { opacity: 0; transform: scale(.97); } }
@media (prefers-reduced-motion: reduce) { .menu[data-open="true"] { animation: none; } }
.menu button { display: flex; width: 100%; text-align: left; padding: 6.5px 11px;
  border-radius: 8px; font-size: 13px; color: var(--text); gap: 8px; }
.menu button:hover { background: color-mix(in oklab, var(--text) 7%, transparent); }
.menu button.bad { color: var(--clay); }
.menu hr { border: 0; border-top: 1px solid color-mix(in oklab, var(--line) 70%, transparent);
  margin: 5px 8px; }

@media (max-width: 900px) {
  .facts { grid-template-columns: 1fr; }
  /* The dialog gives up its side rail here: the sections become a scrolling
     strip along the top, which is the only way 14 of them fit this narrow. */
  .smodal { grid-template-columns: 1fr; grid-template-rows: auto 1fr; width: 96vw; height: 92vh; }
  .snav { grid-template-rows: auto; grid-template-columns: 1fr; }
  .snav .brandrow, .snav .cfgfile { display: none; }
  /* A thin scrollbar under the strip is the overflow affordance: without it
     the pages past the fold simply do not exist to the eye. */
  .snavlist {
    display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden; padding: 9px 12px 6px;
    scrollbar-width: thin;
  }
  .snav button.sitem { flex: none; white-space: nowrap; }
  /* Sentence-cards stack; the visual pickers (theme / font minis) stay 3-up:
     a miniature blown up to full width reads as a wireframe, not an option. */
  .spick.n3:not(.thpick):not(.fpick), .kbdg { grid-template-columns: 1fr; }
  .spick.n2 { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
  .hubwrap { grid-template-columns: 1fr; gap: 14px; }
  .hubrail { display: flex; gap: 5px; overflow-x: auto; position: static; padding-bottom: 4px; }
  .hubrail .lab { display: none; }
  .hubrail button { white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }
  .snav button { white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; }
  /* The nav turns into one scrolling strip here, so a group heading has to
     read as an inline separator -- as a flex item it would otherwise squeeze
     to min-content and set CJK one glyph per line. */
  .snav .grp { padding: 0 5px 0 9px; align-self: center; white-space: nowrap; }
  .snav .grp:first-child { padding-left: 0; }
  .main[data-shift="true"] { padding-right: 0; }
}
/* ── boot splash ─────────────────────────────────────────────────
   One character, one name, one thin line of motion. Same white ground as
   the app so the fade-out reads as the page settling, not a scene change. */
#splash {
  position: fixed; inset: 0; z-index: 120;
  display: grid; place-items: center;
  background: var(--ink);
  transition: opacity .5s ease;
}
#splash[data-off] { opacity: 0; pointer-events: none; }
.sp-in { display: flex; flex-direction: column; align-items: center;
  transition: transform .5s ease; }
#splash[data-off] .sp-in { transform: scale(.985); }
.sp-rv { width: 132px; height: auto; user-select: none;
  filter: drop-shadow(0 12px 10px rgba(17, 21, 30, .22));
  animation: spfloat 3.2s ease-in-out infinite; }
.sp-wl { margin-top: 20px; font-family: var(--serif); font-size: 30px;
  letter-spacing: -.008em; color: var(--text); line-height: 1; }
.sp-bar { margin-top: 36px; width: 104px; height: 2px; border-radius: 1px;
  background: var(--line-soft); overflow: hidden; position: relative; }
.sp-bar i { position: absolute; top: 0; bottom: 0; left: -40%; width: 40%;
  border-radius: 1px; background: var(--text); opacity: .5;
  animation: spsweep 1.4s cubic-bezier(.45, .1, .45, .9) infinite; }
@keyframes spfloat { 50% { transform: translateY(-5px); } }
@keyframes spsweep { to { left: 100%; } }
@media (prefers-reduced-motion: reduce) {
  .sp-rv { animation: none; }
  .sp-bar i { animation-duration: 2.4s; }
}

/* ── onboarding ──────────────────────────────────────────────────
   Sits under the splash (110 < 120) so boot fades splash → onboarding
   with no gap. Same ground as the page: the flow is the app's own first
   page, not a modal parked on top of one. */
#onb {
  position: fixed; inset: 0; z-index: 110;
  display: grid; place-items: center;
  background: var(--ink);
  transition: opacity .45s ease;
}
#onb[data-off] { opacity: 0; pointer-events: none; }
.ob { width: min(420px, calc(100vw - 48px)); }
/* Each step replaces the previous one wholesale; the entry animation is on
   the step, so every swap breathes the same way. */
.ob-step { animation: obin .3s cubic-bezier(.2, .7, .3, 1) backwards; }
@keyframes obin { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) { .ob-step { animation: none; } }
.ob-rv { width: 96px; height: auto; display: block; margin: 0 auto 26px;
  user-select: none;
  filter: drop-shadow(0 10px 9px rgba(17, 21, 30, .24)); }
.ob-t { font-family: var(--serif); font-size: 28px; font-weight: 400;
  letter-spacing: -.008em; color: var(--text); line-height: 1.2; }
.ob-s { margin-top: 10px; font-size: 13.5px; line-height: 1.6; color: var(--muted); }
.ob-step[data-center] .ob-t, .ob-step[data-center] .ob-s { text-align: center; }
.ob-list { margin-top: 22px; display: flex; flex-direction: column; gap: 6px;
  max-height: 320px; overflow: auto; overscroll-behavior: contain; }
.ob-row { display: flex; align-items: center; gap: 10px; padding: 11px 14px;
  border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
  background: var(--ink); text-align: left; font: inherit; width: 100%;
  transition: background .15s ease, border-color .15s ease; }
.ob-row:hover { background: var(--surface); }
.ob-row[data-sel] { border-color: var(--text); background: var(--surface); }
.ob-row .nm { font-size: 14px; font-weight: 500; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ob-row .bd { margin-left: auto; flex: none; font-family: var(--mono);
  font-size: 10px; letter-spacing: .04em; color: var(--faint); }
.ob-row .bd.on { color: var(--moss); }
.ob-in { width: 100%; padding: 11px 14px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--ink); outline: none;
  font: 400 14.5px/1.5 var(--sans); color: var(--text); }
.ob-in::placeholder { color: var(--faint); }
.ob-in:focus { border-color: var(--text); }
.ob-form { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
.ob-btn { margin-top: 22px; width: 100%; padding: 12px 16px; border: 0;
  border-radius: 12px; background: var(--text); color: var(--ink);
  font: 500 14.5px var(--sans); cursor: pointer;
  transition: opacity .15s ease; }
.ob-btn:hover { opacity: .88; }
.ob-btn[disabled] { opacity: .35; cursor: default; }
.ob-ghost { margin-top: 10px; width: 100%; padding: 10px; border: 0;
  background: none; border-radius: 10px; color: var(--muted);
  font: 400 13px var(--sans); cursor: pointer; }
.ob-ghost:hover { color: var(--text); }
.ob-err { margin-top: 12px; font-size: 13px; line-height: 1.5; color: var(--clay); }
.ob-err:empty { display: none; }
/* The one command the GUI cannot run for the user (OAuth sign-in happens in
   a terminal): shown as a copyable line, not paraphrased. */
.ob-cmd { margin-top: 22px; display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 12px; background: var(--surface);
  font-family: var(--mono); font-size: 12.5px; color: var(--text); }
.ob-cmd code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ob-cmd button { margin-left: auto; flex: none; border: 0; background: none;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
  color: var(--link); cursor: pointer; padding: 2px 4px; }
.ob-dots { margin-top: 36px; display: flex; gap: 7px; justify-content: center; }
.ob-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line);
  transition: background .2s ease; }
.ob-dots i.on { background: var(--text); }

</style>
</head>
<body>

<!-- Boot splash: the literal first frame. Markup lives here, before anything
     else in <body>, so the browser paints it ahead of the app shell -- no
     flash of skeleton rows or half-drawn chrome. The demo hides it on window
     load; live mode keeps it up until the boot sequence has real data. -->
<div id="splash" aria-hidden="true">
  <div class="sp-in">
    <img class="sp-rv" src="assets/ravens/main-agent.webp" alt="" decoding="async">
    <div class="sp-wl">Raven Agent</div>
    <div class="sp-bar"><i></i></div>
  </div>
</div>

<!-- First-run onboarding surface. Empty shell: showOnboard() renders the
     steps into it, driven by the same RPCs the TUI setup gate uses
     (setup.status / model.options / model.save_key / config.set), so the
     onboarding logic itself lives once, server-side. -->
<div id="onb" hidden></div>

<div id="noJs" style="position:fixed;left:0;right:0;top:0;z-index:99;background:#e0a030;color:#16150f;
  font:13px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;padding:10px 16px">
  <b>这个页面的脚本没有运行</b> —— 所以只剩空壳：没有会话列表、没有对话、发送键是空的。
  多半是当前预览环境不执行 JavaScript。把文件保存到本地，用 Chrome 或 Safari 直接打开即可。
</div>

<div class="app">
  <!-- ─── rail ─────────────────────────────────────────────────────── -->
  <aside class="rail">
    <div class="railtop">
      <!-- aria-expanded is what paints it as engaged: the toggle never moves, so
           its own state is the only thing that says whether the rail is open. -->
      <button class="ghost-ic tipdn" id="railBtn" aria-expanded="true" data-i18n-tip="gui.collapse_rail" data-i18n-aria="gui.collapse_rail">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/>
        </svg>
      </button>
      <button class="ghost-ic tipdn" id="findBtn" data-i18n-tip="gui.search_sessions" data-i18n-aria="gui.search_sessions" aria-expanded="false">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/>
        </svg>
      </button>
    </div>

    <nav class="rail-nav">
      <button class="navi newrun" id="newBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span data-i18n="gui.new_task">新任务</span>
      </button>
      <button class="navi" id="skillBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M12 4l1.9 5.3L19 11l-5.1 1.7L12 18l-1.9-5.3L5 11l5.1-1.7Z"/>
        </svg>
        <span data-i18n="gui.tab.skills">技能</span>
      </button>
      <button class="navi" id="plugBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M9 3.5v4.5M15 3.5v4.5M7 8h10v4.5a5 5 0 0 1-10 0zM12 17.5v3"/>
        </svg>
        <span data-i18n="gui.tab.plugins">插件</span>
        <span class="bdg" id="plugBdg" hidden>2</span>
      </button>
      <button class="navi" id="xaBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="3.5" y="4" width="7" height="7" rx="1.6"/><rect x="13.5" y="13" width="7" height="7" rx="1.6"/>
          <path d="M10.5 7.5h3.5a3 3 0 0 1 3 3v2.5"/>
        </svg>
        <span data-i18n="gui.nav.agents">连接</span>
        <span class="bdg" id="xaBdg" hidden>1</span>
      </button>
      <button class="navi" id="connBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M9.5 14.5 6.8 17.2a3.3 3.3 0 0 1-4.7-4.7l2.7-2.7M14.5 9.5l2.7-2.7a3.3 3.3 0 0 1 4.7 4.7l-2.7 2.7M9 15l6-6"/>
        </svg>
        <span data-i18n="gui.nav.conn">入口</span>
      </button>
      <button class="navi" id="memBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M12 3l8 4.5-8 4.5-8-4.5zM4 12.4l8 4.5 8-4.5M4 16.6l8 4.5 8-4.5"/>
        </svg>
        <span data-i18n="gui.nav.mem">记忆</span>
      </button>
      <button class="navi" id="cronBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12.5" r="7.5"/><path d="M12 8.5v4.2l2.6 1.6M9 2.5h6"/>
        </svg>
        <span data-i18n="gui.nav.cron">定时</span>
        <span class="bdg" id="cronBdg" hidden>1</span>
      </button>
    </nav>

    <div class="find" id="findBox" hidden>
      <svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/>
      </svg>
      <input id="sfind" data-i18n-ph="gui.search_sessions" data-i18n-aria="gui.search_sessions" placeholder="搜索会话" />
      <button class="clr" id="sclr" hidden data-i18n-aria="gui.clear_search">&#10005;</button>
    </div>

    <div class="list" id="list"></div>

    <div class="rail-foot">
      <button class="upnote" id="upnote" hidden>
        <span class="pip"></span>
        <span class="t" data-i18n="gui.update.note">界面有更新</span>
        <span class="rl" data-i18n="gui.update.reload">刷新</span>
      </button>
      <!-- Identity and settings share one foot row: both states are drawn by
           drawAcct(), so nothing here is a name until a session says so. -->
      <button class="me" id="meBtn" aria-haspopup="dialog" aria-expanded="false">
        <span class="av" id="meAv"></span>
        <span class="who">
          <span class="n" id="meName"></span>
          <span class="s" id="meSub"></span>
        </span>
        <span class="mono chev">&#8963;</span>
      </button>
    </div>
    <div class="grip" id="railGrip" role="separator" aria-orientation="vertical"
         data-i18n-title="gui.resize_rail" data-i18n-aria="gui.resize_rail"></div>
  </aside>

  <!-- ─── main ─────────────────────────────────────────────────────── -->
  <div class="main">
    <div class="split" id="split">
      <div class="chat">
        <!-- The session header belongs to the chat column, not the whole main
             pane: spanning both columns would leave a band of empty header
             above the workspace, which then reads as detached from the top. -->
        <div class="top">
          <button class="ghost-ic tipdn" id="railShow" data-i18n-tip="gui.expand_rail" data-i18n-aria="gui.expand_rail" hidden>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/>
            </svg>
          </button>
          <h1 id="title">新任务</h1>
          <button class="ghost-ic tipdn" id="renameBtn" data-i18n-tip="gui.rename_session" data-i18n-aria="gui.rename_session">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
              <path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14.5 6.5 17.5 9.5"/>
            </svg>
          </button>
          <span class="spacer"></span>
          <button class="ghost-ic wstog tipdn" id="wsBtn" aria-expanded="false" data-i18n-tip="gui.expand_ws" data-i18n-aria="gui.expand_ws">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M14.5 4.5v15"/>
            </svg>
            <span class="bdg" id="wsBdg" hidden>2</span>
          </button>
        </div>

        <div class="scroll" id="scroll">
          <div id="bannerHost"></div>
          <div class="flash" id="flash"></div>
          <div class="col" id="stage"></div>
        </div>
        <button class="backpill" id="backpill" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M6.5 12.5l5.5 5.5 5.5-5.5"/></svg>
        </button>
        <!-- The workspace seam, hung off the chat rather than the panel: the panel
             clips its own overflow, so a grip inside it could only be grabbed
             from one side. -->
        <div class="grip" id="wsGrip" role="separator" aria-orientation="vertical"
             data-i18n-title="gui.resize_ws" data-i18n-aria="gui.resize_ws"></div>

        <div id="brand" aria-hidden="true">
          <span class="mk"></span>
          <span class="wl">Raven Agent</span>
        </div>

        <div class="dock">
          <!-- Behind the composer on purpose: this one is drawn as a torso
               leaning over the top edge, and the card cutting off its lower
               half is what makes it look like it is ON the box rather than
               pasted in front of it. -->
          <div class="crew crew-back" aria-hidden="true">
            <img class="rv rv-content" src="assets/ravens/content.webp" alt="" decoding="async">
          </div>
          <div class="dock-in">
            <div class="queued" id="queued"></div>
            <div class="field">
              <textarea id="ta" rows="1" data-i18n-ph="gui.composer_ph" placeholder="Do anything"></textarea>
            </div>
            <!-- One bar under a clean writing line: actions and identity on
                 the left, session state and the send button on the right --
                 nothing shares the row the reader types in. -->
            <div class="under">
              <button class="tool-btn" id="attBtn" data-i18n-tip="gui.attach" data-i18n-aria="gui.attach">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M15 7l-6.2 6.2a2.6 2.6 0 0 0 3.7 3.7L19 10a4.4 4.4 0 0 0-6.2-6.2L6 10.5a6.2 6.2 0 0 0 8.8 8.8l3.4-3.4"/>
                </svg>
              </button>
              <button class="chip" id="permChip" aria-expanded="false" aria-haspopup="true">
                <svg class="pico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M12 3.5 19 6v5.5c0 4-2.9 7.4-7 9-4.1-1.6-7-5-7-9V6l7-2.5Z"/>
                </svg>
                <span id="permName">自动执行</span>
              </button>
              <span class="chip" id="envChip" hidden><span class="led"></span><span id="envName">本机</span></span>
              <span class="meter" id="meter"></span>
              <button class="chip ctx" id="ctxChip" hidden>
                <svg class="ring" viewBox="0 0 20 20" aria-hidden="true">
                  <circle class="bg" cx="10" cy="10" r="7.6"></circle>
                  <circle class="fg" cx="10" cy="10" r="7.6"></circle>
                </svg>
              </button>
              <button class="chip" id="modelChip"><span id="modelName">minimax-m3</span></button>
              <button class="go" id="go" disabled data-i18n-aria="gui.send"></button>
            </div>

            <div class="pop slash" id="slashPop" data-open="false" role="listbox" data-i18n-aria="gui.commands">
              <div class="hd"><span class="lab" data-i18n="gui.session_commands">会话命令</span></div>
              <div id="slashList"></div>
            </div>

            <div class="pop" id="permPop" data-open="false" role="dialog" data-i18n-aria="gui.perm.title">
              <div class="hd"><span class="lab" data-i18n="gui.perm.title">权限模式</span></div>
              <div id="permList"></div>
              <div class="note" data-i18n="gui.perm.wip">还没接到后端，这里的选择只记在界面上</div>
            </div>
          </div>
                    <!-- In front of the composer: these four stand on or beside it. -->
          <div class="crew crew-front" aria-hidden="true">
            <img class="rv rv-main"     src="assets/ravens/main-agent.webp" alt="" decoding="async">
            <img class="rv rv-research" src="assets/ravens/research.webp"   alt="" decoding="async">
            <img class="rv rv-coding"   src="assets/ravens/coding.webp"     alt="" decoding="async">
            <img class="rv rv-data"     src="assets/ravens/data.webp"       alt="" decoding="async">
          </div>
<div class="ainote" data-i18n="gui.ai_note">内容由 AI 生成，请注意甄别</div>
        </div>
      </div>

      <!-- workspace: what the agent is touching right now -->
      <aside class="ws" id="ws" data-i18n-aria="gui.workspace">
        <div class="ws-top">
          <!-- Segmented icons, not a dropdown: a collapsed menu hides exactly the
               thing you need in your peripheral vision -- that a command is still
               running, or that three more files changed. -->
          <div class="wseg" id="wsTabs" role="tablist">
            <button role="tab" data-w="diff" aria-selected="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8.5v7M8.5 12h7"/>
              </svg>
              <span class="lb" data-i18n="gui.ws.changes">Diff</span>
              <span class="bdg" id="wsUnseen" hidden></span>
            </button>
            <button role="tab" data-w="file" aria-selected="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M4 7.5c0-1.1.9-2 2-2h3.5l2 2.5H18c1.1 0 2 .9 2 2v7c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2v-9.5Z"/>
              </svg>
              <span class="lb" data-i18n="gui.ws.files">文件</span>
            </button>
            <button role="tab" data-w="term" aria-selected="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="m7.5 10 2.5 2-2.5 2M12.5 14.5H16"/>
              </svg>
              <span class="lb" data-i18n="gui.ws.terminal">终端</span>
              <span class="rundot" id="wsRun" hidden></span>
            </button>
            <button role="tab" data-w="browser" aria-selected="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="12" r="8"/><path d="M4.5 12h15M12 4.5c-4.5 4.5-4.5 10.5 0 15M12 4.5c4.5 4.5 4.5 10.5 0 15"/>
              </svg>
              <span class="lb" data-i18n="gui.ws.browser">浏览器</span>
            </button>
            <button role="tab" data-w="agents" aria-selected="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4.5V8M8.5 13h.01M15.5 13h.01"/>
              </svg>
              <span class="lb" data-i18n="gui.ws.agents">子智能体</span>
              <span class="rundot" id="wsAgentRun" hidden></span>
            </button>
          </div>
          <div class="ws-acts">
            <!-- Two glyphs, one button: arrows out to take the window, arrows in
                 to give it back. The state is on the button, so which one shows
                 is CSS rather than a redraw. -->
            <button class="ghost-ic wsfull tipdn" id="wsWide" aria-pressed="false"
                    data-i18n-tip="gui.ws.expand_panel" data-i18n-aria="gui.ws.expand_panel">
              <svg class="ex" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M14 5h5v5M10 19H5v-5M19 5l-6 6M5 19l6-6"/>
              </svg>
              <svg class="in" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M19 10h-5V5M5 14h5v5M13 11l6-6M11 13l-6 6"/>
              </svg>
            </button>
            <!-- Same glyph and same corner as the toggle in the chat header, and
                 only one of the two is ever on screen: the panel toggle is one
                 control at one place that changes state, not a pair that trade
                 positions when the panel opens. -->
            <button class="ghost-ic wstog tipdn" id="wsClose" aria-expanded="true" data-i18n-tip="gui.collapse_ws" data-i18n-aria="gui.collapse_ws">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M14.5 4.5v15"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="ws-body" id="wsBody"></div>
      </aside>
    </div>
  </div>
</div>

<!-- ─── module 2: capabilities (one section, two modules) ──────────────
     技能 and 插件 are separate rail entries but the same machinery: search,
     status pills, card grid, detail drawer. The section is reused; the title
     and the body follow whichever module opened it. -->
<section class="page" id="capsPage" data-open="false">
  <header>
    <h2 id="capsTitle" data-i18n="gui.tab.skills">技能</h2>
  </header>
  <div class="work">
    <div class="wrap">
      <div class="cbar">
        <div class="cfind">
          <svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/>
          </svg>
          <input id="cq" placeholder="搜索" data-i18n-aria="gui.search" />
        </div>
        <div class="pills" id="cKind" role="group" data-i18n-aria="gui.filter_status">
          <button class="pill" data-k="all" aria-pressed="true" data-i18n="gui.filter.all">全部</button>
          <button class="pill" data-k="on" aria-pressed="false" data-i18n="gui.filter.on">已启用</button>
          <button class="pill" data-k="attn" aria-pressed="false" data-i18n="gui.filter.todo">需要处理</button>
          <button class="pill" data-k="add" aria-pressed="false" data-i18n="gui.filter.add">可添加</button>
        </div>
      </div>
      <div id="capsBody"></div>

      <details class="adv" id="advAdd">
        <summary data-i18n="gui.adv_add">高级 &middot; 手动添加</summary>
        <p style="color:var(--muted);font-size:12.5px;margin:10px 0 0" data-i18n="gui.adv_hint">
          知道要接什么就直接填地址或启动命令，Raven 会握手取回它提供的动作。</p>
        <div class="row">
          <input id="mName" data-i18n-ph="gui.adv_name_ph" placeholder="名称，例如 内部 CRM" />
          <input id="mAddr" data-i18n-ph="gui.adv_addr_ph" placeholder="地址或命令，例如 npx -y @acme/crm-mcp" />
          <button class="mini" id="mAdd" data-i18n="gui.add">添加</button>
        </div>
      </details>
    </div>
  </div>
</section>

<!-- ─── module 2b: connections ─────────────────────────────────────── -->
<section class="page" id="xaPage" data-open="false" data-i18n-aria="gui.page.agents">
  <header>
    <h2 data-i18n="gui.page.agents">连接</h2>
  </header>
  <div class="work">
    <div class="wrap" id="xaBody"></div>
  </div>
</section>

<section class="page" id="connPage" data-open="false" data-i18n-aria="gui.page.conn">
  <header>
    <h2 data-i18n="gui.page.conn">入口</h2>
  </header>
  <div class="work">
    <div class="wrap" id="connBody"></div>
  </div>
</section>

<!-- ─── module 3b: data & memory ───────────────────────────────────── -->
<section class="page" id="memPage" data-open="false" data-i18n-aria="gui.mem.hero">
  <header>
    <h2 data-i18n="gui.nav.mem">记忆</h2>
  </header>
  <div class="work">
    <div class="wrap" id="memBody"></div>
  </div>
</section>

<!-- ─── module 4: scheduled ────────────────────────────────────────── -->
<section class="page" id="cronPage" data-open="false" data-i18n-aria="gui.page.cron">
  <header>
    <h2 data-i18n="gui.page.cron">定时</h2>
  </header>
  <div class="work">
    <div class="wrap" id="cronBody"></div>
  </div>

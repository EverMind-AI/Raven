# Shared upstream headers. Included at server level, not per location: a
# `proxy_set_header` anywhere inside a location replaces the whole inherited
# set, so the Origin line the template adds beside this include would be the
# first thing dropped.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# A turn streams for as long as the model takes, and an idle page holds its
# socket open between them. The defaults (60s) would cut both.
proxy_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# Main nginx configuration for the Raven image. Replaces the distribution's, so
# it carries only what serving one page and proxying one engine needs.

user  www-data;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # The page uploads whatever the reader drops into a conversation, and the
    # engine's own ceiling is the one that should refuse an oversized file.
    client_max_body_size 1024M;

    # /rpc is a WebSocket. An upgrade needs `Connection: upgrade` passed
    # through, while every other request wants the header closed out -- one map
    # answers both, so proxy.conf can hold a single Connection line.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Written by the entrypoint from /etc/nginx/templates/raven.conf.template.
    include /etc/nginx/conf.d/*.conf;
}

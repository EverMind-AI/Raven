[project]
name = "raven"
version = "0.2.0"
description = "Raven — AI-native command line agent with memory, proactivity, context control, and skill evolution"
requires-python = ">=3.12"
license =  "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*.txt", "NOTICES.md"]
authors = [
    {name = "EverMind"}
]
keywords = ["ai", "agent", "cli", "terminal", "context-management", "skill-evolution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "litellm>=1.82.1,<2.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "croniter>=6.0.0,<7.0.0",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0.0",
    "json-repair>=0.30.0",
    # everos token-aware truncation (text.py). Currently also a
    # transitive dep of litellm — pinning it directly so the everos
    # extractor keeps working if upstream ever drops it.
    "tiktoken>=0.7.0,<1.0.0",
    "questionary>=2.0.0,<3.0.0",
    "watchfiles>=0.21,<2.0",
    "everos[multimodal]==1.2.3",
    "tomli-w>=1.2.0",
    # UTS-46 host mapping for the browser's navigation check. Already present
    # transitively (httpx), declared here because the check is security-load-
    # bearing: it has to fold a host the way Chromium does before deciding, and
    # a dependency that only arrives by accident is one an upgrade can remove.
    "idna>=3.4,<4.0.0",
    "portalocker>=3.2.0",
    "mcp>=1.27.0",
    "orjson>=3.11.6,<4.0",
    # knn model router (routing/knn_router.py) embedding KNN. Currently also a
    # transitive dep (via lancedb) -- pinning it directly so routing keeps
    # working if upstream ever drops it.
    "numpy>=2.0,<3.0",
    # Image downscale/recompress for read_file (agent/tools/media.py). Reaches
    # us anyway via everos[multimodal] -> everalgo-parser, but that is a
    # three-hop transitive path — pinning it directly so reading an image keeps
    # working if any link in that chain drops it.
    "pillow>=10.0.0",
    # Rasterises a QR-login channel's scan URL server-side, so the page shows an
    # <img> instead of carrying a QR encoder. Not in the channel extras where it
    # started: signing in to WeChat happens in the UI, and an install that cannot
    # draw the code is one the reader has no way to diagnose. Pure Python, and
    # its [pil] backend is pillow, already here.
    "qrcode[pil]>=8.0",
    # Embedded vector store behind raven.knowledge -- a knowledge base indexes
    # and answers from inside the gateway process, so it must not need a server.
    # Already resolved here as a transitive dep of everos, which keeps its own
    # memory in it; named directly for the same reason numpy above is, so
    # retrieval keeps working if that chain ever changes.
    "lancedb>=0.33,<1.0",
]

[project.optional-dependencies]
channel-telegram = [
    "python-telegram-bot[socks]>=22.6,<23.0",
    "socksio>=1.0.0,<2.0.0",
    "python-socks[asyncio]>=2.8.0,<3.0.0; sys_platform != 'win32'",
]
channel-slack = [
    "slack-sdk>=3.39.0,<4.0.0",
    "slackify-markdown>=0.2.0,<1.0.0",
]
channel-discord = ["websockets>=16.0,<17.0"]
channel-whatsapp = []
channel-matrix = [
    "matrix-nio>=0.25.2; sys_platform != 'win32'",
    "mistune>=3.0.0,<4.0.0",
    "nh3>=0.2.17,<1.0.0",
]
channel-feishu = ["lark-oapi>=1.5.0,<2.0.0"]
channel-wecom = ["wecom-aibot-sdk-python>=0.1.5"]
channel-mochat = [
    "python-socketio>=5.16.3,<6.0.0",
    "msgpack>=1.2.1,<2.0.0",
    "websocket-client>=1.9.0,<2.0.0",
]
channel-qq = ["qq-botpy>=1.2.0,<2.0.0"]
channel-dingtalk = ["dingtalk-stream>=0.24.0,<1.0.0"]
channel-email = []
channel-weixin = [
    "pycryptodome>=3.20.0",
]
channels = [
    "raven[channel-telegram]",
    "raven[channel-slack]",
    "raven[channel-discord]",
    "raven[channel-whatsapp]",
    "raven[channel-matrix]",
    "raven[channel-feishu]",
    "raven[channel-wecom]",
    "raven[channel-mochat]",
    "raven[channel-qq]",
    "raven[channel-dingtalk]",
    "raven[channel-email]",
    "raven[channel-weixin]",
]
tools = [
    "readability-lxml>=0.8.4,<1.0.0",
]
sandbox = [
    "anyio>=4.0",
    "boxlite==0.9.5 ; sys_platform != 'win32'",
]
# Driving a real browser is an opt-in extra: playwright pulls a browser binary
# of its own, which no other capability needs. raven.browser imports it lazily
# and reports the extra as missing rather than failing to start.
browser = [
    "playwright>=1.49,<2.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]
eval = [
    # benchmarks/proactivity_eval PROBE adapter (deprioritized stretch test) needs
    # this to pull the PROBE dataset. Keep out of main deps so production installs
    # stay lean.
    "huggingface-hub>=1.11.0",
]

[project.scripts]
raven = "raven.cli.commands:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["raven"]

[tool.hatch.build.targets.wheel.force-include]
"bridge" = "raven/bridge"

# The prebuilt, self-contained TUI bundle (ui-tui/dist/entry.js) is packaged
# into the wheel as raven/ui-tui/dist so `pip`/`uv tool install` yields a
# working `raven tui` with no source checkout. It is added *conditionally* by
# the custom build hook below (hatch_build.py) — a static force-include would
# hard-fail when dist/ is absent (it's gitignored), breaking `git clone && uv
# sync`. CI builds the bundle before building the release wheel
# (see .github/workflows/release.yml).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build]
include = [
    "raven/**/*.py",
    "raven/plugins/**/raven-plugin.toml",
    "raven/templates/**/*.md",
    "raven/skills/**/*.md",
    "raven/skills/**/*.sh",
    # Bundled model-label snapshot, so a fresh install labels models offline.
    "raven/providers/data/*.json",
    # Playbook role-pool defaults and the builtin playbook library.
    "raven/playbook/*.yaml",
    "raven/playbook/builtin/**/*.md",
    # Tracing dashboard viewer (dependency-free Node server + static client).
    "raven/tracing/viewer/**/*.js",
    "raven/tracing/viewer/**/*.css",
    "raven/tracing/viewer/**/*.html",
    "raven/tracing/viewer/**/*.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "raven/",
    "bridge/",
    "hatch_build.py",
    "README.md",
    "LICENSE",
]

[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.13.4",
    # everalgo-boundary 0.3.0 added a required third field to the
    # DetectionResult NamedTuple; everalgo-agent-memory still constructs it with
    # two, under a range (>=0.2.0,<2.0.0) wide enough to pick the break up. The
    # result is a TypeError inside everos, surfacing as a 500 from /memory/add,
    # so a sub-agent whose memory backend is everos fails every turn.
    # This guards the resolutions that read this table: `uv lock --upgrade`, a
    # re-lock after the lockfile is deleted, and in-repo `uv pip install` /
    # `uv run --with`. It does NOT reach `uv tool install`, which ignores
    # constraint-dependencies and takes ceilings only from `-c` -- install.sh
    # passes one exported from the lock, so that path is covered separately.
    # Not removable when everos next moves: agent-memory 0.4.0 still passes two
    # fields and still declares >=0.2.0, so the ceiling stays correct and
    # inactive. It goes when a release actually passes the third field.
    "everalgo-boundary<0.3",
    "pip>=26.1.2",
    "pyjwt>=2.13.0",
    "python-engineio>=4.13.3",
    "python-dotenv>=1.2.2",
    "starlette>=1.3.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "benchmarks/**/data",
    "benchmarks/**/results",
    "benchmarks/**/output",
    # The vendored sub-agent builds. Not adopted the way agentscope below was:
    # each is a separate upstream project replaced wholesale on the next zip,
    # so a lint fix made here cannot survive and reports nobody can act on are
    # the only thing linting them would produce.
    "subagents/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "S101", "S105", "S106", "S107", "S506", "S605", "S607"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test conventions: asserts, hardcoded creds in fixtures, naming, redefinition,
# unused variables, deferred imports, ambiguous names — idiomatic in tests, not
# product code. (Auto-fixable churn E702/F401/I001 is left for the reformat branch.)
"tests/**" = ["E402", "E741", "F811", "F841", "N802", "N805", "N806", "N817", "N818", "S101", "S105", "S106", "S107", "S607"]

# Tracing probe factories take the target class as an argument, named after
# the class (e.g. `def _install_llm(LLMProvider: type)`) for readability.
"raven/tracing/instrument.py" = ["N803"]

# The login shell has to be resolved through PATH rather than pinned to an
# absolute path: a fixed /bin/bash would defeat capturing a login shell that
# may live elsewhere on a given host.
"raven/agent/subagent/backends/env.py" = ["S607"]

# CLI startup-order / deferred imports, accepted long-term.
"raven/cli/commands.py" = ["E402"]
"raven/cli/cron_commands.py" = ["E402"]
"raven/cli/sentinel_commands.py" = ["E402"]

# Other deferred / startup-order imports, accepted.
"benchmarks/skill_evals/fixtures/build_mock_library.py" = ["E402"]
"raven/eval_engine/engine.py" = ["E402"]
"raven/memory_engine/skill_local/registry.py" = ["E402"]
"scripts/skill_forge_full_e2e.py" = ["E402"]

# asserts; convert-vs-keep tracked in v2.
"raven/agent/subagent/manager.py" = ["S101"]
"raven/channels/adapters/discord/channel.py" = ["S101"]
"raven/channels/adapters/weixin/channel.py" = ["S101"]
"raven/cli/doctor_commands.py" = ["S101"]
"raven/cli/onboard_commands.py" = ["S101"]
"raven/memory_engine/contract_test.py" = ["S101"]
"raven/proactive_engine/sentinel/executor/action_executor.py" = ["S101"]
"raven/proactive_engine/sentinel/executor/defer_manager.py" = ["S101"]
"raven/proactive_engine/sentinel/predictor/task_discoverer.py" = ["S101"]

# scripts/: dev utilities; partial-path subprocess, asserts.
"scripts/check_commit_file.py" = ["S607"]
"scripts/check_commit_messages.py" = ["S607"]
"scripts/check_large_files.py" = ["S607"]
"scripts/skill_hub_e2e.py" = ["S101"]

# evolver + appworld bench: git/bash subprocess drivers by design (S607);
# K is SOP domain vocabulary for trials-per-task (N803/N806); *_PASS /
# *_TOKEN constants are outcome labels and a beacon marker, not credentials
# (S105); asserts tracked with the convert-vs-keep batch above (S101).
"raven/evolver/tree/git_ops.py" = ["S607"]
"raven/evolver/launch/config.py" = ["S607"]
"raven/evolver/launch/contract.py" = ["S607"]
"raven/evolver/launch/runner.py" = ["S607"]
"raven/evolver/orchestrator/nodes/semantic.py" = ["S101"]
"raven/evolver/scheduler/cold_start_bandit.py" = ["N803", "N806"]
"raven/evolver/scheduler/tree_aware_bandit.py" = ["N803"]
"raven/evolver/scheduler/tree_loader.py" = ["S101"]
"raven/evolver/analysis/stability_bucket.py" = ["S105"]
"raven/evolver/applier/beacon_guard.py" = ["S105"]
"raven/evolver/judge/prompts.py" = ["S105"]
"benchmarks/appworld/evolve/adapter.py" = ["N803", "S105"]
"benchmarks/appworld/evolve/editor.py" = ["N806"]
"benchmarks/appworld/evolve/sandbox.py" = ["S607"]

# benchmarks/: eval harness; naming, ambiguous names, unused vars,
# partial-path subprocess.
"benchmarks/clawbench/stream.py" = ["S607"]
"benchmarks/proactivity_eval/runners/_common/drivers/longrun.py" = ["F841"]
"benchmarks/proactivity_eval/runners/_common/drivers/pbench.py" = ["E741", "N806"]
"benchmarks/proactivity_eval/runners/_common/longrun_adapters.py" = ["N814", "S607"]
"benchmarks/proactivity_eval/runners/_common/openclaw.py" = ["S607"]
"benchmarks/proactivity_eval/runners/longrun_scorecard.py" = ["F841"]
"benchmarks/proactivity_eval/runners/pa_scorecard.py" = ["N806"]
"benchmarks/proactivity_eval/runners/synthesizers/keyword.py" = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/integration", "*.egg", ".*", "build", "dist"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Four workers, here rather than in each caller's command line, because the
    # invocation that matters most -- the `tests` job -- lives on the orphan
    # `ci` branch, and `addopts` is the one place that reaches every caller at
    # once. Measured on one tree, same 11936 tests both ways: 10m11s at -n 0
    # against 2m14s here, and coverage 80.1055% against 80.1022% -- two lines
    # out of 57670, so the coverage gate reads the same numbers. Those two are
    # the BrokenPipeError arm in subagent/backends/cli_agent.py, which is a race
    # with the child's exit rather than anything the workers changed: a second
    # comparison on an older tree moved the same arm, and moved one in
    # builtin_agents.py the other way.
    # A fixed 4 rather than `auto`: inside a container `os.cpu_count()` reports
    # the host's cores, not the job's, so `auto` is a number nobody chose --
    # bounded memory and predictable behaviour beat a guess, and on a 2-core
    # runner four CPU-bound workers cost only context switching.
    "-n",
    "4",
    "-m",
    "not integration and not e2e",
]
asyncio_mode = "auto"
markers = [
    "integration: needs a real external resource (LLM / RPC subprocess / VM / network); deselected by default, run with '-m integration' or by pointing at tests/integration",
    "e2e: spawns real subprocesses / drives the full stack (slow); deselected by default, run with '-m e2e' (e.g. tests/tui/autotest)",
    "real_llm: hits a real everos runtime (LLM + embedding); skipped unless EVEROS_LLM__API_KEY / EVEROS_EMBEDDING__MODEL are configured",
    "llm_judge: uses an LLM as a grader for extraction quality (extra cost / non-determinism); opt-in",
]

[tool.coverage.run]
branch = true
source = ["raven"]
omit = [
    "raven/__main__.py",
    "raven/evolver/__main__.py",
    "raven/utils/win_fcntl_shim.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
omit = [
    "raven/__main__.py",
    "raven/evolver/__main__.py",
    "raven/utils/win_fcntl_shim.py",
]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "import-linter>=2.14",
    "json-repair>=0.59.5",
    "jsonschema>=4.23.0",
    "packaging>=26.1",
    "pexpect>=4.9",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pyte>=0.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.15.12",
]

[tool.importlinter]
root_package = "raven"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "inner layers know no surface"
type = "forbidden"
source_modules = [
    "raven.spine", "raven.contracts", "raven.agent", "raven.memory_engine",
    "raven.context_engine", "raven.providers", "raven.session", "raven.sandbox",
    "raven.routing", "raven.token_wise", "raven.plugins", "raven.channels",
    "raven.gateway", "raven.market", "raven.ops", "raven.security", "raven.auth",
]
forbidden_modules = ["raven.cli", "raven.rpc", "raven.web_rpc", "raven.proactive_engine"]
# Debt allowlist: may only SHRINK. Lazy machinery-at-surface-address edges,
# each queued for relocation in the ledger: CronTool consumed by the loop
# (turn path registers it, wiring builds it), and the skill install engine
# consumed by market through its rpc method wrapper.
ignore_imports = [
    "raven.agent.loop.turn_path -> raven.proactive_engine.schedulers.cron.tool",
    "raven.agent.loop.wiring -> raven.proactive_engine.schedulers.cron.tool",
    "raven.market.install -> raven.rpc.methods.skillhub",
]

[[tool.importlinter.contracts]]
name = "the kernel stands alone"
type = "forbidden"
# The shippable kernel (papers + spine + tracing) must not reach the rest of
# the tree at import time -- this is what makes a raven-core wheel a build
# artifact rather than a refactor. Lazy in-method edges are the named debt
# below: each fires only inside an LLMProvider method a paper-only consumer
# never calls, and the list may only shrink.
source_modules = ["raven.contracts", "raven.spine", "raven.tracing"]
forbidden_modules = [
    "raven.agent", "raven.channels", "raven.cli", "raven.config",
    "raven.context_engine", "raven.core", "raven.eval_engine", "raven.gateway",
    "raven.market", "raven.mcp", "raven.memory_engine", "raven.ops",
    "raven.playbook", "raven.plugins", "raven.proactive_engine",
    "raven.providers", "raven.routing", "raven.rpc", "raven.sandbox",
    "raven.security", "raven.session", "raven.skill_hub", "raven.token_wise",
    "raven.utils", "raven.web_rpc",
]
ignore_imports = [
    "raven.contracts.llm_provider -> raven.providers.rates",
    "raven.contracts.llm_provider -> raven.providers.prompt_cache",
    "raven.contracts.llm_provider -> raven.providers.truncation",
    "raven.tracing.config -> raven.config.loader",
    "raven.tracing.semconv -> raven.providers.registry",
    "raven.tracing.usage -> raven.token_wise.pricing",
]

[[tool.importlinter.contracts]]
name = "channel adapters are independent cargo"
type = "independence"
modules = [
    "raven.channels.adapters.dingtalk", "raven.channels.adapters.discord",
    "raven.channels.adapters.email", "raven.channels.adapters.feishu",
    "raven.channels.adapters.matrix", "raven.channels.adapters.mochat",
    "raven.channels.adapters.qq", "raven.channels.adapters.slack",
    "raven.channels.adapters.telegram", "raven.channels.adapters.wecom",
    "raven.channels.adapters.weixin", "raven.channels.adapters.whatsapp",
]

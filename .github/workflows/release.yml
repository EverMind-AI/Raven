# Release build — DRAFT.
#
# Goal: produce a wheel that ships a fresh, self-contained TUI bundle
# (ui-tui/dist/entry.js) so `pip`/`uv tool install` yields a working
# `raven tui` with no source checkout and no npm build on the user's machine.
#
# This is the "self-maintaining" piece: every tagged release rebuilds
# entry.js from the current ui-tui/ source, so the packaged TUI can never drift
# behind the Python code. Do NOT commit dist/entry.js to git — it is a build
# artifact produced here.
#
# Trigger: push a version tag (v1.2.3) or run manually.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # 1) Node toolchain to build the TUI bundle.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # 2) Build the self-contained bundle into ui-tui/dist/entry.js.
      #    esbuild bundles react/ink in — no node_modules ships in the wheel.
      - name: Build TUI bundle
        working-directory: ui-tui
        run: |
          npm ci
          npm run build
          test -f dist/entry.js  # fail fast if the bundle didn't land

      # 2b) Build the served page into ui-web/dist. `ui-web/dist` is gitignored, so a
      #     fresh CI checkout has none and the wheel hook's else-branch fires
      #     its warning -- every tagged release would answer `/` with
      #     "No front end built here", which is the state this MR exists to end.
      - name: Build the served page
        run: |
          npm ci --prefix ui-web
          npm run --prefix ui-web build
          python ui-web/build.py
          test -f ui-web/dist/index.html  # fail fast if the page didn't land

      # 3) Build the wheel directly from the checkout so the freshly generated
      #    ui-tui/dist/entry.js is visible to Hatch's conditional build hook.
      #    Then build the sdist separately. A combined `uv build` first creates
      #    an sdist and then builds the wheel from that sdist, which drops this
      #    gitignored bundle before the wheel hook can include it.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      # 2c) The template picker's covers. One cover is a LibreOffice conversion,
      #     and the gateway used to start ten of them a few seconds after every
      #     boot -- on hosts whose reader never opens the picker as much as on
      #     the ones that do. Rendered here instead, from the same templates the
      #     wheel carries, so an installed raven never runs LibreOffice to draw
      #     a picture it could have been given. `--extra dev` is what puts the
      #     engine (and PyMuPDF with it) in the environment the script imports.
      - name: Bake the deck template covers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress
          uv run --frozen --extra dev python scripts/bake_deck_template_covers.py

      - name: Build wheel + sdist
        run: |
          uv build --wheel
          uv build --sdist
          # The everos memory plugin ships as its own wheel from the same
          # release; gh release create uploads everything under dist/.
          uv build --wheel plugins-dist/everos-memory -o dist
          # The product engines ship the same way. install.sh resolves them
          # from the release assets by name, and the roster leaves
          # Raven-Design and Raven-PPT disabled when they are not installed.
          uv build --wheel plugins-dist/design-engine -o dist
          uv build --wheel plugins-dist/ppt-engine -o dist

      # 4) Sanity gate: the wheel MUST contain the bundle and MUST NOT carry
      #    node_modules or ui-tui sources (keeps the wheel lean and the smoke honest).
      - name: Verify wheel contents
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          whl = sorted(glob.glob("dist/raven-*.whl"))[-1]
          names = zipfile.ZipFile(whl).namelist()
          assert "raven/ui-tui/dist/entry.js" in names, "entry.js missing from wheel"
          assert "raven/ui/dist/index.html" in names, "index.html missing from wheel"
          # The half that degrades quietly: `resolve_ui_dist` accepts a dist with
          # no assets, `build_app` skips mounting /assets, and the page loads
          # with broken images rather than failing.
          assert any(n.startswith("raven/ui/dist/assets/") for n in names), "page assets missing from wheel"
          assert not any("node_modules" in n for n in names), "node_modules leaked into wheel"
          # The only ui-tui/ entry must be the bundle — no TS source, no stray files.
          ui = [n for n in names if "ui-tui/" in n]
          assert ui == ["raven/ui-tui/dist/entry.js"], f"unexpected ui-tui entries: {ui}"
          # The agent-product tree degrades the other way: an sdist-derived wheel
          # has no folders at all, and onboarding step 5 reports an empty
          # installation rather than failing.
          agents = [n for n in names if n.endswith("/subagent.json")]
          assert agents, "agent products missing from wheel"
          # The tree is enumerated from git precisely so a built working copy's
          # filled-in .env cannot ride along. Asserted at the publish boundary too.
          leaked = [
              n for n in names
              if n.rsplit("/", 1)[-1].startswith(".env")
              and not n.endswith((".example", ".sample", ".template"))
          ]
          assert not leaked, f"secrets leaked into wheel: {leaked}"
          print(f"OK: {whl} ships entry.js, the served page and {len(agents)} sub-agents, no node_modules")
          PY

      # 4a) The deck engine's own payload. The templates are tracked now, but
      #     a wheel that silently ships none is exactly the failure this gate
      #     exists to catch: `default_template_catalog()` returns an empty
      #     tuple and the deck agent degrades to "bring your own template"
      #     instead of failing, so nothing else notices.
      - name: Verify ppt-engine wheel carries the bundled templates
        run: |
          python3 - <<'PY'
          import glob, hashlib, json, zipfile
          whl = sorted(glob.glob("dist/ppt_engine-*.whl"))[-1]
          pins = json.load(open("plugins-dist/ppt-engine/templates.manifest.json"))["files"]
          archive = zipfile.ZipFile(whl)
          names = set(archive.namelist())
          for entry in pins:
              member = f"raven_ppt/assets/templates/{entry['name']}"
              assert member in names, f"{entry['name']} missing from {whl}"
              blob = archive.read(member)
              assert len(blob) == entry["bytes"], f"{entry['name']} is {len(blob)} bytes, pinned {entry['bytes']}"
              digest = hashlib.sha256(blob).hexdigest()
              assert digest == entry["sha256"], f"{entry['name']} is {digest}, pinned {entry['sha256']}"
          covers = [n for n in names if n.startswith("raven_ppt/assets/templates/covers/")]
          # One per template per language, and the wheel is the only place they
          # exist: the directory is gitignored, so a bake that did not run
          # leaves a wheel that builds and installs and quietly puts LibreOffice
          # back on every reader's machine.
          langs = 1 + len(glob.glob("plugins-dist/ppt-engine/raven_ppt/assets/templates/i18n/*.json"))
          assert len(covers) == len(pins) * langs, f"{len(covers)} covers in {whl}, expected {len(pins) * langs}"
          print(f"OK: {whl} ships all {len(pins)} bundled templates, each matching its pin, and {len(covers)} covers")
          PY

      # 4b) Export the locked dependency set as a constraints file. The install
      #     scripts pass this to `uv tool install -c` so a one-click install gets
      #     the exact versions we lock and test, instead of re-resolving to the
      #     newest versions allowed by pyproject (which drifts, and can pull a
      #     source-only build with no wheel on the user's platform). --locked
      #     fails the release if uv.lock is stale vs pyproject, so we never ship
      #     constraints that conflict with the wheel's own metadata; --all-extras
      #     covers the channel SDKs behind raven[channels].
      - name: Export locked constraints
        run: uv export --locked --all-extras --no-hashes --no-emit-workspace -o dist/raven-constraints.txt

      # 4c) The plugin list: the wheels this release ships beside raven, one
      #     `name @ url` line each. The upgrade helper (and, once it reads it,
      #     the installer) takes this file from the release directory next to
      #     the wheel and the constraints and hands it to `uv tool install
      #     --with-requirements`, so what a complete install is made of is
      #     written here once, from what this job just built, and nowhere
      #     else. Direct URLs on purpose: a bare name would be resolved against
      #     PyPI, where none of these names are ours. The everos line is what
      #     the helper keeps when the engines cannot build, so its name is a
      #     contract (tests/test_release_plugin_list.py).
      - name: Write the plugin list
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          : > dist/raven-plugins.txt
          for whl in dist/everos_memory-*.whl dist/design_engine-*.whl dist/ppt_engine-*.whl; do
            [ -f "$whl" ] || { echo "no wheel matches $whl"; exit 1; }
            name="$(basename "$whl" | cut -d- -f1 | tr _ -)"
            echo "$name @ $base/$(basename "$whl")" >> dist/raven-plugins.txt
          done
          cat dist/raven-plugins.txt
          test "$(wc -l < dist/raven-plugins.txt)" -eq 3

      # 4d) The release installs itself before anything is published: the wheel,
      #     the constraints, the plugin list and the plugin wheels as one whole,
      #     through install.sh piped the way users run it. The list's public URLs
      #     resolve only once a human publishes the draft, so the gate installs
      #     from a copy of the list rewritten to point at the release directory
      #     here; the rewrite only matches the exact public prefix, so a list
      #     that named any other place fails the grep below. Then the installed
      #     raven has to answer, carry the three plugin packages, and have the
      #     `web` the installer ends on.
      - name: Install the release from dist with install.sh
        env:
          RAVEN_MINIMAL: "1"
          RAVEN_NO_LAUNCH: "1"
          UV_TOOL_DIR: ${{ runner.temp }}/gate/tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/gate/bin
          UV_CACHE_DIR: ${{ runner.temp }}/gate/cache
          RAVEN_HOME: ${{ runner.temp }}/gate/home
        run: |
          gate="$RUNNER_TEMP/gate/release"
          mkdir -p "$gate"
          cp dist/*.whl dist/raven-constraints.txt "$gate/"
          prefix="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"
          sed "s#$prefix#file://$gate/#" dist/raven-plugins.txt > "$gate/raven-plugins.txt"
          if grep -q "https://" "$gate/raven-plugins.txt"; then echo "plugin list names a URL outside this release"; exit 1; fi
          wheel="$(ls dist/raven-*-py3-none-any.whl)"
          RAVEN_WHEEL_URL="file://$gate/$(basename "$wheel")" sh -c 'cat install.sh | sh'
          "$UV_TOOL_BIN_DIR/raven" --version
          "$UV_TOOL_DIR/raven/bin/python" -c "import raven_everos, raven_design, raven_ppt"
          "$UV_TOOL_BIN_DIR/raven" web --help >/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      # 5) On a version tag, publish a DRAFT GitHub Release with the built
      #    wheel + sdist attached. install.sh resolves the wheel from the
      #    latest Release asset, so a human reviews the draft and clicks
      #    Publish to make it live. Manual dispatch (no tag) stops after the
      #    artifact upload above.
      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${{ github.ref_name }}"
          v=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          base="${tag#v}"; base="${base%%-*}"   # v0.1.3-rc1 -> 0.1.3
          [ "$base" = "$v" ] || { echo "tag $tag does not match pyproject version $v"; exit 1; }

      - name: Create draft GitHub Release with assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          ver="${tag#v}"
          today="$(date -u +%Y-%m-%d)"
          # prerelease tags (contain a hyphen, e.g. v0.1.3-rc1) must never become
          # /releases/latest, which install.sh serves to curl|sh users.
          pre=""
          case "$tag" in *-*) pre="--prerelease" ;; esac
          # Prefill notes from the template; the summary and Highlights stay TODO
          # for a human to fill in the draft before publishing.
          sed "s/__VERSION__/$ver/g; s/__TAG__/$tag/g" \
            .github/release-notes-template.md > "$RUNNER_TEMP/notes.md"
          # Detect an existing release via the LIST endpoint: the tag endpoint is
          # published-only and the Actions token cannot see a draft through it
          # (cli/cli #3037), so a re-run would 422 on create. Delete a stale draft
          # (this keeps the git tag) and recreate; leave a published release alone.
          rel=$(gh api "repos/$repo/releases?per_page=100" --jq "map(select(.tag_name==\"$tag\"))[0] // {}")
          id=$(printf '%s' "$rel" | jq -r '.id // empty')
          isdraft=$(printf '%s' "$rel" | jq -r '.draft // false')
          if [ -n "$id" ] && [ "$isdraft" = "true" ]; then
            gh api -X DELETE "repos/$repo/releases/$id"
            id=""
          fi
          if [ -z "$id" ]; then
            draft_url=$(gh release create "$tag" dist/*.whl dist/*.tar.gz dist/raven-constraints.txt dist/raven-plugins.txt \
              --title "Raven $ver ($today)" --notes-file "$RUNNER_TEMP/notes.md" --draft $pre)
            # A draft lives at releases/tag/untagged-<hash> and keeps serving that
            # stale page after publication, with no redirect to the real tag. Print
            # both URLs so nobody shares the draft one by copying the address bar.
            {
              echo "### Release $tag"
              echo ""
              echo "- Draft (temporary, do not share): $draft_url"
              echo "- Public URL once published: https://github.com/$repo/releases/tag/$tag"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release $tag already published (id=$id); leaving as-is."
            echo "Release $tag already published: https://github.com/$repo/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
          fi

      # (Optional, wire up when ready) publish to PyPI on tag:
      # - name: Publish to PyPI
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   run: uv publish
      #   env:
      #     UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: make install-deps

      - name: Run pre-commit on changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi
          uv run pre-commit run --from-ref "$BASE" --to-ref HEAD

  lint-python:
    name: python lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: make install-deps

      - name: Focused Python lint
        run: make lint-python

  unit:
    name: unit (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHON_VERSION: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev --python ${{ matrix.python }}

      - name: Unit tests with line and branch coverage
        # TERM=dumb: typer's rich_utils force-enables colour when GITHUB_ACTIONS is
        # set, and the highlighter then splits option names with escape codes, so
        # `"--flag" in result.stdout` assertions fail only on CI.
        run: make coverage

      - name: Coverage summary and lowest-covered files
        if: ${{ !cancelled() && hashFiles('coverage.json') != '' }}
        run: make coverage-summary

      - name: Overall coverage ratchet
        if: ${{ !cancelled() && hashFiles('coverage.json') != '' }}
        run: make coverage-ratchet

      - name: Coverage baseline cannot decrease
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          COVERAGE_BASE_REF: origin/${{ github.base_ref }}
        run: make coverage-baseline-check

      - name: PR diff coverage
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('coverage.json') != '' }}
        env:
          COVERAGE_BASE_REF: origin/${{ github.base_ref }}
        run: make coverage-diff

      - name: Explain skipped diff coverage
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: echo "Diff coverage is a PR-only gate; push builds still enforce the overall ratchet."

      - name: Create auditable baseline candidate
        if: ${{ !cancelled() && hashFiles('coverage.json') != '' }}
        run: make coverage-baseline-candidate

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-py${{ matrix.python }}-${{ matrix.os }}
          path: |
            coverage.xml
            coverage.json
            htmlcov/
            coverage-baseline-candidate.json
          if-no-files-found: warn
          retention-days: 30

  windows-upgrade:
    name: Windows self-upgrade
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Test real uv self-upgrade
        # pytest-asyncio is needed even though this file has no async test: the
        # isolated interpreter still reads the project's pytest config, whose
        # --strict-config turns the then-unknown asyncio_mode into a hard error.
        run: uvx --python 3.12 --from "pytest>=8,<10" --with pytest-asyncio pytest --noconftest tests/integration/test_cli_upgrade_real_uv.py -q

  tui:
    name: TUI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-tui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui-tui

      - name: Lint, type-check, and test
        run: |
          npm run lint
          npm run lint:rpc
          npm run type-check
          npm test
          npm run build
        working-directory: ui-tui

  bridge:
    name: bridge checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: bridge

      - name: Build bridge
        run: npm run build
        working-directory: bridge

      - name: Audit bridge dependencies
        run: npm audit --audit-level=critical
        working-directory: bridge

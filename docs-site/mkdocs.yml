site_name: Raven
site_url: https://evermind-ai.github.io/Raven/
repo_url: https://github.com/EverMind-AI/Raven
docs_dir: docs

theme:
  name: material
  font:
    text: Atkinson Hyperlegible Next
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom

extra_css:
  - stylesheets/evermind.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Getting Started: 开始使用
            Self-Hosting: 自托管
            Launch WebUI: 启动 WebUI
            Reference: 参考
            Command Reference: 命令参考
            Repo Layout: 仓库布局

nav:
  - Home: index.md
  - Getting Started:
      - Self-Hosting: self-hosting.md
      - Launch WebUI: webui.md
  - Reference:
      - Command Reference: commands.md
      - Repo Layout: repo-layout.md

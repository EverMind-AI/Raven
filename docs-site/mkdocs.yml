site_name: Raven
site_url: https://evermind-ai.github.io/Raven/
repo_url: https://github.com/EverMind-AI/Raven
docs_dir: docs

theme:
  name: material
  # The EverMind mark, simplified for the sizes a favicon is drawn at: the
  # mark's eight faint rings are a 3.6-unit stroke on a 192-unit canvas, which
  # is a third of a pixel at 16px and reads as mud. Section 7 of AGENTS.md
  # keeps icon files out of the repository, so it is inlined rather than
  # shipped as a file.
  favicon: 'data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20192%20192%22%3E%3Crect%20width=%22192%22%20height=%22192%22%20rx=%2238.8%22%20fill=%22%23ffc53d%22/%3E%3Cpath%20fill=%22none%22%20stroke=%22%230c0902%22%20stroke-width=%2212%22%20stroke-linejoin=%22round%22%20d=%22M16%2096C16%2078.3%2030.4%2064%2048%2064C69.6%2064%2088%2086.1%2096%2096C104%20105.9%20122.4%20128%20144%20128C161.6%20128%20176%20113.7%20176%2096C176%2078.3%20161.6%2064%20144%2064C122.4%2064%20104%2086.1%2096%2096C88%20105.9%2069.6%20128%2048%20128C30.4%20128%2016%20113.7%2016%2096Z%22/%3E%3C/svg%3E'
  font:
    text: Atkinson Hyperlegible Next
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom

extra:
  generator: false

extra_css:
  - stylesheets/evermind.css

extra_javascript:
  - javascripts/toc-progress.js

hooks:
  - hooks/search_by_language.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

plugins:
  # Chinese runs no spaces, so jieba segments it at build time and marks
  # each boundary with a zero-width space. The separator has to break on
  # that mark: JavaScript's \s stops at \u200a and would leave every run
  # as a single token.
  - search:
      separator: '[\s\u200b\-]+'
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Guide: 指南
            Overview: 总览
            Quick Start: 快速开始
            Using Raven: 使用 Raven
            Working with Sub-agents: 与子 Agent 协作
            Browser and Human Collaboration: 浏览器与人工协作
            Knowledge Bases: 知识库与文档检索
            Long-running Work (Oncall): 长任务托管（Oncall）
            Playbooks: Playbooks 使用指南
            Channels and Messaging: 渠道与消息
            Agent Integrations: Agent 集成
            Self-Hosting: 自托管
            Docker Deployment: Docker 部署
            Launch WebUI: 启动 WebUI
            Sandbox: 沙箱
            Reference: 参考
            Architecture: 架构
            Agent Protocols: Agent 协议
            DAG Orchestration: DAG 编排
            Permissions and Security: 权限与安全
            Skills, Memory and Extensions: 技能、记忆与扩展
            Command Reference: 命令参考
            Repo Layout: 仓库布局
            Developers: 开发者
            Development: 开发
            Building an Agent: 构建 Agent
            Building a Plugin: 构建插件
            Protocol and Backend Integration: 协议与后端集成
            Proactive Reminders and Follow-ups: 主动提醒与跟进
            Proactivity Design and Implementation: 主动性设计与实现
            Evolver: Evolver
            Usage and Experiments: 使用与实验
            Design and Implementation: 设计与实现
            Trajectory Debugging and Replay: 轨迹调试与回放
            Tracing and Instrumentation API: 追踪与埋点 API

  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: false

nav:
  - Guide:
      - Overview: index.md
      - Quick Start: quick-start.md
      - Using Raven:
          - Overview: using-raven.md
          - Launch WebUI: webui.md
          - Sandbox: sandbox.md
          - Working with Sub-agents: agent-collaboration.md
          - Browser and Human Collaboration: browser-collaboration.md
          - Knowledge Bases: knowledge.md
          - Playbooks: playbooks.md
          - Proactive Reminders and Follow-ups: proactivity.md
          - Long-running Work (Oncall): oncall.md
      - Channels and Messaging: channels.md
      - Agent Integrations: agent-integrations.md
      - Skills, Memory and Extensions: skills-and-extensions.md
      - Self-Hosting:
          - Overview: self-hosting.md
          - Docker Deployment: docker.md
  - Reference:
      - Architecture: architecture.md
      - Agent Protocols: agent-protocols.md
      - DAG Orchestration: orchestration.md
      - Permissions and Security: permissions.md
      - Command Reference: commands.md
      - Repo Layout: repo-layout.md
  - Developers:
      - Development: development.md
      - Building an Agent: building-agent.md
      - Building a Plugin: building-plugin.md
      - Protocol and Backend Integration: protocol-backends.md
      - Proactivity Design and Implementation: proactivity-design.md
      - Trajectory Debugging and Replay: trajectory-debugging.md
      - Evolver:
          - Usage and Experiments: evolver.md
          - Design and Implementation: self-evolution-map.md
      - Tracing and Instrumentation API: tracing-api.md
